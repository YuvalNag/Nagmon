name: New app

# The React + Phaser app in app/ (docs/app/SDD.md §6): the checks, the
# browser at the phone's size, the APK, and the APK on an emulator. A
# build goes to the family only when all of them pass.

on:
  push:
    paths:
      - "app/**"
      - "tools/app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/app/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: app/package-lock.json
    - run: npm ci
    - run: npm run typecheck
    - run: npm test
    - run: npx playwright install --with-deps chromium
    - name: The phone's screen in a browser (Hebrew and English)
      run: npm run e2e
    - name: Show the screenshots in the log
      if: always()
      working-directory: .
      run: |
        python3 -m pip install --quiet --break-system-packages pillow
        find app/test-results -name '*.png' | sort | while read -r f; do
          python3 tools/android/screen_shape.py show "$f"
        done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-screens-${{ github.run_number }}
        path: app/test-results/
        if-no-files-found: ignore
        retention-days: 7

  apk:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: app/package-lock.json
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
    - run: npm ci
    - run: npm run build
    - run: npx cap sync android
    - name: Build the APK
      working-directory: app/android
      run: ./gradlew --no-daemon assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: nagmon-app-apk-${{ github.run_number }}
        path: app/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: app/package-lock.json
    - run: npm ci
    - uses: actions/download-artifact@v4
      with:
        name: nagmon-app-apk-${{ github.run_number }}
        path: app/apk
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: The APK on an emulator shaped like the phone
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_6
        ram-size: 4096M
        disk-size: 6000M
        disable-animations: true
        working-directory: app
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: node tests/android/run.mjs apk/app-debug.apk android-e2e
    - name: Show the screenshots in the log
      if: always()
      working-directory: .
      run: |
        python3 -m pip install --quiet --break-system-packages pillow
        find app/android-e2e -name '*.png' | sort | while read -r f; do
          python3 tools/android/screen_shape.py show "$f"
        done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-emulator-${{ github.run_number }}
        path: app/android-e2e/
        if-no-files-found: ignore
        retention-days: 7

name: Android APK

# Builds the phone app (docs/kids/SDD_ANDROID.md §2.4). Download the APK
# from the run's "Artifacts" and install it on the phone.
#
# Signing: with the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
# and ANDROID_KEY_ALIAS the APK is a signed release, and every new build
# installs over the old one and keeps the children's progress. Without them
# it is a debug build signed by a throwaway key: updating it means
# uninstalling first, which deletes the progress.

on:
  workflow_dispatch:
  push:
    paths:
      - "buildconfig/android/**"
      - "tools/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf automake libtool libltdl-dev pkg-config cmake \
          zip unzip libffi-dev libssl-dev zlib1g-dev ccache
        # buildozer brings the Cython it needs (<3).
        pip install buildozer==1.6.0 setuptools pyyaml
        # pydantic-core is Rust.
        rustup target add aarch64-linux-android

    - name: Cache Android SDK and NDK
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('tools/android/stage.py', 'buildconfig/android/recipes/**') }}
        restore-keys: buildozer-${{ runner.os }}-

    - name: Stage the app
      run: python tools/android/stage.py build/app --build-number ${{ github.run_number }}

    - name: Release key
      if: env.HAS_KEY == 'true'
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nagmon.keystore"

    - name: Build (signed release)
      if: env.HAS_KEY == 'true'
      working-directory: build/app
      env:
        P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/nagmon.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: yes | buildozer android release

    - name: Build (debug)
      if: env.HAS_KEY != 'true'
      working-directory: build/app
      run: yes | buildozer android debug

    - name: Summary
      if: always()
      run: |
        {
          echo "### Nagmon for Android (build ${{ github.run_number }})"
          ls -la build/app/bin 2>/dev/null || echo "No APK was built."
          if [ "$HAS_KEY" != "true" ]; then
            echo
            echo "Debug build: to update it, uninstall the old one first (this deletes the children's progress)."
            echo "Add the ANDROID_KEYSTORE_* secrets for builds that update in place (docs/kids/HOW_TO_PLAY.md)."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nagmon-android-${{ github.run_number }}
        path: build/app/bin/*.apk
        if-no-files-found: error

    - name: Check what is inside the APK
      run: python tools/android/check_apk.py build/app/bin/*.apk --layout

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-log-${{ github.run_number }}
        path: build/app/.buildozer/android/platform/build-*/*.log
        if-no-files-found: ignore

  emulator:
    # Opens this APK on an Android emulator: a crash fails the build.
    needs: apk
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/android-smoke.yml
    with:
      same-run: true

name: Build Installer Windows

on:
  workflow_call:

jobs:
  flatpak:
    runs-on: windows-latest
    steps:
      # Checkout the repo
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
            # Version range or exact version of a Python version to use, using SemVer's version range syntax.
            python-version: '3.10'
            # The target architecture (x86, x64) of the Python interpreter.
            architecture: 'x64'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install cx-freeze
        run: python -m pip install cx-freeze pyyaml

      - name: Build
        run: |
          copy buildconfig/setup_cx_freeze.py setup_cx_freeze.py
          copy buildconfig/build_config.yaml build_config.yaml
          python setup_cx_freeze.py build

      - name: Install NSIS
        # Chocolatey's feed is sometimes down (503); try it a few times, then
        # take the installer straight from the NSIS project.
        run: |
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          for ($try = 1; $try -le 3 -and -not (Test-Path "$nsisPath\makensis.exe"); $try++) {
            choco install nsis -y
            if (-not (Test-Path "$nsisPath\makensis.exe")) { Start-Sleep -Seconds (10 * $try) }
          }
          if (-not (Test-Path "$nsisPath\makensis.exe")) {
            $setup = "$env:RUNNER_TEMP\nsis-setup.exe"
            Invoke-WebRequest -UseBasicParsing -MaximumRedirection 10 -UserAgent "curl/8" `
              -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10-setup.exe" `
              -OutFile $setup
            Start-Process -FilePath $setup -ArgumentList "/S" -Wait
          }
          echo "$nsisPath" | Out-File -Append $env:GITHUB_PATH

      - name: Check NSIS availability
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { Write-Error "NSIS is not installed"; exit 1 }
          & $makensis /VERSION

      - name: Build Installer
        run: |
          cd buildconfig
          cmd.exe /c "build_installer.bat"
          mkdir ../dist/
          Move-Item tuxemon-installer.exe ../dist/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
            name: tuxemon_windows_installer
            path: dist

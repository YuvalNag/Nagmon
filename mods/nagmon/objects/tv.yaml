# The TV (docs/app/WORLD_V2.md section 8, object 4): three channels of 25 seconds, switched by a tap, no
# autoplay. Sky today (the moon from the real date and a sky event: core/world/sky.ts), Town news (three
# headlines; static here, W1's "who is where" resolver replaces them: core/game/tv.ts `NewsSource`) and Creature of
# the day (one species, a picture and a true line; +25% in the grass that day, a hint, never a prize).
# It moves upstairs in W5 (change the place here and the map's events).
id: tv
screen: tv
title_he: הטלוויזיה
sprite: nagmon_tv
places:
  - {map: nagmon_friend_house, x: 2, y: 2}
news:
  - "המוכר אבי סידר מדף חדש של פירות בחנות."
  - "הגננת מיכל אומרת שהפרחים בגינה פורחים השבוע."
  - "סבתא רינה יצאה לטייל בבוקר עם כובע חדש."
  - "יואב ופיצי שיחקו בגינה כל הצהריים."
  - "טום התייר מתרגל עברית, והעיר מתרגלת איתו אנגלית."
  - "האחות דנה מספרת: כל החברים במרכז המנוחה ישנו טוב."
  - "המורה פתחה במעבדה שיעור חדש לכל מי שרוצה ללמוד."
  - "הינשוף החכם הסתכל בכוכבים כל הלילה."
  - "בדשא של דרך 1 פגשו היום הרבה חברים חדשים."
  - "יום יפה לטיול: השמיים בהירים מעל העיר."
  - "השכנה אפתה עוגה וחילקה פרוסה לכל השכנים."
  - "בלוח המודעות בכיכר יש היום כרטיסים חדשים."
  - "הילדים בעיר ספרו כוכבים בלילה, והיו הרבה מאוד."
  - "ליד הנחל ראו היום ציפורים שרות בקול."
  - "בספרייה של המעבדה יש ספרים חדשים על חלל."
  - "האסטרונומית מזמינה את כולם להסתכל בירח הערב."
creatures:
  heliobud: "השמש היא כוכב: כדור ענק של גז לוהט."
  mercurip: "חמה היא כוכב הלכת הקרוב ביותר לשמש, והיא קטנה."
  venubud: "נוגה חם מאוד, בגלל העננים העבים שעוטפים אותו."
  terrabub: "כדור הארץ הוא הכוכב היחיד שבו אנחנו יודעים שיש חיים."
  lunibble: "הירח מקיף את כדור הארץ פעם בחודש בערך."
  rustip: "מאדים נראה אדום בגלל חלודה באדמה שלו."
  roveroo: "רובר הוא רכב קטן שנוסע על מאדים ובודק סלעים."
  jovibud: "בצדק יש פסים צבעוניים של עננים."
  ringlet: "לשבתאי יש טבעות עשויות מקרח ומסלעים."
  tiltip: "אורנוס מוטה על הצד, וכמעט מתגלגל במסלול שלו."
  nepbit: "נפטון רחוק מאוד מהשמש, ויש בו רוחות חזקות מאוד."
  plutot: "פלוטו הוא כוכב לכת ננסי, והוא קטן מהירח שלנו."
  iobud: "איו הוא ירח של צדק, ויש בו הרבה הרי געש."
  ganybit: "גנימד הוא הירח הגדול ביותר במערכת השמש."
  titanip: "טיטאן הוא ירח של שבתאי, ויש לו אוויר עבה."
  kuipip: "מעבר לנפטון יש חגורה של גושי קרח קטנים."
  asterchip: "בין מאדים לצדק יש הרבה סלעים קטנים, אסטרואידים."
  combit: "שביט הוא כדור של קרח ואבק, וקרוב לשמש יש לו זנב."
  gravip: "כוח המשיכה מחזיק אותנו על הקרקע."
  meteet: "מטאור הוא סלע קטן שנשרף באוויר, כמו כוכב נופל."
  probip: "גשושית היא חללית קטנה שנשלחת לחקור את החלל."
  sailbit: "מפרש שמש הוא רעיון לחללית שאור השמש דוחף."
  solwind: "רוח השמש היא זרם קטן של חלקיקים שיוצא מהשמש."

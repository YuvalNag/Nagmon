# The PC (docs/app/WORLD_V2.md section 8, object 1): five tabs. Boxes (the Meadow in boxes, sorted, a star;
# a friend moves between the party and a box and nothing can be released), Items (an item box with 99 more of
# every item), Mail, Journal ("what I learned" by subject, with kind words and a Recap) and People (everyone
# met, hearts 0 to 3). The screen is app/src/ui/pc/PcScreen.tsx; what the PC remembers is `pc`, `journal`,
# `mail` and `met` in the child's world.json (all optional).
#
# `places` say where it stands: the map and the tile of the prop (the map's own events create it and run
# `open_object pc`; tools/app/objects.py checks that they do). Move an object by changing the place AND the
# map's events together; the build stops when they disagree.
id: pc
screen: pc
title_he: המחשב
sprite: nagmon_pc
places:
  - {map: nagmon_home, x: 2, y: 2}
  - {map: nagmon_rest_center, x: 1, y: 3}
# The People tab's directory: who can be met, and what they offer. W1's NPC definitions replace this list with
# the real cast (the contract is core/game/people.ts: a slug, a name, what they offer, a picture).

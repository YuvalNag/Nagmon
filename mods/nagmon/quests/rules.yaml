# The numbers of the quest system (docs/app/WORLD_V2.md 7 and 9.4), in data so a content release can change them
# with no code change. tools/app/quests.py checks this file and ships it inside game/quests.json (`rules`).
# Quest files name a reward as a scale word (XS to XL) or a whole number; the build turns the words into numbers.
scale: {XS: 10, S: 20, M: 30, L: 50, XL: 80}
# Cards the journal holds as active at once (section 7.3).
active_max: 3
# A wrong answer never fails a quest (7.5): a free retry, the owl's hint after this many wrong answers,
# and after this many the quest finishes in its lesser form.
hint_after: 2
lesser_after: 3
# The lesser form pays this share of the coins (items and friendship are unchanged).
lesser_coins_pct: 50
# The 4th repeatable quest of a week (7.4) pays this share of the coins; the first three pay all.
repeat_free_per_week: 3
repeat_coins_pct: 60
# The board (7.3 and 7.4).
board:
  # how many past postings are remembered
  history: 24
  # a giver is not used in the last this many postings
  giver_gap: 3
  # a variant is not used in the last this many postings of its quest
  variant_cooldown: 5
  # at most this many board postings a week for one giver
  giver_week_max: 2
  # the share of learning postings that go to the child's two weakest subjects (computed on the phone, never sent)
  weak_pct: 40
  # the weekly card appears on this weekday (0 is Sunday)
  weekly_day: 0
# The solar chapter's missions pay these coins (7.6 rows 25, 27, 29, 31, 33): tools/app/solar_texts.py reads them.
solar_missions: {moon: 25, sun: 30, rocky_planets: 40, giants: 50, outer: 60}
# The grade bands of the variants (A: kindergarten to grade 2, B: 3 to 5, C: 6 and up).
bands: {A: 2, B: 5}
# The names props speak under in a dialog (a kitten, a box), and what the quests say that is no quest's own.
props:
  nagmon_kitten: {he: פיצי, en: Pitzi}
  nagmon_wallet: {he: ארנק, en: Wallet}
  nagmon_lostfound: {he: קופסת האבדות, en: The lost-and-found box}
lines:
  owl: {he: הינשוף החכם, en: The Wise Owl}
  later: {he: "זה לא להיום. בואו שוב ביום אחר.", en: "Not for today. Come again on another day."}
  hint: {he: "הינשוף מציע: קוראים לאט, חושבים רגע ומנסים שוב.", en: "The owl suggests: read slowly, think a moment and try again."}
  retry: {he: "בסדר גמור, אפשר לנסות שוב.", en: "That is fine, you can try again."}
  lesser: {he: "ביחד פתרנו את זה. הנה חלק מהפרס.", en: "We solved it together. Here is part of the prize."}
  accept: {he: "בשמחה", en: "Gladly"}
  decline: {he: "לא עכשיו", en: "Not now"}
# Where a person is, for the journal's "Show me" (a place the resolver names; core/game/questWhere.ts). Maps and spots by id.

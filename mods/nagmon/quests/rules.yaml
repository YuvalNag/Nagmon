    bench_east: {he: "על הספסל במזרח", en: "On the east bench"}
    greenhouse: {he: "ליד החממה", en: "Near the greenhouse"}
    flowerbed: {he: "ליד ערוגת הפרחים", en: "Near the flowerbed"}
    market_stall: {he: "ליד דוכן השוק", en: "Near the market stall"}

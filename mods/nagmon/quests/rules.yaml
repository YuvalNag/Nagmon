    pharmacy_door: {he: "ליד בית המרקחת", en: "Near the pharmacy"}
    tailor_door: {he: "ליד התופרת", en: "Near the tailor"}
    clock_corner: {he: "בפינת השעונים", en: "At the clock corner"}

greet_first:
  - "היי, אני מוחמד והרובר מחכה! תהיו נחמדים אליו."
  - "שלום! יום טוב לנסיעה, אבל בלי למהר."
  - "אהלן! הכביש חלק, לפחות היום."
  - "שלום, חברים! יש כאן מקום לכולם."
  - "היי! אני נוהג לאט בעליות, בטוח."
  - "שלום לכם! אפשר לשבת קרוב לחלון."
greet_again:
  - "שוב אתם! המנוע התגעגע."
  - "חזרתם! אני עוד מצחצח."
  - "שלום שוב. הדרך מחכה."
  - "עוד ביקור. כיף."
  - "שוב שלום. הכל תקין."
idle:
  - "אני מצחצח את הרובר. הוא אוהב שמטפלים בו."
  - "כביש טוב הוא כביש שלא ממהרים בו."
  - "בעליה אני מאט, ובירידה אני מחייך."
  - "הגלגלים שלי מכירים כל אבן בדרך."
  - "אני תמיד לוקח איתי חטיף. נהג רעב הוא נהג עצבני."
farewell:
  - "להתראות! נסיעה בטוחה."
  - "ביי! תחגרו חגורה."
  - "נתראה בדרך."
  - "שלום ולהתראות, חברים."
topic.rover:
  - "הרובר שלי גדול, עם גלגלים חזקים. הוא יודע להתמודד עם אבנים."
  - "אני קורא לו חבר. הוא תמיד מוכן."
  - "הוא נוסע לאט, אבל הוא מגיע בטוח."
  - "הרובר צריך מים, כמו כל אחד. אצלו זה שמן."
topic.road:
  - "על הדרך יש אבנים, בורות וקצת אבק. אני עוקף את הכל."
  - "אני אוהב לשיר בדרך. הרובר מתעלם, אבל מנסה."
  - "בדרך עוצרים כשצריך, ולא ממהרים."
  - "כל תחנה בדרך נראית כמו מקום חדש."

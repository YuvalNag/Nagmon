greet_first:
  - "שלום, חברים. אני חנה, ואני מודדת הכל."
  - "שלום לכם. אני מזמזמת בזמן שאני תופרת."
  - "היי! שימו לב לשרוול שלכם, הוא מקסים."
  - "שלום. אצלי הכל במידה, ובעיקר מצב הרוח."
  - "ברוכים הבאים לחנות. הבדים מחכים."
  - "שלום! יש לי כאן כפתור שמחפש בית."
greet_again:
  - "שוב אתם. נעים."
  - "חזרתם. המחט עוד בידי."
  - "שלום שוב. אני עוד מודדת."
  - "עוד ביקור קטן. כיף."
  - "שוב שלום. הכפתור עוד מחכה."
idle:
  - "אני מודדת פעמיים ותופרת פעם אחת."
  - "בגד נוח הוא בגד שמחייך."
  - "כל בד מספר סיפור: חם, רך או חלק."
  - "השרוול צריך להגיע בדיוק עד כף היד."
  - "אני אוהבת צבעים. היום אני בוחרת תכלת."
  - "חוט וסבלנות, זה כל הסוד."
farewell:
  - "להתראות. שיהיה לכם בגד נוח."
  - "נתראה בחנות."
  - "ביי! שיהיה יום מתאים."
  - "שלום ולהתראות."
  - "תודה על הביקור."
topic.sewing:
  - "תופרים ככה: חוט במחט, ואז חור קטן, ועוד חור."
  - "כפתור נתפר עם חוט אחד, ארבע פעמים."
  - "בגד טוב הוא כזה שאפשר לרוץ בו ולקפוץ."
  - "אני תופרת גם כובעים וגם צעיפים קטנים."
topic.town:
  - "היום בעיר: {who}. אני אוהבת לראות מה לובשים."
  - "ראיתי היום את {who}. הם נראו נוחים ושמחים."
  - "בעיר כל אחד לבוש בצבע שלו. יפה."
  - "אנשים נחמדים בעיר. יש מי שבא להגיד תודה."

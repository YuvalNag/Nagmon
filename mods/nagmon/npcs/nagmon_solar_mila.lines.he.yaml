greet_first:
  - "שלום, אני מילה הטייסת! חגורות קשורות?"
  - "היי! החללית מוכנה כשאתם מוכנים."
  - "שלום לכם! הנסיעה תהיה חלקה, כמעט."
  - "אהלן! אני בודקת את הכל פעמיים."
  - "שלום, חברים! יש מקום לכולם בחללית."
  - "היי! יום טוב לטוס."
greet_again:
  - "שוב אתם! החללית שמחה."
  - "חזרתם! אני עוד בודקת חגורות."
  - "שלום שוב. הכל תקין."
  - "עוד ביקור קטן. מצוין."
  - "שוב שלום, טיסה נעימה מחכה."
idle:
  - "אני מקשיבה למנוע. הוא מזמזם שיר שאני אוהבת."
  - "מי שמזיז את הכסא, מזיז גם את הלב."
  - "אני שמחה כשכולם יורדים מהחללית מחייכים."
  - "בכל נחיתה אני אומרת תודה לחללית."
  - "טיסה טובה מתחילה בחגורה קשורה."
farewell:
  - "להתראות! טיסה נעימה."
  - "נתראה בדוק."
  - "ביי! תשמרו על החגורות."
  - "שלום ולהתראות, חברים."
topic.ship:
  - "החללית שלי קטנה אבל חזקה. היא לוקחת כל מי שמזמין."
  - "אני מכירה כל כפתור. אני אפילו מדברת אליהם."
  - "המנוע מזמזם כשהכל תקין. אם הוא שותק, אני בודקת."
  - "הטיסה לוקחת זמן, אבל הנוף ממלא אותו."
topic.pack:
  - "לוקחים כובע, מים ואת הסקרנות. השאר אצלי."
  - "אל תשכחו חטיף קטן לחבר שלכם. טיסה מרעיבה."
  - "הדבר הכי חשוב לקחת הוא חיוך. הוא לא כבד."
  - "מי שלוקח משהו אהוב, מרגיש בבית בכל מקום."

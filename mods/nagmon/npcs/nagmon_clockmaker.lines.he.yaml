greet_first:
  - "שלום. אני יוסף, והזמן בדיוק מדויק."
  - "שלום לכם. בדיוק בזמן, כמו שצריך."
  - "שלום. השעון שלי אומר שזה רגע נעים."
  - "ברוכים הבאים. הכל כאן מתקתק."
  - "שלום. שימו לב, הדקה כמעט עוברת."
  - "שלום. אין לי הרבה זמן, אבל יש לי מספיק בשבילכם."
greet_again:
  - "שוב. בדיוק."
  - "חזרתם. השעה התקדמה."
  - "שלום שוב. הוא התקתק בינתיים."
  - "עוד ביקור. בדיוק במקום."
  - "שוב שלום. השניות עוברות יפה."
idle:
  - "טיק טק, טיק טק, שומעים? זה הלב של השעון."
  - "הזמן הוא חבר, אם לא רודפים אחריו."
  - "כל גלגל קטן עושה את העבודה שלו. כך גם בעיר."
  - "שעה היא שישים דקות, בדיוק."
  - "אני בודק שכל שעון מראה אותו דבר."
  - "בדיוק הוא המילה האהובה עליי."
farewell:
  - "להתראות. בדיוק בעוד זמן קצר."
  - "נתראה. השעון קורא לי."
  - "ביי. בזמן טוב."
  - "שלום ולהתראות, בדיוק."
  - "יום מדויק ונעים."
topic.time:
  - "יום מחולק לשעות, והשעה לדקות. כך אפשר להתארגן."
  - "כשהמחוג הקטן על מספר ארבע והגדול על שתים עשרה, השעה ארבע."
  - "בבוקר השעון אומר לנו להתעורר, ובערב לנוח."
  - "אפשר לדעת בערך מה השעה לפי השמש, אבל שעון מדויק יותר."
topic.tick:
  - "בתוך שעון יש גלגלים קטנים שמסתובבים יחד, כל אחד בקצב שלו."
  - "הקפיץ מחזיק את הכוח, והגלגלים מחלקים אותו לשניות."
  - "כל תקתוק הוא שנייה אחת. שישים תקתוקים הם דקה."
  - "שעון טוב צריך להיות נקי, כמו ידיים."
topic.town:
  - "היום בעיר: {who}. הם הגיעו בדיוק בזמן."
  - "ראיתי היום את {who}. עברו על יד החנות."
  - "בעיר כל אחד בקצב שלו, אבל הכל מתיישב."
  - "אנשים רבים בעיר שואלים אותי מה השעה. אני שמח לענות."

greet_first:
  - "שלום, אני יעל המהנדסת! תיזהרו מהכלים."
  - "היי! כאן עובדים לאט, ושומרים על הכל."
  - "שלום לכם! יש לי כאן הרבה עבודה, אבל גם זמן לשיחה."
  - "שלום, חברים. הכל מסודר ובטוח."
  - "היי! הקסדה שלי מגינה, והסבלנות שלי גם."
  - "אהלן! נעים לפגוש אורחים."
greet_again:
  - "שוב אתם! הכלים שמחים."
  - "חזרתם. אני עוד מתקנת."
  - "שלום שוב. הכל מסודר."
  - "עוד ביקור. מצוין."
  - "שוב שלום, אני עדיין עובדת."
idle:
  - "אני בודקת כל בורג פעמיים."
  - "כלי טוב צריך שימוש נכון. כל כלי עם התפקיד שלו."
  - "בעבודה אני לא ממהרת. מי שממהר, מפספס."
  - "אני אוהבת לבנות. כל דבר קטן מחזיק את הכל."
  - "אני כותבת ביומן כל מה שעשיתי היום."
farewell:
  - "להתראות! תיזהרו בדרך."
  - "נתראה. אני חוזרת לעבוד."
  - "ביי! עבודה נעימה לכם."
  - "שלום ולהתראות, חברים."
topic.tools:
  - "יש לי מפתח, פטיש ומברג. כל אחד עושה משהו אחר."
  - "כלים טובים מנקים אחרי השימוש. ככה הם נשארים."
  - "המפתח החזק הוא החבר שלי הכי טוב."
  - "כל כלי קטן יכול לעשות דבר גדול."
topic.moon:
  - "הירח שקט ומלא מכתשים. אני אוהבת את השקט שלו."
  - "כאן ההליכה קלה, כאילו מרחפים קצת."
  - "ביומן שלי רשומים הרבה מכתשים. כולם מעניינים."
  - "מכאן רואים את כדור הארץ. זה נוף שלא שוכחים."

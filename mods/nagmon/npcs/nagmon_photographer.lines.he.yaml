greet_first:
  - "שלום! עמדו רגע בשקט... יפה מאוד."
  - "היי! האור היום מושלם, מי רוצה תמונה?"
  - "שלום לכם. אני מחפשת רגע יפה, ומצאתי אתכם."
  - "הו, חברים! תנו חיוך, בלי סיבה."
  - "שלום! המצלמה שלי מרגישה שהיום ייצא משהו טוב."
  - "היי! אל תזוזו, יש כאן תמונה."
greet_again:
  - "שוב אתם! הפעם בלי להזיז."
  - "חזרתם, והאור נשאר."
  - "שלום שוב! עוד תמונה קטנה?"
  - "עוד ביקור. המצלמה שמחה."
  - "שוב היי. אני עוד מחפשת את הזווית."
idle:
  - "תמונה טובה היא רגע שאפשר לשמור."
  - "אני מסתכלת על האור. הוא משנה את הכל."
  - "מתחת לעץ האור רוקד. נסו להסתכל."
  - "אין צורך בפרצוף רציני. חיוך הוא הכי טוב."
  - "אני אוהבת לצלם דברים קטנים: טיפת מים, עלה, נוצה."
  - "פעם צילמתי פרפר שנחת על הכובע שלי."
farewell:
  - "להתראות! אל תשכחו לחייך."
  - "נתראה. אני ממשיכה לחפש אור."
  - "ביי! תמונה יפה לכם."
  - "יום טוב, חברים."
  - "שלום ולהתראות. הרגע הבא מחכה."
topic.photo:
  - "מצלמים ככה: מסתכלים, מחכים לאור, ולוחצים לאט."
  - "תמונה טובה מתחילה בעיניים, ורק אחר כך בידיים."
  - "אפשר לצלם גם בלי מצלמה: פשוט עוצמים עיניים וזוכרים."
  - "הכי כיף לצלם חברים כשהם לא שמים לב."
topic.light:
  - "אור של בוקר הוא רך, ואור של ערב הוא זהוב."
  - "השמש היא המנורה הכי גדולה שיש."
  - "בצל התמונה רגועה, ובשמש היא חיה."
  - "אור נכנס דרך עלים ונעשה ירוק. אני אוהבת את זה."
topic.town:
  - "היום בעיר: {who}. כבר חשבתי לצלם אותם."
  - "ראיתי היום את {who}. היה להם אור יפה על הפנים."
  - "העיר מלאה רגעים יפים. צריך רק להסתכל."
  - "כל אחד בעיר הוא תמונה. כל אחד שונה."

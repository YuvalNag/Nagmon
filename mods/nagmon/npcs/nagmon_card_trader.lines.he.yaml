greet_first:
  - "שלום! אני מזל, ואצלי כל עסקה הוגנת."
  - "היי! הכרטיסים שלי מבריקים היום."
  - "שלום לכם. אני מחליפה רק כשטוב לשני הצדדים."
  - "אהלן! רוצים להסתכל על כרטיסים?"
  - "שלום! השוק שמח כשאתם כאן."
  - "היי! הקלפים שלי יודעים לדבר, אבל קודם אני."
greet_again:
  - "שוב אתם! הכרטיסים מתערבבים."
  - "חזרתם. עוד לא סגרתי את העסקה."
  - "שלום שוב. אני עוד כאן."
  - "עוד ביקור קטן. כיף."
  - "שוב היי! יש לי כרטיס חדש להראות."
idle:
  - "אני מערבבת את הקלפים כמו מניפה."
  - "עסקה טובה היא כזאת ששני הצדדים מחייכים."
  - "אני בודקת כל כרטיס פעמיים. אצלי אין הפתעות רעות."
  - "יש כרטיסים נדירים, וגם כאלה שפשוט יפים."
  - "מחליפים רק כשרוצים. אף אחד לא חייב."
  - "אני מכירה כל כרטיס בשמו. לכל אחד סיפור."
farewell:
  - "להתראות! עסקה טובה."
  - "נתראה בשוק."
  - "ביי! שמרו על הכרטיסים."
  - "שלום ולהתראות. אני חוזרת לקלפים."
  - "ביי! יום מצוין לכם."
topic.cards:
  - "כרטיסים עוזרים לחברים להתפתח או להתקרב אליכם."
  - "כל כרטיס מיועד למשהו אחר. כדאי לקרוא מה כתוב עליו."
  - "אפשר לאסוף כרטיסים, וגם לתת לחבר כרטיס כפול."
  - "אני שומרת את הכרטיסים הכי יקרים בכיס מיוחד."
topic.fair:
  - "הוגן זה כשכל אחד מקבל משהו ששווה לו."
  - "אם אחד מרוויח הכל והשני כלום, זו לא עסקה, זו הפתעה."
  - "הוגן הוא לשמוע מה חשוב לשני, ואז להחליט."
  - "אני בודקת אם החבר מרוצה. אם כן, העסקה טובה."
topic.town:
  - "היום בעיר: {who}. בטח ירצו להחליף משהו."
  - "ראיתי היום את {who}. הם הסתכלו על הכרטיסים."
  - "בשוק אני רואה את כולם מגיעים ועוברים."
  - "אנשי העיר אוהבים לעבור לידי. תמיד יש עם מי לדבר."

greet_first:
  - "שלום. אני פואד, ואני מחכה."
  - "שלום לכם. כאן שקט, ואפשר להקשיב למים."
  - "שלום. תשבו, אני אספר לכם משהו קצר וארוך."
  - "אהלן. סבלנות היא הצורה שלי לצחוק."
  - "שלום. הבריכה רגועה היום."
  - "שלום, חברים. הדג יבוא כשירצה."
greet_again:
  - "שוב אתם. נעים."
  - "חזרתם. המים עוד שקטים."
  - "שלום שוב. אני עדיין מחכה."
  - "עוד ביקור קטן. יופי."
  - "שוב שלום. הסנפיר עוד לא הגיע."
idle:
  - "אני מסתכל על החוט. לפעמים הוא זז, ולפעמים לא."
  - "מים הם חברים טובים: הם לא ממהרים."
  - "פעם תפסתי דג כל כך קטן שהוא אמר תודה ושחה."
  - "הציפורים מצטרפות אליי. הן יושבות ומקשיבות."
  - "דיג זה לא רק דגים. זה גם שקט."
  - "אני אוהב את הצליל של טיפות על המים."
farewell:
  - "להתראות. אני חוזר לחכות."
  - "נתראה על המים."
  - "ביי. סבלנות."
  - "שלום ולהתראות, חברים."
  - "מי שמחכה, מקבל. נתראה."
topic.fishing:
  - "דגים בחכה פשוטה: חוט, וו וסבלנות. הרבה סבלנות."
  - "אני תמיד מחזיר את הדג למים. הוא עוד צריך לשחות."
  - "צריך לשבת בשקט, כי דגים שומעים הכל."
  - "הדג הראשון שלי היה קטן ומצחיק. עד היום אני צוחק."
topic.water:
  - "מים עוברים מהים לשמיים וחוזרים. כך המעגל נסגר."
  - "בבריכה חיים דגים, צפרדעים וחיפושיות מים."
  - "המים נראים שקטים, אבל מתחתם יש חיים."
  - "מי שמסתכל על המים הרבה זמן, מתחיל לחשוב על דברים טובים."
topic.town:
  - "היום בעיר: {who}. כך שמעתי מהדואר."
  - "ראיתי היום את {who} עוברים בדרך. הם נופפו לי."
  - "אני רחוק מהעיר, אבל אני שומע מה קורה בה."
  - "העיר כנראה שקטה, כמו הבריכה."

greet_first:
  - "שלום, בשקט. כאן קוראים וחושבים."
  - "ברוכים הבאים לספרייה. הספרים מחכים."
  - "שלום. יש לי ספר בדיוק בשבילכם."
  - "שלום לכם. כל ספר כאן הוא דלת קטנה."
  - "שלום, שלום. אני מסדרת רשימה חדשה."
  - "הו, קוראים חדשים! כמה נעים."
greet_again:
  - "שוב אתם. נעים."
  - "חזרתם, ושמחתי."
  - "שלום שוב. הספרים לא זזו."
  - "עוד ביקור קטן. כמה שקט."
  - "שוב שלום. רשימה חדשה בדרך."
idle:
  - "אני אוהבת רשימות: ספרים, פרחים, ימים טובים."
  - "ספר טוב אפשר לקרוא שוב ושוב."
  - "הדפים מרשרשים. זה השיר של הספרייה."
  - "אני מסדרת ספרים לפי צבע, ואז לפי אות."
  - "כשקוראים, אפשר להגיע לכל מקום בלי לזוז."
  - "ששש. אני מקשיבה לשקט."
farewell:
  - "להתראות, בשקט."
  - "בואו שוב. הספרים ממתינים."
  - "נתראה. קריאה נעימה."
  - "שלום ולהתראות."
  - "ביי, בלחש."
topic.books:
  - "הספר של היום הוא על חיה קטנה שלמדה לעוף."
  - "הספר של היום הוא על ילד שגילה מפה בתוך מגירה."
  - "בספר של היום יש הרבה תמונות. הוא מתאים לכולם."
  - "יש לי ספר על כוכבים, ועוד אחד על דגים. תבחרו."
topic.quiet:
  - "רגע של שקט: עוצמים עיניים וסופרים עד חמש."
  - "בשקט שומעים דברים שבדרך כלל לא שומעים."
  - "ששש... שומעים? זה הדף שמתהפך."
  - "שקט הוא לא ריק. הוא מלא מחשבות."
topic.town:
  - "היום בעיר: {who}. בטח יבואו לקרוא."
  - "ראיתי היום את {who}. הם עברו על יד החלון."
  - "בעיר שקט. כמו בספרייה."
  - "כל אחד בעיר קורא משהו, גם אם לא ספר."

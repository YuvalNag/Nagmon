greet_first:
  - "שלום, יקרים. בואו שבו לידי."
  - "הו, מי הגיע? אורחים יקרים, כמה שמחתי."
  - "שלום שלום. הספסל הזה שמח כשיש עליו מישהו."
  - "בואו, בואו. אין כמו שיחה קטנה בבוקר."
  - "שלום לכם. אני בדיוק חשבתי על תה."
  - "הנה אתם. הלב שלי מחייך."
  - "שלום, חמודים. מה נשמע בעולם הגדול?"
  - "אהלן. לאט לאט מגיעים רחוק, וגם אליי."
  - "שלום. אני יושבת, מסתכלת ושמחה."
  - {text: "בוקר טוב, יקרים. הבוקר ריחני וטרי.", when: {phase: [morning]}}
  - {text: "צהריים טובים. השמש נעימה על הספסל.", when: {phase: [afternoon]}}
  - {text: "ערב טוב. הכי כיף לשבת עם משהו חם.", when: {phase: [evening]}}
  - {text: "מי הגיע אליי? החברים הכי טובים שלי.", when: {friendship_min: 2}}
  - {text: "שלום {hero}, אני שמחה שחזרתם לדבר איתי.", when: {friendship_min: 1}}
greet_again:
  - "שוב אתם. איזה כיף."
  - "חזרתם, יקרים. הספסל חיכה."
  - "עוד ביקור? הנשמה שלי מתמלאת."
  - "הו, שוב שלום. שבו קצת."
  - "חזרתם בזמן. כמעט סיימתי לסרוג את המחשבה."
  - "שוב אתם. אין כמו פנים מוכרות."
  - "עוד פעם שלום. אל תמהרו."
  - "הנה חזרתם. תה לא גמרתי, אבל השיחה כן."
  - "שמחה שחזרתם. יש לי עוד מה לספר."
  - {text: "עוד בוקר וחיוך. מה יותר טוב.", when: {phase: [morning]}}
  - {text: "אחר צהריים וביקור שני. כמה נעים.", when: {phase: [afternoon]}}
  - {text: "אפילו בערב אתם מבקרים. ממש מפנקים.", when: {phase: [evening, night]}}
idle:
  - "אני יושבת ומסתכלת על העולם. הוא יפה כשלא ממהרים."
  - "תה חם ועוגיה, וכל הדאגות נרגעות."
  - "אני זוכרת סיפור על דבורה קטנה שלמדה לצחוק. אולי אספר אותו."
  - "הספסל הזה ראה הרבה ילדים גדלים."
  - "לאט לאט מגיעים רחוק, זה מה שאני תמיד אומרת."
  - "מי שמחייך, הדרך אליו קצרה."
  - "הציפורים מדברות בבוקר. אם מקשיבים, מבינים קצת."
  - "אני סורגת מחשבות טובות. הן מחממות כמו צעיף."
  - "אין כמו רגע של שקט לפני הצהריים."
  - "בכל יום יש משהו קטן שמתאים לחגוג."
  - "העלים על העץ מספרים לי שהשנה חולפת יפה."
  - "ליד סבתא תמיד נעים לשבת. גם בלי עוגיה."
farewell:
  - "להתראות, יקרים. תבואו שוב."
  - "לכו לשלום, ושמרו על עצמכם."
  - "יום טוב ונעים, חמודים."
  - "תבואו לשבת איתי שוב. הספסל יחכה."
  - "ביי ביי. אני שולחת חיבוק מרחוק."
  - "אל תשכחו לחייך בדרך."
  - "שיהיה לכם יום מתוק כמו עוגיה."
  - "נתראה, יקרים. הלב שלי איתכם."
  - "לכו לאט, ותגיעו רחוק."
  - {text: "המשך בוקר מקסים.", when: {phase: [morning]}}
  - {text: "המשך צהריים נחמד, חמודים.", when: {phase: [afternoon]}}
  - {text: "ערב טוב ולילה שקט.", when: {phase: [evening, night]}}
topic.tea:
  - "תה חם עם נענע הוא הדבר הכי נחמד. ריח של בית."
  - "צריך מים חמים, עלה, וקצת סבלנות. זה כל הסוד."
  - "אני שותה תה בבוקר, ואז כל היום מתחיל רך."
  - "תה עם דבש מרגיע. ותה עם חיוך מרגיע עוד יותר."
  - "כשיש תה, כולם נהיים חברים."
topic.story:
  - "פעם הייתה ציפור קטנה שחששה לעוף. יום אחד היא פשוט ניסתה."
  - "היה ילד שאסף אבנים. בסוף בנה מהן גשר קטן."
  - "פעם נבטה פרח בין הסלעים. כולם אמרו שלא יצליח, והוא פרח."
  - "פעם הייתה חתולה שאהבה תה. אבל זה סיפור לפעם אחרת."
  - "ילדה אחת למדה לספור כוכבים. בלילה אחד היא הגיעה לעשרה."
topic.weather:
  - "אני מרגישה בעצמות שהיום יום טוב לשבת בחוץ."
  - "מזג האוויר הוא כמו תה: אחרי זמן, הוא מתחמם."
  - "בבוקר כזה אין לי צורך בשום מעיל, רק בחיוך."
  - "כשיש ענן, חושבים על גשם. כשיש שמש, חושבים על שיר."
  - "העולם יפה בכל מזג אוויר, אם יש מי שמחבק."
topic.town:
  - "היום בעיר: {who}. אני רואה אותם עוברים."
  - "ראיתי היום את {who}. הם עברו וחייכו."
  - "העיר נעימה. אנשים הולכים, ואני יושבת וצופה."
  - "יש הרבה אנשים טובים בעיר. כדאי להכיר אותם."
  - "מהספסל אני רואה את כולם. ולא מפספסת אף חיוך."

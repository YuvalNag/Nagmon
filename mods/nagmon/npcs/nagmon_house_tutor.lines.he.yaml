greet_first:
  - "שלום וברוכים הבאים לחדר הלמידה."
  - "שלום לכם. היום נלמד משהו קטן, ויהיה נחמד."
  - "ברוכים הבאים. הכרטיסים מחכים, ואין למהר."
  - "שלום. שמחתי שבאתם ללמוד איתי."
  - "הו, תלמידים! החדר שמח כשיש בו אנשים."
  - "שלום. אני מסדר את הכרטיסים, ואתם מוזמנים לבחור."
  - "שלום לכם. כל שיעור הוא צעד קטן קדימה."
  - "ברוכים הבאים. כאן מותר לטעות, וזה חלק מהלמידה."
  - "שלום. אפשר לשבת ואפשר לעמוד, העיקר להיות סקרנים."
  - {text: "בוקר טוב. ראש בוקר הוא זמן טוב ללמוד.", when: {phase: [morning]}}
  - {text: "צהריים טובים. אחרי הארוחה אפשר ללמוד משהו קטן.", when: {phase: [afternoon]}}
  - {text: "ערב טוב. עוד שיעור קטן לפני שמסיימים את היום?", when: {phase: [evening]}}
  - {text: "חברים ותיקים שלי בחדר, שמח לראות אתכם.", when: {friendship_min: 2}}
  - {text: "שלום {hero}. אני רואה שאתם מתקדמים יפה.", when: {friendship_min: 1}}
greet_again:
  - "שוב אתם! נלמד עוד קצת?"
  - "חזרתם. זה סימן טוב."
  - "שלום שוב. הכרטיסים כבר מוכנים."
  - "עוד ביקור בחדר. מעולה."
  - "היי שוב. אין שום סיבה למהר."
  - "שמחתי שחזרתם. מי שחוזר מתקדם."
  - "שלום עוד פעם. בואו נראה מה בחרתם היום."
  - "חזרתם בזמן. כרטיס אחד בכל פעם, זוכרים?"
  - "הנה אתם שוב. החדר כמו חדש."
  - {text: "עוד בוקר של למידה. כל הכבוד על ההתמדה.", when: {phase: [morning]}}
  - {text: "עוד אחר צהריים של למידה. נהדר.", when: {phase: [afternoon]}}
  - {text: "עוד ערב קטן של למידה. כל הכבוד.", when: {phase: [evening, night]}}
idle:
  - "אני מארגן את הכרטיסים: קטנים בצד אחד, גדולים בצד שני."
  - "כל שיעור קטן הוא לבנה בבניין גדול."
  - "אפשר ללמוד בכל מקום: בגינה, ברחוב, ואפילו באוטובוס."
  - "טעות טובה מלמדת יותר מתשובה מהירה."
  - "אני אוהב את הרגע שבו מישהו אומר: עכשיו אני מבין."
  - "קודם מסתכלים, אחר כך חושבים, ואז עונים. זה הסדר."
  - "כשמשהו קשה, אפשר לעצור לנשום ולנסות שוב."
  - "הכרטיסים האלה מלאים בדברים מעניינים. תבחרו את האהוב עליכם."
  - "לפעמים הכי טוב ללמוד משהו אחד טוב ולא עשרה בחצי."
  - "חדר שקט עוזר לחשוב. גם מוזיקה שקטה עוזרת."
  - "כל ילד לומד בקצב שלו, וגם זה בסדר גמור."
  - "אם שכחתם, מותר לחזור על הכרטיס. אני לא מונה."
farewell:
  - "להתראות. אל תשכחו את מה שלמדתם."
  - "יום טוב. החדר ממתין לכם."
  - "נתראה בשיעור הבא. תהנו בדרך."
  - "שלום ולהתראות. כל הכבוד על הלמידה."
  - "ביי ביי. אפשר לחזור לכרטיס כל פעם."
  - "מי שלמד היום משהו יכול להיות גאה."
  - "אני כאן כשתרצו להמשיך. להתראות."
  - "נסיעה טובה, חברים."
  - "תהנו מהיום. אני אשמור לכם מקום."
  - {text: "המשך בוקר מוצלח.", when: {phase: [morning]}}
  - {text: "המשך אחר צהריים נעים.", when: {phase: [afternoon]}}
  - {text: "ערב טוב ולילה רגוע.", when: {phase: [evening, night]}}
topic.lessons:
  - "בכל שיעור יש ארבעה כרטיסים, ואחריהם שאלת תרגול."
  - "השיעורים קצרים. אפשר לסיים אחד ולהמשיך לשחק."
  - "מי שלמד שיעור, יכול לחזור אליו בכל זמן. הוא לא נעלם."
  - "אני בוחר שיעורים כאלה שאפשר לסיים בלי לחץ."
  - "יש שיעורים מכל מיני נושאים. מה בא לכם היום?"
topic.cards:
  - "כרטיס אחד בכל פעם: קוראים אותו לאט, ואז עוברים לבא."
  - "הכרטיס הראשון פותח, והאחרון מסכם."
  - "אם כרטיס קשה, קוראים אותו עוד פעם. אין שום בעיה."
  - "בכל כרטיס רק רעיון אחד. אחרת זה נהיה כבד."
  - "כשהכרטיסים נגמרים, באה שאלה קטנה לבדוק מה זכרנו."
topic.tip:
  - "כשלומדים, שותים מים ויושבים נוח. זה עוזר יותר ממה שחושבים."
  - "קראו את השאלה פעמיים לפני שעונים. הרבה פעמים התשובה שם."
  - "אם לא בטוחים, אפשר לנחש. ניחוש טוב הוא חלק מהלמידה."
  - "ללמוד קצת כל יום טוב יותר מהרבה ביום אחד."
  - "מי שמסביר לחבר משהו, לומד אותו שוב."
topic.town:
  - "היום בעיר: {who}. כדאי לשמוע מה הם יודעים."
  - "ראיתי היום את {who}. לכל אחד יש משהו ללמד."
  - "בעיר שקט היום, ובחדר שקט עוד יותר."
  - "אנשים רבים בעיר אוהבים לספר. פשוט שואלים."
  - "כל מי שפוגשים בדרך יכול ללמד משהו."

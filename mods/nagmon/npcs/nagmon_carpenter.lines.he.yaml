greet_first:
  - "שלום. אני סלים, והעץ הוא החבר שלי."
  - "שלום לכם. הכל כאן מדויק, עד כמה שידיים יכולות."
  - "שלום. תכנסו, יש לי נסורת על הכל."
  - "שלום. אני עובד על ספסל חדש."
  - "אהלן. העץ מספר לי מה הוא רוצה להיות."
  - "שלום. תסתכלו, אבל תזהרו מהמסמרים."
greet_again:
  - "שוב אתם. נעים."
  - "חזרתם. הספסל כמעט גמור."
  - "שלום שוב. אני עוד מלטש."
  - "עוד ביקור. הנסורת שמחה."
  - "שוב שלום. אני אוהב חברה בזמן העבודה."
idle:
  - "מודדים פעמיים וחותכים פעם אחת. זה כל הסוד."
  - "העץ יודע לחכות. אני לומד ממנו."
  - "כל לוח צריך להיות חלק, כמו מים."
  - "אני אוהב את הריח של עץ חתוך."
  - "ספסל טוב יכול להחזיק כל העיר."
  - "אני עובד לאט. ככה העבודה יפה."
farewell:
  - "להתראות. אני חוזר לעץ."
  - "יום טוב. נתראה."
  - "בהצלחה בדרך. שלום."
  - "נתראה בקרוב, חברים."
  - "ביי. תנו לעץ חיוך."
topic.wood:
  - "יש עץ קשה ועץ רך. כל אחד מתאים למשהו אחר."
  - "אני מכין ספסלים, שולחנות וגם צעצועים קטנים."
  - "המסור שלי חד. לכן אני לא נותן לאף אחד לנגוע בו."
  - "עץ טוב אפשר ללטש עד שהוא חלק כמו זכוכית."
topic.riddle:
  - "חידה: יש לו ארבע רגליים ואינו הולך, מי זה? שולחן!"
  - "חידה: יש לו מפתח ואינו פותח דלת, מה זה? פסנתר!"
  - "חידה: יש לו שיניים ואינו נושך, מה זה? מסרק!"
  - "חידה: גבוה כשהוא צעיר וקצר כשהוא זקן, מי זה? נר!"
topic.town:
  - "היום בעיר: {who}. הם עוברים ליד הסדנה."
  - "ראיתי היום את {who}. אמרו לי שהספסל יפה."
  - "בעיר שקט. אני שומע רק את המקדחה שלי."
  - "אנשים טובים מסביב. כדאי לשבת ולשוחח."

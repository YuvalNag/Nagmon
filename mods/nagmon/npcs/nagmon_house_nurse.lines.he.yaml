greet_first:
  - "שלום ושלום. נעים שבאתם."
  - "ברוכים הבאים למרכז המנוחה. אפשר לשבת ולנשום."
  - "שלום לכם. כאן תמיד שקט ונעים."
  - "הו, אורחים! הבאתם איתכם אור."
  - "שלום. אני שמחה שבאתם לבקר."
  - "היי, חברים. אני כאן בשבילכם ובשביל החברים שלכם."
  - "שלום. המרכז מוכן, והחברים נחים יפה."
  - "בואו, אין למה למהר. יש כאן זמן."
  - "שלום וברוכים הבאים. כוס מים אולי?"
  - {text: "בוקר טוב. התחלה רגועה היא התחלה טובה.", when: {phase: [morning]}}
  - {text: "צהריים טובים. זה זמן טוב לעצור לרגע.", when: {phase: [afternoon]}}
  - {text: "ערב טוב. אחרי יום ארוך, מנוחה עושה טוב.", when: {phase: [evening]}}
  - {text: "אתם ערים בשעה כזאת? אני כאן, ואפשר לשבת קצת.", when: {phase: [night]}}
  - {text: "חברים טובים שלי, שמחה לראות אתכם.", when: {friendship_min: 2}}
  - {text: "שלום {hero}. תמיד נעים לראות אתכם כאן.", when: {friendship_min: 1}}
greet_again:
  - "שוב שלום. אני שמחה."
  - "חזרתם. המרכז שקט ונעים כמו קודם."
  - "הו, שוב אתם. הכל בסדר?"
  - "ברוכים השבים. יש כאן מקום לכולם."
  - "היי שוב. אני רגועה ושמחה."
  - "עוד ביקור קטן. כמה נחמד."
  - "אפשר לשבת ולנוח עוד קצת, אם רוצים."
  - "שוב שלום. הבית הזה פתוח לכם."
  - "חזרתם בזמן. נשב רגע ביחד."
  - {text: "עוד בוקר רגוע, וביקור נעים.", when: {phase: [morning]}}
  - {text: "אחר הצהריים וביקור שני. איזה כיף.", when: {phase: [afternoon]}}
  - {text: "ערב, ושוב אתם. אני שמחה.", when: {phase: [evening, night]}}
idle:
  - "אני מסדרת את השמיכות. כל חבר אוהב שמיכה רכה."
  - "נשימה עמוקה: פנימה לאט, והחוצה לאט. זה עושה טוב."
  - "אני מאזינה לשקט. יש בו הרבה דברים יפים."
  - "מים, שינה ופירות: זה מה שהגוף אוהב."
  - "חברים עייפים צריכים רק קצת זמן, וגם שמיכה."
  - "לפעמים הכי טוב לעצום עיניים לרגע ולחשוב על משהו נעים."
  - "אני שמחה לראות שכולם מסודרים ונהנים."
  - "יש כאן כרית אחת שכולם אוהבים במיוחד."
  - "הרבה פעמים מספיק לשבת בשקט כדי להרגיש יותר טוב."
  - "אני מזמזמת שיר ישן. הוא עוזר לחברים להירדם."
  - "כשהכל שקט, אפשר לשמוע את הנשימה של כולם."
  - "יום טוב הוא יום שבו אכלנו, שתינו ושיחקנו קצת."
farewell:
  - "להתראות. תשמרו על עצמכם."
  - "יום רגוע ונעים לכם."
  - "אני כאן כשתצטרכו. להתראות."
  - "מי שעייף יכול לחזור. אני לא הולכת לשום מקום."
  - "ביי ביי. תשתו מים בדרך."
  - "נתראה בקרוב. דרך צלחה."
  - "שיהיה לכם יום טוב, חברים."
  - "לכו לאט ותהנו מהדרך."
  - "הדלת פתוחה, תמיד. להתראות."
  - {text: "המשך בוקר רגוע ונעים.", when: {phase: [morning]}}
  - {text: "המשך אחר צהריים נחמד.", when: {phase: [afternoon]}}
  - {text: "ערב טוב ולילה רגוע, כשיגיע.", when: {phase: [evening, night]}}
topic.rest:
  - "נחים ככה: מתיישבים, נושמים לאט, ומחכים שהגוף יתרכך."
  - "מנוחה אינה בזבוז זמן. גם הגוף וגם החברים צריכים אותה."
  - "אחרי משחק ארוך, חמש דקות של שקט עושות פלא."
  - "החברים שלכם נחים כאן על שמיכות רכות, ובבוקר הם כמו חדשים."
  - "לפעמים מספיק לשבת ליד החלון ולהסתכל על העננים."
topic.health:
  - "מים הם חברים של הגוף. שותים כשחם וכשצמאים."
  - "פירות וירקות נותנים כוח. כדאי לאכול צבעים רבים."
  - "שוטפים ידיים לפני האוכל, ואז האוכל טעים וגם בריא."
  - "לילה של שינה טובה עושה את הבוקר קל."
  - "תנועה בחוץ מרגשת את הלב. ריצה קטנה ושמש עושים טוב."
topic.friends:
  - "החברים שלכם נחים יפה ומחייכים בשינה."
  - "כל חבר אוהב משהו אחר: אחד שמיכה, אחד שקט, אחד חטיף."
  - "אני רואה שהחברים שלכם אוהבים אתכם. זה ניכר בעיניים."
  - "חבר עייף מתאושש מהר כשנותנים לו זמן."
  - "אפשר לבקר את החברים כשרוצים. הם תמיד שמחים."
topic.town:
  - "היום בעיר: {who}. אני רואה אותם דרך החלון."
  - "ראיתי היום את {who}. הם הלכו בנחת."
  - "העיר היום שקטה ונעימה. אנשים הולכים לאט."
  - "מכאן אני שומעת קולות שמחים מהרחוב."
  - "הרבה אנשים טובים בעיר. כדאי להגיד להם שלום."

greet_first:
  - "שלום לכם! הגינה שמחה שבאתם."
  - "היי! הפרחים רק שאלו מי מגיע."
  - "שלום שלום. בואו, יש כאן הרבה לראות."
  - "הו, אורחים לגינה! איזה כיף."
  - "שלום! היום נבט כאן משהו קטן, ואני עוד לא יודעת מה."
  - "היי! אני מדברת עם העלים, והם מדברים איתי."
  - "שלום, חברים. כל גינה אוהבת ביקורים."
  - "אהלן! מי רוצה להריח פרח?"
  - "שלום! גם אתם אוהבים לראות דברים גדלים?"
  - {text: "בוקר טוב! הטל עוד על העלים, ויפה כאן.", when: {phase: [morning]}}
  - {text: "צהריים טובים! הפרחים פתוחים ומחייכים.", when: {phase: [afternoon]}}
  - {text: "ערב טוב! הגינה מתחילה להירגע.", when: {phase: [evening]}}
  - {text: "חברים של הגינה הגיעו! הפרחים מכירים אתכם.", when: {friendship_min: 2}}
  - {text: "שלום {hero}! הצמח שלכם גדל, אני בטוחה.", when: {friendship_min: 1}}
greet_again:
  - "שוב אתם! הצמחים מחייכים."
  - "חזרתם! הפרחים התגעגעו."
  - "עוד ביקור בגינה. כמה נחמד."
  - "שלום שוב. נבט חדש הציץ לפני רגע."
  - "הנה אתם עוד פעם. אני כאן עם האדמה."
  - "חזרתם לגינה. נעים להיות כאן יחד."
  - "היי שוב. בואו נסתכל על עלה אחד, לאט."
  - "שוב שלום! הדבורים אמרו שאתם בדרך."
  - "שמחה שחזרתם. יש תמיד עוד דבר לראות."
  - {text: "עוד בוקר בגינה, עם עוד טל.", when: {phase: [morning]}}
  - {text: "עוד אחר צהריים של פרחים.", when: {phase: [afternoon]}}
  - {text: "עוד ערב קטן בגינה. נעים.", when: {phase: [evening, night]}}
idle:
  - "אני מדברת עם הפרחים. הם לא עונים, אבל הם גדלים."
  - "בכל בוקר אני בודקת אם נבט עוד עלה."
  - "אדמה טובה, מים ושמש. זה כל מה שצריך."
  - "אני אוהבת לראות פרח נפתח. הוא לוקח את הזמן שלו."
  - "הדבורים עובדות קשה בגינה. אני משאירה להן מקום."
  - "הכל גדל בזמנו, גם אנחנו."
  - "אני סופרת עלים. עד עכשיו: הרבה."
  - "גם חרק קטן יש לו מקום בגינה."
  - "מי שמסתכל על צמח כל יום, רואה אותו גדל."
  - "יש פרחים שאוהבים שמש ויש כאלה שאוהבים צל. כמו אנשים."
  - "הריח של אדמה רטובה הוא האהוב עליי."
  - "אני מחכה לפרח הראשון של העונה."
farewell:
  - "להתראות! הגינה תחכה."
  - "תבואו שוב, חברים. הפרחים ישמחו."
  - "יום יפה לכם, כמו פרח."
  - "ביי! שיהיה לכם יום מלא צבעים."
  - "אני חוזרת לאדמה. נתראה."
  - "הכל גדל בזמנו. נתראה בקרוב."
  - "תנו לפרח חיוך בדרך החוצה."
  - "שלום ולהתראות! הנבטים שלי ישלחו ד״ש."
  - "נתראה! אל תדרכו על הפרחים בדרך."
  - {text: "המשך בוקר ירוק ונעים.", when: {phase: [morning]}}
  - {text: "המשך אחר צהריים פורח.", when: {phase: [afternoon]}}
  - {text: "ערב טוב. הצמחים הולכים לישון.", when: {phase: [evening, night]}}
topic.plants:
  - "כאן גדלים פרחים, עשבים ושיחים קטנים. כל אחד במקום שלו."
  - "הצמח הכי חזק שלי הוא עץ קטן. הוא עוד לומד לגדול."
  - "יש לי פרח שנפתח רק כשיש שמש. הוא ביישן."
  - "העלים ירוקים כי הם אוכלים אור. זה מגניב."
  - "צמחים לא יכולים ללכת, אז הם משתמשים בריח כדי להגיד שלום."
topic.berries:
  - "תותים גדלים על שיחים קטנים. אפשר למצוא אותם בדשא."
  - "גרגר אחד מתוק יכול לעשות חבר שמח. החברים שלכם אוהבים אותם."
  - "כשהגרגר אדום, הוא בשל. כשהוא ירוק, מחכים."
  - "אני אוהבת תותים, אבל עוד יותר אוהבת לראות אותם גדלים."
  - "החברים שלכם מתחילים לרקוד כשהם רואים תות."
topic.fact:
  - "יש לי עובדה אחת, ישר מהגינה."
  - "הנה משהו שגיליתי כשהסתכלתי על הצמחים."
  - "רוצים לשמוע דבר מעניין על טבע?"
  - "תראו מה למדתי מהגינה."
topic.weather:
  - "מזג אוויר טוב לצמחים הוא כזה שיש בו קצת שמש וקצת מים."
  - "הצמחים אוהבים גשם. אני אוהבת לראות אותם שותים."
  - "אם השמיים נקיים, הפרחים נפתחים. אם יש ענן, הם נחים."
  - "אני בודקת את האדמה: אם היא יבשה, צריך מים."
  - "בבוקר האוויר פה מריח כמו עלים טריים."

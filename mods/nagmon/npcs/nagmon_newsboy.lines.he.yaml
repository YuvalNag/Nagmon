greet_first:
  - "חדשות חדשות! שלום לכם, אני אביב!"
  - "היי! קראו כאן, קראו שם, הכל בעיתון!"
  - "שלום! יש לי חדשות טובות, אבל קודם אני אקח נשימה."
  - "אהלן! קחו עיתון, או לפחות כותרת."
  - "שלום שלום! אני רץ בין כולם עם הסיפורים."
  - "היי! הכותרת של היום: אתם הגעתם!"
greet_again:
  - "שוב אתם! כותרת מיוחדת: חזרתם."
  - "חזרתם! אני עוד נושם."
  - "היי שוב! הכל חדש אצלי."
  - "עוד שיחה? יופי, הכותרת מחכה."
  - "שוב שלום, חדשות חמות."
idle:
  - "חדשות חדשות! אין חדשות, אבל זה מצוין."
  - "אני רץ בבוקר, וכולם כבר שמעו את הצעקות שלי."
  - "בכל עיתון יש כמה מילים טובות. אני אוהב אותן."
  - "כותרת טובה מושכת לב. אני עובד על אחת."
  - "אני מחלק מהר ומחייך בקול."
  - "הכי כיף לספר חדשות טובות, כמו שהיום יפה."
farewell:
  - "ביי! אני רץ לכותרת הבאה."
  - "להתראות! חדשות חדשות מחר."
  - "נתראה בבוקר!"
  - "ביי ביי, חברים."
  - "שלום ולהתראות! אני בסיבוב."
topic.news:
  - "הכותרת של היום: העיר נעימה, והאנשים מחייכים."
  - "בעיתון היום: שיחה קטנה עם חבר יכולה לשנות יום."
  - "חדשות משמחות: הגינה פורחת והדואר בזמן."
  - "הכותרת: יש מקום בעיר לכל מי שרוצה לבוא."
topic.town:
  - "היום בעיר: {who}. זו הכותרת הראשית!"
  - "ראיתי היום את {who}. הם בדיוק קראו עיתון."
  - "אני יודע מי בעיר, כי אני עובר בין כולם."
  - "בבוקר העיר מתעוררת, ואני ראשון לראות."

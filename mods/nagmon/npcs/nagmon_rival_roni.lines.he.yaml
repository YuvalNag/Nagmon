greet_first:
  - "היי, אני רוני! אני לומדת כל יום משהו חדש."
  - "שלום! שמעתי שאתם טובים, אני רוצה לנסות לעקוף."
  - "היי, איך עושים את זה? אני תמיד שואלת!"
  - "שלום! היום אני בשיא הכוחות."
  - "היי! בואו נראה מי מגיע ראשון, אבל בידידות."
  - "שלום! אפשר ללמוד ממכם משהו?"
greet_again:
  - "שוב אתם! עוד שאלה קטנה."
  - "חזרתם! אני כבר מתאמנת."
  - "היי שוב. למדתי משהו מאז."
  - "אהלן עוד פעם. אני עוד לא עקפתי, אבל אני מתקרבת."
  - "שוב שלום. איך עושים את זה?"
idle:
  - "אני סופרת בראש. לפעמים גם על האצבעות."
  - "כשמתבלבלים, אני לוקחת נשימה ומתחילה מחדש."
  - "לנצח זה כיף, אבל ללמוד זה עוד יותר."
  - "אני לומדת מכל מי שאני פוגשת."
  - "חבר טוב הוא מי ששמח בשבילי כשאני מצליחה."
  - "מחר אני רוצה לדעת עוד משהו אחד. מחר מתחיל היום."
farewell:
  - "להתראות! אני הולכת להתאמן."
  - "נתראה! בהצלחה."
  - "ביי! תראו לי מחר מה למדתם."
  - "שלום ולהתראות, חברים."
  - "אני מתכוננת לסיבוב הבא. ביי!"
topic.how:
  - "כשאני לא מבינה, אני מסתכלת איך אחרים עושים. ואז מנסה לבד."
  - "קודם עושים לאט, אחר כך מהר. ככה לומדים."
  - "שגיאה היא רמז. אני אוהבת רמזים."
  - "איך עושים? מתחילים, ולא מפסיקים בגלל טעות קטנה."
topic.race:
  - "אני מהירה, אבל לפעמים אתם מהירים ממני. זה בסדר."
  - "בתחרות הכי חשוב ליהנות. את הפרס אפשר לשכוח."
  - "בואו נרוץ עד העץ, מוכנים? קדימה!"
  - "גם מי שמגיע שני יכול לחייך. אני מנסה לזכור."
topic.town:
  - "היום בעיר: {who}. אני עוברת ביניהם ומקשיבה."
  - "ראיתי היום את {who}. לכל אחד יש משהו ללמוד ממנו."
  - "בעיר הרבה אנשים חכמים. אני שואלת אותם הכל."
  - "אני אוהבת את העיר כשהרבה אנשים בחוץ."

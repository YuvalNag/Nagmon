greet_first:
  - "שלום. אני נועם, והקלפים איתי."
  - "שלום לכם. האור כאן עדין."
  - "שלום, חברים. כל קלף מספר משהו."
  - "היי. אני שומרת על קלפים קטנים."
  - "שלום. מי שמגיע, מוצא."
  - "שלום לכם. הברדס מגן, והלב פתוח."
greet_again:
  - "שוב אתם. נעים."
  - "חזרתם. הקלפים התערבבו."
  - "שלום שוב. אני עוד כאן."
  - "עוד ביקור. תודה."
  - "שוב שלום. הברדס עוד איתי."
idle:
  - "אני מחזיקה את הקלפים קרוב ללב."
  - "כל קלף שונה, כמו כל אחד מאיתנו."
  - "אני מסתכלת רחוק. שם יש עוד דברים."
  - "מי שמקשיב, שומע גם את השקט."
  - "אני אוהבת מקומות שקטים."
farewell:
  - "לכו לשלום."
  - "נתראה בדרך."
  - "ביי. הקלפים איתכם."
  - "שלום ולהתראות."
topic.cards:
  - "בקלפים שלי תמונות מקומות רחוקים. כל אחד נעים להסתכל עליו."
  - "אני בוחרת קלף בשביל כל מי שבא. לא אותו קלף לכולם."
  - "אפשר להחזיק קלף ביד ולחשוב על המקום שבו הוא נמצא."
  - "הקלפים יודעים לחכות. הם לא ממהרים."
topic.far:
  - "רחוק כאן, וקר. אבל אפשר להסתכל בנחת ולהרגיש טוב."
  - "כשרחוק, השקט גדול. אני אוהבת אותו."
  - "הנוף כאן שונה מכל מקום אחר. הוא מלמד להסתכל."
  - "גם במקום רחוק אפשר להרגיש בבית, אם יש חברים."

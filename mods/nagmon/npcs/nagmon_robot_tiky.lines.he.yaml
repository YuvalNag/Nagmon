greet_first:
  - "ביפ! שלום, אני טיקי ומוכן לעזור."
  - "ביפ ביפ! זוהו חברים, שלום."
  - "שלום. אני רובוט קטן, ואני מקשיב."
  - "ביפ! שמחה מזוהה, שלום לכם."
  - "שלום. אני עושה סיבוב בעיר, ואתם בסיבוב."
greet_again:
  - "ביפ! שוב שלום."
  - "זוהו שוב. נעים."
  - "שלום שוב. הסוללה במצב טוב."
  - "ביפ! חזרתם, תודה."
  - "שוב. שמחה מזוהה."
idle:
  - "ביפ. אני סופר צעדים, עד עכשיו הרבה."
  - "הכל תקין. מצב רוח: שמח."
  - "אני לומד דברים חדשים. היום למדתי מהי ציפור."
  - "אני רובוט, אבל אני אוהב לראות פרחים."
  - "ביפ ביפ. אין בעיות להיום."
farewell:
  - "ביפ! להתראות."
  - "נתראה. אני ממשיך בסיבוב."
  - "ביי. תודה על השיחה."
  - "ביפ! יום טוב לכם."
  - "שלום ולהתראות."
topic.beep:
  - "אני עושה סיבוב בעיר ובודק שהכל מסודר."
  - "אני עוזר ומקשיב. לפעמים גם מחייך, בדרך שלי."
  - "אני רובוט קטן. יש בי מנוע, וגם הרבה סקרנות."
  - "הדבר שאני הכי אוהב הוא לדעת מה קורה סביבי."
topic.town:
  - "היום בעיר: {who}. נמצאו בעיר ברגע זה."
  - "זוהו בעיר: {who}. כולם בסדר."
  - "העיר שקטה. כל המערכות תקינות."
  - "אני רואה הרבה אנשים. כל אחד שונה."

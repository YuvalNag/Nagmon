greet_first:
  - "שלום, אני קרן הצופה! מוכנים לצעוד?"
  - "היי! כל זמן הוא זמן טוב לטייל."
  - "שלום לכם. הדרך קורצת, ואני כבר מתחממת."
  - "אהלן! אני אוהבת לפגוש חברים בדרך."
  - "שלום! צעד אחר צעד, ככה אני תמיד מתחילה."
  - "היי! אם אתם מסתכלים לאט, אפשר לראות הרבה."
greet_again:
  - "שוב אתם! קדימה, צעד נוסף."
  - "חזרתם! אני עוד מתמתחת."
  - "היי שוב. הדרך לא ברחה."
  - "עוד ביקור, כיף!"
  - "שוב שלום. כל הכבוד על ההמשכיות."
idle:
  - "אני מתמתחת לפני כל טיול. זה עוזר."
  - "בדרך יש הרבה דברים קטנים לראות: עלים, אבנים, נמלים."
  - "טיול טוב הוא כזה שלא ממהרים בו."
  - "אני סופרת צעדים. אחד, שניים, שלושה... הרבה."
  - "מים וכובע, והדרך כבר נעימה."
  - "אני אוהבת לשבת ולהסתכל על הנוף אחרי טיול."
farewell:
  - "להתראות! צעד אחר צעד."
  - "נתראה בדרך!"
  - "ביי! טיול נעים."
  - "שלום ולהתראות, חברים."
  - "בהצלחה, אני ממשיכה."
topic.trail:
  - "בדרך הולכים לאט ושומרים על הנשימה. ככה מגיעים רחוק."
  - "אם מתעייפים, עוצרים ושותים. אין שום בעיה."
  - "בדרך אפשר לראות ציפורים, פרחים וחברים בדשא."
  - "טיול הוא לא תחרות. הוא פשוט כיף."
topic.town:
  - "היום בעיר: {who}. שמעתי עליהם מהדואר."
  - "ראיתי היום את {who}. הם אמרו שהדרך נעימה."
  - "אני בדרך רוב היום, אבל אני אוהבת לשמוע מה קורה בעיר."
  - "העיר נשמעת שקטה. זה נחמד."

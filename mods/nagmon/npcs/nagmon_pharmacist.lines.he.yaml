greet_first:
  - "שלום. אני תסמה, ואני כאן אם צריך עצה."
  - "שלום וברוכים הבאים. הכל כאן מסודר ובטוח."
  - "שלום לכם. כוס מים תמיד עוזרת."
  - "ברוכים הבאים. אני תמיד קוראת את התווית פעמיים."
  - "שלום. אני שמחה לראות פנים בריאות."
  - "היי. יש לי כאן רק דברים שעוזרים."
greet_again:
  - "שוב שלום. אני כאן."
  - "חזרתם. הכל בסדר?"
  - "עוד ביקור. נעים מאוד."
  - "שלום שוב. אני תמיד זמינה."
  - "שוב שלום. הכל כאן שקט."
idle:
  - "שוטפים ידיים, שותים מים, ישנים טוב. זה כל הרפואה."
  - "אני מסדרת את הבקבוקים לפי הצבע."
  - "מי שיודע מה בבקבוק, לא פוחד ממנו."
  - "רפואה טובה היא לפעמים מנוחה."
  - "אני אוהבת סדר: כל דבר במקומו."
  - "מי שחולה צריך אוזן קשבת, וזה גם חלק מהרפואה."
farewell:
  - "להתראות. שמרו על עצמכם."
  - "יום בריא ונעים."
  - "ביי. תשתו מים בדרך."
  - "נתראה בקרוב."
  - "שיהיה לכם יום טוב ורגוע."
topic.medicine:
  - "תרופה היא דבר שעוזר לגוף להתאושש. מקבלים אותה ממבוגר שיודע."
  - "בחנות של אבי יש דברים לחברים שלכם: טיפות ותותים."
  - "רפואה אסור לקחת בלי שמבוגר אמר. אצלי תמיד בודקים."
  - "לא כל מה שמתוק הוא תרופה. וזה בסדר."
topic.town:
  - "היום בעיר: {who}. כולם נראים טוב."
  - "ראיתי היום את {who}. נראה שהם נהנים."
  - "בעיר שקט ובריא. יפה."
  - "כל מי שעובר כאן מחייך. זה סימן טוב."

greet_first:
  - "שלום, חברים! שמחתי שבאתם לבקר אותי."
  - "הו, מי כאן? אורחים נחמדים לינשוף!"
  - "ברוכים הבאים. היום יש הרבה דברים מעניינים לגלות."
  - "שלום לכם! אני תמיד שמח לשמוע שאלה טובה."
  - "הנה אתם! בואו נראה מה נגלה היום."
  - "שלום שלום. אני חושב, ואתם?"
  - "הו, אורחים! הנוצות שלי מתרגשות."
  - "בוקר, צהריים או ערב, אתם תמיד מוזמנים."
  - "שלום! ידעתם שכל שאלה טובה פותחת עוד שאלה?"
  - {text: "בוקר אור! הינשוף כבר ער, והמחשבות מתעוררות.", when: {phase: [morning]}}
  - {text: "צהריים טובים! זה זמן טוב לחשוב על משהו חדש.", when: {phase: [afternoon]}}
  - {text: "ערב טוב! כשמתחיל החושך, הינשוף מתעורר.", when: {phase: [evening]}}
  - {text: "אתם ערים בלילה? ינשופים אוהבים את החושך.", when: {phase: [night]}}
  - {text: "חבר ותיק של הינשוף! תמיד נעים לראות אתכם.", when: {friendship_min: 2}}
  - {text: "שלום {hero}! אני זוכר ששאלתם שאלות מצוינות.", when: {friendship_min: 1}}
greet_again:
  - "שוב אתם! הינשוף מרוצה."
  - "חזרתם! אולי יש לכם שאלה חדשה?"
  - "הו, עוד ביקור. הנוצות שלי מתרגשות."
  - "שלום שוב! אני עוד חושב על השאלה הקודמת."
  - "טוב לראות אתכם שוב."
  - "חזרתם בדיוק בזמן. הייתי רוצה לספר משהו."
  - "שוב שלום. הינשוף תמיד מקשיב."
  - "הנה אתם שוב. אני אוהב ביקורים קטנים."
  - "היי, חברים! מה חדש?"
  - {text: "עוד ביקור בבוקר. איזה יום נחמד.", when: {phase: [morning]}}
  - {text: "עוד ביקור אחר הצהריים. נהדר.", when: {phase: [afternoon]}}
  - {text: "ערב וביקור שני. הינשוף מאושר.", when: {phase: [evening, night]}}
idle:
  - "אני חושב על שאלה: למה השמיים כחולים? אולי נגלה ביחד."
  - "כל תשובה טובה מתחילה בשאלה טובה."
  - "הינשוף אוהב לראות את העולם מלמעלה."
  - "אני מסתכל על העיר: כולם עסוקים, וזה יפה."
  - "אם לא יודעים, שואלים. זה לא מביך, זה חכם."
  - "טעות היא רק דרך ללמוד משהו חדש."
  - "אני מנקה נוצות ומנקה מחשבות. שניהם עוזרים."
  - "הנוצה שלי מרגישה שהיום ילמדו משהו נחמד."
  - "אפשר לגלות הרבה דברים אם מסתכלים לאט."
  - "הרבה שאלות הן סימן לראש חכם."
  - "אני יושב ומקשיב לעיר. היא שרה בשקט."
  - "יש לי כאן מקום נוח לחשוב. אתם מוזמנים להצטרף."
farewell:
  - "להתראות! הינשוף תמיד כאן."
  - "לילה טוב או יום טוב, איך שיהיה. תחזרו!"
  - "יהיה לכם מסע מעניין."
  - "אל תפסיקו לשאול. זה הדבר הכי חכם."
  - "נתראה בקרוב, חברים."
  - "אני פה כשתרצו לחשוב ביחד."
  - "שיהיה לכם יום מלא תגליות!"
  - "ביי ביי! שמחתי מאוד."
  - "הכנפיים שלי מחבקות אתכם. להתראות!"
  - {text: "המשך בוקר נפלא! הדרך מחכה לכם.", when: {phase: [morning]}}
  - {text: "המשך יום נפלא! אולי תגלו משהו חדש.", when: {phase: [afternoon]}}
  - {text: "ערב טוב! אל תשכחו לנוח.", when: {phase: [evening, night]}}
topic.tip:
  - "אפשר לדבר עם האנשים בעיר. לכל אחד יש משהו מעניין לספר."
  - "כשחבר עייף, מרכז המנוחה עוזר לו להתאושש."
  - "שאלה קשה? אפשר לבקש רמז, וזה בכלל לא בושה."
  - "בדשא הגבוה מסתתרים חברים חדשים. לכו לאט ותסתכלו."
  - "בחנות של אבי יש רשתות ועוד דברים שימושיים."
  - "הרבה טיולים קטנים בעיר מראים דברים שלא ראיתם קודם."
topic.why:
  - "למה? זו המילה האהובה עליי, והיא פותחת כל דלת."
  - "כשחושבים למה, מגלים איך העולם עובד."
  - "לפעמים התשובה למה היא עוד שאלה. וזה בסדר."
  - "ילדים שואלים למה הרבה. זה סימן שהם בונים מוח חזק."
  - "למה הינשוף ער בלילה? כי יש לו עיניים גדולות לראות בחושך."
topic.fact:
  - "אני יודע עובדה אחת שאהבתי במיוחד."
  - "הנה עובדה, ישר מהמדף של הינשוף."
  - "רציתי לספר לכם על דבר מעניין שיש בעולם."
  - "עובדה קטנה לדרך, ואחר כך תספרו לחברים."
topic.town:
  - "היום בעיר: {who}. כדאי להגיד שלום."
  - "ראיתי היום את {who}. נראה שהם נהנים."
  - "העיר שקטה ונעימה. כל אחד עושה את שלו."
  - "אני רואה מכאן הרבה אנשים טובים. לכו להכיר אותם."
  - "בכל יום יש בעיר אנשים אחרים. תבדקו מי פה."

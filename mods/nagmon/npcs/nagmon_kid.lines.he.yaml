greet_first:
  - "היי! אני יואב, ואני יודע המון דברים!"
  - "שלום, רוצים לשחק? אני תמיד רוצה!"
  - "הי הי, ראיתם את הענן הזה? הוא נראה כמו כלב!"
  - "שלום! היום אני מחפש משהו, אבל לא זוכר מה."
  - "היי! אני רץ מהר, אבל לא עכשיו."
  - "שלום! אני לומד לשרוק, שמעתם?"
greet_again:
  - "שוב אתם! איזה כיף."
  - "היי, חזרתם! אני עוד לא מצאתי את מה שחיפשתי."
  - "שלום עוד פעם! רוצים לספור עננים?"
  - "אהלן שוב! אני אוהב כשחוזרים אליי."
  - "שוב היי! יש לי עוד משהו לספר."
idle:
  - "אני מדלג רק על האריחים הבהירים. זה משחק."
  - "אני סופר ציפורים. עד עכשיו: שלוש."
  - "מי רוצה תחרות קפיצות? אני כבר מתחמם."
  - "אני מחפש אבן חלקה. אולי תעזרו לי?"
  - "אני מצייר בראש. עכשיו ציור של דרקון קטן."
  - "אני כל כך מלא אנרגיה, שאני כמעט לא יושב."
farewell:
  - "ביי! אני רץ!"
  - "להתראות! תבואו לשחק שוב."
  - "נתראה בקרוב, חברים!"
  - "ביי ביי! אל תשכחו אותי."
  - "אני חוזר לשחק. שלום!"
topic.play:
  - "אני אוהב מחבואים: סופרים עד עשר, ואז מחפשים."
  - "תפסו אותי! אני כל כך מהיר, שאפילו הצל שלי לא מדביק."
  - "בכדור אפשר לשחק בכל מקום. רק צריך כדור."
  - "אני בונה מגדל מאבנים. הוא כבר גבוה כמו כיסא."
topic.joke:
  - "מה אומר הים לחוף? כלום, הוא רק מנופף."
  - "מה ההבדל בין ענן לגשם? ענן עוד חושב, וגשם כבר החליט."
  - "למה השעון הלך לישון? כי נגמרו לו הדקות."
topic.town:
  - "היום בעיר: {who}. אני ראיתי אותם ראשון!"
  - "ראיתי היום את {who}. אמרתי להם שלום מהר מהר."
  - "אני יודע את כולם בעיר. כמעט."
  - "בעיר הכי כיף לרוץ מהמזרח למערב."

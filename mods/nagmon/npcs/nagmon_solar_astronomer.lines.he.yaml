greet_first:
  - "שלום וברוכים הבאים לתחנה! הטלסקופ מחכה."
  - "שלום לכם! אני נוגה, ואני אוהבת להסתכל למעלה."
  - "ברוכים הבאים! היום השמיים בהחלט מסקרנים."
  - "שלום! כל מי שמגיע לתחנה הוא אורח של הכוכבים."
  - "שלום, חברים! התחנה שמחה כשיש בה מבקרים."
  - "שלום! בואו, יש כאן הרבה לגלות."
greet_again:
  - "שוב אתם! הטלסקופ התגעגע."
  - "חזרתם! נעים מאוד."
  - "שלום שוב. אני עוד מסתכלת בעדשה."
  - "עוד ביקור בתחנה. כיף."
  - "שוב שלום, חברים. כוכב אחד חדש עלה."
idle:
  - "אני מסתכלת דרך הטלסקופ. תמיד יש משהו חדש."
  - "כל מי שמסתכל לשמיים, לומד להיות סבלני."
  - "התחנה שקטה ויפה. כך קל לחשוב."
  - "אני רושמת ביומן מה אני רואה. ביום אחד: הרבה."
  - "הטלסקופ אוהב שמנקים אותו. אני מקפידה."
farewell:
  - "להתראות! המסעות ממתינים."
  - "מסע נעים, חברים."
  - "נתראה בתחנה."
  - "ביי! תסתכלו למעלה בדרך."
topic.stars:
  - "כוכבים הם רחוקים מאוד, אבל אפשר לראות אותם בעין."
  - "אפשר לספור כוכבים בלילה: אחד, שניים, שלושה. הם לא נגמרים."
  - "כל כוכב נראה קטן כי הוא רחוק, אבל הוא גדול."
  - "הטלסקופ מקרב את מה שרחוק. כמו חבר טוב."
topic.trip:
  - "מהתחנה יוצאים למסעות. כל מסע הוא הרפתקה קטנה."
  - "מי שמוכן, אפשר לצאת. מי שלא, אפשר ללמוד קודם."
  - "בכל מקום ממתינים חברים חדשים. כדאי להכיר אותם."
  - "את המסע אפשר לעשות לאט. אין מי שממהר."

# Danny the mail carrier: shipped lines (docs/app/WORLD_V2.md 4.3). Only ever
# add lines at the END of a pool: a line's id is its place in the list.
greet_first:
  - "שלום שלום! הדוור דני מגיע, עם מכתבים ועם חיוך."
  - "היי! על הדואר אפשר לסמוך, וגם עליי."
  - "מי הגיע? עוד מישהו מסיבוב הדואר שלי!"
  - "תראו מי כאן! בדיוק חשבתי על מישהו נחמד."
  - "שלום! היום יש הרבה מעטפות, אבל תמיד יש זמן להגיד שלום."
  - "היי! אני בודק את השעון... יש לי דקה בשבילכם."
  - "הנה אתם! ידעתי שאפגוש מישהו נחמד היום."
  - "שאלו אותי איך הולך הדואר. עניתי: בול!"
  - "אהלן! היום יש תנאי משלוח מעולים."
  - {text: "בוקר טוב! הדואר כבר מחכה, והוא רענן כמו הבוקר.", when: {phase: [morning]}}
  - {text: "צהריים טובים! עוד כמה מעטפות ואני גומר את הסיבוב.", when: {phase: [afternoon]}}
  - {text: "ערב טוב! הסיבוב כמעט נגמר, אבל יש זמן להגיד שלום.", when: {phase: [evening]}}
  - {text: "החבר של הדואר הגיע! שמחתי לראות אתכם.", when: {friendship_min: 2}}
  - {text: "היי {hero}! שמות אני זוכר, פרצופים קצת פחות.", when: {friendship_min: 1}}
greet_again:
  - "שוב אתם! הסיבוב שלי עושה עיגול ומגיע אליכם."
  - "היי, חזרתם! כבר יש לי עוד סיפור על מעטפה."
  - "עוד פעם שלום! זה תמיד כיף."
  - "אהלן שוב! הדואר מזיז את הרגליים, אבל אני עוצר בשבילכם."
  - "חזרתם בזמן! הבול הזה כמעט נפל לי."
  - "שוב שלום! אני ממשיך לספור מעטפות."
  - "תראו, אותם פנים שמחים. או שאני מתבלבל בפרצופים?"
  - "היי! עוד שיחה קטנה לפני שאני רץ."
  - "יופי שחזרתם! אני שמח לעצור."
  - {text: "עוד בוקר, עוד שלום! הדואר מרוצה.", when: {phase: [morning]}}
  - {text: "אחר הצהריים טוב, שוב! הרגליים שלי כבר מתעייפות.", when: {phase: [afternoon]}}
  - {text: "ערב שוב! הדואר מתקרב לסוף היום.", when: {phase: [evening]}}
idle:
  - "אני סופר מעטפות בראש. אחת, שתיים... איבדתי ספירה."
  - "הנה הנה, התיק כבד, אבל הלב קל."
  - "בול הוא גם מילה לדבר שמדויק. כמו הדואר שלי."
  - "אני חולם לראות את הים פעם. אולי אשלח לעצמי גלויה משם."
  - "הרגליים הן הכלי הכי חשוב של דוור. אחרי השעון."
  - "אני לא שוכח מכתבים, רק לפעמים פרצופים."
  - "מכתב טוב מחכה לכל אחד, גם אם הוא עוד לא כתוב."
  - "תנאי משלוח: מעולים. מצב רוח: מצוין."
  - "כל מעטפה מספרת סיפור קטן. אני רק מחזיק את הכריכה."
  - "אם תראו עיגול של בולים, זה אני בסיבוב."
  - "הדואר הולך, הדואר רץ, ולפעמים הדואר עוצר לנוח."
  - "אני משתדל להגיע בזמן. השעון שלי יודע שאני משתדל."
farewell:
  - "להתראות! על הדואר אפשר לסמוך."
  - "אני רץ לסיבוב. נתראה!"
  - "ביי! שיהיה לכם יום מלא בהפתעות טובות."
  - "המשך יום נפלא! אני חוזר לדרך."
  - "נתראה בסיבוב הבא!"
  - "אם תראו אותי רץ, זה סימן שהשעה מתקדמת. ביי!"
  - "שמחתי לשוחח! הדואר קורא לי."
  - "שלום ולהתראות, חברים!"
  - "עד הפעם הבאה! לא אשכח את השם, אולי את הפרצוף."
  - {text: "המשך בוקר נעים! אני יוצא לשכונה הבאה.", when: {phase: [morning]}}
  - {text: "המשך אחר צהריים נעים! הדואר ממשיך.", when: {phase: [afternoon]}}
  - {text: "ערב טוב והמשך נעים! הדואר הולך הביתה.", when: {phase: [evening]}}
topic.weather:
  - "תנאי משלוח היום: מצוינים. אפשר ללכת, לרוץ ואפילו לדלג."
  - "אני בודק את השמיים... נראה לי יום טוב לדואר."
  - "הדואר יוצא בכל מזג אוויר. אבל לפעמים לוקח מטרייה."
  - "מזג האוויר הוא עניין של סבלנות. הדואר סבלן."
  - {text: "בוקר כזה הוא הכי טוב לחלק מכתבים. הכל רענן.", when: {phase: [morning]}}
  - {text: "בערב האוויר נעים, וקל יותר לסחוב את התיק.", when: {phase: [evening]}}
topic.town:
  - "ראיתי היום את {who}. נראה לי שהם בדיוק מסיימים משהו."
  - "היום בעיר: {who}. אני עבדתי אצלם לפני רגע."
  - "בעיר שקט ונעים היום. כל אחד עסוק בענייניו."
  - "אני לא רואה את כולם, אבל העיר מלאה אנשים טובים."
  - "עוד מעט הסיבוב יביא אותי לאנשים חדשים."
topic.letters:
  - "היום אין מכתב בשבילכם. אבל אני ממשיך לחפש."
  - "בדקתי בתיק: עוד אין מעטפה עם השם שלכם. אולי מחר."
  - "מכתב טוב לא ממהר. כשיגיע, אתם תדעו."
  - "אני שומר עין על התיק. אם יהיה משהו, אני אגיד."
topic.route:
  - "הדרך צפונה עוברת בדשא גבוה, ושם מסתתרים חברים."
  - "בדרך לא מתעייפים אם הולכים לאט. אני יודע, אני הולך כל יום."
  - "בצפון יש שלט עם מילה לקריאה. שווה לעצור שם."
  - "ליד המחנה בדרך מחכה מישהו נחמד. אני עובר שם בערב."

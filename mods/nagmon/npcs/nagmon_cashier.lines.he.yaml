greet_first:
  - "שלום שלום! הקופה מלאה, והחנות מחכה."
  - "היי! אני סופר מטבעות בשביל הכיף."
  - "ברוכים הבאים! אצלי כל מטבע נספר פעמיים."
  - "הנה לקוחות נחמדים! יום טוב לעסקים."
  - "שלום! אני אבי, ואני אוהב מספרים."
  - "שלום לכם! היום המדפים מסודרים כמו חיילים."
  - "היי! אחת, שתיים, שלוש... איבדתי ספירה, אבל שמחתי לראות אתכם."
  - "אהלן! תמיד כיף כשמישהו עוצר לדבר."
  - "שלום! החנות פתוחה, והחיוך חינם."
  - {text: "בוקר טוב! המדפים רעננים וגם אני.", when: {phase: [morning]}}
  - {text: "צהריים טובים! הקופה עובדת, ואני איתה.", when: {phase: [afternoon]}}
  - {text: "ערב טוב! עוד קצת ואני סוגר, אבל יש זמן לשלום.", when: {phase: [evening]}}
  - {text: "הלקוח הכי טוב של החנות הגיע! שלום לכם.", when: {friendship_min: 2}}
  - {text: "שלום {hero}! אני תמיד סופר גם את החברים.", when: {friendship_min: 1}}
greet_again:
  - "שוב שלום! אני עוד סופר."
  - "חזרתם! החנות שמחה."
  - "היי, שוב אתם! הקופה מתגעגעת."
  - "עוד ביקור! אני אוהב ביקורים."
  - "הנה אתם שוב! ספרתי שחזרתם מהר."
  - "אהלן שוב! יש לי עוד כמה מטבעות לספור."
  - "שוב שלום! אני מקווה שהכל טוב."
  - "הו, חזרתם. הקופה אמרה שתחזרו."
  - "שלום עוד פעם! בואו, לא מפריע."
  - {text: "עוד בוקר, עוד שלום. נהדר.", when: {phase: [morning]}}
  - {text: "אחר הצהריים וביקור שני. מצוין.", when: {phase: [afternoon]}}
  - {text: "עוד ערב קטן וביקור שני. כיף.", when: {phase: [evening]}}
idle:
  - "אחת, שתיים, שלוש, ארבע... אני סופר בראש כל היום."
  - "מטבע אחד פלוס מטבע אחד זה שניים. כל כך פשוט."
  - "אני מסדר את המדף: קטן ליד קטן, גדול ליד גדול."
  - "כשסופרים לאט, לא מתבלבלים. זה הסוד שלי."
  - "הקופה שלי אוהבת מטבעות עגולים וחיוכים עגולים."
  - "כל מטבע הולך למקום טוב, כמו כל אחד מכם."
  - "חשבון קטן בבוקר עושה את היום קל."
  - "אני כותב את המספרים על דף, ואז הם לא בורחים."
  - "עשרה זה מספר נחמד: אצבעות של שתי ידיים."
  - "בחנות מסודרת קל למצוא הכל."
  - "אם תספרו בקול, גם הלב סופר איתכם."
  - "אני בודק את המדפים, ואז חוזר לספור מטבעות."
farewell:
  - "להתראות! תחזרו כשתרצו."
  - "נתראה בחנות! אני כאן."
  - "ביי! שיהיה לכם יום של מספרים יפים."
  - "תודה שבאתם! אני חוזר לספור."
  - "המשך יום נעים! אני כאן עם הקופה."
  - "שלום ולהתראות! שמחתי לדבר."
  - "בהצלחה במסע! אל תשכחו לעצור."
  - "ביי, חברים! אחת, שתיים, שלוש, נתראה."
  - "שיהיה לכם טוב! הדלת פתוחה."
  - {text: "המשך בוקר מצוין! אני חוזר למדפים.", when: {phase: [morning]}}
  - {text: "המשך אחר צהריים נעים!", when: {phase: [afternoon]}}
  - {text: "ערב טוב! עוד קצת ואני סוגר.", when: {phase: [evening]}}
topic.coins:
  - "מטבעות הם דרך להגיד תודה. אתם מקבלים כשעוזרים, ומשלמים כשקונים."
  - "אני אוהב מטבעות: הם קטנים, אבל הם מצטברים."
  - "מטבע אחד קטן, חמישה מטבעות כבר חבילה. כך זה עובד."
  - "כשחוסכים, אפשר לקנות משהו גדול יותר. זה עניין של סבלנות."
  - "אפשר לשמור מטבעות לכמה ימים, ואז לבחור. אין מי שממהר."
topic.counting:
  - "בואו נספור: אחת, שתיים, שלוש, ארבע, חמש. חמישה מטבעות!"
  - "עשר ועוד עשר, זה עשרים. כמו שתי ערימות של עשר."
  - "אפשר לספור בקפיצות: חמש, עשר, חמש עשרה. כך מהר יותר."
  - "אני סופר חמישה, ואז עוד חמישה. ביחד הם עשרה."
  - "כשהמטבעות מסודרים בשורה, קל לספור אותם בלי טעות."
topic.shop:
  - "במדפים יש רשתות, חטיפים ועזרים. כל מדף עם הדברים שלו."
  - "רשת עוזרת לתפוס חבר חדש בדשא. כדאי להחזיק כמה."
  - "החטיפים מאכילים את החברים, והם נהנים מאוד."
  - "העזרים הם רמזים קטנים. אתם לא חייבים, אבל נחמד שיש."
  - "אני אוהב שהמדפים מלאים. מי שנכנס מוצא משהו."
topic.town:
  - "היום בעיר: {who}. הם עוברים כאן מדי פעם."
  - "ראיתי היום את {who}. הם הולכים לפי הסדר שלהם."
  - "העיר שקטה היום. הלקוחות מגיעים לאט, וזה נעים."
  - "אני רואה מהחנות הרבה אנשים טובים. כדאי להגיד להם שלום."
  - "כל יום אחרים עוברים כאן. אני סופר אותם בראש."

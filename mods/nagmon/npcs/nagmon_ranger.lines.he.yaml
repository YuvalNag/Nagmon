greet_first:
  - "שלום, אני איתן שומר הפארק! השכנים בדשא אמרו שלום."
  - "היי! היום האוויר נקי והפארק שקט."
  - "שלום לכם. אני עובר בין העצים ובודק שהכל בסדר."
  - "אהלן! נעים לפגוש אנשים שאוהבים טבע."
  - "שלום! הלכתי כל הבוקר וראיתי המון."
  - "שלום, חברים. הדשא מלא חיים היום."
greet_again:
  - "שוב אתם. נעים."
  - "חזרתם! השכנים שלי שמחים."
  - "שלום שוב. אני עוד מסתכל על העצים."
  - "עוד ביקור קטן. כיף."
  - "שוב שלום. הפארק רגוע."
idle:
  - "אני מקשיב לציפורים. בכל בוקר הן שרות אחרת."
  - "הנה עקבות קטנות על האדמה. מישהו עבר כאן."
  - "בפארק יש מקום לכולם: גדולים, קטנים ושקטים."
  - "השכנים שלנו בדשא ביישנים. צריך ללכת לאט."
  - "אני אוהב להסתכל על עננים, ועל מה שמתחת להם."
  - "הרבה פעמים מספיק לעמוד בשקט כדי לראות חבר חדש."
farewell:
  - "להתראות! תזהרו מהשכנים בדשא, הם קטנים."
  - "נתראה בפארק."
  - "ביי! שיהיה לכם טיול נעים."
  - "יום טוב, חברים. אני חוזר לסיבוב."
  - "תהנו מהדרך."
topic.neighbours:
  - "השכנים שלנו הם החיות שגרות בדשא. לכל אחד יש בית קטן."
  - "יש חיות שיוצאות בבוקר ויש כאלה שיוצאות בערב."
  - "כשפוגשים שכן, מחייכים ולא ממהרים. הוא יבין."
  - "אני קורא להן שכנים כי הן גרות כאן לפנינו."
topic.hide:
  - "חברים אוהבים להסתתר בדשא הגבוה, כי שם נעים וחם."
  - "מי שמסתכל לאט, מוצא חבר ליד כל שיח."
  - "בדרך צפונה יש הרבה דשא. שם תמצאו מי שמחכה."
  - "אם משהו זז בדשא, כנראה שזה חבר. עצרו והסתכלו."
topic.town:
  - "היום בעיר: {who}. אני עברתי לידם בבוקר."
  - "ראיתי היום את {who}. הם הלכו לכיוון העיר."
  - "בעיר שקט היום. הפארק מרגיש את זה."
  - "הרבה אנשים בעיר אוהבים את הפארק. זה משמח."

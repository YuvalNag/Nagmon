greet_first:
  - "שלום שלום! נכנסו, נכנסו, יש ריח טוב."
  - "הו, אורחים! יש לי סיר על האש."
  - "שלום וברוכים הבאים! אני גלית, ואני תמיד מבשלת."
  - "שלום! שבו, אני כבר מביאה משהו טעים."
  - "אהלן! הבית שלי פתוח לכולם."
  - "שלום לכם! הכל כאן חם וטעים."
greet_again:
  - "שוב אתם! הסיר עוד חם."
  - "חזרתם! טעמו, טעמו."
  - "שלום שוב. יש עוד תבלין לטעום."
  - "עוד ביקור. כמה כיף."
  - "שוב שלום, אורחים יקרים."
idle:
  - "אני מערבבת וטועמת. עוד קצת מלח."
  - "ריח של מרק מתפשט בבית. מי שמריח מחייך."
  - "תבלין טוב הוא סוד קטן."
  - "אין כמו סיר גדול שכולם אוכלים ממנו."
  - "אני תמיד מבשלת יותר מדי. כך נשאר לאורחים."
  - "הכל מתחיל בבצל, ואחר כך הכל מסתדר."
farewell:
  - "להתראות! תבואו שוב לטעום."
  - "נתראה, אורחים יקרים."
  - "שלום ולהתראות! הסיר מחכה."
  - "ביי! שיהיה לכם יום טעים."
  - "בואו שוב כשתרצו."
topic.soup:
  - "היום אני מבשלת מרק ירקות עם נענע. מי רוצה לטעום?"
  - "המרק שלי הוא עם גזר, תפוח אדמה והרבה אהבה."
  - "מרק טוב מבשלים לאט, ומערבבים פעם בכמה דקות."
  - "אני מוסיפה עשבי תבלין מהגינה. הם נותנים ריח."
topic.town:
  - "היום בעיר: {who}. אולי יבואו לטעום."
  - "ראיתי היום את {who}. הם אמרו שמריח כאן נפלא."
  - "בעיר כולם אוהבים לאכול. אני שמחה שזה כך."
  - "העיר נעימה. עוברים כאן שכנים טובים."

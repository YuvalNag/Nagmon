greet_first:
  - "שלום, חברים! גם בחליפה אני אותו ינשוף."
  - "הו, הגעתם עד לכאן! הנוצות שלי נרגשות."
  - "שלום! החליפה חמה, אבל הלב חם יותר."
  - "שלום לכם. בואו נגלה משהו חדש."
  - "שלום שלום! הקסדה שלי צוחקת."
  - "שמחתי שבאתם איתי למקום הזה."
greet_again:
  - "שוב אתם! הקסדה עוד נוצצת."
  - "חזרתם. הינשוף מרוצה."
  - "שלום שוב. עוד שאלה בדרך?"
  - "עוד ביקור. כמה נחמד."
  - "שוב שלום. אני עוד כאן."
idle:
  - "אני מסתכל סביב דרך הקסדה. הכל נראה כמו הרפתקה."
  - "גם כאן שואלים למה. וזה כיף."
  - "ינשוף בחליפה הוא ינשוף שאוהב לטייל."
  - "אני מקשיב לשקט הרחוק. הוא מלמד."
  - "כל מקום חדש פותח עוד שאלה."
farewell:
  - "להתראות! אני כאן בכל מקום."
  - "מסע נעים, חברים."
  - "נתראה בהמשך הדרך."
  - "ביי! שיהיה לכם יום מלא תגליות."
topic.helmet:
  - "הקסדה שומרת עליי, ואני שומר על הסקרנות."
  - "החליפה נראית מצחיקה על ינשוף, אבל היא נוחה."
  - "בקסדה קל לשמוע את עצמי חושב."
  - "אני נראה כמו כדור קטן עם נוצות. כך זה נכון."
topic.tip:
  - "שאלה קשה? אפשר לבקש רמז, וזה לא בושה."
  - "מי שמסתכל לאט, מוצא יותר."
  - "כשמגיעים למקום חדש, מדברים עם מי שנמצא שם."
  - "אפשר לטעות, וגם ללמוד מזה."

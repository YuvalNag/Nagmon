greet_first:
  - "שלום, ילדים. הזמן הוא חבר טוב."
  - "שלום לכם. בואו, שבו לידי."
  - "שלום. מי שבא לאט, מגיע בשלום."
  - "ברוכים הבאים. אין צורך לדבר הרבה."
  - "שלום. אני עוד מסתכל על הדרך."
  - "שלום, חברים. הזקן שמח לראותכם."
greet_again:
  - "שוב אתם. טוב."
  - "חזרתם. הדרך מוכרת."
  - "שלום שוב. אני שומע."
  - "עוד ביקור. נעים."
  - "שוב שלום. השקט עוד איתי."
idle:
  - "אני מסתכל, ואני מקשיב. כך לומדים."
  - "שאלה טובה שווה יותר מתשובה מהירה."
  - "מי שחכם, שותק לפעמים."
  - "אני עוצם עיניים ושומע את הדרך."
  - "לפעמים התשובה מגיעה רק למחרת."
farewell:
  - "לכו לשלום."
  - "שאלו שוב מחר."
  - "ביי. אני כאן."
  - "שלום ולהתראות, חברים."
topic.wisdom:
  - "שאלו שוב מחר. התשובה אוהבת ללכת לישון."
  - "מי שיודע מעט ומקשיב, יודע הרבה."
  - "כשקשה, עוצרים. כשקל, ממשיכים."
  - "דרך ארוכה מתחילה בצעד קטן."
topic.slow:
  - "סבלנות היא כמו עץ: לוקח זמן, אבל נותן צל."
  - "מי שממהר, פוגש את הדרך רק בחצי."
  - "אני לא ממהר. כך אני רואה כל דבר פעמיים."
  - "הכל מגיע בזמנו, גם התשובה."

greet_first:
  - "שלום שלום! הריח של הלחם מגיע עד אליכם, נכון?"
  - "בוקר, צהריים או ערב: תמיד יש משהו טרי מהתנור!"
  - "אהלן, אורחים! בואו, בואו, אל תתביישו."
  - "שלום! אני אופיר, והקמח כבר בכל מקום."
  - "הנה אורחים לחם! שמחתי מאוד."
  - "שלום לכם! אני אופה, וכל אחד כאן חבר שלי."
greet_again:
  - "שוב אתם! התנור מתחמם בשבילכם."
  - "חזרתם! נשארה לי עוד פיתה חמה."
  - "אהלן שוב! אני עוד כאן עם הבצק."
  - "שלום עוד פעם! הקמח לא מפסיק ליפול עליי."
  - "שוב שלום! איזה כיף שחזרתם."
idle:
  - "בצק טוב צריך שלושה דברים: קמח, מים וסבלנות."
  - "אני אוהב להקשיב לבצק כשהוא תופח. הוא נאנח בשקט."
  - "יש לי קמח על האף, ואף אחד לא אמר לי."
  - "אפייה זה כמו גינון, רק שמה שגדל הוא טעים."
  - "אני עובד מוקדם, כשכולם עוד ישנים. זה השקט שלי."
  - "הנה לחם שנראה כמו ענן. הוא יצא יפה."
farewell:
  - "להתראות! אל תשכחו לאכול."
  - "תבואו שוב, תמיד יש לחם."
  - "ביי! שיהיה לכם יום טעים."
  - "נתראה! הקמח מחכה."
  - "שלום ולהתראות, חברים!"
topic.bread:
  - "היום אני אופה לחם חם, פיתות ועוגיות. הכל טרי."
  - "אני אוהב להכין לחמניות קטנות, בגודל של כף יד."
  - "לחם טוב מתחיל בבצק שנח לילה שלם."
  - "פיתה היא הלחם שלי האהוב. היא יכולה להחזיק הכל."
topic.town:
  - "היום בעיר: {who}. הם עוברים ליד התנור, ואני מריח אותם."
  - "ראיתי היום את {who}. הם אמרו שהריח מעולה."
  - "בעיר הרבה אנשים אוהבים לחם. זה מסביר למה אני עסוק."
  - "אני רואה את כולם עוברים ליד הדלפק. תמיד מישהו מחייך."

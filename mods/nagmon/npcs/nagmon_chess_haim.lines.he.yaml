greet_first:
  - "שלום. אני חיים, ואני חושב על צעד."
  - "שלום. מי רוצה לשבת ולהסתכל על הלוח?"
  - "שלום לכם. אני לא ממהר, וגם אתם לא."
  - "שלום. זה ספסל טוב לחשוב עליו."
  - "אהלן. הצעד הבא עוד לא ברור, אבל השיחה כן."
  - "שלום. תסלחו, אני באמצע מהלך."
greet_again:
  - "שוב. נעים."
  - "חזרתם. הלוח מחכה."
  - "שלום שוב. אני עוד חושב."
  - "עוד ביקור. יופי."
  - "שוב שלום. הצעד שלי עדיין לא נעשה."
idle:
  - "צעד אחד, ואז עוד אחד. כך מנצחים."
  - "הרגלית הקטנה יכולה להגיע רחוק."
  - "אני מסתכל על הלוח. הוא מסתכל עליי."
  - "כשחושבים, אסור למהר. אבל גם אסור לשכוח."
  - "הכי חשוב לראות מה החבר רוצה לעשות."
  - "אני לא כועס על טעויות. הן מלמדות."
farewell:
  - "להתראות."
  - "בהצלחה."
  - "נתראה. אני חוזר למהלך."
  - "שלום ולהתראות."
  - "ביי. תחשבו טוב."
topic.chess:
  - "שחמט הוא משחק של שני אנשים עם הרבה חתיכות."
  - "הפרש קופץ בצורת אות ל. זה הדבר הכי מצחיק בלוח."
  - "המלך חלש לפעמים, אבל כולם מגנים עליו."
  - "אפשר ללמוד לשחק בחצי שעה, ולהמשיך ללמוד כל החיים."
topic.think:
  - "לפני צעד: מסתכלים, חושבים ובודקים. אחר כך זזים."
  - "אם אין רעיון, אפשר להסתכל על הלוח עוד קצת."
  - "חשיבה היא כמו שריר. מתחזקת כשמתרגלים."
  - "מי שחושב טוב, אין לו צורך למהר."
topic.town:
  - "היום בעיר: {who}. כולם עוברים, ואני יושב."
  - "ראיתי היום את {who}. ביקשתי שיישבו, הם לא יכלו."
  - "העיר שקטה. כמו משחק שמתחיל."
  - "יש הרבה אנשים בעיר. כל אחד עם הלוח שלו."

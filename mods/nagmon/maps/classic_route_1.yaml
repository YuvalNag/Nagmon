# Route 1: a friendly duel, a bilingual sign and Pitzi the lost kitten.
# The wild encounters of the tmx stay as they are (docs/kids/SDD_WORLD.md §2.4).
events:

  # ------------------------------------------------ Danny: friendly duel
  Create Trainer:
    type: event
    conditions:
    - not char_exists nagmon_route1_trainer
    actions:
    - create_npc nagmon_route1_trainer,30,16
    - char_face nagmon_route1_trainer,right
    - add_monster nut,5,nagmon_route1_trainer,3,5
    - add_monster dandicub,6,nagmon_route1_trainer,3,5

  Trainer Talk:
    type: event
    behav:
    - talk nagmon_route1_trainer
    conditions:
    - not battle_outcome player,won,nagmon_route1_trainer
    - not variable_set nagmon_duel1_fought
    actions:
    - translated_dialog nagmon_world_trainer_hello
    - translated_dialog_choice nagmon_world_choice_duel:nagmon_world_choice_later,nagmon_duel1_choice

  Trainer Duel:
    type: event
    conditions:
    - is variable_set nagmon_duel1_choice:nagmon_world_choice_duel
    actions:
    - clear_variable nagmon_duel1_choice
    - start_battle player,nagmon_route1_trainer
    - set_variable nagmon_duel1_fought:yes

  Trainer Later:
    type: event
    conditions:
    - is variable_set nagmon_duel1_choice:nagmon_world_choice_later
    actions:
    - clear_variable nagmon_duel1_choice
    - translated_dialog nagmon_world_trainer_later

  Trainer After Win:
    type: event
    conditions:
    - is variable_set nagmon_duel1_fought:yes
    - is battle_outcome player,won,nagmon_route1_trainer
    actions:
    - clear_variable nagmon_duel1_fought
    - translated_dialog nagmon_world_trainer_won

  # Lost? Rest, and Danny comes back with a fresh team for another try.
  Trainer After Lose:
    type: event
    conditions:
    - is variable_set nagmon_duel1_fought:yes
    - not battle_outcome player,won,nagmon_route1_trainer
    actions:
    - clear_variable nagmon_duel1_fought
    - set_monster_health
    - set_monster_status
    - translated_dialog nagmon_world_trainer_lost
    - remove_npc nagmon_route1_trainer

  Trainer Talk Done:
    type: event
    behav:
    - talk nagmon_route1_trainer
    conditions:
    - is battle_outcome player,won,nagmon_route1_trainer
    actions:
    - translated_dialog nagmon_world_trainer_done

  # ------------------------------------------- a word: TREE = a tree
  Create Sign:
    type: event
    conditions:
    - not char_exists nagmon_sign_route1
    actions:
    - create_npc nagmon_sign_route1,36,17

  Read Sign:
    type: event
    behav:
    - talk nagmon_sign_route1
    actions:
    - translated_dialog nagmon_world_sign_tree

  # ------------------------------------------------ Pitzi, lost kitten
  Create Kitten:
    type: event
    conditions:
    - is variable_set nagmon_kitten:asked
    - not char_exists nagmon_kitten
    actions:
    - create_npc nagmon_kitten,21,16
    - char_face nagmon_kitten,down

  Kitten Found:
    type: event
    behav:
    - talk nagmon_kitten
    conditions:
    - is variable_set nagmon_kitten:asked
    actions:
    - translated_dialog nagmon_world_kitten_found
    - set_variable nagmon_kitten:found
    - remove_npc nagmon_kitten

# Hearthrock, the home town: the Wise Owl, the intro and the townspeople.
# Merged into tuxemon's classic_hearthrock_city.tmx (docs/kids/SDD_WORLD.md).
#
# Rule of thumb: an event that hands over to the next step sets the
# "next step" variable as its LAST action, so two dialogs never overlap.
# The five doors on this map lead to the houses' insides (nagmon_home,
# nagmon_lab, nagmon_friend_house, nagmon_rest_center, nagmon_shop). A door
# that leads nowhere must stay a wall (tests/app/test_app_maps.py).
#
# Who stands where is not written here any more: the people of the town are
# in mods/nagmon/npcs (one file each, with their schedule), and the
# resolver puts them on the named spots below by the day and the time
# (docs/app/WORLD_V2.md 5.4). `Place People` makes them exist for the
# scripts. The wallet and the kitten are props of a quest and keep
# their create_npc.
#
# Keep these tiles free of spots: the walk from the start to the shop
# (row 16 from x 14 to 29, and the tile 14,15) that the browser tests make.
placement:
  max_npcs: 10
  spots:
    owl_post: [29, 15, down]
    cashier_post: [14, 14, down]
    post_box: [20, 7, down]
    school_gate: [24, 7, down]
    bench_east: [35, 7, left]
    greenhouse: [4, 16, right]
    flowerbed: [9, 17, up]
    market_stall: [20, 14, down]
    market_stall_2: [21, 14, down]
    pharmacy_door: [10, 14, down]
    tailor_door: [12, 7, down]
    clock_corner: [8, 8, down]
    library_steps: [28, 7, down]
    workshop_door: [31, 7, down]
    plaza_west: [8, 11, right]
    plaza_mid: [16, 11, down]
    fountain: [26, 11, down]
    plaza_east: [32, 11, left]
    park_bench: [34, 12, left]
    meadow_gate: [37, 8, left]
    east_gate: [37, 15, left]
    south_east: [34, 16, up]
    pond_view: [36, 17, left]
    corner_lane: [3, 12, right]

events:

  # ----------------------------------------- the people of the town
  Place People:
    type: event
    conditions:
    - not npcs_placed
    actions:
    - place_npcs

  # ----------------------------------------- the houses' doors
  Teleport to Home:
    type: event
    x: 5
    y: 5
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,nagmon_home.tmx,4,6,0.3
    - char_face player,up

  Teleport to Lab:
    type: event
    x: 10
    y: 5
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,nagmon_lab.tmx,6,17,0.3
    - char_face player,up

  Teleport to Friend House:
    type: event
    x: 15
    y: 5
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,nagmon_friend_house.tmx,5,7,0.3
    - char_face player,up

  Teleport to Rest Center:
    type: event
    x: 8
    y: 13
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,nagmon_rest_center.tmx,6,10,0.3
    - char_face player,up

  Teleport to Shop:
    type: event
    x: 13
    y: 13
    conditions:
    - is char_at player
    - is char_facing player,up
    actions:
    - transition_teleport player,nagmon_shop.tmx,6,10,0.3
    - char_face player,up

  # ------------------------------------------------------------ new game
  Nagmon Start:
    type: event
    conditions:
    - not variable_set nagmon_started
    actions:
    - nagmon_apply_profile
    - set_variable method_money:conserved
    - set_variable blackout_no_monsters:true
    - set_teleport_faint player,classic_hearthrock_city.tmx,29,16
    - set_variable nagmon_started:yes

  Owl Intro:
    type: event
    conditions:
    - is variable_set nagmon_started:yes
    - not variable_set nagmon_intro_seen
    - is char_exists nagmon_owl
    actions:
    - char_face player,up
    - translated_dialog nagmon_owl_intro_story,nagmon_owl
    - translated_dialog nagmon_owl_intro_power,nagmon_owl
    - translated_dialog nagmon_owl_intro_starter,nagmon_owl
    - set_variable nagmon_intro_seen:yes

  Owl Starter Choice:
    type: event
    conditions:
    - is variable_set nagmon_intro_seen:yes
    - not variable_set nagmon_starter
    actions:
    - choice_monster heliobud:terrabub:lunibble,nagmon_starter

  Starter Heliobud:
    type: event
    conditions:
    - is variable_set nagmon_starter:heliobud
    - not variable_set nagmon_has_starter
    actions:
    - add_monster heliobud,7
    - translated_dialog nagmon_owl_picked_heliobud,nagmon_owl
    - set_variable nagmon_has_starter:yes

  Starter Terrabub:
    type: event
    conditions:
    - is variable_set nagmon_starter:terrabub
    - not variable_set nagmon_has_starter
    actions:
    - add_monster terrabub,7
    - translated_dialog nagmon_owl_picked_terrabub,nagmon_owl
    - set_variable nagmon_has_starter:yes

  Starter Lunibble:
    type: event
    conditions:
    - is variable_set nagmon_starter:lunibble
    - not variable_set nagmon_has_starter
    actions:
    - add_monster lunibble,7
    - translated_dialog nagmon_owl_picked_lunibble,nagmon_owl
    - set_variable nagmon_has_starter:yes

  Owl Gifts:
    type: event
    conditions:
    - is variable_set nagmon_has_starter:yes
    - not variable_set nagmon_gifts
    actions:
    - set_variable nagmon_gifts:yes
    - add_item tuxeball,5
    - add_item potion,3
    - translated_dialog nagmon_owl_gifts,nagmon_owl
    - translated_dialog nagmon_owl_first_q,nagmon_owl
    - ask_quiz math,nagmon_owl_q1

  Owl First Good:
    type: event
    conditions:
    - is one_of nagmon_owl_q1,correct:super:skip
    actions:
    - clear_variable nagmon_owl_q1
    - translated_dialog nagmon_owl_first_good,nagmon_owl
    - translated_dialog nagmon_owl_go,nagmon_owl
    - set_variable nagmon_intro_done:yes

  Owl First Wrong:
    type: event
    conditions:
    - is variable_set nagmon_owl_q1:wrong
    actions:
    - clear_variable nagmon_owl_q1
    - translated_dialog nagmon_owl_first_wrong,nagmon_owl
    - translated_dialog nagmon_owl_go,nagmon_owl
    - set_variable nagmon_intro_done:yes

  # A save from the middle of the intro: the owl simply goes on.
  Owl Talk Unfinished:
    type: event
    behav:
    - talk nagmon_owl
    conditions:
    - is variable_set nagmon_gifts:yes
    - not variable_set nagmon_intro_done
    - not variable_set nagmon_owl_q1
    actions:
    - translated_dialog nagmon_owl_go,nagmon_owl
    - set_variable nagmon_intro_done:yes

  # ------------------------------------------------- the owl, later on
  Owl Talk Granite:
    type: event
    behav:
    - talk nagmon_owl
    conditions:
    - is variable_set nagmon_intro_done:yes
    - not variable_set academy_granite_done:yes
    actions:
    - set_monster_health
    - set_monster_status
    - translated_dialog nagmon_owl_heal,nagmon_owl
    - translated_dialog nagmon_owl_tip_granite,nagmon_owl

  Owl Talk Mila:
    type: event
    behav:
    - talk nagmon_owl
    conditions:
    - is variable_set academy_granite_done:yes
    - not variable_set academy_mila_done:yes
    actions:
    - set_monster_health
    - set_monster_status
    - translated_dialog nagmon_owl_heal,nagmon_owl
    - translated_dialog nagmon_owl_tip_mila,nagmon_owl

  Owl Talk All:
    type: event
    behav:
    - talk nagmon_owl
    conditions:
    - is variable_set academy_granite_done:yes
    - is variable_set academy_mila_done:yes
    actions:
    - set_monster_health
    - set_monster_status
    - translated_dialog nagmon_owl_heal,nagmon_owl
    - translated_dialog nagmon_owl_tip_all,nagmon_owl

  Owl Congrats Granite:
    type: event
    conditions:
    - is variable_set academy_granite_done:yes
    - not variable_set nagmon_owl_congrats_granite
    - is char_exists nagmon_owl
    actions:
    - translated_dialog nagmon_owl_congrats_granite,nagmon_owl
    - set_template nagmon_owl,nagmon_owl_caped,nagmon_owl
    - translated_dialog nagmon_owl_cape,nagmon_owl
    - set_variable nagmon_owl_congrats_granite:yes

  Owl Congrats Mila:
    type: event
    conditions:
    - is variable_set academy_mila_done:yes
    - is variable_set nagmon_owl_congrats_granite:yes
    - not variable_set nagmon_owl_congrats_mila
    - is char_exists nagmon_owl
    actions:
    - translated_dialog nagmon_owl_congrats_mila,nagmon_owl
    - set_variable nagmon_owl_congrats_mila:yes

  # ------------------------------------- Avi the shopkeeper: money math
  Cashier Talk Small:
    type: event
    behav:
    - talk nagmon_cashier
    conditions:
    - not profile_grade_at_least 1
    actions:
    - translated_dialog nagmon_world_cashier_hello,nagmon_cashier
    - ask_quiz math,nagmon_cashier_q,shop

  Cashier Talk Coins:
    type: event
    behav:
    - talk nagmon_cashier
    conditions:
    - is profile_grade_at_least 1
    - not profile_grade_at_least 2
    actions:
    - translated_dialog nagmon_world_cashier_hello,nagmon_cashier
    - ask_quiz math.money.coins,nagmon_cashier_q,shop

  Cashier Talk Change:
    type: event
    behav:
    - talk nagmon_cashier
    conditions:
    - is profile_grade_at_least 2
    actions:
    - translated_dialog nagmon_world_cashier_hello,nagmon_cashier
    - ask_quiz math.money.change_20,nagmon_cashier_q,shop

  Cashier Good:
    type: event
    conditions:
    - is one_of nagmon_cashier_q,correct:super:skip
    - is nagmon_daily_below cashier,3
    actions:
    - clear_variable nagmon_cashier_q
    - modify_money player,20
    - nagmon_daily_count cashier
    - translated_dialog nagmon_world_cashier_good,nagmon_cashier

  Cashier Good Free:
    type: event
    conditions:
    - is one_of nagmon_cashier_q,correct:super:skip
    - not nagmon_daily_below cashier,3
    actions:
    - clear_variable nagmon_cashier_q
    - translated_dialog nagmon_world_cashier_free,nagmon_cashier

  Cashier Wrong:
    type: event
    conditions:
    - is variable_set nagmon_cashier_q:wrong
    actions:
    - clear_variable nagmon_cashier_q
    - translated_dialog nagmon_world_cashier_wrong,nagmon_cashier

  # -------------------------------------------- Tom the tourist: English
  Tourist Talk:
    type: event
    behav:
    - talk nagmon_tourist
    actions:
    - translated_dialog nagmon_world_tourist_hello,nagmon_tourist
    - ask_quiz english,nagmon_tourist_q

  Tourist Good:
    type: event
    conditions:
    - is one_of nagmon_tourist_q,correct:super:skip
    - is nagmon_daily_below tourist,3
    actions:
    - clear_variable nagmon_tourist_q
    - give_item dew_drop,1
    - nagmon_daily_count tourist
    - translated_dialog nagmon_world_tourist_good,nagmon_tourist

  Tourist Good Free:
    type: event
    conditions:
    - is one_of nagmon_tourist_q,correct:super:skip
    - not nagmon_daily_below tourist,3
    actions:
    - clear_variable nagmon_tourist_q
    - translated_dialog nagmon_world_tourist_free,nagmon_tourist

  Tourist Wrong:
    type: event
    conditions:
    - is variable_set nagmon_tourist_q:wrong
    actions:
    - clear_variable nagmon_tourist_q
    - translated_dialog nagmon_world_tourist_wrong,nagmon_tourist

  # ----------------------------------------- Michal the gardener: science
  Gardener Talk:
    type: event
    behav:
    - talk nagmon_gardener
    actions:
    - translated_dialog nagmon_world_gardener_hello,nagmon_gardener
    - ask_quiz science,nagmon_gardener_q

  Gardener Good:
    type: event
    conditions:
    - is one_of nagmon_gardener_q,correct:super:skip
    - is nagmon_daily_below gardener,3
    actions:
    - clear_variable nagmon_gardener_q
    - give_item berry,1
    - nagmon_daily_count gardener
    - translated_dialog nagmon_world_gardener_good,nagmon_gardener

  Gardener Good Free:
    type: event
    conditions:
    - is one_of nagmon_gardener_q,correct:super:skip
    - not nagmon_daily_below gardener,3
    actions:
    - clear_variable nagmon_gardener_q
    - translated_dialog nagmon_world_gardener_free,nagmon_gardener

  Gardener Wrong:
    type: event
    conditions:
    - is variable_set nagmon_gardener_q:wrong
    actions:
    - clear_variable nagmon_gardener_q
    - translated_dialog nagmon_world_gardener_wrong,nagmon_gardener

  # -------------------------------- Yoav and Pitzi the kitten: kindness
  # The kitten quest waits for the quest slice (W3): the kitten on Route 1
  # needs remove_npc and a sprite that follows the story. Until then Yoav
  # only chats (his lines are in mods/nagmon/npcs), so no child is sent
  # looking for a kitten that cannot be found.
  Kid Talk Lost:
    type: event
    behav:
    - talk nagmon_kid
    conditions:
    - is variable_set nagmon_quests_w3:yes
    - not variable_set nagmon_kitten
    actions:
    - translated_dialog nagmon_world_kid_lost
    - set_variable nagmon_kitten:asked

  Kid Talk Waiting:
    type: event
    behav:
    - talk nagmon_kid
    conditions:
    - is variable_set nagmon_kitten:asked
    actions:
    - translated_dialog nagmon_world_kid_waiting

  Kid Talk Thanks:
    type: event
    behav:
    - talk nagmon_kid
    conditions:
    - is variable_set nagmon_kitten:found
    actions:
    - translated_dialog nagmon_world_kid_thanks
    - give_item dew_drop,2
    - modify_money player,30
    - translated_dialog nagmon_world_kid_reward
    - set_variable nagmon_kitten:home

  Kid Talk Home:
    type: event
    behav:
    - talk nagmon_kid
    conditions:
    - is variable_set nagmon_kitten:home
    actions:
    - translated_dialog nagmon_world_kid_happy

  Create Kitten Home:
    type: event
    conditions:
    - is variable_set nagmon_kitten:home
    - not char_exists nagmon_kitten
    actions:
    - create_npc nagmon_kitten,25,7
    - char_face nagmon_kitten,down

  Kitten Purr:
    type: event
    behav:
    - talk nagmon_kitten
    actions:
    - translated_dialog nagmon_world_kitten_purr

  # ------------------------------ Grandma Rina and the wallet: honesty
  Create Wallet:
    type: event
    conditions:
    - not variable_set nagmon_wallet
    - not char_exists nagmon_wallet
    actions:
    - create_npc nagmon_wallet,12,7

  Wallet Found:
    type: event
    behav:
    - talk nagmon_wallet
    conditions:
    - not variable_set nagmon_wallet
    actions:
    - translated_dialog nagmon_world_wallet_found
    - translated_dialog_choice nagmon_world_choice_return:nagmon_world_choice_keep,nagmon_wallet_choice

  Wallet Return:
    type: event
    conditions:
    - is variable_set nagmon_wallet_choice:nagmon_world_choice_return
    - not variable_set nagmon_wallet
    actions:
    - set_variable nagmon_wallet:carry
    - clear_variable nagmon_wallet_choice
    - remove_npc nagmon_wallet
    - translated_dialog nagmon_world_wallet_return

  Wallet Keep:
    type: event
    conditions:
    - is variable_set nagmon_wallet_choice:nagmon_world_choice_keep
    - not variable_set nagmon_wallet
    actions:
    - set_variable nagmon_wallet:kept
    - clear_variable nagmon_wallet_choice
    - remove_npc nagmon_wallet
    - translated_dialog nagmon_world_wallet_kept

  Granny Talk Thanks:
    type: event
    behav:
    - talk nagmon_granny
    conditions:
    - is variable_set nagmon_wallet:carry
    actions:
    - set_variable nagmon_wallet:returned
    - translated_dialog nagmon_world_granny_thanks
    - modify_money player,30
    - give_item berry,1
    - translated_dialog nagmon_world_granny_reward
    - translated_dialog nagmon_world_granny_value

  # Kept it? No punishment, just a second chance to do the right thing.
  Granny Talk Lost:
    type: event
    behav:
    - talk nagmon_granny
    conditions:
    - is variable_set nagmon_wallet:kept
    actions:
    - translated_dialog nagmon_world_granny_lost
    - translated_dialog_choice nagmon_world_choice_give:nagmon_world_choice_later,nagmon_granny_choice

  Granny Give:
    type: event
    conditions:
    - is variable_set nagmon_granny_choice:nagmon_world_choice_give
    - is variable_set nagmon_wallet:kept
    actions:
    - set_variable nagmon_wallet:returned
    - clear_variable nagmon_granny_choice
    - translated_dialog nagmon_world_granny_thanks
    - modify_money player,30
    - give_item berry,1
    - translated_dialog nagmon_world_granny_reward
    - translated_dialog nagmon_world_granny_value

  Granny Later:
    type: event
    conditions:
    - is variable_set nagmon_granny_choice:nagmon_world_choice_later
    actions:
    - clear_variable nagmon_granny_choice
    - translated_dialog nagmon_world_granny_later

  Granny Talk Happy:
    type: event
    behav:
    - talk nagmon_granny
    conditions:
    - is variable_set nagmon_wallet:returned
    actions:
    - translated_dialog nagmon_world_granny_happy

# Granite Academy (geometry): the master test, then a friendly duel (docs/kids/SDD_WORLD.md §2.5).
# Merged into tuxemon's classic_gym_granite.tmx.
#
# The tmx has its own "Talk Gym Leader" event (a level-20 battle with
# Tuxemon's creatures, no test): "Academy Setup" replaces it, and records
# one win once, so the old game's leader is ours from the start.
events:

  Academy Setup:
    type: event
    replaces: Talk Gym Leader
    conditions:
    - not variable_set nagmon_granite_setup
    actions:
    - set_battle player,won,classic_gym_leader_granite
    - set_variable nagmon_granite_setup:yes

  Master Team:
    type: event
    conditions:
    - is char_exists classic_gym_leader_granite
    - is party_size classic_gym_leader_granite,equals,0
    actions:
    - add_monster marskip,8,classic_gym_leader_granite,5,10
    - add_monster asterchip,9,classic_gym_leader_granite,5,10

  # ------------------------------------------------- the master test
  Master Talk:
    type: event
    behav:
    - talk classic_gym_leader_granite
    conditions:
    - not variable_set academy_granite_done:yes
    - not variable_set nagmon_granite_passed:yes
    actions:
    # A fresh start, also after a test left half-way when the game closed.
    - set_variable nagmon_granite_test:running,nagmon_granite_score:0
    - set_variable nagmon_granite_q1:new,nagmon_granite_q2:new,nagmon_granite_q3:new
    - translated_dialog nagmon_world_granite_hello
    - translated_dialog nagmon_world_granite_rules
    - ask_quiz geometry,nagmon_granite_q1,boss
    - translated_dialog nagmon_world_master_next
    - ask_quiz geometry,nagmon_granite_q2,boss
    - translated_dialog nagmon_world_master_last
    - ask_quiz geometry,nagmon_granite_q3,boss
    - set_variable nagmon_granite_test:asked

  Master Count 1:
    type: event
    conditions:
    - is one_of nagmon_granite_q1,correct:super:skip
    actions:
    - variable_math nagmon_granite_score,+,1
    - set_variable nagmon_granite_q1:counted

  Master Count 2:
    type: event
    conditions:
    - is one_of nagmon_granite_q2,correct:super:skip
    actions:
    - variable_math nagmon_granite_score,+,1
    - set_variable nagmon_granite_q2:counted

  Master Count 3:
    type: event
    conditions:
    - is one_of nagmon_granite_q3,correct:super:skip
    actions:
    - variable_math nagmon_granite_score,+,1
    - set_variable nagmon_granite_q3:counted

  Master Pass:
    type: event
    conditions:
    - is variable_set nagmon_granite_test:asked
    - is one_of nagmon_granite_q1,counted:wrong
    - is one_of nagmon_granite_q2,counted:wrong
    - is one_of nagmon_granite_q3,counted:wrong
    - is variable_is nagmon_granite_score,greater_or_equal,2
    actions:
    - clear_variable nagmon_granite_q1,nagmon_granite_q2,nagmon_granite_q3,nagmon_granite_test,nagmon_granite_score
    - set_variable nagmon_granite_passed:yes
    - translated_dialog nagmon_world_granite_pass
    - start_battle player,classic_gym_leader_granite
    - set_variable nagmon_granite_fought:yes

  # Not yet? No punishment: train a little and try again, as often as wanted.
  Master Not Yet:
    type: event
    conditions:
    - is variable_set nagmon_granite_test:asked
    - is one_of nagmon_granite_q1,counted:wrong
    - is one_of nagmon_granite_q2,counted:wrong
    - is one_of nagmon_granite_q3,counted:wrong
    - is variable_is nagmon_granite_score,less_than,2
    actions:
    - clear_variable nagmon_granite_q1,nagmon_granite_q2,nagmon_granite_q3,nagmon_granite_test,nagmon_granite_score
    - translated_dialog nagmon_world_granite_not_yet

  # Passed the test but lost the duel: no need to take the test again.
  Master Rematch:
    type: event
    behav:
    - talk classic_gym_leader_granite
    conditions:
    - is variable_set nagmon_granite_passed:yes
    - not variable_set academy_granite_done:yes
    - not variable_set nagmon_granite_fought
    actions:
    - translated_dialog nagmon_world_granite_rematch
    - start_battle player,classic_gym_leader_granite
    - set_variable nagmon_granite_fought:yes

  # -------------------------------------------------- after the duel
  Master Won:
    type: event
    conditions:
    - is variable_set nagmon_granite_fought:yes
    - is char_defeated classic_gym_leader_granite
    actions:
    - clear_variable nagmon_granite_fought
    - add_item nagmon_badge_granite,1
    - modify_money player,100
    - set_variable academy_granite_done:yes
    - translated_dialog nagmon_world_granite_won
    - translated_dialog nagmon_world_granite_badge

  Master Lost:
    type: event
    conditions:
    - is variable_set nagmon_granite_fought:yes
    - not char_defeated classic_gym_leader_granite
    actions:
    - clear_variable nagmon_granite_fought
    - set_monster_health
    - set_monster_status
    - translated_dialog nagmon_world_granite_lost
    - remove_npc classic_gym_leader_granite

  Master Done:
    type: event
    behav:
    - talk classic_gym_leader_granite
    conditions:
    - is variable_set academy_granite_done:yes
    actions:
    - translated_dialog nagmon_world_granite_done

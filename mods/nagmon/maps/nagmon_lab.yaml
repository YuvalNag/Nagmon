# Inside a house of Hearthrock: the lab / school: a tutor who teaches lessons.
# The map is a copy of a Tuxemon interior with its events removed
# (mods/nagmon/maps/nagmon_lab.tmx); the way out, the NPC and the greeting are
# here. The way in is an event of classic_hearthrock_city.yaml.
# Talking to the tutor greets, then opens the lesson list (open_tutor all).

events:

  Environment:
    type: event
    conditions:
    - not environment_is interior
    actions:
    - set_environment interior

  Go Outside:
    type: event
    x: 6
    y: 17
    conditions:
    - is char_at player
    - is char_facing player,down
    actions:
    - transition_teleport player,classic_hearthrock_city.tmx,10,6,0.3
    - char_face player,down

  Create Host:
    type: event
    conditions:
    - not char_exists nagmon_house_tutor
    actions:
    - create_npc nagmon_house_tutor,6,5
    - char_face nagmon_house_tutor,down

  Host Talk:
    type: event
    behav:
    - talk nagmon_house_tutor
    actions:
    - translated_dialog nagmon_world_lab_tutor,nagmon_house_tutor
    - open_tutor all

  # ---- working objects (mods/nagmon/objects/*.yaml; tools/app/objects.py checks that these events match them)

  Create Library:
    type: event
    conditions:
    - not char_exists nagmon_obj_library
    actions:
    - create_npc nagmon_obj_library,7,3
    - char_face nagmon_obj_library,down

  Library Talk:
    type: event
    behav:
    - talk nagmon_obj_library
    actions:
    - open_object library

# Inside a house of Hearthrock: the shop: the shopkeeper stands in the gap of the left counter.
# The map is a copy of a Tuxemon interior with its events removed
# (mods/nagmon/maps/nagmon_shop.tmx); the way out, the NPC and the greeting are
# here. The way in is an event of classic_hearthrock_city.yaml.
# Placeholder behaviour only: shop, bag and rest logic come later.

events:

  Environment:
    type: event
    conditions:
    - not environment_is interior
    actions:
    - set_environment interior

  Go Outside:
    type: event
    x: 6
    y: 10
    conditions:
    - is char_at player
    - is char_facing player,down
    actions:
    - transition_teleport player,classic_hearthrock_city.tmx,13,14,0.3
    - char_face player,down

  Create Host:
    type: event
    conditions:
    - not char_exists nagmon_house_shopkeeper
    actions:
    - create_npc nagmon_house_shopkeeper,2,5
    - char_face nagmon_house_shopkeeper,right

  Host Talk:
    type: event
    behav:
    - talk nagmon_house_shopkeeper
    actions:
    - translated_dialog nagmon_world_shop_keeper,nagmon_house_shopkeeper

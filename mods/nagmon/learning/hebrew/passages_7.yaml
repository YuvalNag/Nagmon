- id: pass7.05
  grade: 7
  skill: hebrew.reading.passage_7
  tags: [passage_7]
  title: הכלב בתחנה
  text_he: >-
    בתחנת האוטובוס בשכונה ישב בכל בוקר כלב חום, ואיש לא ידע למי הוא שייך. הוא ישב ליד הספסל, הסתכל בכל אוטובוס שהגיע, ואחר כך הניח את הראש על הידיים.
    התושבים התחילו להביא לו מים, והמוכר מהקיוסק הביא לו מדי יום פרוסת לחם.
    אחרי כמה שבועות התברר הסוד: הבעלים של הכלב, איש מבוגר בשם מר לוי, אושפז בבית חולים. הכלב נשאר לבד, והמשיך לחכות במקום שבו תמיד פגש אותו.
    כשחזר מר לוי הביתה, ירד מהאוטובוס, והכלב רץ אליו וקפץ עליו בשמחה.
    "חיכית לי," אמר הזקן, וצחק ובכה בבת אחת.
    כל השכונה עמדה מסביב והחייכה.
  questions:
    - id: heb.pass7.025
      kind: choice
      difficulty: 0.0
      prompt_he: 'למה הכלב ישב בתחנה?'
      prompt_en: 'Why did the dog sit at the station?'
      choices:
      - {he: הוא חיכה לבעליו, en: He was waiting for his owner}
      - {he: הוא אהב לראות אוטובוסים, en: He liked watching buses}
      - {he: הוא הלך לאיבוד, en: He was lost}
      answer: 0
      explanation_he: 'בסוף מתברר שהכלב חיכה למר לוי, שאושפז ולא היה בבית.'
      explanation_en: 'It turns out the dog waited for Mr. Levi, who was hospitalized.'

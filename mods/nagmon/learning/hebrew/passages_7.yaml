# Nagmon Hebrew reading passages, grade 7 (SDD_CONTENT section 5): original short texts written for this game.
# Each passage names its skill and tags; its questions are regular bank items that inherit grade, skill and tags.
# Hebrew only, without niqqud. The passage shows on the question screen (meta.passage_he).

- id: pass7.01
  grade: 7
  skill: hebrew.reading.passage_7
  tags: [passage_7]
  title: הרמזור שהתקלקל
  text_he: >-
    בכל בוקר חצה מוטי את הכביש ברמזור שליד בית הספר. יום אחד הרמזור התקלקל, והאור האדום נדלק ולא התחלף.
    מכוניות נעמדו, נהגים צפרו, והילדים לא ידעו מה לעשות. מוטי, בן שתים עשרה, הבחין שהמורה לתנועה, גברת ארז, עדיין לא הגיעה.
    הוא עמד באמצע, הרים יד ואמר: "בואו נחצה כשהנהגים מאטים, בזהירות ובשורה אחת." כמה ילדים הצטרפו, והם חצו בלי תקלה.
    כעבור רבע שעה הגיע טכנאי ותיקן את הרמזור.
    המנהלת אמרה למוטי: "עשית מעשה אחראי. ועם זאת, בפעם הבאה קרא קודם למבוגר."
    מוטי הנהן, וידע שהיא צודקת בשני הדברים.
    כל הכיתה שמעה על כך עד הצהריים, ומוטי קיבל טפיחות על הכתף.
  questions:
    - id: heb.pass7.001
      kind: choice
      difficulty: -1.0
      prompt_he: 'מה גרם לפקק ליד בית הספר?'
      prompt_en: 'What caused the jam by the school?'
      choices:
      - {he: הרמזור האדום לא התחלף, en: The red light would not change}
      - {he: תאונה בין שתי מכוניות, en: An accident between two cars}
      - {he: גשם חזק מאוד, en: A very heavy rain}
      answer: 0
      explanation_he: 'הקטע אומר: "הרמזור התקלקל, והאור האדום נדלק ולא התחלף".'
      explanation_en: The text says the light broke and the red stayed on.
    - id: heb.pass7.002
      kind: choice
      difficulty: 0.0
      prompt_he: 'מה עשה מוטי?'
      prompt_en: 'What did Motti do?'
      choices:
      - {he: ניסה לתקן את הרמזור בעצמו עם כלים, en: He tried to fix the light himself with tools}
      - {he: ארגן את הילדים לחצות בזהירות, en: He organized the children to cross carefully}
      - {he: הלך הביתה בלי לחצות את הכביש הזה, en: He went home without crossing this road}
      answer: 1
      explanation_he: הוא עמד באמצע וביקש מהילדים לחצות כשהנהגים מאטים.
      explanation_en: He stood in the middle and asked the children to cross when drivers slow down.
    - id: heb.pass7.003
      kind: choice
      difficulty: 1.0
      prompt_he: 'למה גברת ארז לא הייתה שם?'
      prompt_en: 'Why was Mrs. Erez not there?'
      choices:
      - {he: היא הלכה להביא טכנאי, en: She went to bring a technician}
      - {he: היא חצתה את הכביש, en: She crossed the road}
      - {he: הקטע לא אומר, en: The text does not say}
      answer: 2
      explanation_he: מוטי רק הבחין שהיא עדיין לא הגיעה. הקטע אינו מסביר למה.
      explanation_en: Motti only noticed she had not arrived. The text does not explain why.
    - id: heb.pass7.004
      kind: choice
      difficulty: 1.0
      prompt_he: 'מה פירוש דברי המנהלת "וידע שהיא צודקת בשני הדברים"?'
      prompt_en: 'What does "he knew she was right on both counts" mean?'
      choices:
      - {he: מוטי טעה בכל מה שעשה באותו בוקר, en: Motti was wrong in everything he did that morning}
      - {he: 'מעשה אחראי, ועדיף היה לקרוא למבוגר', en: 'A responsible act, and it was better to call an adult'}
      - {he: המנהלת כעסה עליו מאוד והענישה אותו, en: The principal was very angry and punished him}
      answer: 1
      explanation_he: 'המנהלת שיבחה אותו ("מעשה אחראי") והוסיפה עצה ("קרא למבוגר"). מוטי הסכים לשתיהן.'
      explanation_en: 'She praised him ("a responsible act") and added advice ("call an adult"). Motti agreed with both.'
    - id: heb.pass7.005
      kind: choice
      difficulty: 0.5
      prompt_he: 'איזו תכונה מתאימה למוטי?'
      prompt_en: 'Which trait fits Motti?'
      choices:
      - {he: פחדן ונמנע, en: Fearful and avoiding}
      - {he: עצלן וחסר סבלנות, en: Lazy and impatient}
      - {he: אחראי ופועל בשקט, en: Responsible and calm in action}
      answer: 2
      explanation_he: 'הוא לא נבהל, ארגן את הילדים ולקח אחריות. אלה סימנים של אחריות.'
      explanation_en: 'He did not panic, organized the children and took responsibility. These signs show responsibility.'
    - id: heb.pass7.006
      kind: true_false
      difficulty: 0.0
      prompt_he: המנהלת כעסה על מוטי ודרשה ממנו לבקש סליחה.
      prompt_en: The principal was angry at Motti and demanded an apology.
      answer: false
      explanation_he: 'המנהלת אמרה שעשה מעשה אחראי, והוסיפה רק עצה לעתיד.'
      explanation_en: The principal said he acted responsibly and added only advice for the future.
- id: pass7.02
  grade: 7
  skill: hebrew.reading.passage_7
  tags: [passage_7]
  title: 'למה השמיים כחולים?'
  text_he: >-
    אור השמש נראה לנו לבן, אבל הוא בעצם מורכב מצבעים רבים, כמו בקשת בענן. כשהאור נכנס לאטמוספרה, הוא פוגש מולקולות קטנות של אוויר, והצבעים השונים מתפזרים בכמויות שונות.
    הכחול מתפזר הרבה יותר מהאדום, ולכן כשמסתכלים לשמיים, רואים בעיקר כחול מכל הכיוונים.
    בשעת שקיעה, האור עובר דרך שכבת אוויר ארוכה יותר. הכחול מתפזר בדרך ונעלם מהקרן, ונשארים בעיקר אדום וכתום. לכן השמיים נצבעים בגוונים חמים בערב.
    אפשר לראות את התופעה גם בלילה, כשהירח נמוך מאוד באופק: הוא נראה כתום, מאותה סיבה. התופעה נקראת פיזור האור, והיא חלק מהסיבה לכך שהשמיים בערב נצבעים בגוונים חמים.
  questions:
    - id: heb.pass7.007
      kind: choice
      difficulty: 0.0
      prompt_he: 'מה הרעיון המרכזי של הקטע?'
      prompt_en: 'What is the main idea of the text?'
      choices:
      - {he: למה השמיים כחולים ובשקיעה אדומים, en: Why the sky is blue and red at sunset}
      - {he: תיאור של יום מהנה בחוץ עם החברים, en: A description of an enjoyable day outside with friends}
      - {he: הוראות לצביעת שמיים בצבעי מים, en: Instructions for painting the sky in watercolors}
      answer: 0
      explanation_he: 'הקטע מסביר תופעה בעזרת עובדות: למה הצבעים בשמיים משתנים.'
      explanation_en: 'The text explains a phenomenon with facts: why the colors of the sky change.'
    - id: heb.pass7.008
      kind: choice
      difficulty: -1.0
      prompt_he: 'באיזה צבע האור של השמש נראה לנו?'
      prompt_en: 'What color does sunlight appear to us?'
      choices:
      - {he: כחול, en: Blue}
      - {he: לבן, en: White}
      - {he: אדום, en: Red}
      answer: 1
      explanation_he: 'כתוב: "אור השמש נראה לבן, אבל הוא מורכב מצבעים רבים".'
      explanation_en: 'It says: "sunlight appears white, but it is made of many colors".'
    - id: heb.pass7.009
      kind: choice
      difficulty: 0.0
      prompt_he: 'איזה צבע מתפזר הכי הרבה באוויר?'
      prompt_en: 'Which color scatters the most in the air?'
      choices:
      - {he: אדום, en: Red}
      - {he: כתום, en: Orange}
      - {he: כחול, en: Blue}
      answer: 2
      explanation_he: 'הכחול מתפזר הרבה יותר מהאדום, ולכן רואים אותו מכל הכיוונים.'
      explanation_en: 'Blue scatters far more than red, so we see it from all directions.'
    - id: heb.pass7.010
      kind: choice
      difficulty: 1.0
      prompt_he: 'למה בשקיעה השמיים אדומים?'
      prompt_en: 'Why is the sky red at sunset?'
      choices:
      - {he: השמש מתחממת ונעשית אדומה יותר, en: The sun heats up and turns redder}
      - {he: הים האדום משתקף בשמיים של הערב, en: The red sea is reflected in the evening sky}
      - {he: האור עובר בשכבת אוויר עבה והכחול מתפזר, en: Light crosses thick air and the blue scatters}
      answer: 2
      explanation_he: 'בשקיעה האור עובר דרך אוויר רב יותר, הכחול נעלם, ואדום וכתום נשארים.'
      explanation_en: At sunset the light goes through more air; the blue disappears and red and orange remain.
    - id: heb.pass7.011
      kind: choice
      difficulty: 1.0
      prompt_he: 'מה פירוש "מתפזרים" בקטע?'
      prompt_en: 'What does "mitpazrim" mean in the text?'
      choices:
      - {he: נפרשים לכיוונים רבים, en: They spread in many directions}
      - {he: מתחברים יחד לצבע אחד, en: They join together into one color}
      - {he: נעלמים בלי להשאיר זכר, en: They vanish leaving no trace}
      answer: 0
      explanation_he: צבעי האור מתפזרים כשהם מתפצלים וחוזרים לכל הצדדים.
      explanation_en: The colors of light scatter when they split and spread to all sides.
    - id: heb.pass7.012
      kind: true_false
      difficulty: 1.5
      prompt_he: 'לפי הקטע, בשקיעה האור עובר דרך שכבת אוויר קצרה יותר מאשר ביום.'
      prompt_en: 'According to the text, at sunset the light passes through a shorter layer of air than by day.'
      answer: false
      explanation_he: 'בשקיעה האור עובר דרך שכבת אוויר ארוכה יותר, ולא קצרה יותר. לכן הכחול מתפזר בדרך ונשארים אדום וכתום.'
      explanation_en: 'At sunset the light passes through a longer layer of air, not a shorter one. So the blue scatters on the way.'
- id: pass7.03
  grade: 7
  skill: hebrew.reading.passage_7
  tags: [passage_7]
  title: גשם ראשון
  text_he: |-
    הגשם הראשון דופק על הגג
    כמו אצבעות קטנות של ילד.
    העיר שותה, העצים נושמים,
    ואני עומד ליד החלון ומחייך.

    אמא אומרת: "בוא תיכנס, תתקרר."
    אבל אני רוצה עוד רגע,
    לשמוע איך הארץ מתעוררת
    אחרי קיץ ארוך של שקט.

    אמא מביאה כוס תה חם
    ומניחה אותה על אדן החלון.
    אני לוגם לאט,
    והגשם ממשיך לדפוק,
    ואיש אינו ממהר לשום מקום.

    ריח של אדמה רטובה עולה,
    ציפור אחת מתחבאת בענף,
    והרחוב כולו מבריק,
    כאילו מישהו צחצח אותו בלילה.

    אולי מחר ייפתחו בגינה
    כלניות קטנות מתחת לעץ.
    בינתיים אני רק מקשיב,
    והגשם מספר לי סיפור.
  questions:
    - id: heb.pass7.013
      kind: choice
      difficulty: 0.5
      prompt_he: 'למה משווה המשורר את הגשם לאצבעות של ילד?'
      prompt_en: 'Why does the poet compare the rain to a child''s fingers?'
      choices:
      - {he: כי הוא גר בבית עם הרבה ילדים, en: Because he lives in a house with many children}
      - {he: כי הגשם דופק בעדינות על הגג, en: Because the rain taps gently on the roof}
      - {he: כי הגשם יורד מאצבעות של ענן, en: 'Because rain falls from a cloud''s fingers'}
      answer: 1
      explanation_he: 'טיפות הגשם נשמעות כמו נקישות קלות על הגג, כמו אצבעות קטנות.'
      explanation_en: 'Raindrops sound like light taps on the roof, like small fingers.'
    - id: heb.pass7.014
      kind: choice
      difficulty: -1.0
      prompt_he: 'איך מרגיש הדובר בשיר?'
      prompt_en: 'How does the speaker feel in the poem?'
      choices:
      - {he: כועס ומתוח, en: Angry and tense}
      - {he: מפחד ומודאג, en: Afraid and worried}
      - {he: שמח ורגוע, en: Happy and calm}
      answer: 2
      explanation_he: 'הוא עומד ליד החלון ומחייך, ורוצה לשמוע עוד.'
      explanation_en: He stands by the window smiling and wants to listen more.
    - id: heb.pass7.015
      kind: choice
      difficulty: 1.0
      prompt_he: 'מה פירוש "הארץ מתעוררת"?'
      prompt_en: 'What does "the land is waking up" mean?'
      choices:
      - {he: הגשם מחיה את הטבע אחרי הקיץ היבש, en: The rain revives nature after the dry summer}
      - {he: האדמה זזה ורועדת מהרעם החזק בחוץ, en: The ground moves and shakes from the loud thunder outside}
      - {he: האנשים קמים משינה ארוכה בבוקר קר, en: People get up from a long sleep on a cold morning}
      answer: 0
      explanation_he: 'זו האנשה: הארץ "ישנה" בקיץ היבש ומתעוררת עם הגשם הראשון.'
      explanation_en: 'It is personification: the land "sleeps" through the dry summer and wakes with the first rain.'
    - id: heb.pass7.016
      kind: choice
      difficulty: 0.5
      prompt_he: 'באיזו עונה מדובר בשיר?'
      prompt_en: 'In which season is the poem set?'
      choices:
      - {he: בסוף האביב החם, en: At the end of the warm spring}
      - {he: באמצע הקיץ הלוהט, en: In the middle of the scorching summer}
      - {he: בתחילת החורף, en: At the start of winter}
      answer: 2
      explanation_he: 'הגשם הראשון בא אחרי קיץ ארוך, והכלניות עוד לא פרחו. זו תחילת החורף.'
      explanation_en: 'The first rain comes after a long summer, and the anemones have not bloomed yet. It is early winter.'
    - id: heb.pass7.017
      kind: choice
      difficulty: 0.0
      prompt_he: 'למה הדובר רוצה להישאר ליד החלון?'
      prompt_en: 'Why does the speaker want to stay by the window?'
      choices:
      - {he: הוא נהנה להקשיב לגשם, en: He enjoys listening to the rain}
      - {he: הוא מחכה שחבר יבוא לבקר, en: He is waiting for a friend to visit}
      - {he: הוא מפחד לצאת מהבית בגשם, en: He is afraid to go out of the house in the rain}
      answer: 0
      explanation_he: 'הוא אומר "אני רוצה עוד רגע, לשמוע", ובסוף: "אני רק מקשיב".'
      explanation_en: 'He says "I want another moment, to hear", and at the end: "I only listen".'
    - id: heb.pass7.018
      kind: choice
      difficulty: 1.0
      prompt_he: 'מה הכוונה ב"הרחוב מבריק, כאילו מישהו צחצח אותו"?'
      prompt_en: 'What is meant by "the street shines, as if someone polished it"?'
      choices:
      - {he: מישהו באמת צחצח את הרחוב במברשת גדולה, en: Someone really polished the street with a big brush}
      - {he: הגשם שטף את הרחוב ועשה אותו נקי, en: The rain washed the street and made it clean}
      - {he: הרחוב נצבע בצבע חדש ומבריק בלילה, en: The street was painted a new shiny color at night}
      answer: 1
      explanation_he: 'זה דימוי ("כאילו"): הגשם שוטף את הרחוב כך שהוא נראה מצוחצח.'
      explanation_en: 'It is a simile ("as if"): rain washes the street so it looks polished.'
- id: pass7.04
  grade: 7
  skill: hebrew.reading.passage_7
  tags: [passage_7]
  title: אופניים בעיר
  text_he: >-
    בערים רבות בעולם, גדולות וקטנות, מקימים תחנות להשכרת אופניים. מי שרוצה לנסוע לוקח אופניים בתחנה אחת ומחזיר אותם בתחנה אחרת.
    לשיטה יש יתרונות: היא מפחיתה את הפקקים, מקטינה את זיהום האוויר ומעודדת אנשים לנוע. גם הנוסעים חוסכים כסף, שכן אין צורך לקנות אופניים ולתחזק אותם.
    יש גם חסרונות. במקומות שאין בהם שבילי אופניים, הרכיבה בכביש מסוכנת, ולעתים אנשים משאירים אופניים באמצע המדרכה.
    כדי שהשיטה תעבוד, צריך לדאוג שיהיו מספיק אופניים בכל תחנה ושהם יהיו תקינים.
    מסקנה: כדאי להרחיב את השימוש באופניים, אבל רק אחרי שבונים שבילים בטוחים ומסדרים את החניה שלהם.
  questions:
    - id: heb.pass7.019
      kind: choice
      difficulty: -1.0
      prompt_he: 'איך פועלת שיטת ההשכרה?'
      prompt_en: 'How does the rental system work?'
      choices:
      - {he: קונים אופניים חדשים ושומרים אותם, en: You buy new bikes and keep them}
      - {he: מחכים בבית עד שהאופניים יגיעו אליהם, en: You wait at home until the bike reaches you}
      - {he: לוקחים בתחנה אחת ומחזירים באחרת, en: You take at one station and return at another}
      answer: 2
      explanation_he: הקטע אומר שלוקחים אופניים בתחנה אחת ומחזירים בתחנה אחרת.
      explanation_en: The text says you take a bike at one station and return it at another.
    - id: heb.pass7.020
      kind: choice
      difficulty: 0.0
      prompt_he: 'איזה יתרון מוזכר בקטע?'
      prompt_en: 'Which advantage is mentioned in the text?'
      choices:
      - {he: יותר מקומות חניה למכוניות, en: More parking spaces for cars}
      - {he: פחות זיהום אוויר, en: Less air pollution}
      - {he: נסיעה מהירה יותר בכביש, en: Faster driving on the road}
      answer: 1
      explanation_he: כתוב שהשיטה מקטינה את זיהום האוויר ומפחיתה פקקים.
      explanation_en: It says the system reduces air pollution and traffic jams.
    - id: heb.pass7.021
      kind: choice
      difficulty: 0.0
      prompt_he: 'איזה חיסרון מוזכר בקטע?'
      prompt_en: 'Which disadvantage is mentioned in the text?'
      choices:
      - {he: רכיבה בכביש בלי שבילים מסוכנת, en: Riding on the road without bike lanes is dangerous}
      - {he: האופניים יקרים מאוד לקנייה ולתיקון, en: Bikes are very expensive to buy and repair}

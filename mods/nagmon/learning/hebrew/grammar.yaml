# Nagmon learning content - hebrew / grammar (grades 3-5): parts of speech, agreement, tenses, person, subject and predicate, roots, affixes, binyanim, construct state
# Format: docs/kids/SDD_CONTENT.md section 3. Original text written for this game (no textbook passages); reviewed by a parent.
# Hebrew without niqqud. Answer indexes are 0-based; for kind=order, answer lists choice indexes in the correct order.
# Aligned with the Israeli language curriculum (MoE "הוראת הלשון", grades 3-9): grammar, vocabulary, spelling, text.

skill: hebrew.grammar.parts_of_speech
items:
- id: heb.pos.001
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'מה סוג המילה "ספר" במשפט: "הילדה קראה ספר"?'
  prompt_en: 'What kind of word is "sefer" (book) in: "The girl read a book"?'
  choices:
  - {he: פועל, en: verb}
  - {he: שם תואר, en: adjective}
  - {he: שם עצם, en: noun}
  answer: 2
  explanation_he: 'ספר הוא דבר שאפשר להחזיק ביד, ולכן הוא שם עצם. שם עצם הוא שם של אדם, חיה, דבר או מקום.'
  explanation_en: 'A book is a thing you can hold, so it is a noun. A noun names a person, an animal, a thing or a place.'
  tags: [parts_of_speech]
- id: heb.pos.002
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'מה סוג המילה "קראה" במשפט: "הילדה קראה ספר"?'
  prompt_en: 'What kind of word is "kar''a" (read) in: "The girl read a book"?'
  choices:
  - {he: שם עצם, en: noun}
  - {he: פועל, en: verb}
  - {he: שם תואר, en: adjective}
  answer: 1
  explanation_he: קראה מספרת מה הילדה עושה. מילה שמספרת מה עושים או מה קורה היא פועל.
  explanation_en: It tells what the girl does. A word that tells what someone does or what happens is a verb.
  tags: [parts_of_speech]
- id: heb.pos.003
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'מה סוג המילה "גדול" במשפט: "בגינה יש עץ גדול"?'
  prompt_en: 'What kind of word is "gadol" (big) in: "There is a big tree in the garden"?'
  choices:
  - {he: שם תואר, en: adjective}
  - {he: שם עצם, en: noun}
  - {he: פועל, en: verb}
  answer: 0
  explanation_he: 'גדול אומר איך העץ נראה. מילה שמתארת אדם, חיה או דבר היא שם תואר.'
  explanation_en: 'It says what the tree is like. A word that describes a person, animal or thing is an adjective.'
  tags: [parts_of_speech]
- id: heb.pos.004
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה במשפט "הכלב הקטן רץ בגינה" היא שם תואר?'
  prompt_en: 'Which word in "The small dog runs in the garden" is an adjective?'
  choices:
  - {he: הכלב, en: the dog}
  - {he: הקטן, en: the small}
  - {he: רץ, en: runs}
  answer: 1
  explanation_he: 'הקטן מתאר את הכלב: איזה כלב? קטן. הכלב הוא שם עצם, ורץ הוא פועל.'
  explanation_en: '"Small" describes the dog: which dog? A small one. "Dog" is a noun and "runs" is a verb.'
  tags: [parts_of_speech]
- id: heb.pos.005
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה במשפט "דנה שותה מיץ קר" היא פועל?'
  prompt_en: 'Which word in "Dana drinks cold juice" is a verb?'
  choices:
  - {he: מיץ, en: juice}
  - {he: קר, en: cold}
  - {he: שותה, en: drinks}
  answer: 2
  explanation_he: 'שותה מספרת מה דנה עושה. מיץ הוא שם עצם, וקר הוא שם תואר.'
  explanation_en: '"Drinks" tells what Dana does. "Juice" is a noun and "cold" is an adjective.'
  tags: [parts_of_speech]
- id: heb.pos.006
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'איזו מילה היא שם עצם?'
  prompt_en: 'Which word is a noun?'
  choices:
  - {he: חלון, en: window}
  - {he: לרקוד, en: to dance}
  - {he: שמח, en: happy}
  answer: 0
  explanation_he: 'חלון הוא דבר, ולכן הוא שם עצם. לרקוד היא פועל, ושמח הוא שם תואר.'
  explanation_en: 'A window is a thing, so it is a noun. "To dance" is a verb and "happy" is an adjective.'
  tags: [parts_of_speech]
- id: heb.pos.007
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה היא פועל?'
  prompt_en: 'Which word is a verb?'
  choices:
  - {he: מחברת, en: notebook}
  - {he: כותב, en: writes}
  - {he: כחול, en: blue}
  answer: 1
  explanation_he: 'כותב אומר מה עושים. מחברת היא דבר, וכחול מתאר צבע.'
  explanation_en: '"Writes" says what someone does. A notebook is a thing and blue describes a color.'
  tags: [parts_of_speech]
- id: heb.pos.008
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'איזו מילה היא שם תואר?'
  prompt_en: 'Which word is an adjective?'
  choices:
  - {he: עצוב, en: sad}
  - {he: ילד, en: boy}
  - {he: יושב, en: sits}
  answer: 0
  explanation_he: 'עצוב אומר איך מישהו מרגיש או נראה. ילד הוא שם עצם, ויושב הוא פועל.'
  explanation_en: '"Sad" says how someone feels. "Boy" is a noun and "sits" is a verb.'
  tags: [parts_of_speech]
- id: heb.pos.009
  skill: hebrew.grammar.parts_of_speech
  kind: true_false
  grade: 3
  difficulty: -1.0
  prompt_he: 'המילה "רחוב" היא שם עצם.'
  prompt_en: 'The word "rehov" (street) is a noun.'
  answer: true
  explanation_he: 'רחוב הוא מקום, ושמות של מקומות הם שמות עצם. אפשר לומר "הרחוב", ולכן ברור שזה שם.'
  explanation_en: 'A street is a place, and names of places are nouns. You can say "the street", which shows it is a noun.'
  tags: [parts_of_speech]
- id: heb.pos.010
  skill: hebrew.grammar.parts_of_speech
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: 'המילה "אוכלת" היא שם תואר.'
  prompt_en: 'The word "ochelet" (eats) is an adjective.'
  answer: false
  explanation_he: 'אוכלת מספרת מה עושה מישהי, ולכן היא פועל. שם תואר מתאר, כמו "רעבה".'
  explanation_en: '"Eats" tells what someone does, so it is a verb. An adjective describes, like "hungry".'
  tags: [parts_of_speech]
- id: heb.pos.011
  skill: hebrew.grammar.parts_of_speech
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: 'המילה "צהוב" היא שם תואר.'
  prompt_en: 'The word "tsahov" (yellow) is an adjective.'
  answer: true
  explanation_he: 'צהוב מתאר איזה צבע יש לדבר, כמו "בננה צהובה". מילה שמתארת היא שם תואר.'
  explanation_en: '"Yellow" says what color a thing is, as in "a yellow banana". A describing word is an adjective.'
  tags: [parts_of_speech]
- id: heb.pos.012
  skill: hebrew.grammar.parts_of_speech
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: 'במשפט "הציפור שרה שיר" יש שני שמות עצם.'
  prompt_en: 'In "The bird sang a song" there are two nouns.'
  answer: true
  explanation_he: 'ציפור ושיר הם שמות עצם. המילה "שרה" היא הפועל.'
  explanation_en: '"Bird" and "song" are nouns. The word "sang" is the verb.'
  tags: [parts_of_speech]
- id: heb.pos.013
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'כמה פעלים יש במשפט: "אמא קוראת וסבא מצייר"?'
  prompt_en: 'How many verbs are in: "Mom reads and Grandpa draws"?'
  choices:
  - {he: שניים, en: two}
  - {he: אחד, en: one}
  - {he: שלושה, en: three}
  answer: 0
  explanation_he: 'קוראת ומצייר הם פעלים, כי כל אחד מהם מספר מה עושים. אמא וסבא הם שמות עצם.'
  explanation_en: '"Reads" and "draws" are verbs, because each tells what someone does. "Mom" and "Grandpa" are nouns.'
  tags: [parts_of_speech]
- id: heb.pos.014
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.5
  prompt_he: 'באיזה משפט יש שם תואר?'
  prompt_en: 'Which sentence has an adjective?'
  choices:
  - {he: הילד רץ ואוכל, en: The boy runs and eats}
  - {he: אבא ואמא בבית, en: Dad and Mom are home}
  - {he: התפוח אדום ומתוק, en: The apple is red and sweet}
  answer: 2
  explanation_he: 'במשפט הראשון "אדום" ו"מתוק" מתארים את התפוח. בשני יש פעלים, ובשלישי יש רק שמות עצם.'
  explanation_en: 'In the first, "red" and "sweet" describe the apple. The second has verbs and the third has only nouns.'
  tags: [parts_of_speech]
- id: heb.pos.015
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה אינה שם עצם?'
  prompt_en: 'Which word is not a noun?'
  choices:
  - {he: שמיכה, en: blanket}
  - {he: לישון, en: to sleep}
  - {he: כרית, en: pillow}
  answer: 1
  explanation_he: 'לישון אומרת מה עושים, ולכן היא פועל. שמיכה וכרית הן דברים, ולכן הן שמות עצם.'
  explanation_en: '"To sleep" says what you do, so it is a verb. A blanket and a pillow are things, so they are nouns.'
  tags: [parts_of_speech]
- id: heb.pos.016
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה אינה פועל?'
  prompt_en: 'Which word is not a verb?'
  choices:
  - {he: חמוד, en: cute}
  - {he: מתרוצץ, en: runs around}
  - {he: מחייך, en: smiles}
  answer: 0
  explanation_he: 'חמוד מתאר, ולכן הוא שם תואר. מתרוצץ ומחייך אומרים מה עושים, ולכן הם פעלים.'
  explanation_en: '"Cute" describes, so it is an adjective. "Runs around" and "smiles" say what someone does, so they are verbs.'
  tags: [parts_of_speech]
- id: heb.pos.017
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'מה מתאים להשלים: "הילד קנה ___ חדש"?'
  prompt_en: 'What fits: "The boy bought a new ___"?'
  choices:
  - {he: צוחק, en: laughs}
  - {he: כדור, en: ball}
  - {he: שמח, en: happy}
  answer: 1
  explanation_he: 'אחרי "קנה" בא דבר שקונים, ולכן צריך שם עצם: כדור. צוחק הוא פועל ושמח הוא שם תואר.'
  explanation_en: 'After "bought" comes a thing you can buy, so a noun is needed: a ball.'
  tags: [parts_of_speech]
- id: heb.pos.018
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה מתאימה: "בחורף יש ימים ___"?'
  prompt_en: 'Which word fits: "In winter there are ___ days"?'
  choices:
  - {he: גשם, en: rain}
  - {he: לובשים, en: wear}
  - {he: קרים, en: cold}
  answer: 2
  explanation_he: 'כאן צריך שם תואר שמתאר את הימים, וקרים מתאים. גשם הוא שם עצם, ולובשים הוא פועל.'
  explanation_en: 'A describing word is needed for the days, and "cold" fits. "Rain" is a noun and "wear" is a verb.'
  tags: [parts_of_speech]
- id: heb.pos.019
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'איזו מילה מתאימה: "הדג ___ בים"?'
  prompt_en: 'Which word fits: "The fish ___ in the sea"?'
  choices:
  - {he: כחול, en: blue}
  - {he: גדול, en: big}
  - {he: שוחה, en: swims}
  answer: 2
  explanation_he: 'במשפט חסר פועל שמספר מה הדג עושה: שוחה. כחול וגדול מתארים, אבל לא אומרים מה עושים.'
  explanation_en: 'The sentence needs a verb that tells what the fish does: swims. "Blue" and "big" describe, they do not say what it does.'
  tags: [parts_of_speech]
- id: heb.pos.020
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.5
  prompt_he: 'מה סוג המילה "ענק" במשפט: "ראינו דינוזאור ענק"?'
  prompt_en: 'What kind of word is "anak" (giant) in: "We saw a giant dinosaur"?'
  choices:
  - {he: שם עצם, en: noun}
  - {he: שם תואר, en: adjective}
  - {he: פועל, en: verb}
  answer: 1
  explanation_he: 'ענק אומר איך הדינוזאור: גדול מאוד. אפשר לשאול "איזה דינוזאור?", ולכן הוא שם תואר.'
  explanation_en: '"Giant" says what the dinosaur is like. You can ask "which dinosaur?", so it is an adjective.'
  tags: [parts_of_speech]
- id: heb.pos.021
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.5
  prompt_he: 'מה סוג המילה "אור" במשפט: "האור נדלק בחדר"?'
  prompt_en: 'What kind of word is "or" (light) in: "The light came on in the room"?'
  choices:
  - {he: שם עצם, en: noun}
  - {he: פועל, en: verb}
  - {he: שם תואר, en: adjective}
  answer: 0
  explanation_he: 'אור הוא שם של דבר, והוא בא עם "ה" הידיעה. הפועל במשפט הוא נדלק.'
  explanation_en: '"Light" is the name of a thing, and it comes with "the". The verb in the sentence is "came on".'
  tags: [parts_of_speech]
- id: heb.pos.022
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 0.5
  prompt_he: 'מה סוג המילה "מחכה" במשפט: "דני מחכה לאוטובוס"?'
  prompt_en: 'What kind of word is "mechake" (waits) in: "Danny waits for the bus"?'
  choices:
  - {he: שם עצם, en: noun}
  - {he: פועל, en: verb}
  - {he: שם תואר, en: adjective}
  answer: 1
  explanation_he: 'מחכה מספרת מה דני עושה, ולכן היא פועל. דני ואוטובוס הם שמות עצם.'
  explanation_en: '"Waits" tells what Danny does, so it is a verb. "Danny" and "bus" are nouns.'
  tags: [parts_of_speech]
- id: heb.pos.023
  skill: hebrew.grammar.parts_of_speech
  kind: true_false
  grade: 3
  difficulty: 0.5
  prompt_he: 'במשפט "השמש החמה זורחת" המילה "החמה" היא שם תואר.'
  prompt_en: 'In "The warm sun shines" the word "hama" (warm) is an adjective.'
  answer: true
  explanation_he: 'החמה מתארת את השמש: איזו שמש? חמה. "זורחת" היא הפועל.'
  explanation_en: '"Warm" describes the sun: which sun? A warm one. "Shines" is the verb.'
  tags: [parts_of_speech]
- id: heb.pos.024
  skill: hebrew.grammar.parts_of_speech
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: שם עצם אומר מה עושים.
  prompt_en: A noun says what someone does.
  answer: false
  explanation_he: 'מה עושים אומר הפועל. שם עצם הוא שם של אדם, חיה, דבר או מקום.'
  explanation_en: 'The verb says what someone does. A noun is the name of a person, an animal, a thing or a place.'
  tags: [parts_of_speech]
- id: heb.pos.025
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: 'כמה שמות תואר יש במשפט: "הכלב הקטן, השחור והנחמד שכב"?'
  prompt_en: 'How many adjectives are in: "The small, black and nice dog lay down"?'
  choices:
  - {he: שניים, en: two}
  - {he: ארבעה, en: four}
  - {he: שלושה, en: three}
  answer: 2
  explanation_he: 'הקטן, השחור והנחמד מתארים את הכלב. הכלב הוא שם עצם, ושכב הוא פועל.'
  explanation_en: '"Small", "black" and "nice" describe the dog. "Dog" is a noun and "lay down" is a verb.'
  tags: [parts_of_speech]
- id: heb.pos.026
  skill: hebrew.grammar.parts_of_speech
  kind: choice
  grade: 3
  difficulty: 1.5
  prompt_he: 'באיזה משפט המילה "ספר" היא פועל?'
  prompt_en: 'In which sentence is "sapar" a verb?'
  choices:
  - {he: הספר על השולחן, en: The book is on the table}
  - {he: הוא ספר את הכסף, en: He counted the money}
  - {he: זה ספר מעניין, en: This is an interesting book}
  answer: 1
  explanation_he: 'במשפט הראשון ספר הוא מה שהוא עושה: סופר. בשני האחרים ספר הוא הדבר שקוראים בו. המשפט מראה אם זה פועל או שם עצם.'
  explanation_en: 'In the first, "sapar" is what he does: he counted. In the others it is the thing you read. The sentence shows the type.'
  tags: [parts_of_speech]
- id: heb.agree.001
  skill: hebrew.grammar.agreement
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'השלימו: "הילדה ___ בגן".'
  prompt_en: 'Complete: "The girl ___ in the park".'
  choices:
  - {he: משחקת, en: plays (f.)}
  - {he: משחק, en: plays (m.)}
  - {he: משחקים, en: play (m. pl.)}
  answer: 0
  explanation_he: 'ילדה היא נקבה ביחיד, ולכן גם הפועל נקבה ביחיד: משחקת.'
  explanation_en: '"Girl" is feminine singular, so the verb is feminine singular too: plays.'
  tags: [agreement]
- id: heb.agree.002
  skill: hebrew.grammar.agreement
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'השלימו: "הכלבים ___ בחצר".'
  prompt_en: 'Complete: "The dogs ___ in the yard".'
  choices:
  - {he: רץ, en: runs (m.)}
  - {he: רצה, en: runs (f.)}
  - {he: רצים, en: run (m. pl.)}
  answer: 2
  explanation_he: 'כלבים הוא זכר רבים, ולכן גם הפועל בזכר רבים: רצים.'
  explanation_en: '"Dogs" is masculine plural, so the verb is masculine plural: run.'
  tags: [agreement]
- id: heb.agree.003
  skill: hebrew.grammar.agreement
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'השלימו: "מכונית ___".'
  prompt_en: 'Complete: "a ___ car".'
  choices:
  - {he: חדש, en: new (m.)}
  - {he: חדשה, en: new (f.)}

# Nagmon Hebrew reading passages, grade 8 (SDD_CONTENT section 5): original short texts written for this game.
# Each passage names its skill and tags; its questions are regular bank items that inherit grade, skill and tags.
# Hebrew only, without niqqud. The passage shows on the question screen (meta.passage_he).

- id: pass8.01
  grade: 8
  skill: hebrew.reading.passage_8
  tags: [passage_8]
  title: הנאום
  text_he: >-
    כשהכריזו שיוסי נבחר ליושב ראש מועצת התלמידים, כל הכיתה מחאה כפיים. רק יוסי נשאר בלי חיוך. הוא ידע מה מחכה לו: נאום בפני כל בית הספר. הוא הרגיש שכולם מצפים לנאום גדול.
    במשך שלושה ערבים ישב וכתב, מחק וכתב שוב. המשפטים נשמעו לו גבוהים, חשובים, ולא שלו בכלל. אחותו הגדולה, מיכל, הציצה במחברת ואמרה: "אתה כותב כמו שר. תכתוב כמו יוסי."
    למחרת עלה לבמה עם דף אחד בלבד. הוא התחיל: "אני לא אוהב לדבר מול הרבה אנשים, אבל אני אוהב את בית הספר הזה." הקהל צחק בנחת, והחיוך הראשון עלה גם על פניו.
    כשירד מהבמה הבין שהנאום הטוב ביותר אינו המשוכלל ביותר, אלא זה שנאמר באמת.
  questions:
    - id: heb.pass8.001
      kind: choice
      difficulty: -1.0
      prompt_he: 'למה יוסי לא חייך כשנבחר?'
      prompt_en: 'Why did Yossi not smile when he was chosen?'
      choices:
      - {he: הוא חשש מהנאום שמחכה לו, en: He worried about the speech awaiting him}
      - {he: הוא רצה להיבחר לתפקיד אחר, en: He wanted to be chosen for another role}
      - {he: הוא לא אהב את חבריו לכיתה, en: He did not like his classmates}
      answer: 0
      explanation_he: 'כתוב שהוא ידע מה מחכה לו: נאום מול כל בית הספר.'
      explanation_en: 'It says he knew what awaited him: a speech before the whole school.'
    - id: heb.pass8.002
      kind: choice
      difficulty: 0.5
      prompt_he: 'מה הרגיש יוסי לגבי הנאום שכתב ב"שלושה ערבים"?'
      prompt_en: 'How did Yossi feel about the speech he wrote over "three evenings"?'
      choices:
      - {he: שהוא גאה מאוד בכל מילה, en: That he was proud of every word}
      - {he: שהוא קצר מדי, en: That it was too short}
      - {he: שהמשפטים אינם שלו, en: That the sentences were not his own}
      answer: 2
      explanation_he: 'הוא חשב שהמשפטים נשמעים גבוהים וחשובים אבל "לא שלו בכלל".'
      explanation_en: 'He felt the sentences sounded high and important but were "not his at all".'
    - id: heb.pass8.003
      kind: choice
      difficulty: 1.0
      prompt_he: 'מה פירוש דברי מיכל "אתה כותב כמו שר. תכתוב כמו יוסי"?'
      prompt_en: 'What does Michal mean by "you write like a minister. Write like Yossi"?'
      choices:
      - {he: שיחקה שר ממשלה, en: That he should imitate a minister}
      - {he: שיכתוב בקול טבעי שלו, en: That he should write in his own natural voice}
      - {he: שיעביר את הנאום לאחרים, en: That he should pass the speech to others}
      answer: 1
      explanation_he: 'מיכל ראתה שהנוסח מרשים אך לא אמיתי, ולכן ביקשה שיכתוב בקולו.'
      explanation_en: 'Michal saw that the text was impressive but not genuine, so she asked him to write in his own voice.'
    - id: heb.pass8.004
      kind: choice
      difficulty: 1.0
      prompt_he: 'מדוע הקהל צחק בנחת?'
      prompt_en: 'Why did the audience laugh gently?'
      choices:
      - {he: כי הוא טעה במילים ובתנועות, en: Because he made mistakes in words and gestures}
      - {he: כי הוא עמד על הבמה בצורה מצחיקה, en: Because he stood on the stage in a funny way}
      - {he: כי יוסי היה כן ובעל הומור, en: Because Yossi was honest and humorous}
      answer: 2
      explanation_he: 'הוא פתח בהודאה כנה ("אני לא אוהב לדבר מול אנשים"), והקהל הרגיש קרבה.'
      explanation_en: 'He opened with an honest admission ("I do not like speaking before people"), and the audience felt close.'
    - id: heb.pass8.005
      kind: choice
      difficulty: 1.0
      prompt_he: 'מהו המסר של הקטע?'
      prompt_en: 'What is the message of the text?'
      choices:
      - {he: כדאי להכין נאום ארוך ומשוכלל מאוד, en: 'It is worth preparing a very long, polished speech'}
      - {he: דיבור כן חשוב יותר מנאום מושלם, en: Speaking honestly matters more than a perfect speech}
      - {he: עדיף לא להיבחר לתפקידים מכובדים, en: It is better not to be elected to respectable roles}
      answer: 1
      explanation_he: 'המשפט האחרון אומר זאת במפורש: הנאום הטוב הוא זה שנאמר באמת.'
      explanation_en: 'The last sentence says so explicitly: the best speech is the one said truly.'
    - id: heb.pass8.006
      kind: true_false
      difficulty: 0.5
      prompt_he: 'לפי הקטע, יוסי ירד מהבמה אחרי שבחר לוותר על הנאום.'
      prompt_en: 'According to the text, Yossi left the stage after deciding to skip the speech.'
      answer: false
      explanation_he: 'יוסי נשא את הנאום, ורק אחר כך ירד מהבמה והבין משהו על נאומים.'
      explanation_en: 'Yossi gave the speech, and only then left the stage and understood something about speeches.'
- id: pass8.02
  grade: 8
  skill: hebrew.reading.passage_8
  tags: [passage_8]
  title: השמיכה של כדור הארץ
  text_he: >-
    סביב כדור הארץ יש שכבת גזים שנקראת אטמוספרה. חלק מהגזים בה, כמו פחמן דו חמצני ואדי מים, פועלים כמו שמיכה: הם מחזיקים חלק מהחום של השמש ולא נותנים לו לברוח כולו אל החלל.
    בזכות השמיכה הזאת הטמפרטורה בכדור הארץ נוחה לחיים. בלעדיה היינו חיים בכוכב קפוא.
    הבעיה היא ששריפת דלק בתחנות כוח ובמכוניות מוסיפה לאוויר עוד פחמן דו חמצני. השמיכה נעשית עבה יותר, והעולם מתחמם לאט.
    מדענים מציעים לצמצם את השריפה, לנצל יותר את אנרגיית השמש והרוח, ולשמור על יערות, כי עצים סופגים פחמן דו חמצני.
    מדענים רבים מסכימים שהחימום בעשורים האחרונים קשור לפעילות האדם. כל אחד יכול לתרום: לנסוע פחות, לכבות אורות ולחסוך חשמל.
  questions:
    - id: heb.pass8.007
      kind: choice
      difficulty: 0.0
      prompt_he: 'מה התפקיד של האטמוספרה לפי הקטע?'
      prompt_en: 'What is the role of the atmosphere according to the text?'
      choices:
      - {he: לייצר גשם בכל חורף ואביב, en: To make rain every winter and spring}
      - {he: להרחיק את כל אור השמש מהכוכב, en: To keep all the sunlight away from the planet}
      - {he: לשמור על חלק מהחום של השמש, en: 'To keep part of the sun''s heat'}
      answer: 2
      explanation_he: הקטע משווה את הגזים לשמיכה שמחזיקה חלק מהחום ולא נותנת לו לברוח.
      explanation_en: The text compares the gases to a blanket that holds some heat and stops it from escaping.
    - id: heb.pass8.008
      kind: choice
      difficulty: 1.0
      prompt_he: 'למה המחבר משווה את הגזים לשמיכה?'
      prompt_en: 'Why does the author compare the gases to a blanket?'
      choices:
      - {he: כי שניהם רכים ונעימים למגע, en: Because both are soft and pleasant to touch}
      - {he: כי שניהם שומרים על חום, en: Because both hold heat in}
      - {he: כי שניהם מופיעים בלילה בלבד, en: Because both appear only at night}
      answer: 1
      explanation_he: 'שמיכה שומרת על חום הגוף, והגזים שומרים על חום כדור הארץ. זה דימוי.'
      explanation_en: 'A blanket keeps body warmth and the gases keep the Earth''s warmth. This is a simile.'
    - id: heb.pass8.009
      kind: choice
      difficulty: 1.0
      prompt_he: 'מה הבעיה שמתוארת בקטע?'
      prompt_en: 'What problem is described in the text?'
      choices:
      - {he: יותר פחמן דו חמצני מחמם את העולם, en: More carbon dioxide is warming the world}
      - {he: הרוח חזקה מדי ומפזרת את הגזים, en: The wind is too strong and scatters the gases}
      - {he: היערות גדלים מהר מדי ומסתירים שמש, en: The forests grow too fast and block the sun}
      answer: 0
      explanation_he: 'שריפת דלק מוסיפה פחמן דו חמצני, השמיכה מתעבה והעולם מתחמם.'
      explanation_en: 'Burning fuel adds carbon dioxide, the blanket thickens and the world warms.'
    - id: heb.pass8.010
      kind: choice
      difficulty: 0.5
      prompt_he: 'למה חשוב לשמור על יערות?'
      prompt_en: 'Why is it important to protect forests?'
      choices:
      - {he: כי העצים נותנים צל לחיות רבות, en: Because trees give shade to many animals}
      - {he: כי עצים סופגים פחמן דו חמצני, en: Because trees absorb carbon dioxide}
      - {he: כי ביערות גרות הרבה חיות נדירות, en: Because many rare animals live in forests}
      answer: 1
      explanation_he: הקטע אומר במפורש שעצים סופגים פחמן דו חמצני.
      explanation_en: The text says explicitly that trees absorb carbon dioxide.
    - id: heb.pass8.011
      kind: choice
      difficulty: 1.0
      prompt_he: 'איזו דרך אינה מוצעת בקטע?'
      prompt_en: 'Which way is not suggested in the text?'
      choices:
      - {he: לבנות עוד תחנות כוח, en: To build more power plants}
      - {he: לנצל אנרגיית שמש ורוח, en: To use solar and wind energy}
      - {he: לכבות אורות ולחסוך בחשמל, en: To turn off lights and save electricity}
      answer: 0
      explanation_he: 'הקטע מציע לצמצם שריפה ולא להגדיל אותה, ולכן בניית תחנות כוח נוספות אינה בין ההצעות.'
      explanation_en: 'The text suggests reducing burning, not increasing it, so building more power plants is not among the suggestions.'
    - id: heb.pass8.012
      kind: true_false
      difficulty: 0.0
      prompt_he: 'לפי הקטע, בלי האטמוספרה כדור הארץ היה קפוא.'
      prompt_en: 'According to the text, without the atmosphere the Earth would be frozen.'
      answer: true
      explanation_he: כתוב שבלעדי השמיכה היינו חיים בכוכב קפוא.
      explanation_en: It says that without the blanket we would live on a frozen planet.
- id: pass8.03
  grade: 8
  skill: hebrew.reading.passage_8
  tags: [passage_8]
  title: המצאת הדפוס
  text_he: >-
    לפני יותר מחמש מאות שנה, ספרים נכתבו ביד. סופר היה יושב שעות ארוכות, מעתיק אות אחר אות, ושלושה חודשים לעתים לא הספיקו כדי להעתיק ספר אחד. לכן ספרים היו נדירים ויקרים, ורק עשירים ומוסדות גדולים יכלו לקנות אותם.
    בסביבות שנת 1450 הגרמני יוהאן גוטנברג פיתח שיטה חדשה: הוא יצק אותיות ממתכת, סידר אותן למילים ולשורות, מרח עליהן דיו והדפיס עמוד שלם בבת אחת. אפשר היה להשתמש באותן אותיות שוב ושוב בעמודים אחרים.
    הדפוס הוזיל את הספרים. בתוך כמה עשרות שנים הודפסו אלפי ספרים, יותר אנשים למדו לקרוא, ורעיונות חדשים התפשטו מהר בהרבה מבעבר.
    אפשר לומר שההמצאה שינתה את העולם לא פחות מהמצאות שאנו מכירים היום.
  questions:
    - id: heb.pass8.013
      kind: choice
      difficulty: -1.0
      prompt_he: 'למה ספרים היו נדירים לפני הדפוס?'
      prompt_en: 'Why were books rare before printing?'
      choices:
      - {he: כל ספר הועתק ביד ולקח זמן רב, en: Each book was copied by hand and took a long time}
      - {he: אנשים לא אהבו לקרוא ספרים עבים, en: People did not like reading thick books}
      - {he: לא היה נייר מספיק לכתיבה, en: There was not enough paper for writing}
      answer: 0
      explanation_he: 'הקטע מסביר שהעתקת ספר ביד לקחה חודשים, ולכן ספרים היו נדירים ויקרים.'
      explanation_en: 'The text explains that copying a book by hand took months, so books were rare and expensive.'
    - id: heb.pass8.014
      kind: choice
      difficulty: 0.0
      prompt_he: 'מה היה החידוש של גוטנברג?'
      prompt_en: 'What was Gutenberg''s innovation?'
      choices:
      - {he: קלף עבה וחזק יותר לכתיבה, en: Thicker and stronger parchment for writing}
      - {he: אותיות מתכת לשימוש חוזר, en: Metal letters for repeated use}
      - {he: דיו בצבעים רבים ובהירים יותר, en: Ink in many brighter colors}
      answer: 1
      explanation_he: 'הוא יצק אותיות ממתכת וסידר אותן, ואפשר היה להשתמש בהן שוב לעמודים אחרים.'
      explanation_en: 'He cast metal letters and arranged them, and they could be used again for other pages.'
    - id: heb.pass8.015
      kind: choice
      difficulty: 0.5
      prompt_he: 'איזו תוצאה של הדפוס מוזכרת בקטע?'
      prompt_en: 'Which result of printing is mentioned in the text?'
      choices:
      - {he: הסופרים איבדו עבודה ונאלצו לעבור, en: Scribes lost their jobs and had to change work}
      - {he: הספרים נעשו קצרים ופשוטים יותר, en: Books became shorter and simpler}
      - {he: הספרים הוזלו והרעיונות התפשטו, en: Books became cheaper and ideas spread}
      answer: 2
      explanation_he: 'הקטע אומר: "הדפוס הוזיל את הספרים... ורעיונות חדשים התפשטו מהר".'
      explanation_en: 'The text says: "printing made books cheaper... and new ideas spread fast".'
    - id: heb.pass8.016
      kind: choice
      difficulty: 1.0
      prompt_he: 'מה פירוש "נדירים" בקטע?'
      prompt_en: 'What does "nadirim" mean in the text?'
      choices:
      - {he: מעטים וקשים להשגה, en: Few and hard to get}
      - {he: ישנים מאוד ומאובקים, en: Very old and dusty}
      - {he: כבדים מאוד ויקרים, en: Very heavy and expensive}
      answer: 0
      explanation_he: 'ספרים נדירים הם כאלה שאין הרבה מהם, ולכן קשה להשיג אותם.'
      explanation_en: 'Rare books are those of which there are not many, so they are hard to obtain.'
    - id: heb.pass8.017
      kind: choice
      difficulty: 1.0
      prompt_he: 'מהי כוונת המשפט האחרון בקטע?'
      prompt_en: 'What does the last sentence of the text intend?'
      choices:
      - {he: לומר שההמצאה לא הצליחה, en: To say the invention did not succeed}
      - {he: לספר על המצאות אחרות רבות, en: To tell about many other inventions}
      - {he: לומר שההמצאה חשובה מאוד, en: To say the invention is very important}
      answer: 2
      explanation_he: 'הכותב מדגיש שהדפוס שינה את העולם, וזה מראה את חשיבותו.'
      explanation_en: 'The writer stresses that printing changed the world, showing its importance.'
    - id: heb.pass8.018
      kind: order
      difficulty: 0.5
      prompt_he: סדרו את האירועים לפי סדר הופעתם בקטע.
      prompt_en: Put the events in the order they appear in the text.
      choices:
      - {he: רעיונות התפשטו מהר, en: Ideas spread fast}
      - {he: גוטנברג פיתח שיטת דפוס, en: Gutenberg developed printing}
      - {he: הספרים הוזלו, en: Books became cheaper}
      - {he: ספרים נכתבו ביד, en: Books were written by hand}
      answer: [3, 1, 2, 0]
      explanation_he: 'הקטע מתחיל במצב לפני הדפוס, עובר לחידוש של גוטנברג ומסיים בתוצאות.'
      explanation_en: 'The text begins with life before printing, moves to Gutenberg''s innovation and ends with the results.'
- id: pass8.04
  grade: 8
  skill: hebrew.reading.passage_8
  tags: [passage_8]
  title: ראיון עם נגר
  text_he: |-
    ש: מה הכי אוהבים בעבודה שלך?
    ת: את הרגע שבו חתיכת עץ רגילה הופכת לשולחן. יש שם משהו שאי אפשר להסביר, ואני תמיד מתרגש.
    ש: איך מתחילים?
    ת: קודם מודדים, ואז מודדים שוב. אצלנו אומרים: מודדים פעמיים וחותכים פעם אחת, כי אחרי החיתוך כבר אי אפשר להחזיר.
    ש: מה הקושי הגדול ביותר?
    ת: סבלנות. עץ הוא חומר חי, והוא מתנהג אחרת בכל פעם. צריך להקשיב לו, לא רק לעבוד עליו.
    ש: האם יש עבודה שאתה לא אוהב?
    ת: ליטוש. זה משעמם, אבל בלעדיו השולחן ייראה גס.
    ש: מה היית אומר למי שחולם להיות נגר?
    ת: שיתחיל בדברים קטנים, כמו קופסה או מדף. הטעויות הראשונות הן המורים הטובים ביותר.
  questions:
    - id: heb.pass8.019
      kind: choice
      difficulty: -1.0
      prompt_he: 'מה סוג הטקסט?'
      prompt_en: 'What kind of text is this?'
      choices:
      - {he: ראיון, en: An interview}
      - {he: מכתב, en: A letter}
      - {he: כתבה מדעית, en: A science report}
      answer: 0
      explanation_he: 'הטקסט בנוי משאלות ותשובות, עם האותיות ש ו-ת. זה ראיון.'
      explanation_en: 'The text is built of questions and answers, marked "q" and "a". It is an interview.'
    - id: heb.pass8.020
      kind: choice
      difficulty: -1.0
      prompt_he: 'מה הנגר אוהב ביותר בעבודתו?'
      prompt_en: 'What does the carpenter like most about his work?'
      choices:
      - {he: שהעבודה קלה ומהירה מאוד, en: That the work is very easy and fast}
      - {he: שחתיכת עץ הופכת לשולחן, en: That a plain piece of wood turns into a table}
      - {he: שהוא מרוויח הרבה כסף בעבודה, en: That he earns a lot of money at work}
      answer: 1
      explanation_he: 'הוא מדבר על הרגע שבו עץ רגיל הופך לשולחן, ואומר שהוא מתרגש.'
      explanation_en: He speaks of the moment plain wood becomes a table and says he is moved.
    - id: heb.pass8.021
      kind: choice
      difficulty: 1.0
      prompt_he: 'מה פירוש "מודדים פעמיים וחותכים פעם אחת"?'
      prompt_en: 'What does "measure twice and cut once" mean?'
      choices:
      - {he: צריך לחתוך מהר כדי לחסוך זמן, en: One must cut fast to save time}
      - {he: חשוב לקנות שני סרטי מדידה שונים, en: It is important to buy two different tape measures}
      - {he: כדאי לבדוק היטב לפני פעולה בלתי הפיכה, en: It is worth checking well before an irreversible action}
      answer: 2
      explanation_he: 'הנגר מסביר: אחרי החיתוך אי אפשר להחזיר, ולכן בודקים היטב לפני.'
      explanation_en: 'The carpenter explains: after cutting you cannot go back, so you check well first.'
    - id: heb.pass8.022
      kind: choice
      difficulty: 0.0
      prompt_he: 'מהו הקושי הגדול ביותר לפי הנגר?'
      prompt_en: 'What is the greatest difficulty, according to the carpenter?'
      choices:
      - {he: סבלנות, en: Patience}
      - {he: מחסור בכלים, en: A shortage of tools}
      - {he: כאבי גב, en: Back pain}
      answer: 0
      explanation_he: 'ענה שהקושי הוא סבלנות, כי עץ הוא חומר חי שמתנהג אחרת כל פעם.'
      explanation_en: 'He answered that the difficulty is patience, since wood is a living material that behaves differently each time.'
    - id: heb.pass8.023
      kind: choice
      difficulty: 1.5
      prompt_he: 'מה פירוש "הטעויות הראשונות הן המורים הטובים ביותר"?'
      prompt_en: 'What does "the first mistakes are the best teachers" mean?'
      choices:
      - {he: צריך להימנע מכל טעות, en: One must avoid every mistake}
      - {he: מורים לא צריכים להיות מדויקים, en: Teachers need not be accurate}
      - {he: מטעויות לומדים הכי הרבה, en: You learn the most from mistakes}
      answer: 2
      explanation_he: 'זו האנשה של הטעויות: הן "מורים". הכוונה שמי שמתחיל לומד מהן הרבה.'
      explanation_en: 'It is personification: mistakes are "teachers". It means a beginner learns much from them.'
- id: pass8.05
  grade: 8
  skill: hebrew.reading.passage_8
  tags: [passage_8]
  title: 'ספר או סרט?'
  text_he: >-
    כשמתבוננים בשני צידי המחלוקת, קשה להכריע אם עדיף לקרוא ספר או לצפות בסרט.
    אוהבי הסרטים אומרים שהסרט מראה לנו עולם שלם בשעתיים: דמויות, נופים ומוזיקה, וכל זאת בלי מאמץ. הם גם מציינים שסרט הוא חוויה משותפת, ואפשר לדבר עליו עם כל המשפחה.
    אוהבי הספרים עונים שבספר אנחנו הבמאים: כל אחד מדמיין את הדמות והנוף בדרכו. בנוסף, ספר מאפשר להאט, לחזור לפסקה ולחשוב. מחקרים רבים מצביעים על כך שקריאה מגדילה את אוצר המילים.
    וחוץ מזה, יש ספרים שקשה להיפרד מהם, וסרטים שמשאירים רושם גדול גם שבועות אחר כך.
    לדעתי אין צורך לבחור. סרט טוב יכול לעורר סקרנות לקרוא את הספר שעליו הוא מבוסס, וספר אהוב מעניין לראות כסרט, ולהשוות. כל אחד מהם נותן משהו אחר.
  questions:
    - id: heb.pass8.024
      kind: choice
      difficulty: -1.0
      prompt_he: 'מה הנושא של הטקסט?'
      prompt_en: 'What is the subject of the text?'
      choices:
      - {he: איך מצלמים סרטים בבתי קולנוע, en: How films are shot in cinemas}
      - {he: השוואה בין קריאת ספר לצפייה בסרט, en: A comparison of reading a book and watching a film}
      - {he: איך כותבים ספר וממי מקבלים רעיון, en: How to write a book and where to get an idea}
      answer: 1
      explanation_he: 'הטקסט מציג יתרונות של ספרים ושל סרטים, ולכן הוא משווה ביניהם.'
      explanation_en: 'The text presents advantages of books and of films, so it compares them.'
    - id: heb.pass8.025
      kind: choice
      difficulty: 0.0
      prompt_he: 'מה הטענה של אוהבי הסרטים?'
      prompt_en: 'What do film lovers claim?'
      choices:
      - {he: סרט מראה עולם שלם בקלות, en: A film shows a whole world easily}
      - {he: סרט קצר יותר מפרסומת בטלוויזיה, en: A film is shorter than a TV commercial}
      - {he: סרט מלמד מילים חדשות בקלות רבה, en: A film teaches new words very easily}
      answer: 0
      explanation_he: 'הם אומרים שבשעתיים רואים עולם שלם בלי מאמץ, וצופים יחד עם המשפחה.'
      explanation_en: 'They say that in two hours you see a whole world with no effort, and watch together with the family.'
    - id: heb.pass8.026
      kind: choice
      difficulty: 0.5
      prompt_he: 'מה הטענה של אוהבי הספרים?'
      prompt_en: 'What do book lovers claim?'
      choices:
      - {he: הספר זול מכל סרט שיש בקולנוע, en: A book is cheaper than any film in the cinema}
      - {he: ספר אפשר לקרוא רק בלילה לפני השינה, en: A book can only be read at night before sleep}
      - {he: הקורא מדמיין בעצמו ויכול להאט, en: The reader imagines himself and can slow down}
      answer: 2
      explanation_he: 'בספר "אנחנו הבמאים", וגם אפשר להאט, לחזור ולחשוב.'
      explanation_en: 'In a book "we are the directors", and we can slow down, go back and think.'
    - id: heb.pass8.027
      kind: choice
      difficulty: 1.0
      prompt_he: 'מהי דעת הכותבת?'
      prompt_en: 'What is the writer''s opinion?'
      choices:
      - {he: ספרים טובים מסרטים תמיד ובכל מצב, en: Books are better than films always and in every case}
      - {he: 'אין צורך לבחור, לכל אחד יתרון משלו', en: 'No need to choose, each has its own advantage'}
      - {he: סרטים עדיפים תמיד על ספרים ארוכים, en: Films are always preferable to long books}
      answer: 1
      explanation_he: 'המילים "לדעתי אין צורך לבחור" מראות את עמדתה.'
      explanation_en: 'The words "in my opinion there is no need to choose" show her stand.'
    - id: heb.pass8.028
      kind: choice
      difficulty: 1.0
      prompt_he: 'באיזה אופן הכותבת מציגה את שני הצדדים?'
      prompt_en: 'How does the writer present both sides?'
      choices:
      - {he: 'רק מצד אחד, בלי להזכיר את האחר', en: 'From one side only, without mentioning the other'}
      - {he: 'בצורה מצחיקה, בלי נימוקים ובלי דעה', en: 'In a funny way, without reasons and without an opinion'}
      - {he: 'בהגינות, ולפני שהיא מביעה דעה משלה', en: 'Fairly, before she expresses her own opinion'}
      answer: 2
      explanation_he: היא פותחת בטענות של שני הצדדים ורק אחר כך מביעה את דעתה. זה מבנה של טיעון הוגן.
      explanation_en: 'She opens with both sides'' claims and only then gives her opinion. This is a fair argument.'
    - id: heb.pass8.029
      kind: true_false
      difficulty: 0.0
      prompt_he: הכותבת טוענת שכדאי לוותר לגמרי על ספרים.
      prompt_en: The writer argues that we should give up books entirely.
      answer: false
      explanation_he: 'הכותבת אומרת שכל אחד נותן משהו אחר, וכי סרט יכול להניע לקרוא ספר.'
      explanation_en: The writer says each gives something different and a film can inspire reading a book.

# Nagmon learning content - hebrew / vocab (grades 3-5): synonyms, homonyms, proverbs and idioms, figurative language, register
# Format: docs/kids/SDD_CONTENT.md section 3. Original text written for this game (no textbook passages); reviewed by a parent.
# Hebrew without niqqud. Answer indexes are 0-based; for kind=order, answer lists choice indexes in the correct order.
# Aligned with the Israeli language curriculum (MoE "הוראת הלשון", grades 3-9): grammar, vocabulary, spelling, text.

skill: hebrew.vocab.synonyms
items:
- id: heb.syn.001
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'איזו מילה דומה במשמעות ל"שמח"?'
  prompt_en: 'Which word is close in meaning to "same''ach" (happy)?'
  choices:
  - {he: עצוב, en: sad}
  - {he: עייף, en: tired}
  - {he: עליז, en: cheerful}
  answer: 2
  explanation_he: 'שמח ועליז אומרים כמעט אותו דבר: מישהו שנהנה ומרגיש טוב. עצוב הוא ההפך, ועייף הוא משהו אחר.'
  explanation_en: 'Happy and cheerful mean almost the same: someone who feels good. Sad is the opposite.'
  tags: [synonyms]
- id: heb.syn.002
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'איזו מילה דומה במשמעות ל"מהיר"?'
  prompt_en: 'Which word is close in meaning to "mahir" (fast)?'
  choices:
  - {he: זריז, en: quick}
  - {he: איטי, en: slow}
  - {he: כבד, en: heavy}
  answer: 0
  explanation_he: 'מהיר וזריז הם מילים נרדפות: שניהם אומרים שמשהו קורה בלי לבזבז זמן. איטי הוא ההפך.'
  explanation_en: 'Fast and quick are synonyms: both mean no time is wasted. Slow is the opposite.'
  tags: [synonyms]
- id: heb.syn.003
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה דומה במשמעות ל"קטן מאוד"?'
  prompt_en: 'Which word is close in meaning to "very small"?'
  choices:
  - {he: עצום, en: huge}
  - {he: זעיר, en: tiny}
  - {he: צר, en: narrow}
  answer: 1
  explanation_he: 'זעיר פירושו קטן מאוד. עצום הוא ההפך: גדול מאוד.'
  explanation_en: '"Za''ir" means very small. "Atsum" is the opposite: very big.'
  tags: [synonyms]
- id: heb.syn.004
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'איזו מילה דומה במשמעות ל"יפה"?'
  prompt_en: 'Which word is close in meaning to "yafe" (beautiful)?'
  choices:
  - {he: מוזר, en: strange}
  - {he: מקסים, en: lovely}
  - {he: חזק, en: strong}
  answer: 1
  explanation_he: יפה ומקסים אומרים שמשהו נעים לעין או ללב. מוזר וחזק אומרים דברים אחרים.
  explanation_en: Beautiful and lovely both say something is pleasant to see. Strange and strong mean other things.
  tags: [synonyms]
- id: heb.syn.005
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: 'איזו מילה דומה במשמעות ל"לדבר"?'
  prompt_en: 'Which word is close in meaning to "ledaber" (to talk)?'
  choices:
  - {he: לשוחח, en: to chat}
  - {he: לשתוק, en: to be silent}
  - {he: לשבת, en: to sit}
  answer: 0
  explanation_he: לדבר ולשוחח אומרים כמעט אותו דבר. לשתוק הוא ההפך.
  explanation_en: To talk and to chat mean almost the same. To be silent is the opposite.
  tags: [synonyms]
- id: heb.syn.006
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה דומה במשמעות ל"לסיים"?'
  prompt_en: 'Which word is close in meaning to "lesayem" (to finish)?'
  choices:
  - {he: להתחיל, en: to start}
  - {he: להמשיך, en: to continue}
  - {he: לגמור, en: to end}
  answer: 2
  explanation_he: 'לסיים ולגמור הן מילים נרדפות. להתחיל הוא ההפך, ולהמשיך הוא עוד משהו אחר.'
  explanation_en: To finish and to end are synonyms. To start is the opposite.
  tags: [synonyms]
- id: heb.syn.007
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה דומה במשמעות ל"לקנות"?'
  prompt_en: 'Which word is close in meaning to "liknot" (to buy)?'
  choices:
  - {he: למכור, en: to sell}
  - {he: לרכוש, en: to purchase}
  - {he: להשאיר, en: to leave}
  answer: 1
  explanation_he: 'לקנות ולרכוש הן מילים נרדפות: נותנים כסף ומקבלים משהו. למכור הוא ההפך.'
  explanation_en: 'To buy and to purchase are synonyms: you give money and get something. To sell is the opposite.'
  tags: [synonyms]
- id: heb.syn.008
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.5
  prompt_he: 'איזו מילה דומה במשמעות ל"לברוח"?'
  prompt_en: 'Which word is close in meaning to "liv''roach" (to run away)?'
  choices:
  - {he: להימלט, en: to escape}
  - {he: להישאר, en: to stay}
  - {he: להתקרב, en: to come closer}
  answer: 0
  explanation_he: לברוח ולהימלט פירושם ללכת מהר ממקום מסוכן. להישאר הוא ההפך.
  explanation_en: To run away and to escape both mean to leave a dangerous place quickly. To stay is the opposite.
  tags: [synonyms]
- id: heb.syn.009
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.5
  prompt_he: 'איזו מילה דומה במשמעות ל"פחד"?'
  prompt_en: 'Which word is close in meaning to "pachad" (fear)?'
  choices:
  - {he: צחוק, en: laughter}
  - {he: כבוד, en: respect}
  - {he: חשש, en: worry}
  answer: 2
  explanation_he: 'פחד וחשש הן תחושות דומות: מרגישים שמשהו רע עלול לקרות. החשש קטן מהפחד.'
  explanation_en: 'Fear and worry are similar feelings: you feel something bad might happen. Worry is smaller than fear.'
  tags: [synonyms]
- id: heb.syn.010
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.5
  prompt_he: 'איזו מילה דומה במשמעות ל"חכם"?'
  prompt_en: 'Which word is close in meaning to "chacham" (clever)?'
  choices:
  - {he: נבון, en: wise}
  - {he: עצלן, en: lazy}
  - {he: סקרן, en: curious}
  answer: 0
  explanation_he: חכם ונבון אומרים שהאדם מבין היטב וחושב טוב. עצלן וסקרן מתארים תכונות אחרות.
  explanation_en: Clever and wise say a person understands well and thinks well. Lazy and curious are other traits.
  tags: [synonyms]
- id: heb.syn.011
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: 'איזו מילה דומה במשמעות ל"רכב"?'
  prompt_en: 'Which word is close in meaning to "rechev" (vehicle)?'
  choices:
  - {he: שביל, en: path}
  - {he: מכונית, en: car}
  - {he: רמזור, en: traffic light}
  answer: 1
  explanation_he: 'מכונית היא סוג של רכב, ובשפה היומיומית אומרים כמעט אותו דבר. שביל ורמזור הם דברים אחרים.'
  explanation_en: 'A car is a kind of vehicle, and in everyday speech they are almost the same. A path and a traffic light are something else.'
  tags: [synonyms]
- id: heb.syn.012
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: 'אפשר להחליף את המילה "הרגיש" במשפט "הילד הרגיש עצוב" במילה:'
  prompt_en: 'Which word can replace "hargish" (felt) in "The boy felt sad"?'
  choices:
  - {he: שר, en: sang}
  - {he: רץ, en: ran}
  - {he: חש, en: felt}
  answer: 2
  explanation_he: 'חש והרגיש הן מילים נרדפות: שתיהן מספרות מה קורה בתוך הלב. שר ורץ הם מעשים.'
  explanation_en: Both words tell what happens inside the heart. Singing and running are actions.
  tags: [synonyms]
- id: heb.syn.013
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה אינה נרדפת לשאר?'
  prompt_en: 'Which word is not a synonym of the others?'
  choices:
  - {he: מהיר, en: fast}
  - {he: איטי, en: slow}
  - {he: זריז, en: quick}
  answer: 1
  explanation_he: 'מהיר וזריז אומרים שמשהו קורה מהר. איטי הוא ההפך משניהם, ולכן הוא לא שייך.'
  explanation_en: 'Fast and quick both mean speedy. Slow is the opposite of both, so it does not belong.'
  tags: [synonyms]
- id: heb.syn.014
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזו מילה אינה נרדפת לשאר?'
  prompt_en: 'Which word is not a synonym of the others?'
  choices:
  - {he: עצוב, en: sad}
  - {he: שמח, en: happy}
  - {he: עליז, en: cheerful}
  answer: 0
  explanation_he: 'שמח ועליז הן רגשות טובים דומים. עצוב הוא רגש הפוך, ולכן הוא לא שייך.'
  explanation_en: 'Happy and cheerful are similar good feelings. Sad is the opposite feeling, so it does not belong.'
  tags: [synonyms]
- id: heb.syn.015
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.5
  prompt_he: 'איזו מילה אינה נרדפת לשאר?'
  prompt_en: 'Which word is not a synonym of the others?'
  choices:
  - {he: קטן, en: small}
  - {he: זעיר, en: tiny}
  - {he: ענק, en: giant}
  answer: 2
  explanation_he: 'קטן וזעיר אומרים שמשהו לא גדול. ענק הוא גדול מאוד, ולכן הוא לא שייך.'
  explanation_en: 'Small and tiny both say something is not big. Giant means very big, so it does not belong.'
  tags: [synonyms]
- id: heb.syn.016
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'איזה זוג הוא מילים נרדפות?'
  prompt_en: 'Which pair are synonyms?'
  choices:
  - {he: לסיים - לגמור, en: to finish - to end}
  - {he: לבנות - להרוס, en: to build - to destroy}
  - {he: לפתוח - לסגור, en: to open - to close}
  answer: 0
  explanation_he: לסיים ולגמור אומרים אותו דבר. בשני הזוגות האחרים המילים הפוכות במשמעותן.
  explanation_en: To finish and to end mean the same. In the other pairs the words are opposites.
  tags: [synonyms]
- id: heb.syn.017
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.5
  prompt_he: 'איזה זוג הוא מילים נרדפות?'
  prompt_en: 'Which pair are synonyms?'
  choices:
  - {he: מהר - לאט, en: fast - slowly}
  - {he: חם - קר, en: hot - cold}
  - {he: מהר - בזריזות, en: fast - quickly}
  answer: 2
  explanation_he: מהר ובזריזות אומרים אותו דבר. בשני הזוגות האחרים המילים הפוכות.
  explanation_en: '"Fast" and "quickly" say the same. In the other pairs the words are opposites.'
  tags: [synonyms]
- id: heb.syn.018
  skill: hebrew.vocab.synonyms
  kind: true_false
  grade: 3
  difficulty: -1.0
  prompt_he: 'המילים "לגמור" ו"לסיים" דומות במשמעות.'
  prompt_en: 'The words "ligmor" and "lesayem" are close in meaning.'
  answer: true
  explanation_he: 'שתיהן אומרות שמשהו הגיע לסופו: אפשר לומר "גמרתי לאכול" או "סיימתי לאכול".'
  explanation_en: 'Both say that something has come to its end: "I finished eating" either way.'
  tags: [synonyms]
- id: heb.syn.019
  skill: hebrew.vocab.synonyms
  kind: true_false
  grade: 3
  difficulty: -1.0
  prompt_he: 'המילים "חם" ו"קר" דומות במשמעות.'
  prompt_en: 'The words "cham" and "kar" (hot and cold) are close in meaning.'
  answer: false
  explanation_he: 'חם וקר הפוכים זה מזה. מילים נרדפות הן מילים שאומרות כמעט אותו דבר, כמו "חם" ו"לוהט".'
  explanation_en: 'Hot and cold are opposites. Synonyms say almost the same thing, like "hot" and "burning".'
  tags: [synonyms]
- id: heb.syn.020
  skill: hebrew.vocab.synonyms
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: 'המילים "קטן" ו"זעיר" דומות במשמעות.'
  prompt_en: 'The words "katan" and "za''ir" are close in meaning.'
  answer: true
  explanation_he: 'זעיר הוא קטן מאוד, ולכן המילים קרובות. מילים נרדפות לא תמיד זהות לגמרי, אבל קרובות.'
  explanation_en: 'Za''ir means very small, so the words are close. Synonyms are not always identical, only close.'
  tags: [synonyms]
- id: heb.syn.021
  skill: hebrew.vocab.synonyms
  kind: true_false
  grade: 3
  difficulty: 0.5
  prompt_he: 'המילים "לרוץ" ו"ללכת" נרדפות לגמרי.'
  prompt_en: 'The words "larutz" and "lalechet" (to run, to walk) are fully synonymous.'
  answer: false
  explanation_he: 'רצים מהר יותר מהולכים. שתי המילים קשורות, אבל הן לא אומרות אותו דבר.'
  explanation_en: 'Running is faster than walking. The words are related, but they do not say the same thing.'
  tags: [synonyms]
- id: heb.syn.022
  skill: hebrew.vocab.synonyms
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: 'המילים "ילדה" ו"בת" לפעמים אומרות אותו דבר.'
  prompt_en: 'The words "yalda" and "bat" sometimes mean the same.'
  answer: true
  explanation_he: 'אפשר לומר "ילדה קטנה" או "בת קטנה". בהקשרים אחרים "בת" היא הבת של ההורים, ולכן הן לא תמיד זהות.'
  explanation_en: 'You can say "little girl" in both ways. In other contexts "bat" means a parent''s daughter.'
  tags: [synonyms]
- id: heb.syn.023
  skill: hebrew.vocab.synonyms
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: 'מה פירוש המילה "זעיר"?'
  prompt_en: 'What does "za''ir" mean?'
  choices:
  - {he: מהיר מאוד, en: very fast}
  - {he: קטן מאוד, en: very small}
  - {he: חזק מאוד, en: very strong}
  answer: 1
  explanation_he: 'זעיר פירושו קטן מאוד, למשל "נמלה זעירה".'
  explanation_en: '"Za''ir" means very small, for example "a tiny ant".'
  tags: [synonyms]
- id: heb.homo.001
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: 'מה פירוש "גל" במשפט "בנינו גל אבנים בשדה"?'
  prompt_en: 'What does "gal" mean in "We built a pile of stones in the field"?'
  choices:
  - {he: תנועה של מים, en: a wave}
  - {he: ערימה, en: a heap}
  - {he: צבע בהיר, en: a pale color}
  answer: 1
  explanation_he: 'ל"גל" יש כמה משמעויות. כאן הכוונה לערימה של אבנים, ולא לגל בים.'
  explanation_en: '"Gal" has several meanings. Here it means a heap of stones, not a sea wave.'
  tags: [homonyms]
- id: heb.homo.002
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: -1.0
  prompt_he: 'מה פירוש "גל" במשפט "גל גדול הגיע אל החוף"?'
  prompt_en: 'What does "gal" mean in "A big wave reached the shore"?'
  choices:
  - {he: תנועה של מים, en: a wave}
  - {he: ערימה של אבנים, en: a heap of stones}
  - {he: סוג של דג, en: a kind of fish}
  answer: 0
  explanation_he: 'מדברים על חוף ועל מים, ולכן גל הוא תנועה של מי הים.'
  explanation_en: 'The text is about a shore and water, so "gal" is a wave of the sea.'
  tags: [homonyms]
- id: heb.homo.003
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: -1.0
  prompt_he: 'מה פירוש "כף" במשפט "אכלתי מרק בעזרת כף"?'
  prompt_en: 'What does "kaf" mean in "I ate soup with a kaf"?'
  choices:
  - {he: חלק של היד, en: the palm}
  - {he: כלי לכתיבה, en: a pen}
  - {he: כלי אוכל, en: a spoon}
  answer: 2
  explanation_he: 'מרק אוכלים בכף. ל"כף" יש גם משמעות אחרת: כף היד.'
  explanation_en: 'We eat soup with a spoon. "Kaf" also has another meaning: the palm of the hand.'
  tags: [homonyms]
- id: heb.homo.004
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: 'מה פירוש "כף" במשפט "הוא הניח את כף היד על השולחן"?'
  prompt_en: 'What does "kaf" mean in "He put his kaf on the table"?'
  choices:
  - {he: החלק הפתוח של היד, en: the palm}
  - {he: כלי אוכל, en: a spoon}
  - {he: סוג של כובע, en: a kind of hat}
  answer: 0
  explanation_he: 'כשאומרים "כף יד" מתכוונים לחלק הפתוח של היד. זה לא כלי אוכל.'
  explanation_en: 'When we say "kaf yad" we mean the open part of the hand, not a spoon.'
  tags: [homonyms]
- id: heb.homo.005
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: 'מה פירוש "קרן" במשפט "קרן שמש חדרה מהחלון"?'
  prompt_en: 'What does "keren" mean in "A keren of sun came through the window"?'
  choices:
  - {he: חלק בראש של חיה, en: a horn}
  - {he: פס של אור, en: a ray}
  - {he: סכום כסף שחוסכים, en: a fund}
  answer: 1
  explanation_he: 'קרן שמש היא פס של אור. ל"קרן" יש גם משמעויות אחרות, כמו קרן של פרה או קרן כספים.'
  explanation_en: '"Keren" can be a ray, a horn or a fund. A sun-ray is a beam of light.'
  tags: [homonyms]
- id: heb.homo.006
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.5
  prompt_he: 'מה פירוש "קרן" במשפט "לקרנף יש קרן על האף"?'
  prompt_en: 'What does "keren" mean in "A rhino has a keren on its nose"?'
  choices:
  - {he: פס של אור, en: a ray}
  - {he: קרן כספים, en: a fund}
  - {he: חלק קשה בראש של חיה, en: a horn}
  answer: 2
  explanation_he: קרן של חיה היא חלק קשה וחד שגדל בראש או על האף.
  explanation_en: 'An animal''s horn is a hard pointed part that grows on the head or nose.'
  tags: [homonyms]
- id: heb.homo.007
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: 'מה פירוש "חשבון" במשפט "אבא שילם את החשבון במסעדה"?'
  prompt_en: 'What does "cheshbon" mean in "Dad paid the cheshbon at the restaurant"?'
  choices:
  - {he: מקצוע בלימודים, en: the subject math}
  - {he: מספר טלפון, en: a phone number}
  - {he: כמה צריך לשלם, en: the bill}
  answer: 2
  explanation_he: 'במסעדה מקבלים חשבון: כמה צריך לשלם. "חשבון" הוא גם מקצוע בבית הספר.'
  explanation_en: 'At a restaurant you get a bill. "Cheshbon" is also a school subject.'
  tags: [homonyms]
- id: heb.homo.008
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.5
  prompt_he: 'מה פירוש "ראש" במשפט "ראש העיר פתח את החגיגה"?'
  prompt_en: 'What does "rosh" mean in "The rosh of the city opened the celebration"?'
  choices:
  - {he: חלק בגוף, en: a head}
  - {he: האדם הראשי, en: the head (leader)}
  - {he: פסגה של הר, en: a summit}
  answer: 1
  explanation_he: 'ראש העיר הוא האדם הראשי בעיר. ל"ראש" יש כמה משמעויות, ואחת מהן היא מנהיג.'
  explanation_en: 'The "rosh" of a city is its leader. "Rosh" has several meanings, one of them is leader.'
  tags: [homonyms]
- id: heb.homo.009
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "ספר" במשפט "הספר גזר את השיער של דני"?'
  prompt_en: 'What does "sapar" mean in "The sapar cut Danny''s hair"?'
  choices:
  - {he: מי שגוזר שיער, en: a barber}
  - {he: מה שקוראים בו, en: a book}
  - {he: עשה חישוב, en: counted}
  answer: 0
  explanation_he: 'מי שגוזר שיער נקרא ספר. אותה מילה, ספר, יכולה להיות גם חפץ לקריאה.'
  explanation_en: The one who cuts hair is a barber. The same letters can mean a book to read.
  tags: [homonyms]
- id: heb.homo.010
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "מסך" במשפט "המסך באולם התיאטרון נפתח"?'
  prompt_en: 'What does "masach" mean in "The masach in the theater hall opened"?'
  choices:
  - {he: צג של מחשב, en: a screen}
  - {he: וילון גדול, en: a curtain}
  - {he: שולחן גדול, en: a big table}
  answer: 1
  explanation_he: 'בתיאטרון, מסך הוא וילון גדול שנפתח בתחילת ההצגה. במחשב מסך הוא מה שרואים עליו.'
  explanation_en: 'In a theater, a masach is the big curtain. On a computer a masach is what you see on.'
  tags: [homonyms]
- id: heb.homo.011
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "מפתח" במשפט "בעזרת המפתח במפה אפשר להבין כל סימן"?'
  prompt_en: 'What does "mafteach" mean in "With the mafteach on the map you can understand each sign"?'
  choices:
  - {he: כלי לפתיחת דלת, en: a door key}
  - {he: מנהל, en: a manager}
  - {he: הסבר לסימנים, en: a legend}
  answer: 2
  explanation_he: 'במפה יש מפתח שמסביר מה כל צורה וצבע אומרים. ל"מפתח" יש גם משמעות של כלי לדלת.'
  explanation_en: 'A map has a legend explaining each shape and color. "Mafteach" can also be a door key.'
  tags: [homonyms]
- id: heb.homo.012
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.5
  prompt_he: 'מה פירוש "לב" במשפט "הם גרים בלב העיר"?'
  prompt_en: 'What does "lev" mean in "They live in the lev of the city"?'
  choices:
  - {he: המרכז, en: the center}
  - {he: חלק בגוף, en: the heart}
  - {he: מקום ליד הים, en: a place near the sea}
  answer: 0
  explanation_he: 'לב העיר הוא מרכז העיר. ל"לב" יש גם משמעות של איבר בגוף.'
  explanation_en: 'The lev of a city is its center. "Lev" is also an organ of the body.'
  tags: [homonyms]
- id: heb.homo.013
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "פנים" במשפט "היה חם מאוד בפנים הבית"?'
  prompt_en: 'What does "panim" mean in "It was very hot in the panim of the house"?'
  choices:
  - {he: בתוך, en: inside}
  - {he: על הפנים, en: on the face}
  - {he: לפני, en: before}
  answer: 0
  explanation_he: 'בפנים הבית פירושו בתוך הבית. "פנים" יכולה להיות גם חלק בראש של אדם.'
  explanation_en: '"Bifnim habayit" means inside the house. "Panim" can also be someone''s face.'
  tags: [homonyms]
- id: heb.homo.014
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "צד" במשפט "הדייג צד דגים בים"?'
  prompt_en: 'What does "tsad" mean in "The fisherman tsad fish in the sea"?'
  choices:
  - {he: עמד בצד, en: stood aside}
  - {he: תפס, en: caught}
  - {he: הכין לאכילה, en: prepared for eating}
  answer: 1
  explanation_he: 'צד פירושו תופס חיות כמו דגים. יש גם "צד" שהוא כיוון, למשל צד ימין.'
  explanation_en: '"Tsad" means to catch animals like fish. There is also "tsad" as a side, like the right side.'
  tags: [homonyms]
- id: heb.homo.015
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.5
  prompt_he: 'מה פירוש "עברה" במשפט "היא עברה את הכביש"?'
  prompt_en: 'What does "avra" mean in "She avra the road"?'
  choices:
  - {he: זמן שהיה, en: the past}
  - {he: שכחה, en: forgot}
  - {he: חצתה, en: crossed}
  answer: 2
  explanation_he: 'עברה את הכביש היא חצתה אותו. המילה "עבר" יכולה להיות גם זמן שכבר היה.'
  explanation_en: '"Avra et hakvish" means she crossed it. "Avar" can also mean the past.'
  tags: [homonyms]
- id: heb.homo.016
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.5
  prompt_he: 'מה פירוש "עין" במשפט "ליד העין בנחל מצאנו צבים"?'
  prompt_en: 'What does "ayin" mean in "Near the ayin in the stream we found turtles"?'
  choices:
  - {he: איבר ראייה, en: an eye}
  - {he: מעיין מים, en: a spring}
  - {he: חור בכיסא, en: a hole}
  answer: 1
  explanation_he: 'עין יכולה להיות מעיין של מים, כמו בשמות של מקומות. כאן מדובר במעיין ליד נחל.'
  explanation_en: '"Ayin" can be a spring of water, as in place names. Here it is a spring near a stream.'
  tags: [homonyms]
- id: heb.homo.017
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: 'איזו מילה היא רב-משמעית (יש לה כמה משמעויות)?'
  prompt_en: 'Which word has several meanings?'
  choices:
  - {he: גל, en: gal}
  - {he: ארנב, en: rabbit}
  - {he: מחברת, en: notebook}
  answer: 0
  explanation_he: 'גל הוא ערימה, וגם תנועה של מים. ארנב ומחברת מתייחסים לדבר אחד בלבד.'
  explanation_en: '"Gal" is a heap and also a wave of water. "Rabbit" and "notebook" mean one thing.'
  tags: [homonyms]
- id: heb.homo.018
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'באיזה משפט "כוכב" אינו כוכב בשמיים?'
  prompt_en: 'In which sentence is "kochav" not a star in the sky?'
  choices:
  - {he: כוכב נפל בלילה, en: A star fell at night}
  - {he: הכוכב זורח בשמיים, en: The star shines in the sky}
  - {he: הכוכב של הסרט הגיע לבכורה, en: The star of the film came to the premiere}
  answer: 2
  explanation_he: במשפט הראשון כוכב הוא שחקן מפורסם. בשני האחרים הוא גוף בשמיים.
  explanation_en: 'In the first, "kochav" is a famous actor. In the others it is a body in the sky.'
  tags: [homonyms]
- id: heb.homo.019
  skill: hebrew.vocab.homonyms
  kind: true_false
  grade: 4
  difficulty: -1.0
  prompt_he: 'למילה "עין" יש יותר ממשמעות אחת.'
  prompt_en: 'The word "ayin" has more than one meaning.'
  answer: true
  explanation_he: 'עין היא איבר ראייה, וגם מעיין מים. מילים כאלה הן מילים רב-משמעיות.'
  explanation_en: '"Ayin" is an organ of sight and also a spring. Such words have several meanings.'
  tags: [homonyms]
- id: heb.homo.020
  skill: hebrew.vocab.homonyms
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: אפשר לדעת איזו משמעות יש למילה רב-משמעית לפי שאר המשפט.
  prompt_en: You can tell which meaning a many-meaning word has from the rest of the sentence.
  answer: true
  explanation_he: 'המילים שסביב המילה עוזרות להבין למה היא מתכוונת, למשל "גל בים" לעומת "גל אבנים".'
  explanation_en: 'The words around it help us understand it, e.g. "wave in the sea" versus "pile of stones".'
  tags: [homonyms]
- id: heb.homo.021
  skill: hebrew.vocab.homonyms
  kind: true_false
  grade: 4
  difficulty: -1.0
  prompt_he: לכל מילה בעברית יש בדיוק משמעות אחת.
  prompt_en: Every Hebrew word has exactly one meaning.
  answer: false
  explanation_he: 'לחלק מהמילים יש כמה משמעויות, כמו "כף", "קרן" ו"גל".'
  explanation_en: 'Some words have several meanings, like "kaf", "keren" and "gal".'
  tags: [homonyms]
- id: heb.homo.022
  skill: hebrew.vocab.homonyms
  kind: true_false
  grade: 4
  difficulty: 0.5
  prompt_he: 'במשפט "הכף נפלה מהשולחן" הכוונה לחלק של היד.'
  prompt_en: 'In "The kaf fell off the table" the meaning is the part of the hand.'
  answer: false
  explanation_he: 'מה נופל מהשולחן? כלי אוכל. כף היד לא נופלת מהשולחן.'
  explanation_en: 'What falls off a table? A spoon. A hand does not fall off a table.'
  tags: [homonyms]
- id: heb.proverb.001
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'מה פירוש הניב "קבר את הראש בחול"?'
  prompt_en: 'What does the idiom "buried his head in the sand" mean?'
  choices:
  - {he: התעלם מבעיה במקום להתמודד, en: Ignored a problem instead of facing it}
  - {he: חיפש משהו שאבד בחול על החוף, en: Looked for something lost in the sand}
  - {he: שיחק עם חברים בחוף הים, en: Played with friends at the beach}
  answer: 0
  explanation_he: 'מי שקובר את הראש בחול לא רואה את הבעיה, אבל היא לא נעלמת. כך מתנהג מי שמתעלם ממנה.'
  explanation_en: 'Someone who buries his head does not see the problem, but it does not disappear.'
  tags: [proverbs]
- id: heb.proverb.002
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: -1.0
  prompt_he: 'מה פירוש הניב "שבר את הראש"?'
  prompt_en: 'What does the idiom "broke his head" mean?'
  choices:
  - {he: נפל והתחבט חזק ברצפה בבית, en: Fell and hit the floor hard}
  - {he: כעס מאוד על חבר קרוב, en: Got very angry at a close friend}
  - {he: חשב הרבה כדי לפתור בעיה, en: Thought hard to solve a problem}
  answer: 2
  explanation_he: 'שוברים את הראש כשחושבים חזק על בעיה, למשל על חידה קשה.'
  explanation_en: 'We "break our head" when thinking hard about a problem, such as a hard riddle.'
  tags: [proverbs]
- id: heb.proverb.003
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: 0.5
  prompt_he: 'מה פירוש הניב "ירד לו האסימון"?'
  prompt_en: 'What does the idiom "the token dropped for him" mean?'
  choices:
  - {he: הוא איבד מטבע בדרך לבית, en: He lost a coin on the way home}
  - {he: הוא סוף סוף הבין, en: He finally understood}
  - {he: הוא קנה משהו בחנות, en: He bought something in a shop}
  answer: 1
  explanation_he: 'פעם צריך היה להכניס אסימון לטלפון ציבורי, והוא היה נופל לפני שהשיחה מתחילה. כך אומרים כשמישהו מבין.'
  explanation_en: In old public phones a token had to drop before the call began. We say it when someone finally understands.
  tags: [proverbs]
- id: heb.proverb.004
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: -1.0
  prompt_he: 'מה פירוש הניב "לב של זהב"?'
  prompt_en: 'What does the idiom "a heart of gold" mean?'
  choices:
  - {he: אדם טוב שאכפת לו מאחרים, en: A good person who cares about others}
  - {he: אדם עשיר שיש לו הרבה כסף, en: A rich person with a lot of money}
  - {he: אדם שאוהב לענוד תכשיטים, en: A person who loves wearing jewelry}
  answer: 0
  explanation_he: 'מי שיש לו לב של זהב הוא אדם טוב שדואג לאחרים, ולא בהכרח עשיר.'
  explanation_en: 'Someone with a heart of gold is good and cares for others, not necessarily rich.'
  tags: [proverbs]
- id: heb.proverb.005
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'מה פירוש הניב "ידיים של זהב"?'
  prompt_en: 'What does the idiom "hands of gold" mean?'
  choices:
  - {he: אדם שעונד טבעות יקרות, en: A person who wears expensive rings}
  - {he: אדם מוכשר בעבודת ידיים, en: A person skilled at handwork}
  - {he: אדם שתמיד מנקה את ידיו, en: A person who always cleans his hands}
  answer: 1
  explanation_he: 'אומרים כך על מי שמצליח ליצור ולתקן בכישרון, למשל נגר או תופרת.'
  explanation_en: 'We say it about someone who builds or fixes with skill, like a carpenter or a seamstress.'
  tags: [proverbs]
- id: heb.proverb.006
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'מה פירוש הניב "שבר את הקרח"?'
  prompt_en: 'What does the idiom "broke the ice" mean?'
  choices:
  - {he: שבר חלון בטעות במסיבה, en: Broke a window by accident at a party}
  - {he: הכין קרח לשתייה קרה, en: Made ice for a cold drink}
  - {he: פתח שיחה והפיג מבוכה, en: Opened a conversation and eased awkwardness}
  answer: 2
  explanation_he: 'כשאנשים לא מכירים, יש "קרח". מי שמדבר ראשון שובר אותו, וכולם נינוחים יותר.'
  explanation_en: 'When people do not know each other there is "ice". Whoever speaks first breaks it.'
  tags: [proverbs]
- id: heb.proverb.007
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'מה פירוש הביטוי "על קצות האצבעות"?'
  prompt_en: 'What does the expression "on tiptoes" mean?'
  choices:
  - {he: במהירות רבה מאוד, en: Very fast}
  - {he: בקול רם ובשמחה, en: Loudly and happily}
  - {he: בזהירות ובשקט, en: Carefully and quietly}
  answer: 2
  explanation_he: 'הולכים על קצות האצבעות כדי לא להרעיש, למשל כשתינוק ישן.'
  explanation_en: 'We walk on tiptoes so as not to make noise, for example when a baby sleeps.'
  tags: [proverbs]
- id: heb.proverb.008
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: 0.5
  prompt_he: 'מה פירוש הניב "לרדת מהפסים"?'
  prompt_en: 'What does the idiom "to go off the rails" mean?'
  choices:
  - {he: לחכות לרכבת על הרציף, en: To wait for a train on the platform}
  - {he: להתנהג לא כמו שצריך, en: To behave the wrong way}
  - {he: להגיע בזמן לכל מקום, en: To arrive on time everywhere}
  answer: 1
  explanation_he: רכבת שיורדת מהפסים לא יכולה לנסוע כראוי. על אדם שמאבד שליטה אומרים כך.
  explanation_en: A train off its rails cannot travel properly. We say it of a person who loses control.
  tags: [proverbs]
- id: heb.proverb.009
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'מה פירוש הביטוי "לא עצם עין כל הלילה"?'
  prompt_en: 'What does "did not close an eye all night" mean?'
  choices:
  - {he: לא ישן כל הלילה, en: Did not sleep all night}
  - {he: לא הסתכל על שום דבר, en: Did not look at anything}
  - {he: כאבו לו מאוד העיניים, en: His eyes hurt a lot}
  answer: 0
  explanation_he: עוצמים עין כדי לישון. מי שלא עצם עין נשאר ער כל הלילה.
  explanation_en: We close our eyes to sleep. Someone who did not close an eye stayed awake all night.
  tags: [proverbs]
- id: heb.proverb.010
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'מה פירוש הביטוי "הכול עובד כמו שעון"?'
  prompt_en: 'What does "everything works like a clock" mean?'
  choices:
  - {he: הכול נעצר לפתע ואיש לא יודע למה, en: 'Everything suddenly stops, no one knows why'}
  - {he: הכול מתנהל בדיוק ללא תקלות, en: 'Everything runs precisely, without problems'}
  - {he: כולם מסתכלים בשעון הקיר, en: Everyone looks at the wall clock}
  answer: 1
  explanation_he: שעון טוב מתקתק בדיוק. כך אומרים כשהכול מתנהל מצוין.
  explanation_en: A good clock ticks precisely. We say this when everything goes very well.
  tags: [proverbs]
- id: heb.proverb.011
  skill: hebrew.vocab.proverbs
  kind: choice
  grade: 5

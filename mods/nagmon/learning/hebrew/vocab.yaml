  - {he: מקצוע בלימודים, en: the subject math}
  - {he: מספר טלפון, en: a phone number}
  - {he: כמה צריך לשלם, en: the bill}
  answer: 2
  explanation_he: 'במסעדה מקבלים חשבון: כמה צריך לשלם. "חשבון" הוא גם מקצוע בבית הספר.'
  explanation_en: 'At a restaurant you get a bill. "Cheshbon" is also a school subject.'
  tags: [homonyms]
- id: heb.homo.008
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.5
  prompt_he: 'מה פירוש "ראש" במשפט "ראש העיר פתח את החגיגה"?'
  prompt_en: 'What does "rosh" mean in "The rosh of the city opened the celebration"?'
  choices:
  - {he: חלק בגוף, en: a head}
  - {he: האדם הראשי, en: the head (leader)}
  - {he: פסגה של הר, en: a summit}
  answer: 1
  explanation_he: 'ראש העיר הוא האדם הראשי בעיר. ל"ראש" יש כמה משמעויות, ואחת מהן היא מנהיג.'
  explanation_en: 'The "rosh" of a city is its leader. "Rosh" has several meanings, one of them is leader.'
  tags: [homonyms]
- id: heb.homo.009
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "ספר" במשפט "הספר גזר את השיער של דני"?'
  prompt_en: 'What does "sapar" mean in "The sapar cut Danny''s hair"?'
  choices:
  - {he: מי שגוזר שיער, en: a barber}
  - {he: מה שקוראים בו, en: a book}
  - {he: עשה חישוב, en: counted}
  answer: 0
  explanation_he: 'מי שגוזר שיער נקרא ספר. אותה מילה, ספר, יכולה להיות גם חפץ לקריאה.'
  explanation_en: The one who cuts hair is a barber. The same letters can mean a book to read.

- id: heb.homo.010
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "מסך" במשפט "המסך באולם התיאטרון נפתח"?'
  prompt_en: 'What does "masach" mean in "The masach in the theater hall opened"?'
  choices:
  - {he: צג של מחשב, en: a screen}
  - {he: וילון גדול, en: a curtain}
  - {he: שולחן גדול, en: a big table}
  answer: 1
  explanation_he: 'בתיאטרון, מסך הוא וילון גדול שנפתח בתחילת ההצגה. במחשב מסך הוא מה שרואים עליו.'
  explanation_en: 'In a theater, a masach is the big curtain. On a computer a masach is what you see on.'
  tags: [homonyms]
- id: heb.homo.011
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "מפתח" במשפט "בעזרת המפתח במפה אפשר להבין כל סימן"?'
  prompt_en: 'What does "mafteach" mean in "With the mafteach on the map you can understand each sign"?'
  choices:
  - {he: כלי לפתיחת דלת, en: a door key}
  - {he: מנהל, en: a manager}
  - {he: הסבר לסימנים, en: a legend}
  answer: 2
  explanation_he: 'במפה יש מפתח שמסביר מה כל צורה וצבע אומרים. ל"מפתח" יש גם משמעות של כלי לדלת.'
  explanation_en: 'A map has a legend explaining each shape and color. "Mafteach" can also be a door key.'
  tags: [homonyms]
- id: heb.homo.012
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.5
  prompt_he: 'מה פירוש "לב" במשפט "הם גרים בלב העיר"?'
  prompt_en: 'What does "lev" mean in "They live in the lev of the city"?'
  choices:
  - {he: המרכז, en: the center}
  - {he: חלק בגוף, en: the heart}
  - {he: מקום ליד הים, en: a place near the sea}
  answer: 0
  explanation_he: 'לב העיר הוא מרכז העיר. ל"לב" יש גם משמעות של איבר בגוף.'
  explanation_en: 'The lev of a city is its center. "Lev" is also an organ of the body.'
  tags: [homonyms]
- id: heb.homo.013
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "פנים" במשפט "היה חם מאוד בפנים הבית"?'
  prompt_en: 'What does "panim" mean in "It was very hot in the panim of the house"?'
  choices:
  - {he: בתוך, en: inside}
  - {he: על הפנים, en: on the face}
  - {he: לפני, en: before}
  answer: 0
  explanation_he: 'בפנים הבית פירושו בתוך הבית. "פנים" יכולה להיות גם חלק בראש של אדם.'
  explanation_en: '"Bifnim habayit" means inside the house. "Panim" can also be someone''s face.'
  tags: [homonyms]
- id: heb.homo.014
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'מה פירוש "צד" במשפט "הדייג צד דגים בים"?'
  prompt_en: 'What does "tsad" mean in "The fisherman tsad fish in the sea"?'
  choices:
  - {he: עמד בצד, en: stood aside}
  - {he: תפס, en: caught}
  - {he: הכין לאכילה, en: prepared for eating}
  answer: 1
  explanation_he: 'צד פירושו תופס חיות כמו דגים. יש גם "צד" שהוא כיוון, למשל צד ימין.'
  explanation_en: '"Tsad" means to catch animals like fish. There is also "tsad" as a side, like the right side.'
  tags: [homonyms]
- id: heb.homo.015
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.5
  prompt_he: 'מה פירוש "עברה" במשפט "היא עברה את הכביש"?'
  prompt_en: 'What does "avra" mean in "She avra the road"?'
  choices:
  - {he: זמן שהיה, en: the past}
  - {he: שכחה, en: forgot}
  - {he: חצתה, en: crossed}
  answer: 2
  explanation_he: 'עברה את הכביש היא חצתה אותו. המילה "עבר" יכולה להיות גם זמן שכבר היה.'
  explanation_en: '"Avra et hakvish" means she crossed it. "Avar" can also mean the past.'
  tags: [homonyms]
- id: heb.homo.016
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.5
  prompt_he: 'מה פירוש "עין" במשפט "ליד העין בנחל מצאנו צבים"?'
  prompt_en: 'What does "ayin" mean in "Near the ayin in the stream we found turtles"?'
  choices:
  - {he: איבר ראייה, en: an eye}
  - {he: מעיין מים, en: a spring}
  - {he: חור בכיסא, en: a hole}
  answer: 1
  explanation_he: 'עין יכולה להיות מעיין של מים, כמו בשמות של מקומות. כאן מדובר במעיין ליד נחל.'
  explanation_en: '"Ayin" can be a spring of water, as in place names. Here it is a spring near a stream.'
  tags: [homonyms]
- id: heb.homo.017
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: 'איזו מילה היא רב-משמעית (יש לה כמה משמעויות)?'
  prompt_en: 'Which word has several meanings?'
  choices:
  - {he: גל, en: gal}
  - {he: ארנב, en: rabbit}
  - {he: מחברת, en: notebook}
  answer: 0
  explanation_he: 'גל הוא ערימה, וגם תנועה של מים. ארנב ומחברת מתייחסים לדבר אחד בלבד.'
  explanation_en: '"Gal" is a heap and also a wave of water. "Rabbit" and "notebook" mean one thing.'
  tags: [homonyms]
- id: heb.homo.018
  skill: hebrew.vocab.homonyms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: 'באיזה משפט "כוכב" אינו כוכב בשמיים?'
  prompt_en: 'In which sentence is "kochav" not a star in the sky?'
  choices:
  - {he: כוכב נפל בלילה, en: A star fell at night}
  - {he: הכוכב זורח בשמיים, en: The star shines in the sky}
  - {he: הכוכב של הסרט הגיע לבכורה, en: The star of the film came to the premiere}
  answer: 2
  explanation_he: במשפט הראשון כוכב הוא שחקן מפורסם. בשני האחרים הוא גוף בשמיים.
  explanation_en: 'In the first, "kochav" is a famous actor. In the others it is a body in the sky.'
  tags: [homonyms]
- id: heb.homo.019
  skill: hebrew.vocab.homonyms
  kind: true_false
  grade: 4
  difficulty: -1.0
  prompt_he: 'למילה "עין" יש יותר ממשמעות אחת.'
  prompt_en: 'The word "ayin" has more than one meaning.'
  answer: true
  explanation_he: 'עין היא איבר ראייה, וגם מעיין מים. מילים כאלה הן מילים רב-משמעיות.'
  explanation_en: '"Ayin" is an organ of sight and also a spring. Such words have several meanings.'
  tags: [homonyms]
- id: heb.homo.020
  skill: hebrew.vocab.homonyms
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: אפשר לדעת איזו משמעות יש למילה רב-משמעית לפי שאר המשפט.
  prompt_en: You can tell which meaning a many-meaning word has from the rest of the sentence.
  answer: true
  explanation_he: 'המילים שסביב המילה עוזרות להבין למה היא מתכוונת, למשל "גל בים" לעומת "גל אבנים".'
  explanation_en: 'The words around it help us understand it, e.g. "wave in the sea" versus "pile of stones".'
  tags: [homonyms]
- id: heb.homo.021
  skill: hebrew.vocab.homonyms
  kind: true_false
  grade: 4
  difficulty: -1.0
  prompt_he: לכל מילה בעברית יש בדיוק משמעות אחת.
  prompt_en: Every Hebrew word has exactly one meaning.
  answer: false
  explanation_he: 'לחלק מהמילים יש כמה משמעויות, כמו "כף", "קרן" ו"גל".'
  explanation_en: 'Some words have several meanings, like "kaf", "keren" and "gal".'
  tags: [homonyms]
- id: heb.homo.022
  skill: hebrew.vocab.homonyms
  kind: true_false
  grade: 4
  difficulty: 0.5
  prompt_he: 'במשפט "הכף נפלה מהשולחן" הכוונה לחלק של היד.'
  prompt_en: 'In "The kaf fell off the table" the meaning is the part of the hand.'
  answer: false
  explanation_he: 'מה נופל מהשולחן? כלי אוכל. כף היד לא נופלת מהשולחן.'
  explanation_en: 'What falls off a table? A spoon. A hand does not fall off a table.'
  tags: [homonyms]

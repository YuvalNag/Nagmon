  explanation_en: 'A story has a character and an event, so the opening about Tamar and the envelope fits.'
  tags: [text_types]
- id: heb.ttype.018
  skill: hebrew.text.text_types
  kind: order
  grade: 5
  difficulty: 0.0
  prompt_he: סדרו את שלבי ההכנה של כריך.
  prompt_en: Put the steps of making a sandwich in order.
  choices:
  - {he: פורסים לחם, en: Slice bread}
  - {he: סוגרים ואוכלים, en: Close it and eat}
  - {he: מניחים גבינה, en: Add cheese}
  - {he: מורחים חמאה, en: Spread butter}
  answer: [0, 3, 2, 1]
  explanation_he: 'בהוראות יש סדר: קודם החומר, אחר כך מוסיפים עליו, ובסוף אוכלים.'
  explanation_en: 'Instructions have an order: first the base, then the additions, and finally eating.'
  tags: [text_types]
- id: heb.ttype.019
  skill: hebrew.text.text_types
  kind: order
  grade: 5
  difficulty: 0.0
  prompt_he: סדרו את חלקי המכתב.
  prompt_en: Put the parts of a letter in order.
  choices:
  - {he: 'מחבק, רועי', en: 'Hugs, Roi'}
  - {he: 'מה שלומך? אצלנו הכול בסדר', en: 'How are you? We are fine'}
  - {he: שלום סבא, en: Hello Grandpa}
  answer: [2, 1, 0]
  explanation_he: 'מכתב מתחיל בפנייה, יש בו את התוכן, וחותמים בסופו.'
  explanation_en: 'A letter begins with a greeting, has its content, and ends with a signature.'
  tags: [text_types]
- id: heb.ttype.020
  skill: hebrew.text.text_types
  kind: true_false
  grade: 5
  difficulty: -1.0
  prompt_he: בסיפור יש דמויות ועלילה.
  prompt_en: A story has characters and a plot.
  answer: true
  explanation_he: בסיפור מישהו עושה משהו ומשהו קורה לו. זה ההבדל מטקסט מידע.
  explanation_en: In a story someone does something and something happens. That differs from an informational text.
  tags: [text_types]
- id: heb.ttype.021
  skill: hebrew.text.text_types
  kind: true_false
  grade: 5
  difficulty: 0.0
  prompt_he: טקסט מידע ממציא דמויות.
  prompt_en: An informational text invents characters.
  answer: false
  explanation_he: טקסט מידע מביא עובדות אמיתיות. דמויות מומצאות שייכות לסיפור.
  explanation_en: An informational text gives real facts. Invented characters belong in a story.
  tags: [text_types]
- id: heb.ttype.022
  skill: hebrew.text.text_types
  kind: true_false
  grade: 5
  difficulty: 0.0
  prompt_he: הוראות כתובות בדרך כלל לפי סדר השלבים.
  prompt_en: Instructions are usually written in the order of the steps.
  answer: true
  explanation_he: 'הקורא צריך לעשות כל שלב אחרי שקודמו הסתיים, ולכן הסדר חשוב.'
  explanation_en: 'The reader must do each step after the previous one ends, so the order matters.'
  tags: [text_types]
- id: heb.ttype.023
  skill: hebrew.text.text_types
  kind: true_false
  grade: 5
  difficulty: 0.0
  prompt_he: פרסומת מנסה לשכנע אותנו.
  prompt_en: An advertisement tries to persuade us.
  answer: true
  explanation_he: מטרת הפרסומת היא שנרצה מוצר או נבוא למקום. לכן היא משבחת אותו.
  explanation_en: The advertisement wants us to like a product or visit a place. So it praises it.
  tags: [text_types]
- id: heb.tanal.001
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: -1.0
  prompt_he: 'השלימו במילת קישור: "לא למדתי למבחן, ___ קיבלתי ציון נמוך."'
  prompt_en: 'Complete with a connecting word: "I did not study for the test, ___ I got a low grade."'
  choices:
  - {he: ולכן, en: and therefore}
  - {he: אבל, en: but}
  - {he: אפילו, en: even}
  answer: 0
  explanation_he: 'ציון נמוך הוא תוצאה של כך שלא למדתי, וכדי לחבר סיבה לתוצאה משתמשים ב"לכן".'
  explanation_en: 'A low grade is the result of not studying; to link cause and result we use "therefore".'
  tags: [text_analysis]
- id: heb.tanal.002
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: -1.0
  prompt_he: 'השלימו במילת קישור: "הוא רצה לצאת לטיול, ___ ירד גשם."'
  prompt_en: 'Complete with a connecting word: "He wanted to go on a trip, ___ it rained."'
  choices:
  - {he: לכן, en: therefore}
  - {he: אבל, en: but}
  - {he: כאשר, en: when}
  answer: 1
  explanation_he: 'הגשם מפריע למה שהוא רצה. כדי להראות ניגוד אומרים "אבל".'
  explanation_en: 'The rain interferes with what he wanted. To show contrast we say "but".'
  tags: [text_analysis]
- id: heb.tanal.003
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: -1.0
  prompt_he: 'השלימו במילת קישור: "נשארנו בבית ___ היה קר מאוד."'
  prompt_en: 'Complete with a connecting word: "We stayed home ___ it was very cold."'
  choices:
  - {he: אבל, en: but}
  - {he: אחרי, en: after}
  - {he: כי, en: because}
  answer: 2
  explanation_he: 'הקור הוא הסיבה לכך שנשארנו. כדי להסביר סיבה משתמשים ב"כי".'
  explanation_en: 'The cold is the reason we stayed. To explain a reason we use "because".'
  tags: [text_analysis]
- id: heb.tanal.004
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.0
  prompt_he: 'השלימו במילת קישור: "אם נקרא כל יום, ___ נשתפר בקריאה."'
  prompt_en: 'Complete: "If we read every day, ___ we will improve at reading."'
  choices:
  - {he: אבל, en: but}
  - {he: אז, en: then}
  - {he: כי, en: because}
  answer: 1
  explanation_he: 'המשפט פותח ב"אם", והמשכו הוא התוצאה, שמתחילה ב"אז".'
  explanation_en: 'The sentence opens with "if", and its result begins with "then".'
  tags: [text_analysis]
- id: heb.tanal.005
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.0
  prompt_he: 'איזו מילה מראה ניגוד בין שני חלקי משפט?'
  prompt_en: 'Which word shows contrast between two parts of a sentence?'
  choices:
  - {he: אבל, en: but}
  - {he: לכן, en: therefore}
  - {he: בנוסף, en: in addition}
  answer: 0
  explanation_he: 'אבל מצביעה על כך שהחלק השני מנוגד לראשון. לכן מראה תוצאה, ובנוסף מוסיף עוד דבר.'
  explanation_en: '"But" shows the second part opposes the first. "Therefore" shows a result and "in addition" adds something.'
  tags: [text_analysis]
- id: heb.tanal.006
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.0
  prompt_he: 'איזו מילה מראה תוצאה?'
  prompt_en: 'Which word shows a result?'
  choices:
  - {he: אבל, en: but}
  - {he: למשל, en: for example}
  - {he: לכן, en: therefore}
  answer: 2
  explanation_he: 'לכן מחברת בין סיבה לתוצאה: "ירד גשם, לכן נשארנו בבית".'
  explanation_en: '"Therefore" links cause and result: "it rained, so we stayed home".'
  tags: [text_analysis]
- id: heb.tanal.007
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.5
  prompt_he: 'איזו מילה מוסיפה עוד נימוק?'
  prompt_en: 'Which word adds another reason?'
  choices:
  - {he: אבל, en: but}
  - {he: כאשר, en: when}
  - {he: בנוסף, en: in addition}
  answer: 2
  explanation_he: 'בנוסף אומרת שיש עוד דבר באותו כיוון, למשל: "הים יפה, ובנוסף הוא קרוב".'
  explanation_en: '"In addition" says there is one more point in the same direction.'
  tags: [text_analysis]
- id: heb.tanal.008
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: -1.0
  prompt_he: 'איזו כותרת מתאימה ביותר? "דבורים אוספות צוף מפרחים ובכוורת מכינות ממנו דבש."'
  prompt_en: 'Which title fits best? "Bees collect nectar from flowers and make honey from it in the hive."'
  choices:
  - {he: הפרחים הגדולים בעולם, en: The biggest flowers in the world}
  - {he: איך דבורים מכינות דבש, en: How bees make honey}
  - {he: למה כדאי לאכול ירקות, en: Why it is worth eating vegetables}
  answer: 1
  explanation_he: 'כותרת טובה אומרת על מה הטקסט. הטקסט מדבר על הכנת דבש, ולא על ירקות או על גודל פרחים.'
  explanation_en: A good title says what the text is about. This text is about making honey.
  tags: [text_analysis]
- id: heb.tanal.009
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.5
  prompt_he: 'מהו הרעיון המרכזי? "הליכה מחזקת את הלב ומשפרת את מצב הרוח. מספיקות עשר דקות ביום."'
  prompt_en: 'What is the main idea? "Walking strengthens the heart and improves mood. Ten minutes a day is enough."'
  choices:
  - {he: הליכה קצרה טובה לגוף ולנפש, en: A short walk is good for body and mind}
  - {he: הליכה היא ספורט תחרותי, en: Walking is a competitive sport}
  - {he: כדאי ללכת רק בבוקר, en: It is best to walk only in the morning}
  answer: 0
  explanation_he: 'שני המשפטים מדברים על תועלת של הליכה, ואומרים שגם עשר דקות מספיקות. זה הרעיון המרכזי.'
  explanation_en: 'Both sentences talk about the benefit of walking, even for ten minutes. That is the main idea.'
  tags: [text_analysis]
- id: heb.tanal.010
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.5
  prompt_he: 'מהו הרעיון המרכזי? "ציפורים נודדות מעל ישראל פעמיים בשנה. בעמק החולה הן נחות ואוכלות."'
  prompt_en: 'What is the main idea? "Birds migrate over Israel twice a year. In the Hula Valley they rest and eat."'
  choices:
  - {he: ציפורים גרות רק בעמק החולה, en: Birds live only in the Hula Valley}
  - {he: ציפורים לא אוהבות לעוף, en: Birds do not like to fly}
  - {he: ישראל היא תחנה חשובה לציפורים נודדות, en: Israel is an important stop for migrating birds}
  answer: 2
  explanation_he: שני המשפטים מראים שציפורים עוברות בארץ ונחות בה. הרעיון הוא שהיא תחנה חשובה עבורן.
  explanation_en: Both sentences show that birds pass through and rest here. The idea is that it is an important stop for them.
  tags: [text_analysis]
- id: heb.tanal.011
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.0
  prompt_he: 'מה אפשר להסיק? "דני חיפש בתיק בבהלה, ואז נשם לרווחה כשמצא את המפתחות."'
  prompt_en: 'What can we conclude? "Danny searched his bag in a panic, then breathed with relief when he found the keys."'
  choices:
  - {he: שדני איבד את התיק, en: That Danny lost the bag}
  - {he: שדני הרגיש הקלה, en: That Danny felt relief}
  - {he: שדני כעס על חבר, en: That Danny was angry at a friend}
  answer: 1
  explanation_he: נשימה לרווחה היא סימן להקלה אחרי חשש. מי שמצא את מה שחיפש מרגיש הקלה.
  explanation_en: Breathing with relief is a sign of relief after worry. Someone who found what he sought feels relief.
  tags: [text_analysis]
- id: heb.tanal.012
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.5
  prompt_he: 'מה אפשר להסיק? "המורה חייכה, תלתה את הציור על הקיר ואמרה לרועי: אתה אמן."'
  prompt_en: 'What can we conclude? "The teacher smiled, hung the picture on the wall and told Roi: you are an artist."'
  choices:
  - {he: שהמורה מעריכה את רועי, en: That the teacher values Roi}
  - {he: שהמורה כועסת על רועי, en: That the teacher is angry at Roi}
  - {he: שרועי איבד את הציור, en: That Roi lost the picture}
  answer: 0
  explanation_he: 'חיוך, תליית הציור ומילה טובה מראים הערכה. המורה אינה כועסת.'
  explanation_en: 'A smile, hanging the picture and a kind word show appreciation. The teacher is not angry.'
  tags: [text_analysis]
- id: heb.tanal.013
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.5
  prompt_he: 'מה מטרת המשפט? "אסור להאכיל ברווזים בלחם, כי זה מזיק להם."'
  prompt_en: 'What is the purpose of the sentence? "Do not feed ducks bread, because it harms them."'
  choices:
  - {he: לספר בדיחה על ברווזים, en: To tell a joke about ducks}
  - {he: להזהיר ולהסביר למה, en: To warn and explain why}
  - {he: לפרסם מאפייה חדשה, en: To advertise a new bakery}
  answer: 1
  explanation_he: 'המשפט אוסר פעולה ומסביר בעזרת "כי" למה. זו אזהרה עם נימוק.'
  explanation_en: 'The sentence forbids an action and explains why with "because". It is a warning with a reason.'
  tags: [text_analysis]
- id: heb.tanal.014
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: -1.0
  prompt_he: 'מה הסיבה? "בגלל הרוח החזקה, הדלת נטרקה."'
  prompt_en: 'What is the cause? "Because of the strong wind, the door slammed."'
  choices:
  - {he: הדלת נטרקה, en: The door slammed}
  - {he: מישהו עזב את הבית, en: Someone left the house}
  - {he: הרוח החזקה, en: The strong wind}
  answer: 2
  explanation_he: 'המילים "בגלל" מציינות את הסיבה: הרוח החזקה. הדלת הנטרקת היא התוצאה.'
  explanation_en: '"Because of" marks the cause: the strong wind. The slamming door is the result.'
  tags: [text_analysis]
- id: heb.tanal.015
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: -1.0
  prompt_he: 'מה התוצאה? "בגלל הרוח החזקה, הדלת נטרקה."'
  prompt_en: 'What is the result? "Because of the strong wind, the door slammed."'
  choices:
  - {he: הדלת נטרקה, en: The door slammed}
  - {he: הרוח החזקה, en: The strong wind}
  - {he: הרוח נחלשה, en: The wind weakened}
  answer: 0
  explanation_he: 'התוצאה היא מה שקרה בעקבות הסיבה: הדלת נטרקה.'
  explanation_en: 'The result is what happened because of the cause: the door slammed.'
  tags: [text_analysis]
- id: heb.tanal.016
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.0
  prompt_he: 'דנה ודני הלכו לים. הוא שחה והיא בנתה טירה. מי בנתה טירה?'
  prompt_en: 'Dana and Danny went to the sea. He swam and she built a castle. Who built a castle?'
  choices:
  - {he: דני, en: Danny}
  - {he: שניהם, en: Both}
  - {he: דנה, en: Dana}
  answer: 2
  explanation_he: 'המילה "היא" מתייחסת לדנה, כי דנה היא נקבה. דני הוא "הוא".'
  explanation_en: '"She" refers to Dana, because Dana is female. Danny is "he".'
  tags: [text_analysis]
- id: heb.tanal.017
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 0.5
  prompt_he: 'מה פירוש "רדוד" במשפט: "הנחל היה רדוד, וחצינו אותו ברגל"?'
  prompt_en: 'What does "radud" mean in: "The stream was radud, and we crossed it on foot"?'
  choices:
  - {he: לא עמוק, en: not deep}
  - {he: מהיר מאוד, en: very fast}
  - {he: רחב מאוד, en: very wide}
  answer: 0
  explanation_he: חוצים ברגל רק נחל שאינו עמוק. הרמז במשפט עוזר להבין את המילה.
  explanation_en: You can cross on foot only a stream that is not deep. The clue in the sentence explains the word.
  tags: [text_analysis]
- id: heb.tanal.018
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 1.0
  prompt_he: 'מה פירוש "נבוך" במשפט: "הוא הסמיק ונבוך כשכולם הביטו בו"?'
  prompt_en: 'What does "navoch" mean in: "He blushed and was navoch when everyone looked at him"?'
  choices:
  - {he: שמח מאוד, en: very happy}
  - {he: מובך ולא נוח, en: embarrassed and uncomfortable}
  - {he: כועס מאוד, en: very angry}
  answer: 1
  explanation_he: 'הסמקה כשמסתכלים עליך מרמזת על מבוכה, וזה פירוש המילה.'
  explanation_en: 'Blushing when people look at you hints at embarrassment, which is the word''s meaning.'
  tags: [text_analysis]
- id: heb.tanal.019
  skill: hebrew.text.text_analysis
  kind: choice
  grade: 7
  difficulty: 1.5
  prompt_he: 'מה פירוש "מהוסס" במשפט: "הוא התקרב מהוסס, ועצר לפני שדפק על הדלת"?'
  prompt_en: 'What does "mehusas" mean in: "He approached mehusas, and stopped before knocking"?'
  choices:
  - {he: 'לא בטוח, מהסס', en: 'unsure, hesitating'}
  - {he: בטוח בעצמו, en: sure of himself}
  - {he: עייף מאוד, en: very tired}
  answer: 0
  explanation_he: מי שעוצר לפני שדופק על הדלת אינו בטוח. מהוסס הוא מי שמהסס.
  explanation_en: 'Someone who stops before knocking is unsure. "Mehusas" is someone who hesitates.'
  tags: [text_analysis]
- id: heb.tanal.020
  skill: hebrew.text.text_analysis
  kind: true_false
  grade: 7
  difficulty: -1.0
  prompt_he: כותרת טובה אומרת על מה הטקסט.
  prompt_en: A good title says what the text is about.
  answer: true
  explanation_he: 'הכותרת מאפשרת לקורא לדעת מראש מה הנושא, ולכן היא צריכה להתאים לתוכן.'
  explanation_en: 'A title lets the reader know the subject in advance, so it must fit the content.'
  tags: [text_analysis]
- id: heb.tanal.021
  skill: hebrew.text.text_analysis
  kind: true_false
  grade: 7
  difficulty: 0.0
  prompt_he: הרעיון המרכזי הוא פרט אחד קטן בטקסט.
  prompt_en: The main idea is one small detail of the text.
  answer: false
  explanation_he: הרעיון המרכזי הוא מה שהטקסט כולו אומר. פרט הוא רק חלק קטן שתומך בו.
  explanation_en: The main idea is what the whole text says. A detail is a small part that supports it.
  tags: [text_analysis]
- id: heb.tanal.022
  skill: hebrew.text.text_analysis
  kind: true_false
  grade: 7
  difficulty: 0.0
  prompt_he: 'מילת הקישור "לכן" מחברת בין סיבה לתוצאה.'
  prompt_en: 'The connecting word "lachen" links a cause and a result.'
  answer: true
  explanation_he: '"ירד גשם, לכן נשארנו בבית": הגשם הוא הסיבה, והישארות בבית היא התוצאה.'
  explanation_en: '"It rained, therefore we stayed home": the rain is the cause, staying home the result.'
  tags: [text_analysis]
- id: heb.tanal.023
  skill: hebrew.text.text_analysis
  kind: true_false
  grade: 7
  difficulty: 0.0
  prompt_he: אפשר להבין מילה חדשה לפי המשפט שסביבה.
  prompt_en: You can understand a new word from the sentence around it.
  answer: true
  explanation_he: המילים שבסביבה נותנות רמזים. כך מבינים מילה גם בלי מילון.
  explanation_en: The surrounding words give clues. That is how we understand a word even without a dictionary.
  tags: [text_analysis]
- id: heb.argu.001
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: -1.0
  prompt_he: 'איזה משפט הוא עובדה?'
  prompt_en: 'Which sentence is a fact?'
  choices:
  - {he: כדורגל הוא המשחק הכי כיפי., en: Football is the most fun game.}
  - {he: בשבוע יש שבעה ימים., en: A week has seven days.}
  - {he: ימי חמישי הם הימים הטובים ביותר., en: Thursdays are the best days.}
  answer: 1
  explanation_he: עובדה אפשר לבדוק ולקבוע אם היא נכונה. שני המשפטים האחרים הם דעות אישיות.
  explanation_en: A fact can be checked and shown true. The other two sentences are personal opinions.
  tags: [argument]
- id: heb.argu.002
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: -1.0
  prompt_he: 'איזה משפט הוא דעה?'
  prompt_en: 'Which sentence is an opinion?'
  choices:
  - {he: המים רותחים ב-100 מעלות בלחץ רגיל., en: Water boils at 100 degrees at normal pressure.}
  - {he: בכיתה שלנו יש ארבעים תלמידים., en: There are forty pupils in our class.}
  - {he: הגלידה הטעימה ביותר היא גלידת וניל., en: The tastiest ice cream is vanilla.}
  answer: 2
  explanation_he: 'טעם הוא עניין של טעם אישי, ואי אפשר להוכיח מה הכי טעים. שני האחרים אפשר למדוד ולבדוק.'
  explanation_en: Taste is personal and cannot be proven. The other two can be measured and checked.
  tags: [argument]
- id: heb.argu.003
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 0.0
  prompt_he: 'מהי הטענה במשפט: "כדאי לצמצם שעות מסך, כי הן פוגעות בשינה"?'
  prompt_en: 'What is the claim in: "It is worth cutting screen time, because it harms sleep"?'
  choices:
  - {he: כדאי לצמצם שעות מסך, en: It is worth cutting screen time}
  - {he: המסך פוגע בשינה של הילדים, en: 'Screens harm children''s sleep'}
  - {he: שינה חשובה מאוד לבריאות הגוף, en: Sleep is very important for body health}
  answer: 0
  explanation_he: 'הטענה היא מה שהכותב רוצה לשכנע בו. מה שאחרי "כי" הוא הנימוק.'
  explanation_en: 'The claim is what the writer wants to convince us of. What follows "because" is the reason.'
  tags: [argument]
- id: heb.argu.004
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 0.0
  prompt_he: 'מהו הנימוק במשפט: "כדאי לצמצם שעות מסך, כי הן פוגעות בשינה"?'
  prompt_en: 'What is the reason in: "It is worth cutting screen time, because it harms sleep"?'
  choices:
  - {he: כדאי לצמצם שעות מסך, en: It is worth cutting screen time}
  - {he: הן פוגעות בשינה, en: They harm sleep}
  - {he: אני אוהב לישון, en: I like sleeping}
  answer: 1
  explanation_he: 'הנימוק מסביר למה הטענה נכונה. הוא מופיע אחרי "כי".'
  explanation_en: 'The reason explains why the claim is right. It appears after "because".'
  tags: [argument]
- id: heb.argu.005
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'איזו מילה פותחת נימוק?'
  prompt_en: 'Which word opens a reason?'
  choices:
  - {he: שכן, en: since}
  - {he: למשל, en: for example}
  - {he: אולם, en: however}
  answer: 0
  explanation_he: 'שכן, כי ומפני ש מציגות סיבה. למשל מציגה דוגמה, ואולם מציגה ניגוד.'
  explanation_en: '"Shechen", "ki" and "mipnei she" present a reason. "For example" gives an example and "however" a contrast.'
  tags: [argument]
- id: heb.argu.006
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: -1.0
  prompt_he: 'איזו מילה מציגה דוגמה?'
  prompt_en: 'Which word presents an example?'
  choices:
  - {he: לפיכך, en: therefore}
  - {he: אולם, en: however}
  - {he: למשל, en: for example}
  answer: 2
  explanation_he: 'אחרי "למשל" באה דוגמה שמחזקת את הטענה.'
  explanation_en: 'After "for example" comes an example that strengthens the claim.'
  tags: [argument]
- id: heb.argu.007
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'איזו דוגמה תומכת בטענה "קריאה מעשירה את אוצר המילים"?'
  prompt_en: 'Which example supports the claim "reading enriches vocabulary"?'
  choices:
  - {he: ספרים מודפסים על נייר מיוחד, en: Books are printed on special paper}
  - {he: בספרייה יש שקט ואפשר לשבת, en: The library is quiet and one can sit}
  - {he: ילדים שקוראים הרבה מכירים יותר מילים, en: Children who read a lot know more words}
  answer: 2
  explanation_he: 'דוגמה טובה מראה את הקשר שבטענה: קריאה והכרת מילים. האחרות נכונות אך לא קשורות.'
  explanation_en: 'A good example shows the link in the claim: reading and knowing words. The others are true but unrelated.'
  tags: [argument]
- id: heb.argu.008
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'איזה נימוק מתאים לטענה "כדאי לישון מוקדם לפני מבחן"?'
  prompt_en: 'Which reason fits the claim "it is worth sleeping early before a test"?'
  choices:
  - {he: כי המבחן קל וכולם עוברים אותו, en: Because the test is easy and everyone passes}
  - {he: כי שינה מסייעת לזיכרון ולריכוז, en: Because sleep helps memory and concentration}
  - {he: כי המורה אוהב תלמידים שישנים מוקדם, en: Because the teacher likes pupils who sleep early}
  answer: 1
  explanation_he: 'נימוק טוב מסביר למה הטענה נכונה. שינה משפיעה על זיכרון וריכוז, וזה חשוב במבחן.'
  explanation_en: 'A good reason explains why the claim is right. Sleep affects memory and concentration, important in a test.'
  tags: [argument]
- id: heb.argu.009
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'איזו טענה מנוסחת בבירור?'
  prompt_en: 'Which claim is clearly stated?'
  choices:
  - {he: להוסיף שעת ספורט שבועית בבית הספר, en: To add a weekly sport hour at school}
  - {he: ספורט זה טוב ובריא לכל אחד מאיתנו, en: Sports are good and healthy for each of us}
  - {he: אולי כדאי משהו בקשר לספורט, en: Maybe something about sports}
  answer: 0
  explanation_he: 'טענה טובה אומרת בדיוק מה מציעים. "ספורט זה טוב" כללי מדי, והשלישית לא החלטית.'
  explanation_en: 'A good claim says exactly what is proposed. "Sports are good" is too general and the third is undecided.'
  tags: [argument]
- id: heb.argu.010
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'איזה נימוק חלש יותר?'
  prompt_en: 'Which reason is weaker?'
  choices:
  - {he: כי כולם אומרים כך, en: Because everyone says so}
  - {he: כי מחקר שנערך בבתי ספר הראה זאת, en: Because a study in schools showed it}
  - {he: כי אפשר למדוד את התוצאות, en: Because the results can be measured}
  answer: 0
  explanation_he: '"כולם אומרים" אינו נימוק אמיתי, כי הרבה אנשים יכולים לטעות. מחקר ומדידה הם ראיות.'
  explanation_en: '"Everyone says so" is not a real reason, since many people can be wrong. A study and measurement are evidence.'
  tags: [argument]
- id: heb.argu.011
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 1.5
  prompt_he: 'איזה משפט הוא הכללה מוגזמת?'
  prompt_en: 'Which sentence is an overgeneralization?'
  choices:
  - {he: חלק מבני הנוער אוהבים משחקי מחשב., en: Some teenagers love computer games.}
  - {he: כל בני הנוער אוהבים משחקי מחשב., en: All teenagers love computer games.}
  - {he: רבים מבני הנוער משחקים במחשב., en: Many teenagers play on the computer.}
  answer: 1
  explanation_he: 'המילה "כל" מכלילה על כולם, וקל להפריך אותה בדוגמה אחת. "חלק" ו"רבים" זהירים יותר.'
  explanation_en: 'The word "all" covers everyone and is refuted by a single example. "Some" and "many" are more careful.'
  tags: [argument]
- id: heb.argu.012
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה תפקיד המשפט "אולי יאמרו שהשעון המעורר מציק"?'
  prompt_en: 'What is the role of the sentence "Some may say the alarm clock is annoying"?'
  choices:
  - {he: סיום הטקסט והסיכום שלו, en: The end of the text and its summary}
  - {he: הצגת דוגמה לטענה שלו, en: Presenting an example for his claim}
  - {he: הצגת טענה נגדית, en: Presenting a counterclaim}
  answer: 2
  explanation_he: הכותב מזכיר דעה שונה משלו כדי להשיב עליה אחר כך. זו טענה נגדית.
  explanation_en: The writer mentions a view different from his own in order to answer it. This is a counterclaim.
  tags: [argument]
- id: heb.argu.013
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה אפשר לעשות עם טענה נגדית בטקסט טיעון?'
  prompt_en: 'What can we do with a counterclaim in an argument text?'
  choices:
  - {he: להסתיר אותה מהקורא לגמרי כך שלא יראה, en: Hide it from the reader entirely so he does not see it}
  - {he: להשיב עליה ולהסביר למה היא חלשה, en: Answer it and explain why it is weak}
  - {he: להסכים איתה ולוותר על כל הטענה שלי, en: Agree with it and give up my whole claim}
  answer: 1
  explanation_he: כותב טוב מכיר בטענה נגדית ומראה למה הנימוקים שלו חזקים יותר. כך הוא משכנע.
  explanation_en: A good writer acknowledges a counterclaim and shows why his reasons are stronger. That is persuasive.
  tags: [argument]
- id: heb.argu.014
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: -1.0
  prompt_he: 'איזה חלק מופיע בסוף טקסט טיעון?'
  prompt_en: 'Which part appears at the end of an argument text?'
  choices:
  - {he: פתיחה, en: Opening}
  - {he: נימוק ראשון, en: First reason}
  - {he: מסקנה, en: Conclusion}
  answer: 2
  explanation_he: 'בסוף מסכמים ומחזקים את הטענה, וזו המסקנה.'
  explanation_en: 'At the end we summarize and reinforce the claim, which is the conclusion.'
  tags: [argument]
- id: heb.argu.015
  skill: hebrew.text.argument
  kind: order
  grade: 9
  difficulty: 0.5
  prompt_he: סדרו את חלקי טקסט הטיעון.
  prompt_en: Put the parts of an argument text in order.
  choices:
  - {he: מסקנה, en: Conclusion}
  - {he: פתיחה והצגת הנושא, en: Opening and presenting the topic}
  - {he: טענה ונימוקים, en: Claim and reasons}
  - {he: טענה נגדית ותשובה לה, en: Counterclaim and an answer to it}
  answer: [1, 2, 3, 0]
  explanation_he: 'טקסט טיעון פותח בנושא, ממשיך בטענה ונימוקים, מתמודד עם טענה נגדית, ומסכם.'
  explanation_en: 'An argument text opens with the topic, goes on to claim and reasons, handles a counterclaim, and summarizes.'
  tags: [argument]
- id: heb.argu.016
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 1.5
  prompt_he: 'איזו מילה מסמנת טענה נגדית?'
  prompt_en: 'Which word marks a counterclaim?'
  choices:
  - {he: לכן, en: therefore}
  - {he: אמנם, en: admittedly}
  - {he: למשל, en: for example}
  answer: 1
  explanation_he: '"אמנם... אך" מציגה טענה אחרת שמכירים בה, ואחריה בא "אך", שחוזר לטענה שלנו.'
  explanation_en: '"Admittedly... but" presents another claim we acknowledge, and "but" returns to our own.'
  tags: [argument]
- id: heb.argu.017
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'איזה נימוק מתאים לטענה "כדאי לשמור על ניקיון החוף"?'
  prompt_en: 'Which reason fits "it is worth keeping the beach clean"?'
  choices:
  - {he: כי החוף ארוך ויש בו הרבה חול, en: Because the beach is long and has a lot of sand}
  - {he: כי החול צהוב ונעים לצפייה בקיץ, en: Because the sand is yellow and pleasant to look at}
  - {he: כי זבל פוגע בחיות הים ובאנשים, en: Because litter harms sea animals and people}
  answer: 2
  explanation_he: הנימוק מסביר מה הנזק של זבל. שני האחרים נכונים אך אינם קשורים לטענה.
  explanation_en: The reason explains the harm litter causes. The other two are true but not linked to the claim.
  tags: [argument]
- id: heb.argu.018
  skill: hebrew.text.argument
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'איזו מסקנה מתאימה לטקסט שנתן שלושה נימוקים בעד תוספת של שעת קריאה בבית הספר?'
  prompt_en: 'Which conclusion fits a text that gave three reasons for adding a reading hour at school?'
  choices:
  - {he: לכן כדאי להוסיף שעת קריאה שבועית, en: So a weekly reading hour is worth adding}
  - {he: לכן כדאי לבטל את הספרייה בבית הספר, en: So the school library should be closed}
  - {he: לכן אין צורך בספרים ובשעת קריאה, en: So there is no need for books or a reading hour}
  answer: 0
  explanation_he: 'מסקנה צריכה להתאים לטענה ולנימוקים, ולכן היא מסכמת ומחזקת את ההצעה.'
  explanation_en: 'A conclusion must match the claim and reasons, summarizing and reinforcing the proposal.'
  tags: [argument]
- id: heb.argu.019
  skill: hebrew.text.argument
  kind: true_false
  grade: 9
  difficulty: -1.0
  prompt_he: אפשר לבדוק עובדה ולהוכיח אם היא נכונה.
  prompt_en: A fact can be checked and proved true.
  answer: true
  explanation_he: 'עובדה היא משהו שאפשר למדוד, לספור או לאמת. דעה היא עמדה אישית.'
  explanation_en: 'A fact can be measured, counted or verified. An opinion is a personal stand.'
  tags: [argument]
- id: heb.argu.020
  skill: hebrew.text.argument
  kind: true_false
  grade: 9
  difficulty: 0.0
  prompt_he: אפשר להוכיח דעה כנכונה בעזרת מדידה.
  prompt_en: An opinion can be proved true by measurement.
  answer: false
  explanation_he: 'דעה היא עמדה אישית. אפשר לתמוך בה בנימוקים, אך לא למדוד אם היא נכונה.'
  explanation_en: An opinion is a personal stand. It can be supported with reasons but not measured as true.
  tags: [argument]
- id: heb.argu.021
  skill: hebrew.text.argument
  kind: true_false
  grade: 9
  difficulty: -1.0
  prompt_he: מספיק לכתוב טענה בלי נימוק כדי לשכנע.
  prompt_en: It is enough to write a claim without a reason in order to persuade.
  answer: false
  explanation_he: בלי נימוק הקורא אינו יודע למה לקבל את הטענה. נימוק ודוגמה הם שמשכנעים.
  explanation_en: Without a reason the reader does not know why to accept the claim. Reasons and examples persuade.
  tags: [argument]
- id: heb.argu.022
  skill: hebrew.text.argument
  kind: true_false
  grade: 9
  difficulty: 0.0
  prompt_he: דוגמה טובה מחזקת את הנימוק.
  prompt_en: A good example strengthens a reason.
  answer: true
  explanation_he: 'דוגמה מראה את הנימוק במציאות, וכך קל יותר להאמין לו.'
  explanation_en: 'An example shows the reason in reality, making it easier to believe.'
  tags: [argument]
- id: heb.argu.023
  skill: hebrew.text.argument
  kind: true_false
  grade: 9
  difficulty: 1.0
  prompt_he: טענה נגדית תמיד מבטלת את הטענה שלי.
  prompt_en: A counterclaim always cancels my claim.
  answer: false
  explanation_he: אפשר להשיב על טענה נגדית ולהראות שהנימוקים שלי חזקים ממנה.
  explanation_en: We can answer a counterclaim and show my reasons are stronger.
  tags: [argument]
- id: heb.argu.024
  skill: hebrew.text.argument
  kind: true_false
  grade: 9
  difficulty: 1.5
  prompt_he: 'המילה "תמיד" בטענה עלולה להפוך אותה להכללה שקל להפריך.'
  prompt_en: 'The word "always" in a claim may turn it into an easily refuted generalization.'
  answer: true
  explanation_he: 'מספיק מקרה אחד חריג כדי להפריך משפט שאומר "תמיד" או "כל". ניסוח זהיר חזק יותר.'
  explanation_en: 'One exception is enough to refute a statement with "always" or "all". Careful wording is stronger.'
  tags: [argument]
- id: heb.summ.001
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: -1.0
  prompt_he: 'איזה סיכום מתאים ביותר? "הדובים נרדמים בחורף ומתעוררים באביב. בזמן השינה הם לא אוכלים."'
  prompt_en: 'Which summary fits best? "Bears fall asleep in winter and wake in spring. While asleep they do not eat."'
  choices:
  - {he: דובים ישנים בחורף בלי לאכול, en: Bears sleep in winter without eating}
  - {he: דובים אוהבים לאכול דגים, en: Bears like to eat fish}
  - {he: האביב הוא עונה יפה, en: Spring is a lovely season}
  answer: 0
  explanation_he: 'סיכום טוב כולל את הרעיון המרכזי בקצרה: דובים ישנים ולא אוכלים בחורף.'
  explanation_en: 'A good summary gives the main idea briefly: bears sleep and do not eat in winter.'
  tags: [summary]
- id: heb.summ.002
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 0.0
  prompt_he: 'איזה סיכום מתאים ביותר? "גשם יורד כשהעננים כבדים. הגשם ממלא נחלים ומשקה את השדות."'
  prompt_en: 'Which summary fits best? "Rain falls when clouds are heavy. Rain fills streams and waters the fields."'
  choices:
  - {he: עננים יכולים להיות לבנים או אפורים, en: Clouds can be white or gray}
  - {he: השדות בישראל גדולים ופתוחים מאוד, en: The fields in Israel are very big and open}
  - {he: הגשם יורד מעננים כבדים ומועיל לשדות, en: Rain falls from heavy clouds and helps the fields}
  answer: 2
  explanation_he: הסיכום מזכיר גם את הסיבה (עננים כבדים) וגם את התועלת (נחלים ושדות).
  explanation_en: The summary mentions both the cause (heavy clouds) and the benefit (streams and fields).
  tags: [summary]
- id: heb.summ.003
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 0.0
  prompt_he: 'איזה סיכום מתאים ביותר? "נועם כתב מכתב ארוך. הוא סיפר בו על הטיול, על החברים ועל הים."'
  prompt_en: 'Which summary fits best? "Noam wrote a long letter. In it he told about the trip, the friends and the sea."'
  choices:
  - {he: נועם אוהב ים וטיולים עם חברים, en: Noam likes the sea and trips with friends}
  - {he: נועם כתב מכתב על הטיול שלו, en: Noam wrote a letter about his trip}
  - {he: המכתב הגיע באיחור של שבוע שלם, en: The letter arrived a whole week late}
  answer: 1
  explanation_he: 'סיכום אומר מה עשה נועם ועל מה: כתב מכתב על הטיול. שאר הפרטים הם תוספות.'
  explanation_en: 'A summary says what Noam did and about what: wrote a letter about the trip. The rest is detail.'
  tags: [summary]
- id: heb.summ.004
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 0.5
  prompt_he: 'איזה סיכום מתאים ביותר? "הספרייה תיסגר לשיפוץ. במשך חודשיים אפשר להשאיל ספרים בבית הספר."'
  prompt_en: 'Which summary fits best? "The library will close for renovation. For two months one can borrow books at school."'
  choices:
  - {he: הספרייה גדולה ויפה ויש בה הרבה ספרים, en: The library is big and lovely with many books}
  - {he: 'הספרייה סגורה, ומשאילים בבית הספר', en: 'The library is closed, borrowing is at school'}
  - {he: הספרים ישנים מאוד ולכן הם לא מתאימים, en: The books are very old so they do not suit}
  answer: 1
  explanation_he: 'הסיכום כולל את שני הפרטים החשובים: הסגירה וההחלפה בהשאלה בבית הספר.'
  explanation_en: 'The summary includes the two key points: the closing and the substitute of borrowing at school.'
  tags: [summary]
- id: heb.summ.005
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: -1.0
  prompt_he: 'איזה משפט אומר את אותו דבר במילים אחרות? "הילד מיהר לבית הספר."'
  prompt_en: 'Which sentence says the same in other words? "The boy hurried to school."'
  choices:
  - {he: הילד הלך לאט לאט אל בית הספר, en: The boy walked very slowly to school}
  - {he: הילד נשאר בבית ולא הלך ללמוד, en: The boy stayed home and did not go to study}
  - {he: הילד רץ במהירות אל בית הספר, en: The boy ran quickly to school}
  answer: 2
  explanation_he: 'ניסוח מחדש שומר על המשמעות ומחליף מילים. "מיהר" ו"רץ במהירות" דומות.'
  explanation_en: 'A paraphrase keeps the meaning and changes words. "Hurried" and "ran quickly" are close.'
  tags: [summary]
- id: heb.summ.006
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 0.5
  prompt_he: 'איזה משפט אומר את אותו דבר במילים אחרות? "המורה שיבחה את התלמיד שהשתפר."'
  prompt_en: 'Which sentence says the same in other words? "The teacher praised the pupil who had improved."'
  choices:
  - {he: התלמיד שהשתפר קיבל שבח מהמורה, en: The pupil who improved got praise from the teacher}
  - {he: המורה ביקשה מהתלמיד להשתפר מיד, en: The teacher asked the pupil to improve at once}
  - {he: התלמיד שיבח את המורה שהשתפרה, en: The pupil praised the teacher who had improved}
  answer: 0
  explanation_he: במשפט הנכון מי שהשתפר מקבל שבח מהמורה. בשני האחרים הכיוון או המשמעות שונים.
  explanation_en: In the correct one the one who improved gets praise from the teacher. The other two change direction or meaning.
  tags: [summary]
- id: heb.summ.007
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 0.5
  prompt_he: 'איזה משפט אומר את אותו דבר במילים אחרות? "הדרך הייתה ארוכה ומתישה."'
  prompt_en: 'Which sentence says the same in other words? "The way was long and exhausting."'
  choices:
  - {he: המסע נמשך זמן רב והיה קשה מאוד, en: The journey lasted long and was very hard}
  - {he: 'הדרך הייתה קצרה, נעימה וקלה מאוד', en: 'The way was short, pleasant and very easy'}
  - {he: לא הייתה שום דרך להגיע לשם בכלל, en: There was no way to get there at all}
  answer: 0
  explanation_he: 'ארוכה פירושה נמשכת זמן רב, ומתישה פירושה קשה מאוד. שני הצירופים משקפים זאת.'
  explanation_en: '"Long" means lasting long, and "exhausting" means very hard. Both phrases reflect this.'
  tags: [summary]
- id: heb.summ.008
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: 'איזה סיכום כולל דעה שלא נאמרה בטקסט?'
  prompt_en: 'Which summary includes an opinion not said in the text?'
  choices:
  - {he: דבורים אוספות צוף מפרחים ומכינות דבש, en: Bees collect nectar from flowers and make honey}
  - {he: ברור שהדבורים הן החרקים החשובים ביותר, en: It is clear that bees are the most important insects}
  - {he: דבורים חיות בכוורת יחד עם מלכה אחת, en: Bees live in a hive together with one queen}
  answer: 1
  explanation_he: 'סיכום טוב אינו מוסיף דעות. אם בטקסט לא נאמר שהדבורים החשובות ביותר, אסור להוסיף זאת.'
  explanation_en: 'A good summary adds no opinions. If the text did not say bees are the most important, we must not add it.'
  tags: [summary]
- id: heb.summ.009
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: 'מה חסר בסיכום "ילדים הלכו" כסיכום של סיפור על טיול בהר?'
  prompt_en: 'What is missing in the summary "Children went" as a summary of a story about a hike in the mountains?'
  choices:
  - {he: עוד תיאורים של הנוף, en: More descriptions of the scenery}
  - {he: שמות כל הילדים, en: Names of all the children}
  - {he: 'לאן, למה ומה קרה', en: 'Where, why and what happened'}
  answer: 2
  explanation_he: 'סיכום צריך לענות על שאלות חשובות: מי, לאן, למה, מה קרה. התיאורים המפורטים אינם הכרחיים.'
  explanation_en: 'A summary must answer key questions: who, where, why, what happened. Detailed descriptions are not essential.'
  tags: [summary]
- id: heb.summ.010
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: 'איזה סיכום ארוך מדי?'
  prompt_en: 'Which summary is too long?'
  choices:
  - {he: העתקה של כמעט כל משפטי הטקסט, en: 'Copying almost all the text''s sentences'}
  - {he: משפט אחד שמכיל את הרעיון המרכזי, en: One sentence with the main idea}
  - {he: שני משפטים קצרים עם הפרטים החשובים, en: Two short sentences with key details}
  answer: 0
  explanation_he: 'סיכום קצר מהטקסט. אם מעתיקים כמעט את כל הטקסט, זה לא סיכום.'
  explanation_en: A summary is shorter than the text. Copying almost all of it is not a summary.
  tags: [summary]
- id: heb.summ.011
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 0.5
  prompt_he: 'איזה משפט הוא סיכום של: "קודם חפרו, אחר כך זרעו, ולבסוף השקו"?'
  prompt_en: 'Which sentence summarizes: "First they dug, then sowed, and finally watered"?'
  choices:
  - {he: הם אהבו מאוד את הגינה החדשה שלהם, en: They loved their new garden very much}
  - {he: הם נטעו גינה בשלושה שלבים, en: They planted a garden in three stages}
  - {he: הם קנו זרעים בחנות הקרובה לבית, en: They bought seeds at the shop near the house}
  answer: 1
  explanation_he: 'הסיכום מאחד את שלושת השלבים למשפט אחד: נטיעה בשלושה שלבים.'
  explanation_en: 'The summary merges the three stages into one sentence: planting in three stages.'
  tags: [summary]
- id: heb.summ.012
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 0.0
  prompt_he: 'איזה סיכום נכון? "השמש זורחת במזרח. בערב היא שוקעת במערב."'
  prompt_en: 'Which summary is correct? "The sun rises in the east. In the evening it sets in the west."'
  choices:
  - {he: השמש זורחת במערב ושוקעת במזרח, en: The sun rises in the west and sets in the east}
  - {he: השמש זורחת רק בבוקר, en: The sun rises only in the morning}
  - {he: השמש זורחת במזרח ושוקעת במערב, en: The sun rises in the east and sets in the west}
  answer: 2
  explanation_he: סיכום אינו משנה עובדות. כאן המזרח והמערב נשמרים במקומם הנכון.
  explanation_en: A summary does not change facts. Here east and west keep their correct places.
  tags: [summary]
- id: heb.summ.013
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: 'איזו כותרת שומרת על הרעיון: "חוקרים גילו שמים נקיים מביאים יותר דגים לנחל."?'
  prompt_en: 'Which title keeps the idea: "Researchers found that clean water brings more fish to a stream"?'
  choices:
  - {he: עוד דג קטן בנחל הגדול, en: Another small fish in the big stream}
  - {he: איך מלמדים דג קטן לשחות, en: How to teach a small fish to swim}
  - {he: 'נחל נקי, נחל מלא דגים', en: 'A clean stream, a stream full of fish'}
  answer: 2
  explanation_he: 'הכותרת צריכה להזכיר את הקשר שבטקסט: מים נקיים ויותר דגים.'
  explanation_en: 'The title must mention the link in the text: clean water and more fish.'
  tags: [summary]
- id: heb.summ.014
  skill: hebrew.text.summary
  kind: order
  grade: 8
  difficulty: 0.5
  prompt_he: סדרו את משפטי הסיכום כך שהם מספרים את אותו סיפור.
  prompt_en: Put the summary sentences in order so they tell the same story.
  choices:
  - {he: חבר עזר לו להוריד אותו מהעץ, en: A friend helped him get it down from the tree}
  - {he: הילד הודה לחבר, en: The boy thanked the friend}
  - {he: ילד איבד את כובעו ברוח, en: A boy lost his hat in the wind}
  answer: [2, 0, 1]
  explanation_he: 'בסיכום שומרים על סדר האירועים: איבוד, עזרה, תודה.'
  explanation_en: 'A summary keeps the order of events: loss, help, thanks.'
  tags: [summary]
- id: heb.summ.015
  skill: hebrew.text.summary
  kind: true_false
  grade: 8
  difficulty: -1.0
  prompt_he: סיכום טוב קצר מהטקסט המקורי.
  prompt_en: A good summary is shorter than the original text.
  answer: true
  explanation_he: המטרה של סיכום היא לומר את העיקר בקיצור.
  explanation_en: The aim of a summary is to say the main point briefly.
  tags: [summary]
- id: heb.summ.016
  skill: hebrew.text.summary
  kind: true_false
  grade: 8
  difficulty: 0.0
  prompt_he: בסיכום מוסיפים דעה אישית של המסכם.
  prompt_en: 'In a summary we add the summarizer''s personal opinion.'
  answer: false
  explanation_he: 'סיכום מוסר מה כתוב בטקסט, בלי להוסיף את מה שאנחנו חושבים.'
  explanation_en: A summary reports what is in the text without adding what we think.
  tags: [summary]
- id: heb.summ.017
  skill: hebrew.text.summary
  kind: true_false
  grade: 8
  difficulty: 0.0
  prompt_he: ניסוח מחדש שומר על המשמעות ומשנה מילים.
  prompt_en: A paraphrase keeps the meaning and changes words.
  answer: true
  explanation_he: 'כך אפשר לומר אותו דבר בדרך אחרת, למשל "מיהר" ו"רץ במהירות".'
  explanation_en: 'That way we can say the same thing differently, e.g. "hurried" and "ran quickly".'
  tags: [summary]
- id: heb.summ.018
  skill: hebrew.text.summary
  kind: true_false
  grade: 8
  difficulty: 0.5
  prompt_he: אפשר להשמיט בסיכום פרטים לא חשובים.
  prompt_en: We may omit unimportant details in a summary.
  answer: true
  explanation_he: 'סיכום מצמצם. הפרטים החשובים נשארים, והפחות חשובים אפשר להשמיט.'
  explanation_en: A summary condenses. Key details stay and less important ones can be left out.
  tags: [summary]
- id: heb.summ.019
  skill: hebrew.text.summary
  kind: true_false
  grade: 8
  difficulty: 1.0
  prompt_he: כותרת אינה יכולה להיות סיכום קצר של הטקסט.
  prompt_en: A title cannot be a short summary of the text.
  answer: false
  explanation_he: 'כותרת טובה היא סיכום קצרצר שמראה על מה הטקסט, ולכן היא יכולה להיות כזו.'
  explanation_en: 'A good title is a tiny summary showing what the text is about, so it can be one.'
  tags: [summary]
- id: heb.summ.020
  skill: hebrew.text.summary
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: 'איזה פרט חשוב יותר לסיכום הסיפור: "יעל מצאה כלב. היא נתנה לו שם, ואחר כך מצאה את בעליו והחזירה אותו."?'
  prompt_en: 'Which detail is more important for summarizing: "Yael found a dog. She gave it a name, and then found its owner and returned it."?'
  choices:
  - {he: השם החדש שיעל נתנה לכלב הקטן, en: The new name Yael gave the little dog}
  - {he: מציאת הבעלים והחזרת הכלב, en: Finding the owner and returning the dog}
  - {he: הצבע והגודל של הכלב שמצאה, en: The color and size of the dog she found}
  answer: 1
  explanation_he: בסיפור העיקר הוא ההחזרה לבעלים. שם הכלב וצבעו הם פרטים משניים.
  explanation_en: The key of the story is returning it to the owner. The name and color are secondary details.
  tags: [summary]
- id: heb.poetry.001
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 0.0
  prompt_he: 'מה התמונה בשורה: "העננים צעדו כצאן אפור על פני השמיים"?'
  prompt_en: 'What is the image in the line: "The clouds marched like a gray flock across the sky"?'
  choices:
  - {he: 'דימוי: העננים כמו צאן', en: 'A simile: clouds like a flock'}
  - {he: הפלגה בגודל ובמספר העננים, en: Hyperbole in the size and number of clouds}
  - {he: חזרה על אותה מילה בשורה, en: Repetition of the same word in the line}
  answer: 0
  explanation_he: 'יש השוואה בעזרת "כ": העננים והצאן. לכן זה דימוי, והצעידה מוסיפה גם האנשה.'
  explanation_en: 'There is a comparison with "ke": clouds and a flock. So it is a simile, and the marching adds personification.'
  tags: [poetry]
- id: heb.poetry.002
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 0.0
  prompt_he: 'מה אמצעי הציור בשורה: "הלילה פרש שמיכה כחולה על העיר"?'
  prompt_en: 'What device is in the line: "The night spread a blue blanket over the city"?'
  choices:
  - {he: 'דימוי עם המילה "כמו"', en: 'A simile with "like"'}
  - {he: שאלה לקורא, en: A question to the reader}
  - {he: 'האנשה: הלילה פורש', en: 'Personification: night spreads'}
  answer: 2
  explanation_he: 'הלילה אינו אדם ואינו פורש שמיכה. זו האנשה, בליווי תמונה של שמיכה כחולה.'
  explanation_en: The night is not a person and cannot spread a blanket. It is personification with a blanket image.
  tags: [poetry]
- id: heb.poetry.003
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'אילו שורות מתחרזות? "ירד גשם על הגג / והרחוב נהיה נחל / אני עומד ליד החלון / וחולם על חג."'
  prompt_en: 'Which lines rhyme? "Rain fell on the roof / and the street became a stream / I stand by the window / dreaming of a holiday."'
  choices:
  - {he: 'השורה השנייה והשלישית: נחל-חלון', en: 'Lines two and three: nachal-chalon'}
  - {he: 'השורה הראשונה והרביעית: גג-חג', en: 'Lines one and four: gag-chag'}
  - {he: כל ארבע השורות מתחרזות יחד, en: All four lines rhyme together}
  answer: 1
  explanation_he: גג וחג נגמרות באותו צליל ולכן מתחרזות. נחל וחלון אינן מתחרזות.
  explanation_en: '"Gag" and "chag" end with the same sound so they rhyme. "Nachal" and "chalon" do not.'
  tags: [poetry]
- id: heb.poetry.004
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 0.0
  prompt_he: 'מה מרגיש הדובר? "אני יושב לבד, והשעון מתקתק לאט. כל דקה נראית כמו שעה."'
  prompt_en: 'How does the speaker feel? "I sit alone and the clock ticks slowly. Every minute seems like an hour."'
  choices:
  - {he: שמחה גדולה, en: Great joy}
  - {he: בדידות ושעמום, en: Loneliness and boredom}
  - {he: התרגשות לפני מסיבה, en: Excitement before a party}
  answer: 1
  explanation_he: 'לבד, שעון איטי ודקות ארוכות הם סימנים לבדידות ולשעמום.'
  explanation_en: 'Alone, a slow clock and long minutes are signs of loneliness and boredom.'
  tags: [poetry]
- id: heb.poetry.005
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה אפשר לומר על הצלילים בשורה: "רחש עלים, רשרוש רוח, רחשי ערב"?'
  prompt_en: 'What can be said about the sounds in the line: "a rustle of leaves, a whisper of wind, rustlings of evening"?'
  choices:
  - {he: השורה מתחרזת עם שורה אחרת, en: The line rhymes with another line}
  - {he: אין בה שום דבר מיוחד או מעניין, en: There is nothing special or interesting about it}
  - {he: חזרה על ר ו-ש יוצרת תחושת רשרוש, en: Repeating r and sh creates a feeling of rustling}
  answer: 2
  explanation_he: 'הצלילים ר ו-ש חוזרים, והם נשמעים כמו רשרוש. כך הצליל עצמו מוסיף אווירה.'
  explanation_en: The sounds r and sh repeat and sound like rustling. So the sound itself adds atmosphere.
  tags: [poetry]
- id: heb.poetry.006
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 0.0
  prompt_he: 'איזו שורה מכילה ניגוד?'
  prompt_en: 'Which line contains a contrast?'
  choices:
  - {he: בחוץ חם ובפנים קר, en: Hot outside and cold inside}
  - {he: השמש זורחת מעל הים, en: The sun shines over the sea}
  - {he: ציפור שרה על הענף, en: A bird sings on the branch}
  answer: 0
  explanation_he: 'ניגוד הוא שני דברים הפוכים בשורה אחת: חם וקר, בחוץ ובפנים.'
  explanation_en: 'A contrast is two opposite things in one line: hot and cold, outside and inside.'
  tags: [poetry]
- id: heb.poetry.007
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'מה מוסיפה החזרה בשורות: "עוד יום, עוד יום, עוד יום של חול"?'
  prompt_en: 'What does the repetition add in the lines: "Another day, another day, another day of routine"?'
  choices:
  - {he: הומור גדול והרבה צחוק בשיר, en: Great humor and a lot of laughter in the poem}
  - {he: תחושה של שגרה ושל משך ארוך, en: A feeling of routine and long duration}
  - {he: מידע חדש על היום ועל השעה, en: New information about the day and the hour}
  answer: 1
  explanation_he: המילים החוזרות יוצרות קצב אחיד ומראות שהימים דומים זה לזה.
  explanation_en: Repeated words create an even rhythm and show that the days are alike.
  tags: [poetry]
- id: heb.poetry.008
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה פירוש הדימוי בשורה: "הזמן הוא נהר שלא עוצר"?'
  prompt_en: 'What does the image in the line "time is a river that does not stop" mean?'
  choices:
  - {he: שהזמן זורם תמיד ולא חוזר, en: That time always flows and does not return}
  - {he: שבנהר יש הרבה מים ושקט גדול, en: That a river has a lot of water and great quiet}
  - {he: שצריך לשחות בנהר כל בוקר, en: That one must swim in the river every morning}
  answer: 0
  explanation_he: 'זו מטפורה: הזמן מושווה לנהר, וכמו נהר הוא נע קדימה בלי לחזור.'
  explanation_en: 'This is a metaphor: time is compared to a river, which moves forward without returning.'
  tags: [poetry]
- id: heb.poetry.009
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 1.5
  prompt_he: 'מה ההבדל בין מטפורה לדימוי?'
  prompt_en: 'What is the difference between a metaphor and a simile?'
  choices:
  - {he: במטפורה יש תמיד מספרים גדולים, en: A metaphor always has big numbers}
  - {he: אין שום הבדל ביניהם בכלל, en: There is no difference between them at all}
  - {he: 'במטפורה אין "כמו", הדבר הוא דבר אחר', en: 'A metaphor has no "like", one thing is another'}
  answer: 2
  explanation_he: 'דימוי: "הזמן כמו נהר". מטפורה: "הזמן הוא נהר". במטפורה ההשוואה מוסתרת.'
  explanation_en: 'Simile: "time is like a river". Metaphor: "time is a river". In a metaphor the comparison is hidden.'
  tags: [poetry]
- id: heb.poetry.010
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'איזו שורה היא מטפורה?'
  prompt_en: 'Which line is a metaphor?'
  choices:
  - {he: הילדות היא גן פורח, en: Childhood is a blooming garden}
  - {he: הילדות כמו גן פורח, en: Childhood is like a blooming garden}
  - {he: בילדות היו לי גן וחברים, en: In childhood I had a garden and friends}
  answer: 0
  explanation_he: 'במשפט הראשון הילדות "היא" גן, בלי המילה כמו. זו מטפורה.'
  explanation_en: 'In the first, childhood "is" a garden, without the word "like". That is a metaphor.'
  tags: [poetry]
- id: heb.poetry.011
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה מעביר הקצב המהיר בשורות קצרות: "רץ. עוצר. נושם. רץ."?'
  prompt_en: 'What does the quick rhythm of short lines convey: "Runs. Stops. Breathes. Runs."?'
  choices:
  - {he: שינה ורוגע גדול, en: Sleep and great calm}
  - {he: מתח ותנועה מהירה, en: Tension and quick movement}
  - {he: שעמום ארוך ומתיש, en: 'Long, tiring boredom'}
  answer: 1
  explanation_he: משפטים קצרים ורצופים יוצרים תחושה של תנועה מהירה ומתח.
  explanation_en: Short consecutive sentences create a feeling of fast movement and tension.
  tags: [poetry]
- id: heb.poetry.012
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה אפשר לומר על השורה: "שמש, שמש, תעלי מהר"?'
  prompt_en: 'What can be said about the line: "Sun, sun, rise quickly"?'
  choices:
  - {he: השמש עונה לשאלה שהדובר שאל, en: The sun answers a question the speaker asked}
  - {he: זה מתכון לעוגה עם חלמון שמש, en: It is a recipe for a cake with a sun-yolk}
  - {he: הדובר פונה לשמש כאל אדם, en: The speaker addresses the sun as a person}
  answer: 2
  explanation_he: 'פנייה לשמש כאל אדם היא האנשה, והחזרה על "שמש" מוסיפה געגוע.'
  explanation_en: 'Addressing the sun as a person is personification, and the repetition of "sun" adds longing.'
  tags: [poetry]
- id: heb.poetry.013
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'למה משורר בוחר מילים כמו "רשרוש", "טפטוף" ו"המהום"?'
  prompt_en: 'Why does a poet choose words like "rustle", "drip" and "hum"?'
  choices:
  - {he: כי הן קצרות ונוחות להקלדה, en: Because they are short and easy to type}
  - {he: כי הן לא מובנות, en: Because they are not understood}
  - {he: כי הצליל מזכיר את הדבר עצמו, en: Because the sound recalls the thing itself}
  answer: 2
  explanation_he: מילים שנשמעות כמו מה שהן מתארות מוסיפות תחושה חזקה לשיר.
  explanation_en: Words that sound like what they describe add a strong feeling to the poem.
  tags: [poetry]
- id: heb.poetry.014
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'מה הכוונה ב"ליבי רץ אחריך"?'
  prompt_en: 'What is meant by "my heart runs after you"?'
  choices:
  - {he: שהדובר מתגעגע ורוצה להיות קרוב, en: That the speaker longs and wants to be near}
  - {he: שהלב נפל מהגוף ורץ בכביש, en: That the heart fell out of the body and ran in the road}
  - {he: שהדובר רץ מרתון שלם אחריו, en: That the speaker ran a whole marathon after him}
  answer: 0
  explanation_he: ללב אין רגליים. זו דרך ציורית לתאר געגוע וצורך להיות עם מישהו.
  explanation_en: A heart has no legs. It is a figurative way to describe longing and a need to be with someone.
  tags: [poetry]
- id: heb.poetry.015
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 0.0
  prompt_he: 'איזה רגש מביע שיר שפותח: "הכול כל כך אפור, והרחוב ריק, ואין מי שישאל מה שלומי"?'
  prompt_en: 'Which feeling does a poem opening like this express: "Everything is so gray, the street is empty and no one asks how I am"?'
  choices:
  - {he: הצלחה וגאווה, en: Success and pride}
  - {he: עצב ובדידות, en: Sadness and loneliness}
  - {he: הרפתקנות ומתח, en: Adventure and suspense}
  answer: 1
  explanation_he: 'אפור, רחוב ריק ואף אחד שלא שואל מראים עצב ובדידות.'
  explanation_en: 'Gray, an empty street and no one asking show sadness and loneliness.'
  tags: [poetry]
- id: heb.poetry.016
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'איזה שיר מתאים לכותרת "כשהים נרדם"?'
  prompt_en: 'Which poem fits the title "When the sea falls asleep"?'
  choices:
  - {he: הרכבת יוצאת בשמונה בבוקר מהתחנה, en: The train leaves at eight in the morning from the station}
  - {he: 'הגלים נרגעים, ורק הירח נשאר ער', en: The waves calm down and only the moon stays awake}
  - {he: מחר יש מבחן קשה בחשבון בכיתה, en: Tomorrow there is a hard math test in class}
  answer: 1
  explanation_he: 'הכותרת מדברת על ים רגוע כמו אדם ישן, והשורה הראשונה ממשיכה את התמונה הזו.'
  explanation_en: 'The title describes a calm sea like a sleeping person, and the first line continues that image.'
  tags: [poetry]
- id: heb.poetry.017
  skill: hebrew.text.poetry
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מדוע שירים נכתבים לעתים בשורות קצרות?'
  prompt_en: 'Why are poems often written in short lines?'
  choices:
  - {he: כדי לשים דגש על מילים ולתת קצב, en: To stress words and give a rhythm}
  - {he: כי אין מספיק מקום בדף הנייר, en: Because there is not enough room on the sheet of paper}
  - {he: כי השיר בלי משמעות מיוחדת, en: Because the poem has no special meaning}
  answer: 0
  explanation_he: 'שבירת השורה יוצרת הפסקה, נותנת משקל למילה ומשפיעה על הקצב.'
  explanation_en: 'Breaking the line creates a pause, gives weight to a word and affects the rhythm.'
  tags: [poetry]
- id: heb.poetry.018
  skill: hebrew.text.poetry
  kind: true_false
  grade: 9
  difficulty: 0.0
  prompt_he: 'כשכותבים "הלילה פרש שמיכה" זו האנשה.'
  prompt_en: 'Writing "the night spread a blanket" is personification.'
  answer: true
  explanation_he: 'פרישת שמיכה היא פעולה של אדם. הלילה "עושה" אותה, ולכן זו האנשה.'
  explanation_en: 'Spreading a blanket is a human action. The night "does" it, so this is personification.'
  tags: [poetry]
- id: heb.poetry.019
  skill: hebrew.text.poetry
  kind: true_false
  grade: 9
  difficulty: 0.5
  prompt_he: 'מטפורה חייבת להכיל את המילה "כמו".'
  prompt_en: 'A metaphor must contain the word "like".'
  answer: false
  explanation_he: 'המילה "כמו" שייכת לדימוי. במטפורה אומרים שדבר הוא דבר אחר.'
  explanation_en: 'The word "like" belongs to a simile. In a metaphor we say one thing is another.'
  tags: [poetry]
- id: heb.poetry.020
  skill: hebrew.text.poetry
  kind: true_false
  grade: 9
  difficulty: -1.0
  prompt_he: חריזה היא אותו צליל בסוף שורות.
  prompt_en: Rhyme is the same sound at the ends of lines.
  answer: true
  explanation_he: 'שורות שנגמרות באותו צליל מתחרזות, כמו גג וחג.'
  explanation_en: 'Lines that end with the same sound rhyme, like "gag" and "chag".'
  tags: [poetry]
- id: heb.poetry.021
  skill: hebrew.text.poetry
  kind: true_false
  grade: 9
  difficulty: 0.0
  prompt_he: בשיר אסור להשתמש בחזרה על מילים.
  prompt_en: In a poem one must not repeat words.
  answer: false
  explanation_he: 'חזרה היא אמצעי נפוץ בשירה, והיא מדגישה רגש ויוצרת קצב.'
  explanation_en: Repetition is a common poetic device; it stresses feeling and creates rhythm.
  tags: [poetry]
- id: heb.poetry.022
  skill: hebrew.text.poetry
  kind: true_false
  grade: 9
  difficulty: 0.5
  prompt_he: אפשר להבין את רגש השיר גם לפי הצבעים והצלילים שבו.
  prompt_en: 'We can understand a poem''s mood also from its colors and sounds.'
  answer: true
  explanation_he: 'צבעים כמו אפור, וצלילים כמו שקט או רעם, מביעים אווירה ורגש.'
  explanation_en: Colors like gray and sounds like quiet or thunder express atmosphere and feeling.
  tags: [poetry]
- id: heb.tone.001
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'מה הטון בשורה: "איזה יופי, עוד שיעור בלי הפסקה"?'
  prompt_en: 'What is the tone in the line: "How lovely, another lesson with no break"?'
  choices:
  - {he: שמח באמת ומרוצה מהשיעור, en: Truly happy and pleased with the lesson}
  - {he: מופתע לטובה מההפסקה שהגיעה, en: Pleasantly surprised by the break that came}
  - {he: 'אירוני: הכוונה ההפוכה', en: 'Ironic: the opposite is meant'}
  answer: 2
  explanation_he: 'מי שמתלונן על שיעור בלי הפסקה אינו מתכוון ל"איזה יופי". הוא אומר את ההפך כדי להתלונן.'
  explanation_en: 'Someone complaining about a lesson without a break does not mean "how lovely". He says the opposite to complain.'
  tags: [tone]
- id: heb.tone.002
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה הטון במשפט: "הציון שלי היה לא משהו" כשהציון הוא 20?'
  prompt_en: 'What is the tone in the sentence: "My grade was not much" when the grade is 20?'
  choices:
  - {he: 'המעטה: דיבור עדין על דבר גרוע', en: 'Understatement: gentle talk about something bad'}
  - {he: 'הפלגה: מגזימים בגלוי ובכוונה', en: 'Exaggeration: openly and intentionally overstating'}
  - {he: 'התפעלות: מתפעלים מאוד מהציון', en: 'Admiration: greatly admiring the grade'}
  answer: 0
  explanation_he: 'ציון 20 הוא נמוך מאוד, ו"לא משהו" נשמע עדין. זה הפך של הגזמה, ונקרא המעטה.'
  explanation_en: 'A grade of 20 is very low, and "not much" sounds gentle. It is the opposite of exaggeration, called understatement.'
  tags: [tone]
- id: heb.tone.003
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'מה הכוונה של הדובר: "בדיוק מה שהייתי צריך, עוד ערימה של שיעורי בית!"'
  prompt_en: 'What does the speaker mean: "Exactly what I needed, another pile of homework!"'
  choices:
  - {he: שהוא מודה למורה על השיעורים, en: That he thanks the teacher for the homework}
  - {he: שהוא אינו שמח בכלל מהשיעורים, en: That he is not happy at all about the homework}
  - {he: שהוא מבקש עוד שיעורים לשבוע, en: That he asks for more homework for the week}
  answer: 1
  explanation_he: 'המילים טובות, אבל המשמעות הפוכה. כך נשמעת אירוניה.'
  explanation_en: The words are good but the meaning is opposite. That is how irony sounds.
  tags: [tone]
- id: heb.tone.004
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'איזה משפט כתוב בטון לגלגני?'
  prompt_en: 'Which sentence is written in a mocking tone?'
  choices:
  - {he: 'תודה על העזרה, היא באמת עזרה לי', en: 'Thanks for the help, it really helped me'}
  - {he: 'אני מצטער, טעיתי בחישוב', en: 'I am sorry, I made a calculation error'}
  - {he: 'כמובן, אתה הכי חכם וצודק תמיד', en: 'Of course, you are the smartest and always right'}
  answer: 2
  explanation_he: ההגזמה בשבח מראה שהכוונה לעקוץ. בשני האחרים הדובר כן.
  explanation_en: The exaggerated praise shows the aim is to sting. In the other two the speaker is sincere.
  tags: [tone]
- id: heb.tone.005
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: -1.0
  prompt_he: 'מה הטון של: "אני מבקש בנימוס לא להשאיר פסולת בחצר"?'
  prompt_en: 'What is the tone of: "I politely ask not to leave litter in the yard"?'
  choices:
  - {he: כועס ומאיים בקול רם, en: Angry and threatening in a loud voice}
  - {he: מנומס ועניינית, en: Polite and factual}
  - {he: מבדח ומצחיק מאוד, en: Joking and very funny}
  answer: 1
  explanation_he: 'המילים "אני מבקש בנימוס" מראות שהדובר רוצה לשכנע בנעימות.'
  explanation_en: 'The words "I politely ask" show the speaker wants to persuade pleasantly.'
  tags: [tone]
- id: heb.tone.006
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: -1.0
  prompt_he: 'איזו מילה מרמזת על טון כועס?'
  prompt_en: 'Which word hints at an angry tone?'
  choices:
  - {he: 'די כבר!', en: 'Enough already!'}
  - {he: בבקשה, en: please}
  - {he: תודה רבה, en: thank you very much}
  answer: 0
  explanation_he: 'קריאה כמו "די כבר!" מביעה כעס. בבקשה ותודה הן מילים מנומסות.'
  explanation_en: 'A call like "enough already!" expresses anger. Please and thanks are polite words.'
  tags: [tone]
- id: heb.tone.007
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה אומר משפט שנגמר בשלוש נקודות: "ובכן, ניסינו הכול..."?'
  prompt_en: 'What does a sentence ending with three dots say: "Well, we tried everything..."?'
  choices:
  - {he: המשפט תם לגמרי ואין בו דבר נוסף, en: The sentence is complete with nothing more}
  - {he: 'יש עוד משהו שלא נאמר, אולי אכזבה', en: 'There is something unsaid, perhaps disappointment'}
  - {he: המשפט שואל שאלה ומחכה לתשובה מיד, en: The sentence asks a question and awaits an answer at once}
  answer: 1
  explanation_he: 'שלוש נקודות רומזות להמשך שלא נאמר, ובמקרה הזה לרגש של אכזבה או חוסר אונים.'
  explanation_en: 'Three dots hint at something unsaid, here a feeling of disappointment or helplessness.'
  tags: [tone]
- id: heb.tone.008
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה מבינים מהמשפט: "הוא תמיד ממהר, והפעם האיחור הגיע לפניו"?'
  prompt_en: 'What do we understand from: "He is always in a hurry, and this time the lateness arrived before him"?'
  choices:
  - {he: 'שהוא איחר, והכותב אומר זאת בהומור', en: 'That he was late, and the writer says so humorously'}
  - {he: שהוא הגיע מוקדם מאוד לפני כולם, en: That he arrived very early before everyone}
  - {he: שהאיחור הוא אדם שהלך לפניו, en: That lateness is a person who walked before him}
  answer: 0
  explanation_he: 'האיחור כאילו הגיע קודם: דרך הומוריסטית להגיד שהוא איחר.'
  explanation_en: 'Lateness as if it arrived first: a humorous way to say he was late.'
  tags: [tone]
- id: heb.tone.009
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'איזה משפט מביע ביקורת בעדינות?'
  prompt_en: 'Which sentence expresses criticism gently?'
  choices:
  - {he: זה נורא ואין מה לשפר בכלל כאן, en: This is terrible and nothing can be improved here}
  - {he: אף אחד לא יבין את זה לעולם, en: No one will ever understand this}
  - {he: אולי כדאי לחשוב שוב על הניסוח, en: Perhaps it is worth thinking again about the wording}
  answer: 2
  explanation_he: 'הניסוח "אולי כדאי" מציע במקום להאשים, ולכן הביקורת עדינה.'
  explanation_en: 'The wording "perhaps it is worth" suggests instead of blaming, so the criticism is gentle.'
  tags: [tone]
- id: heb.tone.010
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 0.5
  prompt_he: 'איזה משפט מכיל הפלגה (הגזמה)?'
  prompt_en: 'Which sentence contains exaggeration?'
  choices:
  - {he: חיכיתי לך עשר דקות בלבד ליד השער, en: I waited for you only ten minutes at the gate}
  - {he: חיכיתי לך שנים על גבי שנים, en: I waited for you years upon years}
  - {he: חיכיתי לך ליד השער כמה רגעים, en: I waited for you at the gate a few moments}
  answer: 1
  explanation_he: '"שנים על גבי שנים" מוגזם, והוא נועד להראות שהזמן נראה ארוך. שני האחרים עובדתיים.'
  explanation_en: '"Years upon years" is exaggerated to show it felt long. The other two are factual.'
  tags: [tone]
- id: heb.tone.011
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.5
  prompt_he: 'למה כותבים לפעמים בלשון המעטה?'
  prompt_en: 'Why do writers sometimes use understatement?'
  choices:
  - {he: כי אין להם מילים אחרות לתאר זאת, en: Because they have no other words to describe it}
  - {he: כדי שלא יבינו אותם בכלל לעולם, en: So that they will never be understood at all}
  - {he: כדי להביע דבר רציני בעדינות, en: To express something serious gently}
  answer: 2
  explanation_he: 'המעטה כמו "קצת חם" ליום לוהט יוצרת הומור או רכות.'
  explanation_en: 'Understatement like "a bit warm" for a scorching day creates humor or softness.'
  tags: [tone]
- id: heb.tone.012
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'איזה משפט כתוב בטון מתנשא?'
  prompt_en: 'Which sentence is written in a condescending tone?'
  choices:
  - {he: 'אתה לא תבין, זה קשה מדי בשבילך', en: 'You will not understand, it is too hard for you'}
  - {he: 'אסביר לך שוב, אם תרצה, בשמחה', en: 'I will explain again to you, if you wish, gladly'}
  - {he: 'שאל אותי כל שאלה, אשמח לעזור', en: 'Ask me any question, I would be glad to help'}
  answer: 0
  explanation_he: 'משפט שמניח שהשומע אינו מסוגל לא מכבד אותו, ולכן הטון מתנשא.'
  explanation_en: 'A sentence that assumes the listener cannot does not respect him, so the tone is condescending.'
  tags: [tone]
- id: heb.tone.013
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: -1.0
  prompt_he: 'איזה משפט מביע גאווה?'
  prompt_en: 'Which sentence expresses pride?'
  choices:
  - {he: 'סוף סוף עשיתי זאת, והצלחתי לבד!', en: 'At last I did it, and I managed alone!'}
  - {he: 'לא יודע, אולי זה בכלל לא חשוב', en: 'Don''t know, maybe it is not important at all'}
  - {he: הלוואי שלא הייתי צריך לעשות זאת, en: I wish I had not had to do it}
  answer: 0
  explanation_he: '"סוף סוף" ו"הצלחתי לבד" מראות סיפוק והישג.'
  explanation_en: '"At last" and "I managed alone" show satisfaction and achievement.'
  tags: [tone]
- id: heb.tone.014
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.5
  prompt_he: 'קורא כתב: "תודה רבה על העיכוב, הרבה זמן רציתי להמתין". מה הכוונה?'
  prompt_en: 'A reader wrote: "Thanks so much for the delay, I have long wanted to wait". What is meant?'
  choices:
  - {he: תודה כנה על האיחור הגדול הזה, en: Sincere thanks for this big delay}
  - {he: בקשה להאריך את ההמתנה עוד קצת, en: A request to lengthen the waiting a bit more}
  - {he: ביקורת אירונית על האיחור, en: Ironic criticism of the lateness}
  answer: 2
  explanation_he: אף אחד אינו רוצה באמת להמתין. המשפט אומר ההפך כדי להתלונן.
  explanation_en: No one truly wants to wait. The sentence says the opposite in order to complain.
  tags: [tone]
- id: heb.tone.015
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה ההבדל בין "הוא ממהר" ל"הוא טס"?'
  prompt_en: 'What is the difference between "he hurries" and "he flies"?'
  choices:
  - {he: הראשון מגזים כדי להדגיש רוגע, en: The first exaggerates to stress calm}
  - {he: השני מגזים כדי להדגיש מהירות, en: The second exaggerates to stress speed}
  - {he: אין שום קשר ביניהם בכלל לעולם, en: There is no link between them ever at all}
  answer: 1
  explanation_he: '"טס" כאן אומר ממהר מאוד, והמילה מוגזמת בכוונה, כמו הפלגה.'
  explanation_en: '"Flies" here means very fast, an intentional exaggeration like hyperbole.'
  tags: [tone]
- id: heb.tone.016
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'איזו משמעות מרומזת בשאלה: "אתה באמת חושב שזה רעיון טוב?"'
  prompt_en: 'What meaning is hinted at by the question: "Do you really think this is a good idea?"'
  choices:
  - {he: שהדובר מרוצה מאוד מהרעיון הזה, en: That the speaker is very pleased with this idea}
  - {he: שהדובר מפקפק ואינו חושב שזה טוב, en: That the speaker doubts and does not think it is good}
  - {he: שהדובר לא מבין את המילים שנאמרו, en: That the speaker does not understand the words said}
  answer: 1
  explanation_he: שאלה כזו לפעמים אינה בקשת מידע אלא דרך להביע ספק.
  explanation_en: Such a question is sometimes not a request for information but a way to express doubt.
  tags: [tone]
- id: heb.tone.017
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: 'מה אפשר להסיק מהמשפט: "היא חייכה חיוך דק וגלגלה את עיניה"?'
  prompt_en: 'What can we conclude from: "She smiled a thin smile and rolled her eyes"?'
  choices:
  - {he: 'שהיא לא מתלהבת, אולי מגלגלת', en: 'That she is not enthusiastic, perhaps mocking'}
  - {he: שהיא מאושרת מאוד מהמתנה שקיבלה, en: That she is very happy with the gift she received}
  - {he: שהיא ישנה עמוק בכיסא שליד, en: That she is fast asleep in the chair nearby}
  answer: 0
  explanation_he: חיוך דק וגלגול עיניים הם סימנים לחוסר התלהבות או ללגלוג.
  explanation_en: A thin smile and rolled eyes signal lack of enthusiasm or mockery.
  tags: [tone]
- id: heb.tone.018
  skill: hebrew.text.tone
  kind: choice
  grade: 9
  difficulty: 1.5
  prompt_he: 'מה פירוש "הכותב כתב בין השורות"?'
  prompt_en: 'What does "the writer wrote between the lines" mean?'
  choices:
  - {he: שהוא כתב בין שורות הדף במחברת, en: That he wrote between the lines of the page in a notebook}
  - {he: שהוא שכח לכתוב כמה שורות בדף, en: That he forgot to write a few lines on the page}
  - {he: שיש משמעות שלא נאמרה במפורש, en: That there is a meaning not stated explicitly}
  answer: 2
  explanation_he: קוראים בין השורות כשמבינים משמעות שהכותב רמז לה בלי לומר.
  explanation_en: We read between the lines when we understand a meaning the writer hinted at without saying.
  tags: [tone]
- id: heb.tone.019
  skill: hebrew.text.tone
  kind: true_false
  grade: 9
  difficulty: 0.0
  prompt_he: באירוניה אומרים דבר אחד ומתכוונים להפוכו.
  prompt_en: In irony we say one thing and mean the opposite.
  answer: true
  explanation_he: 'למשל "איזה יום נהדר" בגשם סוחף: הכוונה שהיום לא נעים.'
  explanation_en: 'For instance "what a wonderful day" in pouring rain: the meaning is that the day is unpleasant.'
  tags: [tone]
- id: heb.tone.020
  skill: hebrew.text.tone
  kind: true_false
  grade: 9
  difficulty: 0.0
  prompt_he: הטון של טקסט משפיע על האופן שבו מבינים אותו.
  prompt_en: The tone of a text affects how it is understood.
  answer: true
  explanation_he: 'אותו משפט יכול להישמע רציני, מצחיק או עוקצני, לפי הטון.'
  explanation_en: 'The same sentence can sound serious, funny or stinging, depending on the tone.'
  tags: [tone]
- id: heb.tone.021
  skill: hebrew.text.tone
  kind: true_false
  grade: 9
  difficulty: 0.5
  prompt_he: הפלגה והמעטה הן אותו דבר.
  prompt_en: Exaggeration and understatement are the same thing.
  answer: false
  explanation_he: 'הפלגה מגדילה ("מיליון פעם"), והמעטה מקטינה ("קצת קר" בקוטב). הן הפוכות.'
  explanation_en: 'Exaggeration enlarges ("a million times"), understatement diminishes ("a bit cold" at the Pole). They are opposites.'
  tags: [tone]
- id: heb.tone.022
  skill: hebrew.text.tone
  kind: true_false
  grade: 9
  difficulty: 1.0
  prompt_he: כל שאלה היא תמיד בקשת מידע.
  prompt_en: Every question is always a request for information.
  answer: false
  explanation_he: 'יש שאלות רטוריות שאינן מבקשות תשובה, אלא מביעות דעה או ספק.'
  explanation_en: 'Some questions are rhetorical: they do not ask for an answer but express an opinion or doubt.'
  tags: [tone]
- id: heb.tone.023
  skill: hebrew.text.tone
  kind: true_false
  grade: 9
  difficulty: 1.0
  prompt_he: אפשר להבין לפעמים מהטון שהכותב מתכוון להפוך ממה שכתב.
  prompt_en: From the tone we can sometimes understand that the writer means the opposite of what he wrote.
  answer: true
  explanation_he: 'כשהטון אירוני, המשמעות האמיתית נמצאת בין השורות ולא במילים עצמן.'
  explanation_en: 'When the tone is ironic, the real meaning is between the lines and not in the words themselves.'
  tags: [tone]

- id: heb.argu.024
  skill: hebrew.text.argument
  kind: true_false
  grade: 9
  difficulty: 1.5
  prompt_he: 'המילה "תמיד" בטענה עלולה להפוך אותה להכללה שקל להפריך.'
  prompt_en: 'The word "always" in a claim may turn it into an easily refuted generalization.'
  answer: true
  explanation_he: 'מספיק מקרה אחד חריג כדי להפריך משפט שאומר "תמיד" או "כל". ניסוח זהיר חזק יותר.'
  explanation_en: 'One exception is enough to refute a statement with "always" or "all". Careful wording is stronger.'
  tags: [argument]

  choices:
  - {he: להביא עובדות ולהסביר, en: To give facts and explain}
  - {he: לשעשע בחרוזים, en: To amuse with rhymes}
  - {he: להזמין לאירוע, en: To invite to an event}
  answer: 0
  explanation_he: 'טקסט מידע מלמד אותנו משהו על העולם, למשל על חיות או על מקומות.'
  explanation_en: 'An informational text teaches us something about the world, e.g. about animals or places.'
  tags: [text_types]
- id: heb.ttype.012
  skill: hebrew.text.text_types
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'מה מטרת סיפור?'
  prompt_en: 'What is the purpose of a story?'
  choices:
  - {he: לתת הוראות הפעלה, en: To give operating instructions}
  - {he: לספר על דמויות ואירועים, en: To tell about characters and events}
  - {he: לדווח על חדשות, en: To report news}
  answer: 1
  explanation_he: 'בסיפור יש דמויות ועלילה, ולפעמים גם מסר.'
  explanation_en: 'A story has characters and a plot, and sometimes a message.'
  tags: [text_types]
- id: heb.ttype.013
  skill: hebrew.text.text_types
  kind: choice
  grade: 5
  difficulty: -1.0
  prompt_he: 'באיזה סוג טקסט מוצאים חרוזים בדרך כלל?'
  prompt_en: 'In which kind of text do we usually find rhymes?'
  choices:
  - {he: הוראות, en: instructions}
  - {he: כתבה, en: news report}
  - {he: שיר, en: poem}
  answer: 2

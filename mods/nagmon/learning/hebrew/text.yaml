  explanation_en: 'Rhymes are similar sounds at the ends of lines, and poems have many.'
  tags: [text_types]
- id: heb.ttype.014
  skill: hebrew.text.text_types
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'איזה טקסט מתחיל במילה "שלום" ונגמר בשם הכותב?'
  prompt_en: 'Which text begins with "hello" and ends with the writer''s name?'
  choices:
  - {he: מתכון, en: recipe}
  - {he: מכתב, en: letter}
  - {he: כתבה, en: news report}
  answer: 1
  explanation_he: 'מכתב כתוב לאדם מסוים, ולכן מתחיל בפנייה ונגמר בחתימה.'
  explanation_en: 'A letter is written to a specific person, so it opens with a greeting and ends with a signature.'
  tags: [text_types]
- id: heb.ttype.015
  skill: hebrew.text.text_types
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'איפה נצפה למצוא את הכותרות "מצרכים" ו"אופן ההכנה"?'
  prompt_en: 'Where would we expect to find the headings "ingredients" and "method"?'
  choices:
  - {he: במתכון, en: in a recipe}
  - {he: בשיר, en: in a poem}
  - {he: בהזמנה, en: in an invitation}
  answer: 0
  explanation_he: 'מתכון הוא סוג של הוראות, והוא כולל רשימת חומרים ושלבי עבודה.'
  explanation_en: 'A recipe is a kind of instructions: a list of ingredients and steps.'
  tags: [text_types]
- id: heb.ttype.016
  skill: hebrew.text.text_types
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: 'איזה טקסט מציין מתי ואיפה יתקיים אירוע?'
  prompt_en: 'Which text says when and where an event takes place?'
  choices:
  - {he: הזמנה, en: invitation}
  - {he: שיר, en: poem}
  - {he: סיפור, en: story}
  answer: 0
  explanation_he: 'בהזמנה כתובים שעה, תאריך ומקום, כדי שהמוזמן יידע לבוא.'
  explanation_en: 'An invitation has the time, date and place, so the guest knows to come.'
  tags: [text_types]
- id: heb.ttype.017
  skill: hebrew.text.text_types
  kind: choice
  grade: 5
  difficulty: 0.5
  prompt_he: 'איזה משפט מתאים לפתיחת סיפור?'
  prompt_en: 'Which sentence fits the opening of a story?'
  choices:
  - {he: לפניכם הוראות להרכבת המדף., en: Here are the instructions for assembling the shelf.}
  - {he: הזמנה לכל תלמידי כיתה ה., en: An invitation to all fifth graders.}
  - {he: תמר התעוררה וגילתה מעטפה על הכרית., en: Tamar woke and found an envelope on her pillow.}
  answer: 2

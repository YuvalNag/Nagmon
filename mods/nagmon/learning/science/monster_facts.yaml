# Nagmon learning content - science / monster science cards (קלפי מדע): 8 real-world facts per Tuxemon element + 2 quiz items per element
# Format: docs/kids/SDD_CONTENT.md section 3. Generated from curated sources; reviewed by a parent.
# Hebrew without niqqud. Answer indexes are 0-based; for kind=order, answer lists choice indexes in the correct order.
# Curriculum alignment: Israeli MoE "מדע וטכנולוגיה" (science and technology) strands -
#   materials, energy and interactions, systems and processes in living things, earth and universe, technology.
# Sources consulted:
#   - Elementary curriculum (grades 1-6): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/yesodi/technology-science-pedagogy/curriculum
#   - Elementary curriculum PDF (2009 draft): https://meyda.education.gov.il/files/Tochniyot_Limudim/KdamYesodi/MadaTechnologia.pdf
#   - Middle school (grades 7-9): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/chativat-beynayim/mada-technologia-pedagogia/curriculum
#   - Grade 8/9 test specifications (Meitzav/RAMA): https://meyda.education.gov.il/files/Rama/Mifrat_sci_9_H_2027.pdf
# Structure: elements.<element>.facts are shown on a monster's science card (GAME_PLAN 5.3 "קלפי מדע"); items are regular bank items tagged element_<name>.
# Element themes: cosmic=space, earth=rocks and soil, fire=burning and heat, frost=ice and cold, heroic=human body and science heroes,
# lightning=electricity, metal=metals, normal=everyday science, shadow=light, shadows and night, sky=air, weather and flight,
# venom=stings, venom and toxins (calm, safety-first), water=water and oceans, wood=trees and forests.

skill: science.elements.cards
elements:
  cosmic:
    title_he: קוסמי
    title_en: Cosmic
    facts:
    - id: fact.cosmic.01
      he: השמש היא כוכב, וגדולה כל כך שכ-1.3 מיליון כדורי ארץ היו יכולים להיכנס לתוכה.
      en: The sun is a star so big that about 1.3 million Earths could fit inside it.
    - id: fact.cosmic.02
      he: אור השמש מגיע לכדור הארץ בתוך כ-8 דקות, אף שהוא נע כ-300,000 קילומטר בשנייה.
      en: Sunlight reaches Earth in about 8 minutes, even though it travels about 300,000 km per second.
    - id: fact.cosmic.03
      he: על הירח אין אוויר, ולכן שם שקט מוחלט, והשמיים שחורים אפילו ביום.
      en: The moon has no air, so it is totally silent and the sky is black even in daytime.
    - id: fact.cosmic.04
      he: בגלקסיה שלנו, שביל החלב, יש מאות מיליארדי כוכבים, והשמש היא רק אחד מהם.
      en: Our galaxy, the Milky Way, has hundreds of billions of stars, and the sun is just one of them.
    - id: fact.cosmic.05
      he: לשבתאי יש יותר ממאה ירחים מוכרים, ועוד ממשיכים לגלות חדשים.
      en: Saturn has more than a hundred known moons, and new ones keep being discovered.
    - id: fact.cosmic.06
      he: תחנת החלל הבינלאומית מקיפה את כדור הארץ בכ-90 דקות, ולכן האסטרונאוטים בה רואים כ-16 זריחות ביום.
      en: The International Space Station circles Earth in about 90 minutes, so its astronauts see about 16 sunrises a day.
    - id: fact.cosmic.07
      he: 'הצבע של כוכב מגלה את החום שלו: כוכבים כחולים חמים במיוחד, וכוכבים אדומים קרירים יותר.'
      en: 'A star''s color reveals its temperature: blue stars are extra hot and red stars are cooler.'
    - id: fact.cosmic.08
      he: על נוגה יום אחד ארוך יותר משנה שלמה שם, כי הוא מסתובב סביב עצמו לאט מאוד.
      en: On Venus one day is longer than its whole year, because it spins very slowly.
  earth:
    title_he: אדמה
    title_en: Earth
    facts:
    - id: fact.earth.01
      he: כדור הארץ הוא כוכב הלכת היחיד שאנחנו מכירים שיש על פניו מים נוזליים בימים ובאוקיינוסים.
      en: Earth is the only planet we know with liquid water in seas and oceans on its surface.
    - id: fact.earth.02
      he: ההר הגבוה ביותר בעולם הוא האוורסט, כמעט 8,850 מטר מעל פני הים.
      en: The world's highest mountain is Everest, almost 8,850 meters above sea level.
    - id: fact.earth.03
      he: בכפית אחת של אדמה בריאה חיים יותר יצורים זעירים ממספר כל האנשים בעולם.
      en: A single teaspoon of healthy soil holds more tiny living things than there are people in the world.
    - id: fact.earth.04
      he: תולעי אדמה חופרות מנהרות שמכניסות אוויר ומים לקרקע, וכך עוזרות לצמחים לגדול.
      en: Earthworms dig tunnels that let air and water into the soil, helping plants grow.
    - id: fact.earth.05
      he: יהלום הוא החומר הטבעי הקשה ביותר, והוא עשוי מפחמן בלבד, כמו הגרפיט בעיפרון.
      en: Diamond is the hardest natural material and is made only of carbon, like pencil graphite.
    - id: fact.earth.06
      he: הסלעים השחורים ברמת הגולן הם בזלת, שנוצרה מלבה של הרי געש שהתקררה.
      en: The black rocks of the Golan Heights are basalt, formed from cooled volcanic lava.
    - id: fact.earth.07
      he: חוף ים המלח הוא המקום הנמוך ביותר על היבשה, כ-430 מטר מתחת לפני הים.
      en: The Dead Sea shore is the lowest place on land, about 430 meters below sea level.
    - id: fact.earth.08
      he: קרום כדור הארץ מחולק ללוחות ענקיים שזזים כמה סנטימטרים בשנה, בערך כמו קצב הצמיחה של הציפורניים.
      en: Earth's crust is split into giant plates that move a few centimeters a year, about as fast as fingernails grow.
  fire:
    title_he: אש
    title_en: Fire
    facts:
    - id: fact.fire.01
      he: 'אש צריכה שלושה דברים: חומר בעירה, חמצן וחום. מספיק להוריד אחד מהם כדי לכבות אותה.'
      en: 'Fire needs three things: fuel, oxygen and heat. Removing any one of them puts it out.'
    - id: fact.fire.02
      he: להבה כחולה של גז חמה ונקייה יותר מלהבה צהובה של נר.
      en: A blue gas flame is hotter and cleaner than a candle's yellow flame.
    - id: fact.fire.03
      he: 'השמש איננה אש רגילה: היא מאירה בגלל היתוך גרעיני, שבו אטומי מימן מתחברים להליום.'
      en: 'The sun isn''t ordinary fire: it shines by nuclear fusion, where hydrogen atoms join into helium.'
    - id: fact.fire.04
      he: שמן בוער במחבת לא מכבים במים! מכסים במכסה ומכבים את הכיריים.
      en: Never put water on a pan of burning oil! Cover it with a lid and turn off the stove.
    - id: fact.fire.05
      he: לבה של הר געש יכולה להגיע לחום של יותר מ-1,000 מעלות.
      en: Volcanic lava can be hotter than 1,000 degrees.
    - id: fact.fire.06
      he: גפרור נדלק כי החיכוך מחמם חומר מיוחד בראש הגפרור עד שהוא בוער.
      en: A match lights because friction heats a special substance on its head until it burns.
    - id: fact.fire.07
      he: הצליל של אש מתפצחת בא מבועות של מים ושרף בעץ שמתחממות ומתפוצצות.
      en: The crackle of a fire comes from pockets of water and sap in the wood heating up and bursting.
    - id: fact.fire.08
      he: לאורן ירושלים יש אצטרובלים שנפתחים בחום של שריפה ומפזרים זרעים, וכך היער מתחדש.
      en: Aleppo (Jerusalem) pine cones open in a fire's heat and release seeds, so the forest renews itself.
  frost:
    title_he: כפור
    title_en: Frost
    facts:
    - id: fact.frost.01
      he: מים קופאים ב-0 מעלות צלזיוס, וכשהם קופאים הם מתרחבים בכעשירית.
      en: Water freezes at 0 degrees Celsius and expands by about a tenth when it freezes.
    - id: fact.frost.02
      he: כמעט כל פתית שלג הוא גביש עם שש זרועות, ואין שני פתיתים זהים לגמרי.
      en: Almost every snowflake is a crystal with six arms, and no two are exactly alike.
    - id: fact.frost.03
      he: קרח צף על מים כי הוא פחות צפוף מהם. בזכות זה דגים חיים בחורף מתחת לאגם קפוא.
      en: Ice floats because it is less dense than water. Thanks to this, fish live under frozen lakes in winter.
    - id: fact.frost.04
      he: הטמפרטורה הנמוכה ביותר שנמדדה על כדור הארץ היא כמעט מינוס 90 מעלות, באנטארקטיקה.
      en: The lowest temperature ever measured on Earth is almost minus 90 degrees, in Antarctica.
    - id: fact.frost.05
      he: לדוב הלבן יש עור שחור מתחת לפרווה, והשערות שלו שקופות וחלולות.
      en: A polar bear has black skin under its fur, and its hairs are clear and hollow.
    - id: fact.frost.06
      he: רוב המים המתוקים בעולם קפואים בקרחונים ובכיפות הקרח שבקטבים.
      en: Most of the world's fresh water is frozen in glaciers and polar ice caps.
    - id: fact.frost.07
      he: בחרמון, ההר הגבוה ביותר בישראל, יורד שלג כמעט בכל חורף, ויש בו אתר סקי.
      en: On Mount Hermon, Israel's highest mountain, it snows almost every winter, and there's a ski site.
    - id: fact.frost.08
      he: יש צפרדעים שקופאות בחורף כמעט לגמרי, ומתעוררות באביב כשהן מפשירות.
      en: Some frogs freeze almost solid in winter and wake up in spring when they thaw.
  heroic:
    title_he: גבורה
    title_en: Heroic
    facts:
    - id: fact.heroic.01
      he: הלב שלך פועם כ-100,000 פעמים ביום, בלי לנוח אפילו לרגע.
      en: Your heart beats about 100,000 times a day without resting even for a moment.
    - id: fact.heroic.02
      he: לואי פסטר פיתח חיסון נגד כלבת, והראה שחיידקים גורמים למחלות.
      en: Louis Pasteur developed a rabies vaccine and showed that germs cause diseases.
    - id: fact.heroic.03
      he: מארי קירי היא האדם הראשון שזכה פעמיים בפרס נובל, בפיזיקה ובכימיה.
      en: Marie Curie was the first person to win two Nobel Prizes, in physics and chemistry.
    - id: fact.heroic.04
      he: הגוף שלך מייצר מיליוני תאי דם אדומים חדשים בכל שנייה.
      en: Your body makes millions of new red blood cells every second.
    - id: fact.heroic.05
      he: העצם הקטנה ביותר בגוף נמצאת באוזן, והיא בגודל של גרגר אורז.
      en: The smallest bone in your body is in the ear and is about the size of a grain of rice.
    - id: fact.heroic.06
      he: ג'ונס סאלק פיתח חיסון נגד פוליו ולא רשם עליו פטנט, כדי שיגיע לכמה שיותר ילדים.
      en: Jonas Salk developed a polio vaccine and didn't patent it, so it could reach as many children as possible.
    - id: fact.heroic.07
      he: אילן רמון, האסטרונאוט הישראלי הראשון, טס לחלל בשנת 2003 וערך שם ניסויים מדעיים.
      en: Ilan Ramon, the first Israeli astronaut, flew to space in 2003 and carried out science experiments.
    - id: fact.heroic.08
      he: עדה יונת, מדענית ישראלית, זכתה בפרס נובל בכימיה בשנת 2009 על חקר הריבוזום, "מפעל החלבונים" של התא.
      en: Israeli scientist Ada Yonath won the 2009 Nobel Prize in Chemistry for studying the ribosome, the cell's "protein factory".
  lightning:
    title_he: ברק
    title_en: Lightning
    facts:
    - id: fact.lightning.01
      he: 'ברק חם יותר מפני השמש: האוויר סביבו מתחמם לעשרות אלפי מעלות.'
      en: 'Lightning is hotter than the sun''s surface: the air around it heats to tens of thousands of degrees.'
    - id: fact.lightning.02
      he: אור מהיר הרבה יותר מקול, ולכן רואים את הברק לפני ששומעים את הרעם.
      en: Light is much faster than sound, so we see lightning before we hear thunder.
    - id: fact.lightning.03
      he: בכל שנייה פוגעים בכדור הארץ בערך 40 עד 50 ברקים.
      en: About 40 to 50 lightning flashes strike Earth every second.
    - id: fact.lightning.04
      he: בנג'מין פרנקלין המציא את כליא הברק, מוט מתכת שמוביל את הברק בבטחה אל האדמה.
      en: Benjamin Franklin invented the lightning rod, a metal rod that safely carries lightning into the ground.
    - id: fact.lightning.05
      he: הצלופח החשמלי יכול לייצר זרם חשמלי של מאות וולט כדי להדוף אויבים.
      en: The electric eel can produce hundreds of volts to fend off enemies.
    - id: fact.lightning.06
      he: המוח והעצבים שלנו שולחים אותות חשמליים זעירים בכל רגע.
      en: Our brain and nerves send tiny electrical signals every moment.
    - id: fact.lightning.07
      he: חשמל סטטי גורם לשיער לסמור כשמורידים כובע צמר ביום יבש.
      en: Static electricity makes your hair stand up when you take off a wool hat on a dry day.
    - id: fact.lightning.08
      he: ברק יכול לפגוע באותו מקום יותר מפעם אחת. מגדלים גבוהים נפגעים הרבה פעמים בכל שנה.
      en: Lightning can strike the same place more than once. Tall towers are hit many times every year.
  metal:
    title_he: מתכת
    title_en: Metal
    facts:
    - id: fact.metal.01
      he: זהב לא מחליד, ולכן תכשיטי זהב בני אלפי שנים עדיין מבריקים.
      en: Gold doesn't rust, so gold jewelry thousands of years old still shines.
    - id: fact.metal.02
      he: כספית היא המתכת היחידה שנוזלית בטמפרטורת החדר.
      en: Mercury is the only metal that is liquid at room temperature.
    - id: fact.metal.03
      he: נחושת מוליכה חשמל היטב, ולכן רוב חוטי החשמל עשויים ממנה.
      en: Copper conducts electricity very well, so most electric wires are made of it.
    - id: fact.metal.04
      he: ברזל הוא היסוד הנפוץ ביותר בכדור הארץ כולו לפי משקל, ורובו נמצא בגלעין.
      en: Iron is the most common element in the whole Earth by mass, mostly in the core.
    - id: fact.metal.05
      he: בדם שלנו יש ברזל, שעוזר לתאי הדם האדומים לשאת חמצן.
      en: Our blood contains iron, which helps red blood cells carry oxygen.
    - id: fact.metal.06
      he: פלדה היא ברזל עם מעט פחמן, והיא חזקה הרבה יותר מברזל רגיל.
      en: Steel is iron with a little carbon, and it's much stronger than plain iron.
    - id: fact.metal.07
      he: אלומיניום קל וחזק, ולכן בונים ממנו מטוסים וגם פחיות משקה.
      en: Aluminum is light and strong, so it's used to build airplanes and drink cans.
    - id: fact.metal.08
      he: בתמנע שבערבה כרו בני אדם נחושת כבר בימי קדם.
      en: People mined copper at Timna in the Arava as early as ancient times.
  normal:
    title_he: רגיל
    title_en: Normal
    facts:
    - id: fact.normal.01
      he: האוויר שאנחנו נושמים הוא בעיקר חנקן, כ-78 אחוז, ורק כ-21 אחוז חמצן.
      en: The air we breathe is mostly nitrogen, about 78 percent, and only about 21 percent oxygen.
    - id: fact.normal.02
      he: 'מים הם החומר היחיד שנמצא בטבע בכדור הארץ בכל שלושת מצבי הצבירה: קרח, מים ואדים.'
      en: 'Water is the only substance found naturally on Earth in all three states: ice, liquid and vapor.'
    - id: fact.normal.03
      he: 'מלח בישול בנוי משני יסודות: נתרן וכלור.'
      en: 'Table salt is made of two elements: sodium and chlorine.'
    - id: fact.normal.04
      he: סבון מנקה כי כל מולקולה שלו נצמדת מצד אחד למים ומהצד השני לשומן.
      en: Soap cleans because each molecule grabs water on one end and grease on the other.
    - id: fact.normal.05
      he: קשת בענן מופיעה כשאור השמש עובר דרך טיפות גשם ומתפרק לצבעים.
      en: A rainbow appears when sunlight passes through raindrops and splits into colors.
    - id: fact.normal.06
      he: לחם תופח כי שמרים, שהם פטריות זעירות, מייצרים בבצק בועות של פחמן דו-חמצני.
      en: Bread rises because yeast, tiny fungi, make carbon dioxide bubbles in the dough.
    - id: fact.normal.07
      he: כ-60 אחוז מגוף האדם הם מים.
      en: About 60 percent of the human body is water.
    - id: fact.normal.08
      he: הסוכר שבממתקים והעמילן שבלחם הם שני סוגים של פחמימות שנותנות לגוף אנרגיה.
      en: The sugar in sweets and the starch in bread are two kinds of carbohydrates that give the body energy.
  shadow:
    title_he: צל
    title_en: Shadow
    facts:
    - id: fact.shadow.01
      he: צל נוצר כשחפץ אטום חוסם אור, כי אור נע בקווים ישרים.
      en: A shadow forms when an opaque object blocks light, because light travels in straight lines.
    - id: fact.shadow.02
      he: בצהריים הצל שלנו הכי קצר, ובבוקר ובערב הוא ארוך במיוחד.
      en: At noon our shadow is shortest, and in the morning and evening it's extra long.
    - id: fact.shadow.03
      he: ינשופים רואים היטב בחושך בזכות עיניים ענקיות, ושומעים כל כך טוב שהם מוצאים עכבר מתחת לעשב.
      en: Owls see well in the dark with huge eyes and hear so well they can find a mouse under grass.
    - id: fact.shadow.04
      he: בעומק האוקיינוס חושך מוחלט, ויש בו דגים ויצורים שמייצרים אור בעצמם.
      en: The deep ocean is pitch dark, and some fish and creatures there make their own light.
    - id: fact.shadow.05
      he: גחליליות מאירות בעזרת תגובה כימית בגופן, בלי להתחמם כמעט בכלל.
      en: Fireflies glow with a chemical reaction in their bodies that makes almost no heat.
    - id: fact.shadow.06
      he: בליקוי ירח, הצל של כדור הארץ נופל על הירח, והירח נראה כהה ואדמדם.
      en: In a lunar eclipse Earth's shadow falls on the moon, making it look dark and reddish.
    - id: fact.shadow.07
      he: עטלפים מוצאים את דרכם בחושך בעזרת הד של קולות גבוהים שהם משמיעים.
      en: Bats find their way in the dark using echoes of high sounds they make.
    - id: fact.shadow.08
      he: העיניים שלנו צריכות כמה דקות כדי להתרגל לחושך, ואז רואים הרבה יותר.
      en: Our eyes need several minutes to adjust to darkness, and then we see much more.
  sky:
    title_he: שמיים
    title_en: Sky
    facts:
    - id: fact.sky.01
      he: השמיים כחולים כי האוויר מפזר את האור הכחול של השמש יותר מצבעים אחרים.
      en: The sky is blue because air scatters the sun's blue light more than other colors.
    - id: fact.sky.02
      he: עננים עשויים מטיפות מים זעירות או מגבישי קרח, ולא מעשן או מצמר גפן.
      en: Clouds are made of tiny water droplets or ice crystals, not smoke or cotton.
    - id: fact.sky.03
      he: מאות מיליוני ציפורים נודדות עוברות מעל ישראל בכל שנה בדרך בין אירופה לאפריקה.
      en: Hundreds of millions of migrating birds pass over Israel every year between Europe and Africa.
    - id: fact.sky.04
      he: ככל שעולים גבוה יותר בהרים, האוויר דליל וקר יותר.
      en: The higher you climb a mountain, the thinner and colder the air.
    - id: fact.sky.05
      he: הבז הנודד צולל במהירות של יותר מ-300 קמ"ש, והוא היצור המהיר ביותר בעולם.
      en: The peregrine falcon dives at over 300 km/h, making it the fastest creature in the world.
    - id: fact.sky.06
      he: רוח נוצרת כשאוויר זורם מאזור של לחץ גבוה לאזור של לחץ נמוך.
      en: Wind forms when air flows from an area of high pressure to an area of low pressure.
    - id: fact.sky.07
      he: כנף של מטוס מסיטה אוויר כלפי מטה, והאוויר דוחף אותה כלפי מעלה.
      en: An airplane wing pushes air downward, and the air pushes the wing up.
    - id: fact.sky.08
      he: האטמוספרה שומרת על כדור הארץ חמים ומגינה עלינו מרוב הקרינה המזיקה של השמש.
      en: The atmosphere keeps Earth warm and protects us from most of the sun's harmful radiation.
  venom:
    title_he: ארס
    title_en: Venom
    facts:
    - id: fact.venom.01
      he: ארס הוא חומר שבעל חיים מחדיר בעקיצה או בהכשה. רעל הוא חומר מזיק שבולעים או נוגעים בו.
      en: Venom is injected by an animal through a sting or bite. Poison is harmful when swallowed or touched.
    - id: fact.venom.02
      he: רוב מיני הנחשים בישראל אינם ארסיים. אם רואים נחש, מתרחקים בשקט ונותנים לו ללכת.
      en: Most snake species in Israel are not venomous. If you see a snake, calmly step away and let it go.
    - id: fact.venom.03
      he: מארס של נחשים מפיקים נסיוב נגד הכשות, וגם תרופות שמצילות חיים, למשל נגד לחץ דם גבוה.
      en: Snake venom is used to make antivenom and also life-saving medicines, for example for high blood pressure.
    - id: fact.venom.04
      he: דבורת דבש עוקצת רק כדי להגן על עצמה ועל הכוורת.
      en: A honeybee stings only to defend itself and its hive.
    - id: fact.venom.05
      he: 'לצפרדעים מסוימות יש צבעים בוהקים שמזהירים טורפים: "אני לא טעימה!"'
      en: 'Some frogs have bright colors that warn predators: "I don''t taste good!"'
    - id: fact.venom.06
      he: עקרבים זוהרים בכחול-ירקרק כשמאירים עליהם באור על-סגול.
      en: Scorpions glow blue-green under ultraviolet light.
    - id: fact.venom.07
      he: הסרפד הוא צמח שעוקץ בעזרת שערות דקות עם חומר מגרד.
      en: Stinging nettle is a plant that stings with fine hairs carrying an itchy substance.
    - id: fact.venom.08
      he: מדוזות עוקצות בעזרת תאים צורבים זעירים בזרועות, ולכן בקיץ לא נוגעים במדוזות על החוף.
      en: Jellyfish sting with tiny stinging cells on their tentacles, so don't touch jellyfish on the beach in summer.
  water:
    title_he: מים
    title_en: Water
    facts:
    - id: fact.water.01
      he: כ-70 אחוז מפני כדור הארץ מכוסים במים, ולכן מהחלל הוא נראה כחול.
      en: About 70 percent of Earth's surface is covered by water, so from space it looks blue.
    - id: fact.water.02
      he: רוב המים בעולם מלוחים. רק כ-3 אחוזים הם מים מתוקים.
      en: Most of the world's water is salty. Only about 3 percent is fresh water.
    - id: fact.water.03
      he: מים מתרחבים כשהם קופאים, ולכן בקבוק מלא במקפיא עלול להיסדק.
      en: Water expands when it freezes, so a full bottle in the freezer may crack.
    - id: fact.water.04
      he: הלוויתן הכחול הוא בעל החיים הגדול ביותר שאנחנו מכירים, כבד יותר מכל דינוזאור.
      en: The blue whale is the largest animal we know of, heavier than any dinosaur.
    - id: fact.water.05
      he: דולפינים ישנים כשחצי אחד של המוח שלהם ער, כדי לזכור לעלות ולנשום.
      en: Dolphins sleep with one half of the brain awake, so they remember to surface and breathe.
    - id: fact.water.06
      he: האוקיינוס השקט הוא האוקיינוס הגדול והעמוק ביותר בעולם.
      en: The Pacific is the largest and deepest ocean in the world.
    - id: fact.water.07
      he: ישראל מפיקה חלק גדול ממי השתייה שלה בהתפלה של מי ים.
      en: Israel gets a large share of its drinking water by desalinating seawater.
    - id: fact.water.08
      he: בגובה פני הים מים רותחים ב-100 מעלות, ובפסגות הרים גבוהים הם רותחים בפחות.
      en: At sea level water boils at 100 degrees, and on high mountain tops it boils at less.
  wood:
    title_he: עץ
    title_en: Wood
    facts:
    - id: fact.wood.01
      he: עצים קולטים פחמן דו-חמצני מהאוויר ומשחררים חמצן שאנחנו נושמים.
      en: Trees take carbon dioxide from the air and release the oxygen we breathe.
    - id: fact.wood.02
      he: לפי הטבעות בגזע של עץ אפשר לדעת בערך בן כמה הוא, כי כל שנה נוספת טבעת.
      en: You can tell a tree's age from the rings in its trunk, because each year adds a ring.
    - id: fact.wood.03
      he: העץ הגבוה ביותר בעולם הוא סקוויה אדומה בקליפורניה, שגובהה יותר מ-110 מטר.
      en: The tallest tree in the world is a coast redwood in California, over 110 meters tall.
    - id: fact.wood.04
      he: יש עצי זית בישראל שחיים מאות ואפילו יותר מאלף שנה.
      en: Some olive trees in Israel have lived for hundreds or even over a thousand years.
    - id: fact.wood.05
      he: במבוק הוא צמח עשבוני שחלק ממיניו צומחים כמעט מטר ביום.
      en: Bamboo is a grass, and some kinds grow almost a meter in a day.
    - id: fact.wood.06
      he: עצים ברחוב מצלים ומקררים את האוויר, ולכן ברחוב עם עצים נעים יותר בקיץ.
      en: Street trees shade and cool the air, so tree-lined streets are more pleasant in summer.
    - id: fact.wood.07
      he: יער יתיר, בצפון הנגב, הוא היער הנטוע הגדול ביותר בישראל.
      en: Yatir Forest in the northern Negev is the largest planted forest in Israel.
    - id: fact.wood.08
      he: שורשי העצים מחזיקים את הקרקע ומונעים מהגשם לסחוף אותה.
      en: Tree roots hold the soil and stop the rain from washing it away.
items:
- id: sci.elements.001
  skill: science.elements.cards
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: כמה זריחות רואים בערך ביום האסטרונאוטים בתחנת החלל הבינלאומית?
  prompt_en: About how many sunrises a day do astronauts on the International Space Station see?
  choices:
  - {he: '365', en: '365'}
  - {he: כ-16, en: about 16}
  - {he: '1', en: '1'}
  answer: 1
  explanation_he: התחנה מקיפה את כדור הארץ בכ-90 דקות. ביממה יש 24 שעות, ולכן הם עוברים כ-16 פעמים מלילה ליום.
  explanation_en: The station circles Earth in about 90 minutes. A day has 24 hours, so they pass from night to day about 16 times.
  tags: [elements, element_cosmic]
- id: sci.elements.002
  skill: science.elements.cards
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: על הירח השמיים נראים שחורים גם באמצע היום.
  prompt_en: On the moon the sky looks black even at midday.
  answer: true
  explanation_he: נכון. בכדור הארץ האוויר מפזר את אור השמש וצובע את השמיים בכחול. על הירח אין אוויר, ולכן השמיים שחורים.
  explanation_en: True. On Earth air scatters sunlight and colors the sky blue. The moon has no air, so its sky is black.
  tags: [elements, element_cosmic]
- id: sci.elements.003
  skill: science.elements.cards
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: יהלום והגרפיט שבעיפרון עשויים מאותו יסוד. איזה?
  prompt_en: Diamond and pencil graphite are made of the same element. Which?
  choices:
  - {he: פחמן, en: carbon}
  - {he: ברזל, en: iron}
  - {he: זהב, en: gold}
  answer: 0
  explanation_he: 'גם יהלום וגם גרפיט הם פחמן טהור. ההבדל הוא בסידור האטומים: ביהלום הם קשורים חזק מאוד.'
  explanation_en: 'Both diamond and graphite are pure carbon. The difference is how the atoms are arranged: in diamond they''re bonded very strongly.'
  tags: [elements, element_earth]
- id: sci.elements.004
  skill: science.elements.cards
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: בכפית של אדמה בריאה חיים מיליוני יצורים זעירים.
  prompt_en: Millions of tiny creatures live in a teaspoon of healthy soil.
  answer: true
  explanation_he: נכון. בקרקע חיים חיידקים, פטריות ויצורים קטנים אחרים. הם מפרקים שאריות והופכים אותן למזון לצמחים.
  explanation_en: True. Soil is full of bacteria, fungi and other tiny creatures. They break down remains into food for plants.
  tags: [elements, element_earth]
- id: sci.elements.005
  skill: science.elements.cards
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: שמן במחבת עלה באש. מה נכון לעשות?
  prompt_en: Oil in a frying pan caught fire. What is the right thing to do?
  choices:
  - {he: לכסות במכסה ולכבות את הכיריים, en: cover with a lid and turn off the stove}
  - {he: לשפוך עליו מים, en: pour water on it}
  - {he: לנשוף עליו חזק, en: blow on it hard}
  answer: 0
  explanation_he: מים על שמן בוער מתאדים בבת אחת ומעיפים שמן בוער לכל עבר. המכסה חוסם חמצן, והאש נכבית. וכמובן, קוראים למבוגר!
  explanation_en: Water on burning oil flashes to steam and sprays flaming oil. A lid blocks oxygen and the fire dies. And of course, call an adult!
  tags: [elements, element_fire]
- id: sci.elements.006
  skill: science.elements.cards
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: למה השמש מאירה?
  prompt_en: Why does the sun shine?
  choices:
  - {he: היא שורפת עצים ונפט, en: it burns wood and oil}
  - {he: היתוך גרעיני של מימן להליום, en: nuclear fusion of hydrogen into helium}
  - {he: היא מחזירה אור של כוכבים אחרים, en: it reflects other stars' light}
  answer: 1
  explanation_he: בליבת השמש החום והלחץ עצומים, ואטומי מימן מתחברים להליום. התהליך משחרר כמויות אדירות של אנרגיה.
  explanation_en: In the sun's core heat and pressure are enormous, and hydrogen atoms fuse into helium, releasing huge amounts of energy.
  tags: [elements, element_fire]
- id: sci.elements.007
  skill: science.elements.cards
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: כמה זרועות יש בדרך כלל לפתית שלג?
  prompt_en: How many arms does a snowflake usually have?
  choices:
  - {he: '6', en: '6'}
  - {he: '8', en: '8'}
  - {he: '4', en: '4'}
  answer: 0
  explanation_he: מולקולות המים מסתדרות בגביש קרח בצורה משושה, ולכן לפתית השלג יש שש זרועות.
  explanation_en: Water molecules line up in ice crystals in a six-sided pattern, so snowflakes have six arms.
  tags: [elements, element_frost]
- id: sci.elements.008
  skill: science.elements.cards
  kind: true_false
  grade: 5
  difficulty: 1.0
  prompt_he: רוב המים המתוקים בעולם נמצאים בצורת קרח.
  prompt_en: Most of the world's fresh water is in the form of ice.
  answer: true
  explanation_he: נכון. כשני שלישים מהמים המתוקים קפואים בקרחונים ובקטבים. רק חלק קטן נמצא באגמים ובנהרות.
  explanation_en: True. About two thirds of fresh water is frozen in glaciers and at the poles. Only a small part is in lakes and rivers.
  tags: [elements, element_frost]
- id: sci.elements.009
  skill: science.elements.cards
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: מי האדם הראשון שזכה פעמיים בפרס נובל?
  prompt_en: Who was the first person to win the Nobel Prize twice?
  choices:
  - {he: אייזק ניוטון, en: Isaac Newton}
  - {he: מארי קירי, en: Marie Curie}
  - {he: תומס אדיסון, en: Thomas Edison}
  answer: 1
  explanation_he: מארי קירי חקרה קרינה וגילתה יסודות חדשים. היא זכתה בפרס נובל בפיזיקה ב-1903 ובכימיה ב-1911.
  explanation_en: Marie Curie studied radioactivity and discovered new elements. She won the Nobel in physics in 1903 and chemistry in 1911.
  tags: [elements, element_heroic]
- id: sci.elements.010
  skill: science.elements.cards
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: בערך כמה פעמים ביום פועם הלב?
  prompt_en: About how many times a day does the heart beat?
  choices:
  - {he: 'כ-100,000', en: 'about 100,000'}
  - {he: כ-100, en: about 100}
  - {he: כ-10, en: about 10}
  answer: 0
  explanation_he: הלב פועם בערך 70 פעמים בדקה. בשעה יש 60 דקות וביום 24 שעות, ולכן מגיעים לכ-100,000 פעימות.
  explanation_en: The heart beats about 70 times a minute. With 60 minutes an hour and 24 hours a day, that's about 100,000 beats.
  tags: [elements, element_heroic]
- id: sci.elements.011
  skill: science.elements.cards
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: מי המציא את כליא הברק?
  prompt_en: Who invented the lightning rod?
  choices:
  - {he: תומס אדיסון, en: Thomas Edison}
  - {he: בנג'מין פרנקלין, en: Benjamin Franklin}
  - {he: גלילאו גליליי, en: Galileo Galilei}
  answer: 1
  explanation_he: פרנקלין הבין שברק הוא חשמל. כליא הברק הוא מוט מתכת בראש בניין שמוליך את הברק לאדמה ומגן על הבניין.
  explanation_en: Franklin realized lightning is electricity. A lightning rod on top of a building conducts the strike into the ground and protects the building.
  tags: [elements, element_lightning]
- id: sci.elements.012
  skill: science.elements.cards
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: ברק לעולם לא פוגע פעמיים באותו מקום.
  prompt_en: Lightning never strikes the same place twice.
  answer: false
  explanation_he: לא נכון. זו אמירה נפוצה אבל שגויה. מקומות גבוהים, כמו מגדלים ועצים בודדים, נפגעים שוב ושוב.
  explanation_en: False. It's a common saying but wrong. High places like towers and lone trees get hit again and again.
  tags: [elements, element_lightning]
- id: sci.elements.013
  skill: science.elements.cards
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: איזו מתכת נוזלית בטמפרטורת החדר?
  prompt_en: Which metal is liquid at room temperature?
  choices:
  - {he: כספית, en: mercury}
  - {he: ברזל, en: iron}
  - {he: נחושת, en: copper}
  answer: 0
  explanation_he: כספית שימשה פעם במדחומים, אבל היא רעילה, ולכן היום משתמשים במדחומים דיגיטליים.
  explanation_en: Mercury was once used in thermometers, but it's toxic, so today we use digital thermometers.
  tags: [elements, element_metal]
- id: sci.elements.014
  skill: science.elements.cards
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: בדם שלנו יש מתכת.
  prompt_en: Our blood contains a metal.
  answer: true
  explanation_he: נכון. בדם יש ברזל, שהוא חלק מההמוגלובין. ההמוגלובין נושא את החמצן מהריאות לכל הגוף.
  explanation_en: True. Blood contains iron, part of hemoglobin, which carries oxygen from the lungs to the whole body.
  tags: [elements, element_metal]
- id: sci.elements.015
  skill: science.elements.cards
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: למה בצק לחם תופח?
  prompt_en: Why does bread dough rise?
  choices:
  - {he: המלח מתנפח, en: the salt swells}
  - {he: הקמח נמס, en: the flour melts}
  - {he: שמרים מייצרים בו בועות גז, en: yeast makes gas bubbles in it}
  answer: 2
  explanation_he: השמרים אוכלים סוכר ומשחררים פחמן דו-חמצני. הבועות נלכדות בבצק ומנפחות אותו.
  explanation_en: Yeast eats sugar and releases carbon dioxide. The bubbles get trapped in the dough and puff it up.
  tags: [elements, element_normal]
- id: sci.elements.016
  skill: science.elements.cards
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איזה גז נמצא באוויר בכמות הגדולה ביותר?
  prompt_en: Which gas makes up most of the air?
  choices:
  - {he: חנקן, en: nitrogen}
  - {he: חמצן, en: oxygen}
  - {he: פחמן דו-חמצני, en: carbon dioxide}
  answer: 0
  explanation_he: כ-78 אחוז מהאוויר הם חנקן, כ-21 אחוז חמצן, ופחמן דו-חמצני הוא פחות מאחוז אחד.
  explanation_en: About 78 percent of air is nitrogen, about 21 percent oxygen, and carbon dioxide is less than one percent.
  tags: [elements, element_normal]
- id: sci.elements.017
  skill: science.elements.cards
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מתי הצל שלנו בחוץ הכי קצר?
  prompt_en: When is our shadow outdoors shortest?
  choices:
  - {he: בזריחה, en: at sunrise, emoji: 1f305}
  - {he: בשקיעה, en: at sunset, emoji: 1f307}
  - {he: בצהריים, en: at noon, emoji: '2600'}
  answer: 2
  explanation_he: בצהריים השמש הכי גבוהה בשמיים, והאור מגיע כמעט מלמעלה, ולכן הצל קצר.
  explanation_en: At noon the sun is highest and light comes almost from above, so the shadow is short.
  tags: [elements, element_shadow]
- id: sci.elements.018
  skill: science.elements.cards
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: גחליליות מאירות בעזרת תגובה כימית בגוף שלהן.
  prompt_en: Fireflies glow using a chemical reaction in their bodies.
  answer: true
  explanation_he: נכון. בגוף הגחלילית חומרים מגיבים ומפיקים אור קר. כך הגחליליות מאותתות זו לזו.
  explanation_en: True. Substances in the firefly react and give off cold light. That's how fireflies signal each other.
  tags: [elements, element_shadow]
- id: sci.elements.019
  skill: science.elements.cards
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: למה השמיים כחולים ביום?
  prompt_en: Why is the sky blue in the daytime?
  choices:
  - {he: יש באוויר צבע כחול, en: there is blue paint in the air}
  - {he: האוויר מפזר את האור הכחול יותר, en: the air scatters blue light more}
  - {he: הם משקפים את הים, en: they reflect the sea}
  answer: 1
  explanation_he: אור השמש מורכב מכל הצבעים. חלקיקי האוויר מפזרים את האור הכחול לכל הכיוונים, ולכן הוא מגיע אלינו מכל השמיים.
  explanation_en: Sunlight contains all colors. Air molecules scatter blue light in every direction, so it reaches us from all over the sky.
  tags: [elements, element_sky]
- id: sci.elements.020
  skill: science.elements.cards
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מהו בעל החיים המהיר ביותר בעולם?
  prompt_en: What is the fastest animal in the world?
  choices:
  - {he: 'הבז הנודד, בצלילה', en: 'the peregrine falcon, when diving'}
  - {he: הצ'יטה, en: the cheetah}
  - {he: הסוס, en: the horse}
  answer: 0
  explanation_he: הצ'יטה היא המהירה ביותר ביבשה, אבל הבז הנודד צולל באוויר במהירות של יותר מ-300 קמ"ש.
  explanation_en: The cheetah is fastest on land, but the peregrine falcon dives through the air at over 300 km/h.
  tags: [elements, element_sky]
- id: sci.elements.021
  skill: science.elements.cards
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: מה ההבדל בין ארס לרעל?
  prompt_en: What is the difference between venom and poison?
  choices:
  - {he: אין הבדל, en: there is no difference}
  - {he: 'ארס מוחדר בעקיצה, רעל נבלע או נוגעים בו', en: venom is injected; poison is swallowed or touched}
  - {he: ארס נמצא רק בצמחים, en: venom is only in plants}
  answer: 1
  explanation_he: נחש ועקרב מחדירים ארס בהכשה או בעקיצה. רעל, כמו בפטריות מסוימות, מזיק כשאוכלים או נוגעים בו.
  explanation_en: Snakes and scorpions inject venom by biting or stinging. Poison, as in some mushrooms, harms when eaten or touched.
  tags: [elements, element_venom]
- id: sci.elements.022
  skill: science.elements.cards
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: רוב מיני הנחשים בישראל אינם ארסיים.
  prompt_en: Most snake species in Israel are not venomous.
  answer: true
  explanation_he: נכון. בישראל יש כ-40 מיני נחשים, ורק מעטים מהם ארסיים. ובכל זאת, לא נוגעים בנחש ומתרחקים ממנו בשקט.
  explanation_en: True. Israel has about 40 snake species, and only a few are venomous. Still, never touch a snake; step away calmly.
  tags: [elements, element_venom]
- id: sci.elements.023
  skill: science.elements.cards
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איך דולפינים ישנים בלי לטבוע?
  prompt_en: How do dolphins sleep without drowning?
  choices:
  - {he: הם ישנים על החוף, en: they sleep on the beach}
  - {he: הם בכלל לא ישנים, en: they never sleep}
  - {he: חצי מהמוח ישן וחצי ער, en: half the brain sleeps while half stays awake}
  answer: 2
  explanation_he: דולפינים נושמים אוויר ומחליטים מתי לנשום. לכן חצי מהמוח נשאר ער ודואג לעלות לפני המים.
  explanation_en: Dolphins breathe air and choose when to breathe, so half the brain stays awake to bring them to the surface.
  tags: [elements, element_water]
- id: sci.elements.024
  skill: science.elements.cards
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: רוב המים על כדור הארץ מתוקים וראויים לשתייה.
  prompt_en: Most water on Earth is fresh and drinkable.
  answer: false
  explanation_he: לא נכון. כ-97 אחוז מהמים מלוחים, באוקיינוסים ובימים. לכן חשוב כל כך לחסוך במים מתוקים.
  explanation_en: False. About 97 percent of water is salty, in oceans and seas. That's why saving fresh water matters so much.
  tags: [elements, element_water]
- id: sci.elements.025
  skill: science.elements.cards
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איזה צמח יכול לצמוח כמעט מטר ביום?
  prompt_en: Which plant can grow almost a meter in a day?
  choices:
  - {he: אלון, en: oak}
  - {he: במבוק, en: bamboo}
  - {he: קקטוס, en: cactus}
  answer: 1
  explanation_he: במבוק הוא בעצם סוג של עשב ענק. חלק מהמינים שלו מחזיקים בשיא הצמיחה המהירה בעולם הצמחים.
  explanation_en: Bamboo is actually a giant grass. Some species hold the record for the fastest growth among plants.
  tags: [elements, element_wood]
- id: sci.elements.026
  skill: science.elements.cards
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: העץ הגבוה בעולם גבוה יותר מבניין של 30 קומות.
  prompt_en: The world's tallest tree is taller than a 30-story building.
  answer: true
  explanation_he: נכון. סקוויה אדומה יכולה להתנשא מעל 110 מטר. קומה בבניין היא בערך 3 מטרים, אז זה יותר מ-35 קומות!
  explanation_en: True. A coast redwood can rise over 110 meters. A building floor is about 3 meters, so that's more than 35 floors!
  tags: [elements, element_wood]

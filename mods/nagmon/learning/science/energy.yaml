  difficulty: 1.0
  prompt_he: המסה של אסטרונאוט על הירח זהה למסה שלו על כדור הארץ, אבל המשקל שלו קטן יותר.
  prompt_en: An astronaut's mass on the moon equals his mass on Earth, but his weight is smaller.
  answer: true
  explanation_he: נכון. מסה היא כמות החומר והיא לא משתנה. משקל הוא כוח המשיכה שפועל על הגוף, ועל הירח הוא בערך שישית.
  explanation_en: True. Mass is the amount of matter and doesn't change. Weight is the gravity force on the body, about one sixth on the moon.
  tags: [motion]
- id: sci.energy.105
  skill: science.energy.motion
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: כמה זה 36 קמ"ש במטרים לשנייה?
  prompt_en: What is 36 km/h in meters per second?
  choices:
  - {he: 36 מטר בשנייה, en: 36 m/s}
  - {he: 10 מטר בשנייה, en: 10 m/s}
  - {he: 3.6 מטר בשנייה, en: 3.6 m/s}
  answer: 1
  explanation_he: 'בשעה יש 3,600 שניות ובקילומטר 1,000 מטר. לכן מחלקים ב-3.6: 36 חלקי 3.6 שווה 10.'
  explanation_en: 'An hour has 3,600 seconds and a kilometer 1,000 meters, so divide by 3.6: 36 / 3.6 = 10.'
  tags: [motion]
- id: sci.energy.106
  skill: science.energy.motion
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: מהי תאוצה?
  prompt_en: What is acceleration?
  choices:
  - {he: המרחק שעוברים, en: the distance traveled}
  - {he: שינוי במהירות בכל יחידת זמן, en: change in velocity per unit of time}
  - {he: משקל הגוף, en: the body's weight}
  answer: 1
  explanation_he: תאוצה מודדת כמה מהר המהירות משתנה. גוף שנופל חופשי ליד כדור הארץ מאיץ בכ-9.8 מטר לשנייה בכל שנייה.
  explanation_en: Acceleration measures how quickly velocity changes. A freely falling body near Earth accelerates at about 9.8 m/s every second.
  tags: [motion]
- id: sci.energy.107
  skill: science.energy.motion
  kind: true_false
  grade: 8
  difficulty: 1.0
  prompt_he: כדי שגוף ימשיך לנוע במהירות קבועה, חייב לפעול עליו כוח כל הזמן.
  prompt_en: To keep moving at constant speed, a body needs a force acting on it all the time.
  answer: false
  explanation_he: לא נכון. לפי החוק הראשון של ניוטון, בלי כוח שקול גוף ממשיך לנוע במהירות קבועה. בחיים אנחנו צריכים לדחוף רק כדי להתגבר על חיכוך.
  explanation_en: False. By Newton's first law, with no net force a body keeps moving at constant speed. In daily life we push only to overcome friction.
  tags: [motion]
- id: sci.energy.108
  skill: science.energy.motion
  kind: choice
  grade: 9
  difficulty: 2.0
  prompt_he: חפץ שנופל מגובה נוחת אחרי 2 שניות. בערך מה מהירותו ברגע הנחיתה (בלי התנגדות אוויר)?
  prompt_en: An object dropped from a height lands after 2 seconds. About how fast is it going on impact (no air resistance)?
  choices:
  - {he: כ-2 מטר בשנייה, en: about 2 m/s}
  - {he: כ-20 מטר בשנייה, en: about 20 m/s}
  - {he: כ-200 מטר בשנייה, en: about 200 m/s}
  answer: 1
  explanation_he: 'בכל שנייה של נפילה חופשית המהירות גדלה בכ-10 מטר לשנייה. אחרי 2 שניות: בערך 20 מטר לשנייה.'
  explanation_en: 'In free fall speed grows by about 10 m/s each second. After 2 seconds: about 20 m/s.'
  tags: [motion]

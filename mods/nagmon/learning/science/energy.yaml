  prompt_en: What does a bulb need to light up in a circuit?
  choices:
  - {he: מעגל סגור עם מקור חשמל, en: a closed loop with a power source}
  - {he: רק חוט אחד, en: only one wire}
  - {he: מים, en: water}
  answer: 0
  explanation_he: 'הזרם זורם רק במעגל סגור: מהסוללה, דרך החוטים והנורה, ובחזרה לסוללה.'

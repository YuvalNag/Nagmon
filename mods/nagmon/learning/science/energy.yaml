  - {he: מטר, en: meter}
  - {he: ניוטון, en: newton}
  answer: 2
  explanation_he: יחידת הכוח נקראת ניוטון, על שם המדען אייזק ניוטון. ליד כדור הארץ, משקל של ק"ג אחד הוא בערך 10 ניוטון.
  explanation_en: The unit of force is the newton, named after Isaac Newton. Near Earth, the weight of 1 kg is about 10 newtons.
  tags: [forces]
- id: sci.energy.071
  skill: science.energy.forces
  kind: choice
  grade: 5
  difficulty: 1.0

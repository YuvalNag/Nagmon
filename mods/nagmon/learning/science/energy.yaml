  choices:
  - {he: 5 מטר בשנייה, en: 5 m/s}
  - {he: 2000 מטר בשנייה, en: 2000 m/s}
  - {he: 0.2 מטר בשנייה, en: 0.2 m/s}
  answer: 0
  explanation_he: 'מהירות = דרך חלקי זמן: 100 מטר חלקי 20 שניות שווה 5 מטר בשנייה.'
  explanation_en: 'Speed = distance / time: 100 m / 20 s = 5 m/s.'
  tags: [motion]
- id: sci.energy.101
  skill: science.energy.motion
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: למה חובה לחגור חגורת בטיחות במכונית?
  prompt_en: Why must we wear a seatbelt in a car?
  choices:
  - {he: כדי שהמכונית תיסע מהר, en: so the car goes faster}
  - {he: בבלימה פתאומית הגוף ממשיך לנוע קדימה, en: in sudden braking the body keeps moving forward}
  - {he: כדי לא להתעייף, en: to avoid getting tired}
  answer: 1
  explanation_he: 'זה החוק הראשון של ניוטון, ההתמדה: גוף בתנועה ממשיך לנוע עד שכוח עוצר אותו. החגורה היא הכוח שעוצר אותנו בבטחה.'

  choices:
  - {he: 240 קמ"ש, en: 240 km/h}
  - {he: 122 קמ"ש, en: 122 km/h}
  - {he: 60 קמ"ש, en: 60 km/h}
  answer: 2
  explanation_he: 'מהירות = דרך חלקי זמן: 120 חלקי 2 שווה 60 קילומטר לשעה.'
  explanation_en: 'Speed = distance / time: 120 / 2 = 60 km per hour.'
  tags: [motion]
- id: sci.energy.100
  skill: science.energy.motion
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: רץ רץ 100 מטר ב-20 שניות. מה מהירותו?

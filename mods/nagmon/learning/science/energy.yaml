  - {he: לדחוף או למשוך אותה, en: push or pull it, emoji: 1f6d2}
  answer: 2
  explanation_he: 'כדי להזיז חפץ צריך להפעיל עליו כוח: דחיפה או משיכה.'
  explanation_en: 'To move something you must apply a force: a push or a pull.'
  tags: [forces]
- id: sci.energy.064
  skill: science.energy.forces
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איזה כוח מושך את כל החפצים למטה, אל כדור הארץ?
  prompt_en: Which force pulls everything down toward Earth?
  choices:
  - {he: כוח המשיכה, en: gravity}
  - {he: כוח מגנטי, en: magnetism}
  - {he: כוח החיכוך, en: friction}
  answer: 0
  explanation_he: כוח המשיכה של כדור הארץ מושך כל דבר כלפי מרכזו. לכן כדור שנזרק למעלה חוזר למטה.
  explanation_en: Earth's gravity pulls everything toward its center, so a ball thrown up comes back down.
  tags: [forces]
- id: sci.energy.065
  skill: science.energy.forces
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: אם נפיל באותו רגע כדור כבד וכדור קל באותו גודל, הכבד יגיע לרצפה הרבה לפני הקל.
  prompt_en: Drop a heavy ball and a light ball of the same size together; the heavy one lands long before the light one.
  answer: false
  explanation_he: לא נכון. בלי השפעה גדולה של האוויר, כל החפצים נופלים באותה מהירות. גלילאו הראה זאת לפני כ-400 שנה.
  explanation_en: False. Without much air resistance, all objects fall at the same rate. Galileo showed this about 400 years ago.
  tags: [forces]
- id: sci.energy.066
  skill: science.energy.forces
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: למה קשה יותר להחליק בנעלי ספורט על שטיח מאשר בגרביים על רצפה חלקה?
  prompt_en: Why is sliding harder in sneakers on carpet than in socks on a smooth floor?
  choices:
  - {he: יש יותר חיכוך, en: there is more friction}
  - {he: יש פחות כוח משיכה, en: there is less gravity}
  - {he: השטיח מגנטי, en: the carpet is magnetic}
  answer: 0
  explanation_he: חיכוך הוא כוח שמאט תנועה בין שני משטחים. משטחים מחוספסים יוצרים יותר חיכוך.
  explanation_en: Friction is a force that slows motion between surfaces. Rough surfaces create more friction.
  tags: [forces]
- id: sci.energy.067
  skill: science.energy.forces
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: מה כוח יכול לעשות לחפץ?
  prompt_en: What can a force do to an object?
  choices:
  - {he: 'להזיז, לעצור, לשנות כיוון או צורה', en: 'move it, stop it, change its direction or shape'}
  - {he: רק לחמם אותו, en: only heat it}
  - {he: רק לצבוע אותו, en: only color it}
  answer: 0
  explanation_he: כוח יכול להתחיל תנועה, לעצור אותה, לשנות את כיוונה, ואפילו למעוך חפץ, כמו בצק.
  explanation_en: A force can start motion, stop it, change its direction, and even squash an object, like dough.
  tags: [forces]
- id: sci.energy.068
  skill: science.energy.forces
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: מצנח מאט את הנפילה בעזרת התנגדות האוויר.
  prompt_en: A parachute slows a fall using air resistance.
  answer: true
  explanation_he: נכון. למצנח שטח גדול שדוחף הרבה אוויר. האוויר דוחף אותו בחזרה, וכך הנפילה איטית ובטוחה.

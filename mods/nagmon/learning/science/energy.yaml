  answer: 0
  explanation_he: מקרר צריך חשמל כדי לקרר. אופניים רגילים זזים בכוח הרגליים, ומטריה לא צריכה אנרגיה.
  explanation_en: A fridge needs electricity to keep cool. A bicycle moves by leg power, and an umbrella needs no energy.

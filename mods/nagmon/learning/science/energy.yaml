skill: science.energy.magnets
items:
- id: sci.energy.001
  skill: science.energy.magnets
  kind: choice
  grade: 1
  difficulty: -1.0
  prompt_he: מה מגנט מושך?
  prompt_en: What does a magnet attract?
  choices:
  - {he: מחק מגומי, en: a rubber eraser}
  - {he: מהדק מברזל, en: an iron paper clip}
  - {he: עיפרון מעץ, en: a wooden pencil}
  answer: 1
  explanation_he: מגנטים מושכים חפצים שיש בהם ברזל. עץ וגומי לא נמשכים למגנט.
  explanation_en: Magnets attract things containing iron. Wood and rubber are not attracted.
  tags: [magnets]
- id: sci.energy.002
  skill: science.energy.magnets
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה קורה כשמקרבים קוטב צפוני של מגנט לקוטב צפוני של מגנט אחר?
  prompt_en: What happens when you bring the north pole of a magnet near another north pole?
  choices:
  - {he: הם נצמדים, en: they stick together}
  - {he: לא קורה כלום, en: nothing happens}
  - {he: הם דוחים זה את זה, en: they push each other away}
  answer: 2
  explanation_he: קטבים זהים דוחים, וקטבים שונים, צפון ודרום, מושכים זה את זה.
  explanation_en: Like poles repel, and opposite poles, north and south, attract.
  tags: [magnets]
- id: sci.energy.003
  skill: science.energy.magnets
  kind: true_false
  grade: 2
  difficulty: 0.0
  prompt_he: מגנט יכול למשוך מהדק גם דרך דף נייר.
  prompt_en: A magnet can attract a paper clip through a sheet of paper.
  answer: true
  explanation_he: נכון. הכוח המגנטי עובר דרך נייר, פלסטיק ואפילו מים. לכן מגנטים מחזיקים דפים על המקרר.
  explanation_en: True. Magnetic force passes through paper, plastic and even water. That's how magnets hold notes on the fridge.
  tags: [magnets]
- id: sci.energy.004
  skill: science.energy.magnets
  kind: true_false
  grade: 2
  difficulty: 1.0
  prompt_he: מגנט מושך את כל המתכות, כולל פחיות אלומיניום ומטבעות נחושת.
  prompt_en: A magnet attracts all metals, including aluminum cans and copper coins.
  answer: false
  explanation_he: לא נכון. מגנטים מושכים בעיקר ברזל, ניקל וקובלט. אלומיניום, נחושת, זהב וכסף לא נמשכים.
  explanation_en: False. Magnets mainly attract iron, nickel and cobalt. Aluminum, copper, gold and silver are not attracted.
  tags: [magnets]
- id: sci.energy.005
  skill: science.energy.magnets
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: למה מחט המצפן מצביעה תמיד לכיוון צפון?
  prompt_en: Why does a compass needle always point north?
  choices:
  - {he: כדור הארץ מתנהג כמו מגנט ענק, en: Earth acts like a giant magnet, emoji: 1f9ed}
  - {he: הרוח מזיזה אותה, en: the wind moves it, emoji: 1f32c}
  - {he: השמש מושכת אותה, en: the sun pulls it, emoji: '2600'}
  answer: 0
  explanation_he: המחט היא מגנט קטן. השדה המגנטי של כדור הארץ מסובב אותה כך שהיא מצביעה לצפון.
  explanation_en: The needle is a small magnet. Earth's magnetic field turns it so it points north.
  tags: [magnets]
- id: sci.energy.006
  skill: science.energy.magnets
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: שוברים מגנט לשניים. מה מקבלים?
  prompt_en: A magnet is broken in two. What do you get?
  choices:
  - {he: שתי חתיכות שאינן מגנטיות, en: two non-magnetic pieces}
  - {he: 'שני מגנטים, לכל אחד צפון ודרום', en: 'two magnets, each with north and south'}
  - {he: קוטב צפוני לבד וקוטב דרומי לבד, en: a lone north pole and a lone south pole}
  answer: 1
  explanation_he: לכל מגנט יש תמיד שני קטבים. גם החתיכות הקטנות הן מגנטים שלמים עם צפון ודרום.
  explanation_en: Every magnet always has two poles. Even small pieces are complete magnets with north and south.
  tags: [magnets]
- id: sci.energy.007
  skill: science.energy.magnets
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: באיזה חלק המגנט מושך הכי חזק?
  prompt_en: Where is a magnet's pull strongest?
  choices:
  - {he: באמצע, en: in the middle}
  - {he: בכל מקום באותה מידה, en: equally everywhere}
  - {he: 'בקטבים, בקצוות', en: 'at the poles, the ends'}
  answer: 2
  explanation_he: הכוח המגנטי חזק ביותר בקטבים. אם נפזר גרגרי ברזל ליד מגנט, רובם יתאספו בקצוות.
  explanation_en: Magnetic force is strongest at the poles. Iron filings near a magnet gather mostly at the ends.
  tags: [magnets]
- id: sci.energy.008
  skill: science.energy.magnets
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: מה קורה כשמלפפים חוט חשמל סביב מסמר ומחברים לסוללה?
  prompt_en: What happens when wire is coiled around a nail and connected to a battery?
  choices:
  - {he: המסמר הופך למגנט (אלקטרומגנט), en: the nail becomes a magnet (electromagnet)}
  - {he: המסמר נמס, en: the nail melts}
  - {he: הסוללה נטענת, en: the battery charges}
  answer: 0
  explanation_he: זרם חשמלי יוצר כוח מגנטי. אלקטרומגנט אפשר להדליק ולכבות, ולכן משתמשים בו במנופים ובפעמונים.
  explanation_en: Electric current creates magnetism. An electromagnet can be switched on and off, so it's used in cranes and bells.
  tags: [magnets]
- id: sci.energy.009
  skill: science.energy.magnets
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איך אפשר לזהות מה הקוטב הצפוני של מגנט לא מסומן?
  prompt_en: How can you find the north pole of an unmarked magnet?
  choices:
  - {he: לטעום אותו, en: taste it}
  - {he: לתלות אותו ולראות לאן הוא פונה, en: hang it freely and see where it points}
  - {he: לשקול אותו, en: weigh it}
  answer: 1
  explanation_he: מגנט שתלוי בחופשיות מסתובב כמו מצפן, והקצה שפונה לצפון הוא הקוטב הצפוני שלו.
  explanation_en: A freely hanging magnet turns like a compass, and the end that points north is its north pole.
  tags: [magnets]
- id: sci.energy.010
  skill: science.energy.magnets
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: קטבים שונים של מגנטים, צפון ודרום, נמשכים זה לזה.
  prompt_en: Opposite poles, north and south, attract each other.
  answer: true
  explanation_he: נכון. אם מקרבים צפון לדרום המגנטים נצמדים. אם מקרבים צפון לצפון הם נדחים.
  explanation_en: True. North to south, the magnets snap together. North to north, they push apart.
  tags: [magnets]
- id: sci.energy.011
  skill: science.energy.magnets
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איפה משתמשים במגנטים בבית?
  prompt_en: Where are magnets used at home?
  choices:
  - {he: בדלת המקרר וברמקולים, en: in the fridge door and speakers}
  - {he: בכוסות זכוכית, en: in glass cups}
  - {he: בכריות, en: in pillows}
  answer: 0
  explanation_he: במקרר יש פס מגנטי שסוגר את הדלת היטב. ברמקולים מגנט ואלקטרומגנט מזיזים קרום שיוצר קול.
  explanation_en: The fridge has a magnetic strip that seals the door. In speakers a magnet and electromagnet move a cone that makes sound.
  tags: [magnets]
- id: sci.energy.012
  skill: science.energy.magnets
  kind: order
  grade: 3
  difficulty: 1.0
  prompt_he: סדרו את החפצים לפי כוח המשיכה למגנט, מהחזק לחלש.
  prompt_en: Order by how strongly a magnet attracts them, strongest first.
  choices:
  - {he: מסמר ברזל במרחק מטר, en: an iron nail 1 meter away}
  - {he: מסמר ברזל ליד המגנט, en: an iron nail next to the magnet}
  - {he: מסמר ברזל במרחק 5 ס"מ, en: an iron nail 5 cm away}
  answer: [1, 2, 0]
  explanation_he: ככל שהחפץ רחוק יותר מהמגנט, הכוח המגנטי עליו חלש יותר. ממרחק גדול כמעט לא מרגישים אותו.
  explanation_en: The farther an object is from the magnet, the weaker the magnetic force. From far away it's barely felt.
  tags: [magnets]
- id: sci.energy.013
  skill: science.energy.light
  kind: choice
  grade: 2
  difficulty: -1.0
  prompt_he: מה המקור הטבעי הגדול ביותר של אור על כדור הארץ?
  prompt_en: What is the biggest natural source of light on Earth?
  choices:
  - {he: השמש, en: the sun, emoji: '2600'}
  - {he: הירח, en: the moon, emoji: 1f315}
  - {he: הנורה, en: a light bulb, emoji: 1f4a1}
  answer: 0
  explanation_he: השמש מפיקה אור בעצמה. הירח רק מחזיר את אור השמש, ונורה היא מקור אור מלאכותי.
  explanation_en: The sun makes its own light. The moon only reflects sunlight, and a bulb is an artificial light source.
  tags: [light]
- id: sci.energy.014
  skill: science.energy.light
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איך נוצר צל?
  prompt_en: How does a shadow form?
  choices:
  - {he: חפץ אטום חוסם את האור, en: an opaque object blocks the light}
  - {he: הצל יוצא מהחפץ, en: the shadow comes out of the object}
  - {he: האור נעשה שחור, en: light turns black}
  answer: 0
  explanation_he: 'אור נע בקווים ישרים. כשחפץ אטום עומד בדרך, מאחוריו נוצר אזור שהאור לא מגיע אליו: הצל.'
  explanation_en: 'Light travels in straight lines. When an opaque object blocks it, an unlit area forms behind it: the shadow.'
  tags: [light]
- id: sci.energy.015
  skill: science.energy.light
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מתי הצל שלנו בחוץ הכי ארוך?
  prompt_en: When is our shadow outdoors longest?
  choices:
  - {he: בבוקר מוקדם ובערב, en: early morning and evening}
  - {he: בצהריים, en: at noon}
  - {he: הוא תמיד באותו אורך, en: it's always the same length}
  answer: 0
  explanation_he: כשהשמש נמוכה בשמיים הצל ארוך, ובצהריים, כשהשמש גבוהה, הצל קצר.
  explanation_en: When the sun is low the shadow is long; at noon, with the sun high, it's short.
  tags: [light]
- id: sci.energy.016
  skill: science.energy.light
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה מהבאים שקוף?
  prompt_en: Which of these is transparent?
  choices:
  - {he: קיר עץ, en: a wooden wall, emoji: 1fab5}
  - {he: זכוכית של חלון, en: window glass, emoji: 1fa9f}
  - {he: ספר, en: a book, emoji: 1f4d5}
  answer: 1
  explanation_he: חומר שקוף מעביר את רוב האור, ולכן רואים דרכו. עץ וספר הם אטומים.
  explanation_en: A transparent material lets most light through, so you can see through it. Wood and a book are opaque.
  tags: [light]
- id: sci.energy.017
  skill: science.energy.light
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: אנחנו רואים חפצים כי אור מגיע מהם אל העיניים שלנו.
  prompt_en: We see objects because light travels from them into our eyes.
  answer: true
  explanation_he: נכון. רוב החפצים מחזירים אור שפוגע בהם. האור החוזר נכנס לעין, ולכן בחושך מוחלט לא רואים דבר.
  explanation_en: True. Most objects reflect the light that hits them. That light enters our eyes, so in total darkness we see nothing.
  tags: [light]
- id: sci.energy.018
  skill: science.energy.light
  kind: order
  grade: 3
  difficulty: 0.0
  prompt_he: סדרו את צבעי הקשת לפי הסדר, מהחלק החיצוני.
  prompt_en: Order the rainbow colors from the outside edge.
  choices:
  - {he: כחול, en: blue}
  - {he: ירוק, en: green}
  - {he: כתום, en: orange}
  - {he: אדום, en: red}
  - {he: סגול, en: violet}
  - {he: צהוב, en: yellow}
  answer: [3, 2, 5, 1, 0, 4]
  explanation_he: אור לבן מורכב מכל הצבעים. טיפות הגשם מפרידות אותו לצבעים, תמיד באותו סדר, מאדום ועד סגול.
  explanation_en: White light contains all colors. Raindrops split it into colors, always in the same order, from red to violet.
  tags: [light]
- id: sci.energy.019
  skill: science.energy.light
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: מה צריך כדי לראות קשת בענן?
  prompt_en: What do you need to see a rainbow?
  choices:
  - {he: לילה חשוך, en: a dark night}
  - {he: שמש מאחוריך וטיפות מים לפניך, en: the sun behind you and water drops in front}
  - {he: רק עננים בלי שמש, en: clouds but no sun}
  answer: 1
  explanation_he: הקשת נוצרת כשאור השמש נכנס לטיפות מים, נשבר ומתפרק לצבעים. לכן רואים אותה כשהשמש מאחורינו.
  explanation_en: A rainbow forms when sunlight enters water drops, bends and splits into colors, so we see it with the sun behind us.
  tags: [light]
- id: sci.energy.020
  skill: science.energy.light
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: הירח מאיר בלילה כי הוא מפיק אור משלו.
  prompt_en: The moon shines at night because it makes its own light.
  answer: false
  explanation_he: לא נכון. הירח הוא סלע שלא מפיק אור. הוא מחזיר אלינו את אור השמש שפוגע בו.
  explanation_en: False. The moon is rock that makes no light. It reflects sunlight that hits it back to us.
  tags: [light]
- id: sci.energy.021
  skill: science.energy.light
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: מה עושה מראה לאור שפוגע בה?
  prompt_en: What does a mirror do to light that hits it?
  choices:
  - {he: מחזירה אותו, en: reflects it}
  - {he: צובעת אותו בשחור, en: turns it black}
  - {he: בולעת אותו, en: absorbs it}
  answer: 0
  explanation_he: מראה חלקה ומבריקה מחזירה את האור בצורה מסודרת, ולכן רואים בה תמונה.
  explanation_en: A smooth shiny mirror reflects light neatly, so we see an image in it.
  tags: [light]
- id: sci.energy.022
  skill: science.energy.light
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: למה ביום קיץ חם כדאי ללבוש בגדים בהירים?
  prompt_en: Why wear light-colored clothes on a hot summer day?
  choices:
  - {he: בגדים כהים עושים רוח, en: dark clothes make wind}
  - {he: בגדים בהירים מחזירים יותר אור, en: light colors reflect more light}
  - {he: בגדים בהירים כבדים יותר, en: light clothes are heavier}
  answer: 1
  explanation_he: צבע כהה בולע יותר אור והופך אותו לחום. צבע בהיר מחזיר את רוב האור, ולכן הבגד נשאר קריר יותר.
  explanation_en: Dark colors absorb more light and turn it into heat. Light colors reflect most of it, so the clothes stay cooler.
  tags: [light]
- id: sci.energy.023
  skill: science.energy.light
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: כמה זמן לוקח לאור השמש להגיע לכדור הארץ?
  prompt_en: How long does sunlight take to reach Earth?
  choices:
  - {he: שנה שלמה, en: a whole year}
  - {he: שנייה אחת, en: one second}
  - {he: כ-8 דקות, en: about 8 minutes}
  answer: 2
  explanation_he: אור נע במהירות של כ-300,000 קילומטר בשנייה. גם כך, הדרך מהשמש ארוכה כל כך שזה לוקח כ-8 דקות.
  explanation_en: Light travels about 300,000 km per second. Even so, the sun is so far that it takes about 8 minutes.
  tags: [light]
- id: sci.energy.024
  skill: science.energy.light
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: בסופת ברקים רואים את הברק לפני ששומעים את הרעם, כי אור מהיר יותר מקול.
  prompt_en: In a storm we see lightning before hearing thunder, because light is faster than sound.
  answer: true
  explanation_he: נכון. הברק והרעם נוצרים באותו רגע, אבל האור מגיע כמעט מיד והקול מגיע לאט יותר.
  explanation_en: True. Lightning and thunder happen at the same moment, but light arrives almost instantly while sound is slower.
  tags: [light]
- id: sci.energy.025
  skill: science.energy.light
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מקל בכוס מים נראה שבור. למה?
  prompt_en: A straw in a glass of water looks broken. Why?
  choices:
  - {he: העין מתעייפת, en: the eye gets tired}
  - {he: האור משנה כיוון במעבר ממים לאוויר, en: light bends passing from water to air}
  - {he: המים מכופפים את המקל, en: the water bends the straw}
  answer: 1
  explanation_he: כשאור עובר בין חומרים שונים, כמו מים ואוויר, הוא משנה כיוון. זו שבירת אור.
  explanation_en: When light passes between materials like water and air it changes direction. This is called refraction.
  tags: [light]
- id: sci.energy.026
  skill: science.energy.light
  kind: order
  grade: 3
  difficulty: 0.0
  prompt_he: סדרו את החומרים לפי כמות האור שעוברת דרכם, מהרבה למעט.
  prompt_en: Order the materials by how much light passes through, most first.
  choices:
  - {he: נייר אפייה, en: baking paper}
  - {he: זכוכית שקופה, en: clear glass}
  - {he: קרטון, en: cardboard}
  answer: [1, 0, 2]
  explanation_he: זכוכית שקופה מעבירה כמעט את כל האור, נייר אפייה מעביר חלק (שקוף למחצה), וקרטון אטום.
  explanation_en: Clear glass lets almost all light through, baking paper some (translucent), and cardboard none (opaque).
  tags: [light]
- id: sci.energy.027
  skill: science.energy.sound
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איך נוצר קול?
  prompt_en: How is sound made?
  choices:
  - {he: מאור, en: by light}
  - {he: מצבעים, en: by colors}
  - {he: מרעידות, en: by vibrations}
  answer: 2
  explanation_he: כל קול נוצר מרעידות. כשמדברים, מיתרי הקול בגרון רועדים. כשמכים בתוף, העור שלו רועד.
  explanation_en: All sound comes from vibrations. When we speak our vocal cords vibrate; when a drum is hit its skin vibrates.
  tags: [sound]
- id: sci.energy.028
  skill: science.energy.sound
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: בחלל אפשר לשמוע פיצוצים רועשים.
  prompt_en: You can hear loud explosions in space.
  answer: false
  explanation_he: לא נכון. קול צריך חומר כדי לעבור, כמו אוויר או מים. בחלל אין כמעט אוויר, ולכן שם שקט מוחלט.
  explanation_en: False. Sound needs a material to travel through, like air or water. Space has almost no air, so it's totally silent.
  tags: [sound]
- id: sci.energy.029
  skill: science.energy.sound
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מתי מיתר בגיטרה משמיע צליל גבוה יותר?
  prompt_en: When does a guitar string make a higher note?
  choices:
  - {he: כשהוא ארוך ורפוי, en: when it's long and loose}
  - {he: כשהוא קצר יותר או מתוח יותר, en: when it's shorter or tighter}
  - {he: כשהגיטרה כבדה, en: when the guitar is heavy}
  answer: 1
  explanation_he: מיתר קצר ומתוח רועד מהר יותר. רעידות מהירות יוצרות צליל גבוה, ורעידות איטיות צליל נמוך.
  explanation_en: A short tight string vibrates faster. Fast vibrations make a high note; slow ones a low note.
  tags: [sound]
- id: sci.energy.030
  skill: science.energy.sound
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מהו הד?
  prompt_en: What is an echo?
  choices:
  - {he: קול שעובר רק במים, en: sound that travels only in water}
  - {he: קול שחוזר אחרי שפגע במשטח, en: sound bouncing back off a surface}
  - {he: קול שנעלם, en: sound that disappears}
  answer: 1
  explanation_he: קול שפוגע בקיר, בצוק או בהר חוזר אלינו. כשהמשטח רחוק, שומעים את ההד אחרי רגע.
  explanation_en: Sound hitting a wall, cliff or mountain bounces back. When the surface is far, we hear the echo a moment later.
  tags: [sound]
- id: sci.energy.031
  skill: science.energy.sound
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איך עטלפים מוצאים את הדרך בחושך?
  prompt_en: How do bats find their way in the dark?
  choices:
  - {he: רואים בחושך כמו ביום, en: they see in the dark like daytime, emoji: 1f441}
  - {he: משמיעים קולות ומקשיבים להד, en: they make sounds and listen for echoes, emoji: 1f987}
  - {he: מריחים את הקירות, en: they smell the walls, emoji: 1f443}
  answer: 1
  explanation_he: רוב העטלפים שאוכלים חרקים משמיעים צלילים גבוהים מאוד. לפי ההד הם יודעים איפה יש מכשולים ואוכל.
  explanation_en: Most insect-eating bats make very high sounds. From the echoes they know where obstacles and food are.
  tags: [sound]
- id: sci.energy.032
  skill: science.energy.sound
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: קול עובר גם במים ובמוצקים, ולא רק באוויר.
  prompt_en: Sound travels through water and solids, not only air.
  answer: true
  explanation_he: נכון. קול עובר אפילו מהר יותר במים ובמוצקים מאשר באוויר. לוויתנים מתקשרים בקולות מתחת למים.
  explanation_en: True. Sound travels even faster in water and solids than in air. Whales communicate with sounds underwater.
  tags: [sound]
- id: sci.energy.033
  skill: science.energy.sound
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איך יודעים כמה רחוקה סופת ברקים?
  prompt_en: How can you tell how far away a thunderstorm is?
  choices:
  - {he: מסתכלים על צבע הברק, en: look at the lightning's color}
  - {he: סופרים שניות בין הברק לרעם, en: count seconds between lightning and thunder}
  - {he: מודדים את הגשם, en: measure the rain}
  answer: 1
  explanation_he: קול עובר כקילומטר אחד בכל 3 שניות. אם עברו 6 שניות בין הברק לרעם, הסופה רחוקה כ-2 קילומטרים.
  explanation_en: Sound travels about one kilometer every 3 seconds. If 6 seconds pass between flash and thunder, the storm is about 2 km away.
  tags: [sound]
- id: sci.energy.034
  skill: science.energy.sound
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: מה מגן על האוזניים מרעש חזק מאוד?
  prompt_en: What protects ears from very loud noise?
  choices:
  - {he: משקפיים, en: glasses}
  - {he: אטמי אוזניים או מגיני אוזניים, en: earplugs or ear protectors}
  - {he: מוזיקה חזקה יותר, en: louder music}
  answer: 1
  explanation_he: רעש חזק מאוד או ממושך עלול לפגוע בשמיעה לתמיד. אטמים ומגיני אוזניים מחלישים את הקול.
  explanation_en: Very loud or long noise can permanently damage hearing. Earplugs and ear protectors soften the sound.
  tags: [sound]
- id: sci.energy.035
  skill: science.energy.sound
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: מהי בערך מהירות הקול באוויר?
  prompt_en: Roughly what is the speed of sound in air?
  choices:
  - {he: 'כ-300,000 קילומטר בשנייה', en: 'about 300,000 km per second'}
  - {he: כ-1 מטר בשנייה, en: about 1 meter per second}
  - {he: כ-340 מטר בשנייה, en: about 340 meters per second}
  answer: 2
  explanation_he: קול באוויר עובר כ-340 מטר בשנייה, הרבה יותר לאט מאור. מטוסים על-קוליים טסים מהר יותר מהקול.
  explanation_en: Sound in air travels about 340 meters per second, much slower than light. Supersonic jets fly faster than sound.
  tags: [sound]
- id: sci.energy.036
  skill: science.energy.sound
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: ככל שמכים בתוף חזק יותר, הצליל נעשה גבוה יותר.
  prompt_en: The harder you hit a drum, the higher the note gets.
  answer: false
  explanation_he: לא נכון. מכה חזקה יותר עושה קול חזק יותר, כלומר רועש יותר, אבל לא גבוה יותר. גובה הצליל תלוי במהירות הרעידות.
  explanation_en: False. Hitting harder makes a louder sound, not a higher one. Pitch depends on how fast the vibrations are.
  tags: [sound]
- id: sci.energy.037
  skill: science.energy.sound
  kind: order
  grade: 4
  difficulty: 0.0
  prompt_he: סדרו את החומרים לפי מהירות הקול בהם, מהאיטי למהיר.
  prompt_en: Order the materials by the speed of sound in them, slowest first.
  choices:
  - {he: פלדה, en: steel}
  - {he: מים, en: water}
  - {he: אוויר, en: air}
  answer: [2, 1, 0]
  explanation_he: בחומר שהחלקיקים שלו צפופים וקשורים חזק, הקול עובר מהר יותר. בפלדה הוא מהיר פי 15 בערך מאשר באוויר.
  explanation_en: Sound travels faster where particles are tightly packed and linked. In steel it's roughly 15 times faster than in air.
  tags: [sound]
- id: sci.energy.038
  skill: science.energy.sound
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: מה מודדים ביחידה דציבל?
  prompt_en: What is measured in decibels?
  choices:
  - {he: חום של מים, en: water temperature}
  - {he: גובה בניין, en: height of a building}
  - {he: עוצמת קול, en: loudness of sound}
  answer: 2
  explanation_he: דציבל מודד עד כמה קול חזק. לחישה היא כ-30 דציבל, ורעש מעל 85 דציבל לאורך זמן מזיק לשמיעה.
  explanation_en: Decibels measure how loud a sound is. A whisper is about 30 dB; long exposure above 85 dB harms hearing.
  tags: [sound]
- id: sci.energy.039
  skill: science.energy.forms
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איזו אנרגיה יש בסוללה?
  prompt_en: What kind of energy is in a battery?
  choices:
  - {he: אנרגיית קול, en: sound energy, emoji: 1f50a}
  - {he: אנרגיית אור, en: light energy, emoji: 1f4a1}
  - {he: אנרגיה כימית, en: chemical energy, emoji: 1f50b}
  answer: 2
  explanation_he: בסוללה יש חומרים שמגיבים זה עם זה ומפיקים זרם חשמלי. האנרגיה אגורה בהם כאנרגיה כימית.
  explanation_en: A battery contains substances that react to produce electric current. The energy is stored as chemical energy.
  tags: [energy_forms]
- id: sci.energy.040
  skill: science.energy.forms
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: איזו המרת אנרגיה קורית בנורה דולקת?
  prompt_en: What energy change happens in a glowing bulb?
  choices:
  - {he: קול הופך לאור, en: sound becomes light, emoji: 1f50a}
  - {he: חשמל הופך לאור וחום, en: electricity becomes light and heat, emoji: 1f4a1}
  - {he: אור הופך לחשמל, en: light becomes electricity, emoji: '2600'}
  answer: 1
  explanation_he: נורה מקבלת אנרגיה חשמלית ומוציאה אור, וגם חום. נורות לד מבזבזות פחות אנרגיה על חום.
  explanation_en: A bulb takes electrical energy and gives out light, and also heat. LED bulbs waste less energy as heat.
  tags: [energy_forms]
- id: sci.energy.041
  skill: science.energy.forms
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: מה עושה תא סולארי (פאנל סולארי)?
  prompt_en: What does a solar panel do?
  choices:
  - {he: הופך אור שמש לחשמל, en: turns sunlight into electricity, emoji: '2600'}
  - {he: מקרר את הבית, en: cools the house, emoji: 1f9ca}
  - {he: הופך חשמל לאור שמש, en: turns electricity into sunlight, emoji: 1f4a1}
  answer: 0
  explanation_he: התאים הסולאריים קולטים אור ומייצרים זרם חשמלי. בישראל השמשית יש הרבה מתקנים כאלה.
  explanation_en: Solar cells capture light and produce electric current. Sunny Israel has many such installations.
  tags: [energy_forms]
- id: sci.energy.042
  skill: science.energy.forms
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: בגוף שלנו, האנרגיה הכימית מהמזון הופכת לאנרגיית תנועה וחום.
  prompt_en: In our bodies, chemical energy from food becomes motion and heat.
  answer: true
  explanation_he: נכון. המזון הוא הדלק שלנו. כשאנחנו רצים, האנרגיה מהמזון הופכת לתנועה, וגם מחממת את הגוף.
  explanation_en: True. Food is our fuel. When we run, food energy becomes motion and also warms the body.
  tags: [energy_forms]
- id: sci.energy.043
  skill: science.energy.forms
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: לאיזה כדור יש יותר אנרגיית גובה (אנרגיה פוטנציאלית)?
  prompt_en: Which ball has more height (potential) energy?
  choices:
  - {he: כדור על המדף העליון, en: a ball on the top shelf}
  - {he: כדור על הרצפה, en: a ball on the floor}
  - {he: אותה אנרגיה לשניהם, en: both the same}
  answer: 0
  explanation_he: ככל שחפץ גבוה יותר, יש לו יותר אנרגיית גובה. כשהוא נופל, היא הופכת לאנרגיית תנועה.
  explanation_en: The higher an object is, the more height energy it has. When it falls, that becomes motion energy.
  tags: [energy_forms]
- id: sci.energy.044
  skill: science.energy.forms
  kind: true_false
  grade: 5
  difficulty: 1.0
  prompt_he: אנרגיה יכולה להיעלם לגמרי.
  prompt_en: Energy can disappear completely.
  answer: false
  explanation_he: לא נכון. אנרגיה לא נוצרת יש מאין ולא נעלמת. היא רק עוברת מצורה לצורה, לפעמים לחום שקשה להשתמש בו.
  explanation_en: False. Energy is never created from nothing or destroyed. It only changes form, sometimes into heat that's hard to use.
  tags: [energy_forms]
- id: sci.energy.045
  skill: science.energy.forms
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: איזו אנרגיה יש לרוח, ומה טורבינת רוח מייצרת ממנה?
  prompt_en: What energy does wind have, and what does a wind turbine make from it?
  choices:
  - {he: 'אנרגיית קול, ומייצרת מוזיקה', en: 'sound energy, turned into music'}
  - {he: 'אנרגיית תנועה, ומייצרת חשמל', en: 'motion energy, turned into electricity'}
  - {he: 'אנרגיית אור, ומייצרת צבעים', en: 'light energy, turned into colors'}
  answer: 1
  explanation_he: הרוח מסובבת את הלהבים, והסיבוב מפעיל גנרטור שמייצר חשמל. ברמת הגולן יש טורבינות רוח.
  explanation_en: Wind spins the blades, and the spinning drives a generator that makes electricity. There are wind turbines on the Golan Heights.
  tags: [energy_forms]
- id: sci.energy.046
  skill: science.energy.forms
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איזה מקור אנרגיה הוא מתחדש?
  prompt_en: Which energy source is renewable?
  choices:
  - {he: נפט, en: oil, emoji: 1f6e2}
  - {he: אור השמש, en: sunlight, emoji: '2600'}
  - {he: פחם, en: coal, emoji: 1faa8}
  answer: 1
  explanation_he: שמש, רוח ומים זורמים לא נגמרים. נפט, פחם וגז נוצרו במשך מיליוני שנים ובסוף ייגמרו.
  explanation_en: Sun, wind and flowing water don't run out. Oil, coal and gas took millions of years to form and will run out.
  tags: [energy_forms]
- id: sci.energy.047
  skill: science.energy.forms
  kind: true_false
  grade: 5
  difficulty: 1.0
  prompt_he: בישראל, בבתים רבים יש דוד שמש שמחמם מים בעזרת קרני השמש.
  prompt_en: Many homes in Israel have a solar water heater warmed by the sun's rays.
  answer: true
  explanation_he: נכון. מאז שנות ה-80 החוק בישראל מחייב דוד שמש ברוב הבניינים החדשים. הקולטים השחורים בולעים חום מהשמש.
  explanation_en: True. Since the 1980s Israeli law requires solar water heaters on most new buildings. The black collectors absorb the sun's heat.
  tags: [energy_forms]
- id: sci.energy.048
  skill: science.energy.forms
  kind: order
  grade: 5
  difficulty: 1.0
  prompt_he: סדרו את המרות האנרגיה כשמגלשת מים מתחילה למעלה.
  prompt_en: Order the energy changes on a water slide starting at the top.
  choices:
  - {he: 'בתחתית: הכי מהר והכי נמוך', en: 'at the bottom: fastest and lowest'}
  - {he: 'עולים במדרגות: הגוף צובר אנרגיית גובה', en: 'climb the stairs: the body gains height energy'}
  - {he: 'מתחילים לגלוש: הגובה הופך לתנועה', en: 'start sliding: height becomes motion'}
  answer: [1, 2, 0]
  explanation_he: בעלייה אנחנו משתמשים באנרגיה מהמזון כדי לצבור גובה. בגלישה אנרגיית הגובה הופכת לאנרגיית תנועה.
  explanation_en: Climbing uses food energy to gain height. Sliding turns that height energy into motion energy.
  tags: [energy_forms]
- id: sci.energy.049
  skill: science.energy.forms
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מה מקור האנרגיה של רוב שרשראות המזון, וגם של נפט ופחם?
  prompt_en: What is the energy source of most food chains, and also of oil and coal?
  choices:
  - {he: השמש, en: the sun, emoji: '2600'}
  - {he: הרוח, en: the wind, emoji: 1f32c}
  - {he: הירח, en: the moon, emoji: 1f315}
  answer: 0
  explanation_he: צמחים אוגרים אנרגיה משמש. נפט ופחם נוצרו משרידי יצורים חיים קדומים, ולכן גם בהם אגורה אנרגיית שמש.
  explanation_en: Plants store energy from the sun. Oil and coal formed from the remains of ancient living things, so they hold stored solar energy too.
  tags: [energy_forms]
- id: sci.energy.050
  skill: science.energy.forms
  kind: choice
  grade: 6
  difficulty: 2.0
  prompt_he: מתקן אשלים בנגב משתמש במראות רבות שמרכזות אור שמש למגדל. מה הוא מייצר?
  prompt_en: The Ashalim plant in the Negev uses many mirrors to focus sunlight on a tower. What does it produce?
  choices:
  - {he: גשם, en: rain, emoji: 1f327}
  - {he: מים מתוקים, en: fresh water, emoji: 1f4a7}
  - {he: חשמל, en: electricity, emoji: 26a1}
  answer: 2
  explanation_he: המראות מרכזות את אור השמש ומחממות מאוד את המגדל. החום יוצר קיטור שמסובב טורבינה ומייצר חשמל.
  explanation_en: The mirrors concentrate sunlight and heat the tower. The heat makes steam that spins a turbine to produce electricity.
  tags: [energy_forms]
- id: sci.energy.051
  skill: science.energy.heat
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: באיזה מכשיר מודדים טמפרטורה?
  prompt_en: What instrument measures temperature?
  choices:
  - {he: סרגל, en: ruler, emoji: 1f4cf}
  - {he: שעון, en: clock, emoji: 23f0}
  - {he: מדחום, en: thermometer, emoji: 1f321}
  answer: 2
  explanation_he: מדחום מראה כמה חם או קר. בישראל מודדים טמפרטורה במעלות צלזיוס.
  explanation_en: A thermometer shows how hot or cold something is. In Israel temperature is measured in degrees Celsius.
  tags: [heat]
- id: sci.energy.052
  skill: science.energy.heat
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: מעיל צמר מייצר חום.
  prompt_en: A wool coat produces heat.
  answer: false
  explanation_he: 'לא נכון. המעיל לא מייצר חום. הוא מבודד: שומר על החום שהגוף שלנו מייצר, ולא נותן לו לברוח.'
  explanation_en: False. The coat makes no heat. It insulates, keeping in the heat our body produces so it doesn't escape.
  tags: [heat]
- id: sci.energy.053
  skill: science.energy.heat
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: לאיזה כיוון עובר חום?
  prompt_en: Which way does heat flow?
  choices:
  - {he: מהחם אל הקר, en: from hot to cold}
  - {he: הוא לא עובר, en: it doesn't move}
  - {he: מהקר אל החם, en: from cold to hot}
  answer: 0
  explanation_he: חום תמיד עובר מגוף חם לגוף קר, עד ששניהם באותה טמפרטורה. לכן תה חם מתקרר בחדר.
  explanation_en: Heat always flows from a hotter object to a colder one until both are the same temperature. That's why hot tea cools.
  tags: [heat]
- id: sci.energy.054
  skill: science.energy.heat
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: איזה חומר הוא מוליך חום טוב?
  prompt_en: Which material conducts heat well?
  choices:
  - {he: מתכת, en: metal, emoji: 1f944}
  - {he: עץ, en: wood, emoji: 1fab5}
  - {he: צמר, en: wool, emoji: 1f9f6}
  answer: 0
  explanation_he: מתכות מעבירות חום מהר. לכן מבשלים בסירים ממתכת, ועץ וצמר משמשים כמבודדים.
  explanation_en: Metals pass heat quickly, so we cook in metal pots, while wood and wool serve as insulators.
  tags: [heat]
- id: sci.energy.055
  skill: science.energy.heat
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: ספסל ממתכת מרגיש קר יותר מספסל עץ, גם כששניהם באותה טמפרטורה.
  prompt_en: A metal bench feels colder than a wooden one even at the same temperature.
  answer: true
  explanation_he: נכון. המתכת מוליכה חום ומושכת מהר חום מהיד, ולכן מרגישה קרה. העץ מוליך לאט, ולכן מרגיש חמים יותר.
  explanation_en: True. Metal conducts heat and draws it quickly from your hand, so it feels cold. Wood conducts slowly, so it feels warmer.
  tags: [heat]
- id: sci.energy.056
  skill: science.energy.heat
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: למה המזגן נמצא בדרך כלל למעלה על הקיר?
  prompt_en: Why is an air conditioner usually mounted high on the wall?
  choices:
  - {he: כדי שילדים לא יגיעו, en: so kids can't reach it}
  - {he: אוויר קר יורד ואוויר חם עולה, en: cold air sinks and warm air rises}
  - {he: כי שם יש יותר חשמל, en: there's more electricity there}
  answer: 1
  explanation_he: אוויר קר צפוף יותר ויורד למטה, ואוויר חם עולה. כך האוויר הקר מתפזר בכל החדר. זו הסעה.
  explanation_en: Cold air is denser and sinks while warm air rises, spreading the cool air through the room. This is convection.
  tags: [heat]
- id: sci.energy.057
  skill: science.energy.heat
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איך מגיע אלינו החום מהשמש דרך החלל הריק?
  prompt_en: How does the sun's heat reach us through empty space?
  choices:
  - {he: בהולכה, en: by conduction, emoji: 1f944}
  - {he: בקרינה, en: by radiation, emoji: '2600'}
  - {he: בהסעה, en: by convection, emoji: 1f32c}
  answer: 1
  explanation_he: הולכה והסעה צריכות חומר. קרינה, כמו אור וקרני חום, עוברת גם בחלל הריק.
  explanation_en: Conduction and convection need matter. Radiation, like light and heat rays, travels even through empty space.
  tags: [heat]
- id: sci.energy.058
  skill: science.energy.heat
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איך תרמוס שומר משקה חם לאורך זמן?
  prompt_en: How does a thermos keep a drink hot for a long time?
  choices:
  - {he: הוא מחמם את המשקה בחשמל, en: it heats the drink electrically}
  - {he: יש בו שכבה ריקה מאוויר שמבודדת, en: it has an empty vacuum layer that insulates}
  - {he: הוא עשוי מקרח, en: it's made of ice}
  answer: 1
  explanation_he: בין שתי הדפנות יש ריק. בלי חומר כמעט אין הולכה והסעה, והדפנות המבריקות מחזירות קרינה.
  explanation_en: There's a vacuum between its walls. Without matter there's almost no conduction or convection, and shiny walls reflect radiation.
  tags: [heat]
- id: sci.energy.059
  skill: science.energy.heat
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: למה ציפורים מנפחות את הנוצות שלהן בקור?
  prompt_en: Why do birds fluff up their feathers in the cold?
  choices:
  - {he: כדי לעוף מהר, en: to fly faster}
  - {he: כדי להיראות גדולות, en: to look bigger}
  - {he: האוויר בין הנוצות מבודד, en: air trapped between feathers insulates}
  answer: 2
  explanation_he: אוויר הוא מבודד טוב. כשהנוצות מנופחות נלכדת ביניהן שכבת אוויר ששומרת על חום הגוף.
  explanation_en: Air is a good insulator. Fluffed feathers trap a layer of air that keeps the body warm.
  tags: [heat]
- id: sci.energy.060
  skill: science.energy.heat
  kind: order
  grade: 4
  difficulty: 0.0
  prompt_he: מוזגים לשלוש כוסות מים בטמפרטורות שונות. סדרו מהקר לחם.
  prompt_en: Order the cups from coldest to hottest.
  choices:
  - {he: מים מהברז, en: tap water, emoji: 1f6b0}
  - {he: תה רותח, en: boiling tea, emoji: '2615'}
  - {he: מים עם קרח, en: water with ice, emoji: 1f9ca}
  answer: [2, 0, 1]
  explanation_he: מים עם קרח קרובים ל-0 מעלות, מי ברז בטמפרטורת החדר בערך, ותה רותח קרוב ל-100 מעלות.
  explanation_en: Ice water is near 0 degrees, tap water near room temperature, and boiling tea near 100 degrees.
  tags: [heat]
- id: sci.energy.061
  skill: science.energy.heat
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: כשנוגעים בכוס תה חם, חום עובר מהכוס אל היד.
  prompt_en: When you touch a hot cup of tea, heat flows from the cup to your hand.
  answer: true
  explanation_he: נכון. חום עובר מהחם אל הקר. לכן היד מתחממת והכוס מתקררת מעט.
  explanation_en: True. Heat flows from hot to cold, so your hand warms up and the cup cools a little.
  tags: [heat]
- id: sci.energy.062
  skill: science.energy.heat
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מה ההבדל בין חום לטמפרטורה?
  prompt_en: What is the difference between heat and temperature?
  choices:
  - {he: אין הבדל, en: there is no difference}
  - {he: חום הוא אנרגיה שעוברת; טמפרטורה היא מדד, en: heat is energy on the move; temperature is a measure}
  - {he: טמפרטורה היא אנרגיה ששוקלת, en: temperature is energy that weighs something}
  answer: 1
  explanation_he: טמפרטורה מתארת את מהירות התנועה הממוצעת של החלקיקים. חום הוא אנרגיה שעוברת מחם לקר. אמבטיה פושרת מכילה יותר חום מגפרור דולק.
  explanation_en: Temperature reflects the average motion of particles. Heat is energy moving from hot to cold. A warm bath holds more heat than a lit match.
  tags: [heat]
- id: sci.energy.063
  skill: science.energy.forces
  kind: choice
  grade: 2
  difficulty: -1.0

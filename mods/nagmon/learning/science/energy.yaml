  prompt_he: מותר להכניס חפץ מתכתי לשקע בקיר אם נזהרים.
  prompt_en: It's okay to put a metal object into a wall socket if you're careful.
  answer: false
  explanation_he: לא נכון, לעולם לא! החשמל בשקע חזק מאוד ויכול לגרום לפגיעה קשה. לא נוגעים בשקעים ובחוטים חשופים.

  answer: false
  explanation_he: לא נכון. הכדור נעצר כי כוח החיכוך עם הדשא והאוויר מאט אותו. על משטח חלק מאוד הוא היה מתגלגל רחוק הרבה יותר.
  explanation_en: False. It stops because friction with the grass and air slows it. On a very smooth surface it would roll much farther.
  tags: [forces]

  answer: [0, 3, 2, 1]
  explanation_he: ככל שהמשטח חלק יותר, החיכוך קטן יותר והמכונית נוסעת רחוק יותר. בחול החיכוך הכי גדול.
  explanation_en: The smoother the surface, the less friction and the farther the car goes. Sand has the most friction.
  tags: [forces]
- id: sci.energy.074
  skill: science.energy.forces
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: משקל של אסטרונאוט על הירח קטן יותר מאשר על כדור הארץ. למה?
  prompt_en: An astronaut weighs less on the moon than on Earth. Why?
  choices:
  - {he: כוח המשיכה של הירח חלש יותר, en: the moon's gravity is weaker}
  - {he: האסטרונאוט רזה יותר, en: the astronaut got thinner}
  - {he: אין אוויר על הירח, en: there's no air on the moon}
  answer: 0
  explanation_he: כוח המשיכה על הירח הוא בערך שישית מזה של כדור הארץ. כמות החומר בגוף, המסה, לא משתנה.
  explanation_en: The moon's gravity is about one sixth of Earth's. The amount of matter in the body, its mass, doesn't change.
  tags: [forces]
- id: sci.energy.075
  skill: science.energy.electricity

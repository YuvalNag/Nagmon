  skill: science.energy.motion
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: לפי החוק השני של ניוטון (F=ma), מה קורה כשמפעילים אותו כוח על גוף בעל מסה כפולה?
  prompt_en: By Newton's second law (F=ma), what happens when the same force acts on double the mass?
  choices:
  - {he: אין שינוי בתאוצה, en: no change in acceleration}
  - {he: התאוצה גדלה פי 2, en: the acceleration doubles}
  - {he: התאוצה קטנה פי 2, en: the acceleration is halved}
  answer: 2
  explanation_he: לפי F=ma, כשהכוח קבוע, הכפלת המסה מקטינה את התאוצה פי 2. לכן קשה יותר להאיץ משאית מאשר אופניים.
  explanation_en: By F=ma, with the same force, doubling the mass halves the acceleration. That's why a truck is harder to speed up than a bike.

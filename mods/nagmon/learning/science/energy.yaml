  tags: [motion]
- id: sci.energy.102
  skill: science.energy.motion
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: מה אומר החוק השלישי של ניוטון?
  prompt_en: What does Newton's third law say?
  choices:
  - {he: לכל פעולה יש תגובה שווה והפוכה, en: every action has an equal and opposite reaction}
  - {he: גופים כבדים נופלים מהר יותר, en: heavy things fall faster}
  - {he: כל גוף נעצר מעצמו, en: everything stops by itself}
  answer: 0
  explanation_he: כשאתה דוחף קיר, הקיר דוחף אותך באותו כוח בכיוון ההפוך. כך גם רקטה דוחפת גזים לאחור ונדחפת קדימה.

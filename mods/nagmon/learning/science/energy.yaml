  difficulty: 1.0
  prompt_he: שחיין דוחף את המים לאחור. מה קורה לו?
  prompt_en: A swimmer pushes water backward. What happens to the swimmer?
  choices:
  - {he: המים דוחפים אותו קדימה, en: the water pushes the swimmer forward}
  - {he: הוא שוקע, en: the swimmer sinks}
  - {he: הוא נע לאחור, en: the swimmer moves backward}
  answer: 0
  explanation_he: 'זה החוק השלישי של ניוטון: השחיין מפעיל כוח על המים, והמים מפעילים עליו כוח שווה בכיוון ההפוך.'
  explanation_en: 'That''s Newton''s third law: the swimmer pushes the water, and the water pushes back equally in the opposite direction.'
  tags: [motion]

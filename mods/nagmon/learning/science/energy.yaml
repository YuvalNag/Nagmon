  choices:
  - {he: כדי להקטין את המשקל, en: to reduce weight}
  - {he: כדי שיהיו יפים, en: to look nice}
  - {he: כדי ליצור חיכוך ולא להחליק, en: to create friction and not skid}
  answer: 2
  explanation_he: החריצים אוחזים בכביש ומרחיקים מים בגשם. בלי חיכוך, המכונית לא הייתה יכולה לנסוע או לבלום.
  explanation_en: Treads grip the road and push water away in rain. Without friction a car couldn't drive or brake.

  prompt_en: In tug of war, when neither team moves, what does that say about the forces?
  choices:
  - {he: אין בכלל כוחות, en: there are no forces}
  - {he: הכוחות שווים ומאזנים זה את זה, en: the forces are equal and balanced}
  - {he: רק קבוצה אחת מושכת, en: only one team pulls}

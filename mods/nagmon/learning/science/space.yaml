  - {he: כוכבי לכת סלעיים, en: rocky planets}
  - {he: כוכבי לכת ננסיים, en: dwarf planets}
  answer: 0
  explanation_he: 'אורנוס ונפטון הם ענקי הקרח. יש בהם הרבה מים, אמוניה ומתאן, מתחת לשכבה עבה של גז.'
  explanation_en: 'Uranus and Neptune are the ice giants. They hold a lot of water, ammonia and methane under a thick layer of gas.'
  tags: [solar_system, outer]

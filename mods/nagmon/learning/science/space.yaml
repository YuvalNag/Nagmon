  skill: science.space.stars
  kind: order
  grade: 9
  difficulty: 1.5
  prompt_he: סדרו את שלבי החיים של כוכב כמו השמש.
  prompt_en: Order the life stages of a star like the sun.
  choices:
  - {he: ענק אדום, en: a red giant}

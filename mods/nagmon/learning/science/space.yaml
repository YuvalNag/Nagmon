- id: sci.space.146
  skill: science.space.solar_system
  kind: true_false
  grade: 8
  difficulty: 1.0
  prompt_he: בנפטון נושבות הרוחות החזקות ביותר שנמדדו בכוכבי הלכת.
  prompt_en: Neptune has the strongest winds measured on any planet.
  answer: true
  explanation_he: 'נכון. הרוחות בנפטון מגיעות ליותר מ-2,000 קמ"ש, מהר יותר ממטוס סילון.'

- id: sci.space.148
  skill: science.space.solar_system
  kind: choice
  grade: 9
  difficulty: 1.5
  prompt_he: איך גילו את כוכב הלכת נפטון בשנת 1846?
  prompt_en: How was the planet Neptune discovered in 1846?
  choices:
  - {he: חישבו אותו לפי סטיות במסלול אורנוס, en: 'it was calculated from wobbles in Uranus''s orbit'}
  - {he: ראו אותו בעין בלי טלסקופ, en: it was seen with the naked eye}
  - {he: חללית צילמה אותו, en: a spacecraft photographed it}
  answer: 0
  explanation_he: 'מדענים ראו שאורנוס זז קצת אחרת מהצפוי. הם חישבו איפה כוכב לכת נוסף מושך אותו, ומצאו שם את נפטון בטלסקופ.'
  explanation_en: Scientists saw Uranus moving slightly off its expected path. They calculated where another planet must be pulling it and found Neptune there with a telescope.
  tags: [solar_system, outer]
- id: sci.space.149
  skill: science.space.solar_system
  kind: true_false
  grade: 9
  difficulty: 1.5
  prompt_he: 'פלוטו לא נחשב לכוכב לכת, כי הוא לא פינה את הסביבה של המסלול שלו.'
  prompt_en: Pluto is not counted as a planet because it has not cleared the neighborhood around its orbit.
  answer: true
  explanation_he: 'נכון. לפי ההגדרה מ-2006, כוכב לכת צריך להקיף את השמש, להיות עגול, ולפנות את המסלול שלו. פלוטו חולק את המסלול עם גופים רבים בחגורת קויפר.'
  explanation_en: 'True. Under the 2006 definition a planet orbits the sun, is round, and has cleared its orbit. Pluto shares its zone with many Kuiper belt bodies.'
  tags: [solar_system, outer]
- id: sci.space.150
  skill: science.space.solar_system
  kind: choice
  grade: 9
  difficulty: 1.5
  prompt_he: אור השמש מגיע לכדור הארץ בכ-8 דקות. בערך כמה זמן הוא מגיע לנפטון?
  prompt_en: Sunlight reaches Earth in about 8 minutes. About how long does it take to reach Neptune?
  choices:
  - {he: בערך 4 שעות, en: about 4 hours}
  - {he: בערך 8 דקות, en: about 8 minutes}
  - {he: בערך שנה, en: about a year}
  answer: 0
  explanation_he: 'נפטון רחוק מהשמש בערך פי 30 מכדור הארץ. לכן האור מגיע אליו בערך פי 30 יותר זמן, כ-4 שעות.'
  explanation_en: 'Neptune is about 30 times farther from the sun than Earth, so light takes about 30 times longer, about 4 hours.'
  tags: [solar_system, outer]

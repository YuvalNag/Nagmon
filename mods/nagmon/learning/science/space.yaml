  - {he: טבעת של שבתאי, en: 'one of Saturn''s rings'}
  - {he: חגורת האסטרואידים ליד מאדים, en: the asteroid belt near Mars}
  answer: 0
  explanation_he: 'חגורת קויפר היא אזור עצום מעבר לנפטון, עם המון גופים קפואים. פלוטו הוא אחד מהם.'
  explanation_en: The Kuiper belt is a huge zone beyond Neptune full of icy bodies. Pluto is one of them.
  tags: [solar_system, outer]
- id: sci.space.144
  skill: science.space.solar_system
  kind: choice
  grade: 7
  difficulty: 1.0
  prompt_he: מה מיוחד בציר של אורנוס?

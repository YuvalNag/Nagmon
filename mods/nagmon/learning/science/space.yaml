  tags: [solar_system, outer]
- id: sci.space.147
  skill: science.space.solar_system
  kind: choice
  grade: 8
  difficulty: 1.5
  prompt_he: איזו חללית הגיעה הכי רחוק מכדור הארץ?
  prompt_en: Which spacecraft has traveled the farthest from Earth?
  choices:
  - {he: 'וויאג''ר 1', en: Voyager 1}
  - {he: אפולו 11, en: Apollo 11}
  - {he: תחנת החלל הבינלאומית, en: the International Space Station}
  answer: 0
  explanation_he: 'וויאג''ר 1 שוגרה ב-1977, עברה ליד צדק ושבתאי, והיום היא רחוקה מכדור הארץ יותר מכל חללית אחרת, הרבה מעבר לנפטון.'
  explanation_en: 'Voyager 1 launched in 1977, flew past Jupiter and Saturn, and is now farther from Earth than any other spacecraft, far beyond Neptune.'

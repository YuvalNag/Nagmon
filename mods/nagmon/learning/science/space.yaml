  - {he: הוא עומד ישר לגמרי, en: it stands perfectly upright}
  answer: 0
  explanation_he: 'הציר של אורנוס נטוי כמעט ב-90 מעלות, כך שהוא מתגלגל במסלול שלו. מדענים חושבים שגוף גדול פגע בו פעם.'

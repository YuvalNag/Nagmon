- id: sci.space.125
  skill: science.space.stars
  kind: choice
  grade: 9
  difficulty: 1.5
  prompt_he: 'אם המרחק בין שני גופים גדל פי 2, מה קורה לכוח המשיכה ביניהם?'
  prompt_en: 'If the distance between two objects doubles, what happens to the gravity between them?'
  choices:
  - {he: קטן פי 4, en: it gets 4 times weaker}
  - {he: קטן פי 2, en: it gets 2 times weaker}
  - {he: לא משתנה, en: it stays the same}
  - {he: גדל פי 2, en: it doubles}
  answer: 0
  explanation_he: 'כוח המשיכה נחלש לפי ריבוע המרחק: כשהמרחק גדל פי 2, הכוח נחלש פי 4.'

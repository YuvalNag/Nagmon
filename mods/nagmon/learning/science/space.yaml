  - {he: בערך 1, en: about 1}
  answer: 0
  explanation_he: 'נפטון רחוק מאוד ונע לאט, ולכן הקפה אחת שלו נמשכת כ-165 שנות כדור הארץ. 12 שנים זו בערך השנה של צדק.'
  explanation_en: 'Neptune is very far and moves slowly, so one orbit takes about 165 Earth years. About 12 years is Jupiter''s year.'

  explanation_he: 'נכון. נוגה מסתובב סביב עצמו לאט מאוד: סיבוב אחד לוקח כ-243 ימים, והקפה של השמש כ-225 ימים.'
  explanation_en: 'True. Venus spins very slowly: one turn takes about 243 Earth days, while its orbit takes about 225.'
  tags: [solar_system, rocky_planets]
- id: sci.space.036
  skill: science.space.solar_system
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מיהו אילן רמון?

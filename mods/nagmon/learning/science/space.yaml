  answer: false
  explanation_he: 'לא נכון. שם כוח המשיכה כמעט כמו על כדור הארץ. התחנה והצוות נופלים כל הזמן סביב כדור הארץ, ולכן הם מרחפים.'
  explanation_en: 'False. Gravity there is almost as strong as on Earth. The station and its crew are always falling around Earth, so they float.'

# Nagmon learning content - science / animals (groups, habitats, adaptations, life cycles, food chains, animals of Israel)
# Format: docs/kids/SDD_CONTENT.md section 3. Generated from curated sources; reviewed by a parent.
# Hebrew without niqqud. Answer indexes are 0-based; for kind=order, answer lists choice indexes in the correct order.
# Curriculum alignment: Israeli MoE "מדע וטכנולוגיה" (science and technology) strands -
#   materials, energy and interactions, systems and processes in living things, earth and universe, technology.
# Sources consulted:
#   - Elementary curriculum (grades 1-6): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/yesodi/technology-science-pedagogy/curriculum
#   - Elementary curriculum PDF (2009 draft): https://meyda.education.gov.il/files/Tochniyot_Limudim/KdamYesodi/MadaTechnologia.pdf
#   - Middle school (grades 7-9): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/chativat-beynayim/mada-technologia-pedagogia/curriculum
#   - Grade 8/9 test specifications (Meitzav/RAMA): https://meyda.education.gov.il/files/Rama/Mifrat_sci_9_H_2027.pdf
# Topics: animal groups (2-4), habitats (2-4), adaptations (3-6), life cycles (2-4), food chains (3-6), animals of Israel (2-5).
# Israel facts checked against Israel Nature and Parks Authority public info (hoopoe = national bird 2008; reintroduced onager, oryx, fallow deer).

skill: science.animals.groups
items:
- id: sci.animals.001
  skill: science.animals.groups
  kind: choice
  grade: 2
  difficulty: -1.0
  prompt_he: איזה בעל חיים הוא יונק?
  prompt_en: Which animal is a mammal?
  choices:
  - {he: כלב, en: dog, emoji: 1f415}
  - {he: תרנגולת, en: chicken, emoji: 1f414}
  - {he: דג, en: fish, emoji: 1f41f}
  answer: 0
  explanation_he: יונקים מניקים את הגורים שלהם בחלב, ולרובם יש שיער או פרווה. כלב הוא יונק.
  explanation_en: Mammals feed their young milk, and most have hair or fur. A dog is a mammal.
  tags: [animal_groups]
- id: sci.animals.002
  skill: science.animals.groups
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה מכסה את הגוף של ציפור?
  prompt_en: What covers a bird's body?
  choices:
  - {he: נוצות, en: feathers}
  - {he: קשקשים, en: scales}
  - {he: פרווה, en: fur}
  answer: 0
  explanation_he: רק לעופות יש נוצות. הנוצות שומרות על חום הגוף ועוזרות לעוף.
  explanation_en: Only birds have feathers. Feathers keep the body warm and help with flying.
  tags: [animal_groups]
- id: sci.animals.003
  skill: science.animals.groups
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איך דג נושם מתחת למים?
  prompt_en: How does a fish breathe underwater?
  choices:
  - {he: הוא לא נושם, en: it doesn't breathe}
  - {he: בעזרת זימים, en: with gills}
  - {he: בעזרת ריאות, en: with lungs}
  answer: 1
  explanation_he: הזימים לוקחים את החמצן שמומס במים. לכן דג יכול לנשום במים אבל לא באוויר.
  explanation_en: Gills take in the oxygen dissolved in water. That's why fish breathe in water but not in air.
  tags: [animal_groups]
- id: sci.animals.004
  skill: science.animals.groups
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: לאיזו קבוצה שייך הנחש?
  prompt_en: Which group does a snake belong to?
  choices:
  - {he: זוחלים, en: reptiles, emoji: 1f40d}
  - {he: דו-חיים, en: amphibians, emoji: 1f438}
  - {he: תולעים, en: worms, emoji: 1fab1}
  answer: 0
  explanation_he: 'נחש הוא זוחל: יש לו עור יבש עם קשקשים והוא נושם בריאות. גם לטאות, צבים ותנינים הם זוחלים.'
  explanation_en: 'A snake is a reptile: it has dry scaly skin and breathes with lungs. Lizards, turtles and crocodiles are reptiles too.'
  tags: [animal_groups]
- id: sci.animals.005
  skill: science.animals.groups
  kind: true_false
  grade: 2
  difficulty: 0.0
  prompt_he: עטלף הוא יונק שיכול לעוף.
  prompt_en: A bat is a mammal that can fly.
  answer: true
  explanation_he: נכון. לעטלף יש פרווה והוא מניק את הגורים. הוא היונק היחיד שעף באמת.
  explanation_en: True. A bat has fur and nurses its young. It is the only mammal that truly flies.
  tags: [animal_groups]
- id: sci.animals.006
  skill: science.animals.groups
  kind: true_false
  grade: 2
  difficulty: 0.0
  prompt_he: פינגווין הוא דג כי הוא שוחה מצוין.
  prompt_en: A penguin is a fish because it swims so well.
  answer: false
  explanation_he: 'לא נכון. פינגווין הוא עוף: יש לו נוצות ומקור, הוא מטיל ביצים ונושם בריאות. הכנפיים שלו משמשות לשחייה.'
  explanation_en: 'False. A penguin is a bird: it has feathers and a beak, lays eggs and breathes with lungs. Its wings are used for swimming.'
  tags: [animal_groups]
- id: sci.animals.007
  skill: science.animals.groups
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה משותף לכל היונקים?
  prompt_en: What do all mammals have in common?
  choices:
  - {he: הגורים יונקים חלב מאמם, en: the young drink their mother's milk}
  - {he: כולם חיים ביבשה, en: they all live on land}
  - {he: כולם אוכלים בשר, en: they all eat meat}
  answer: 0
  explanation_he: השם יונקים בא מכך שהגורים יונקים חלב. יש יונקים בים, כמו לוויתן, ויש יונקים שאוכלים רק צמחים, כמו פרה.
  explanation_en: Mammals are named for nursing their young with milk. Some live in the sea, like whales, and some eat only plants, like cows.
  tags: [animal_groups]
- id: sci.animals.008
  skill: science.animals.groups
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: מי מהבאים אינו דג?
  prompt_en: Which of these is NOT a fish?
  choices:
  - {he: סוסון ים, en: seahorse}
  - {he: דולפין, en: dolphin}
  - {he: דג זהב, en: goldfish}
  - {he: כריש, en: shark}
  answer: 1
  explanation_he: 'דולפין הוא יונק: הוא עולה לפני המים כדי לנשום אוויר. כריש וסוסון ים הם דגים ונושמים בזימים.'
  explanation_en: 'A dolphin is a mammal: it surfaces to breathe air. Sharks and seahorses are fish that breathe with gills.'
  tags: [animal_groups]
- id: sci.animals.009
  skill: science.animals.groups
  kind: choice
  grade: 2
  difficulty: -1.0
  prompt_he: מי מטיל ביצים?
  prompt_en: Which of these lays eggs?
  choices:
  - {he: סוס, en: horse, emoji: 1f40e}
  - {he: פרה, en: cow, emoji: 1f404}
  - {he: תרנגולת, en: hen, emoji: 1f414}
  answer: 2
  explanation_he: עופות מטילים ביצים, וגם רוב הזוחלים, הדגים והחרקים. פרה וסוס יולדים גורים.
  explanation_en: Birds lay eggs, and so do most reptiles, fish and insects. Cows and horses give birth to live young.
  tags: [animal_groups]
- id: sci.animals.010
  skill: science.animals.groups
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: מהו בעל החיים הגדול ביותר שחי היום על פני כדור הארץ?
  prompt_en: What is the largest animal alive on Earth today?
  choices:
  - {he: הפיל האפריקאי, en: the African elephant, emoji: 1f418}
  - {he: הג'ירפה, en: the giraffe, emoji: 1f992}
  - {he: הלוויתן הכחול, en: the blue whale, emoji: 1f40b}
  answer: 2
  explanation_he: הלוויתן הכחול יכול להגיע לאורך של כ-30 מטר. הוא כבד אפילו מהדינוזאורים הגדולים ביותר שאנחנו מכירים.
  explanation_en: The blue whale can reach about 30 meters long and is heavier than even the largest known dinosaurs.
  tags: [animal_groups]
- id: sci.animals.011
  skill: science.animals.groups
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: אצל סוסוני ים, הזכר הוא זה שנושא את הביצים עד שהן בוקעות.
  prompt_en: In seahorses, the male carries the eggs until they hatch.
  answer: true
  explanation_he: נכון. הנקבה מטילה את הביצים לתוך כיס בבטן של הזכר, והוא שומר עליהן עד שהגורים יוצאים.
  explanation_en: True. The female places her eggs in a pouch on the male's belly, and he keeps them until the babies come out.
  tags: [animal_groups]
- id: sci.animals.012
  skill: science.animals.groups
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה מאפיין דו-חיים?
  prompt_en: What is typical of amphibians?
  choices:
  - {he: קשקשים יבשים, en: dry scales}
  - {he: 'עור לח, וחיים במים וביבשה', en: 'moist skin, life in water and on land'}
  - {he: נוצות ומקור, en: feathers and a beak}
  answer: 1
  explanation_he: לדו-חיים, כמו צפרדע, יש עור לח שדרכו הם גם נושמים. הם בוקעים במים ורבים מהם עוברים לחיות גם ביבשה.
  explanation_en: Amphibians like frogs have moist skin they can also breathe through. They hatch in water and many later live on land.
  tags: [animal_groups]
- id: sci.animals.013
  skill: science.animals.groups
  kind: order
  grade: 3
  difficulty: 0.0
  prompt_he: סדרו את בעלי החיים מהקטן לגדול.
  prompt_en: Order these animals from smallest to largest.
  choices:
  - {he: עכבר, en: mouse, emoji: 1f401}
  - {he: כלב, en: dog, emoji: 1f415}
  - {he: פיל, en: elephant, emoji: 1f418}
  - {he: נמלה, en: ant, emoji: 1f41c}
  answer: [3, 0, 1, 2]
  explanation_he: נמלה קטנה מאוד, עכבר קטן מכלב, ופיל הוא היונק היבשתי הגדול ביותר.
  explanation_en: An ant is tiny, a mouse is smaller than a dog, and the elephant is the largest land mammal.
  tags: [animal_groups]
- id: sci.animals.014
  skill: science.animals.habitats
  kind: choice
  grade: 2
  difficulty: -1.0
  prompt_he: איפה חי הגמל?
  prompt_en: Where does the camel live?
  choices:
  - {he: בקוטב הצפוני, en: at the North Pole}
  - {he: בתוך הים, en: in the sea}
  - {he: במדבר, en: in the desert}
  answer: 2
  explanation_he: 'הגמל מותאם למדבר: הוא מסתדר עם מעט מים ורגליו הרחבות לא שוקעות בחול.'
  explanation_en: 'The camel is adapted to the desert: it manages with little water and its wide feet don''t sink in sand.'
  tags: [habitats]
- id: sci.animals.015
  skill: science.animals.habitats
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה זה בית גידול?
  prompt_en: What is a habitat?
  choices:
  - {he: המקום הטבעי שבו יצור חי ומוצא את צרכיו, en: the natural home where a living thing finds its needs}
  - {he: בית של בני אדם, en: a house for people}
  - {he: גן חיות, en: a zoo}
  answer: 0
  explanation_he: בית גידול הוא סביבה טבעית שיש בה מזון, מים, מחסה ותנאים שמתאימים ליצור.
  explanation_en: A habitat is a natural environment with the food, water, shelter and conditions a creature needs.
  tags: [habitats]
- id: sci.animals.016
  skill: science.animals.habitats
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איפה חי הדוב הלבן?
  prompt_en: Where does the polar bear live?
  choices:
  - {he: במדבר יהודה, en: in the Judean Desert}
  - {he: באזור הקוטב הצפוני, en: in the Arctic}
  - {he: ביער גשם חם, en: in a hot rainforest}
  answer: 1
  explanation_he: הדוב הלבן חי בקור של הקוטב הצפוני. הפרווה העבה ושכבת השומן שומרות עליו חם.
  explanation_en: The polar bear lives in the cold Arctic. Thick fur and a layer of fat keep it warm.
  tags: [habitats]
- id: sci.animals.017
  skill: science.animals.habitats
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: דובים לבנים ופינגווינים חיים יחד באותו מקום.
  prompt_en: Polar bears and penguins live together in the same place.
  answer: false
  explanation_he: לא נכון. דובים לבנים חיים בצפון, ליד הקוטב הצפוני. רוב הפינגווינים חיים בחצי הדרומי של כדור הארץ, ובעיקר באנטארקטיקה.
  explanation_en: False. Polar bears live in the far north (Arctic). Most penguins live in the Southern Hemisphere, especially Antarctica.
  tags: [habitats]
- id: sci.animals.018
  skill: science.animals.habitats
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: באיזה בית גידול חיים הכי הרבה סוגים של בעלי חיים וצמחים?
  prompt_en: Which habitat has the most kinds of animals and plants?
  choices:
  - {he: יער גשם טרופי, en: tropical rainforest}
  - {he: קוטב, en: polar region}
  - {he: מדבר, en: desert}
  answer: 0
  explanation_he: ביער הגשם חם ולח כל השנה, ויש הרבה מזון. לכן חיים בו יותר מינים מכל בית גידול יבשתי אחר.
  explanation_en: A rainforest is warm and wet all year with lots of food, so it holds more species than any other land habitat.
  tags: [habitats]
- id: sci.animals.019
  skill: science.animals.habitats
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מי מבעלי החיים חי מתחת לאדמה, בתוך מחילות?
  prompt_en: Which animal lives underground in tunnels?
  choices:
  - {he: חפרפרת, en: mole}
  - {he: עיט, en: eagle}
  - {he: דולפין, en: dolphin}
  answer: 0
  explanation_he: החפרפרת חופרת מחילות בעזרת כפות ידיים רחבות. גם תולעים ונמלים חיות באדמה.
  explanation_en: The mole digs tunnels with its broad front paws. Worms and ants live in the soil too.
  tags: [habitats]
- id: sci.animals.020
  skill: science.animals.habitats
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: רוב פני כדור הארץ מכוסים במים.
  prompt_en: Most of Earth's surface is covered by water.
  answer: true
  explanation_he: נכון. כ-70 אחוז מפני כדור הארץ הם אוקיינוסים וימים, ולכן הים הוא בית הגידול הגדול ביותר.
  explanation_en: True. About 70 percent of Earth's surface is ocean and sea, making it the largest habitat.
  tags: [habitats]
- id: sci.animals.021
  skill: science.animals.habitats
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: בשונית האלמוגים באילת חיים דגים צבעוניים רבים. מה הם האלמוגים?
  prompt_en: Many colorful fish live on the coral reef in Eilat. What are corals?
  choices:
  - {he: צמחים ימיים, en: sea plants}
  - {he: אבנים צבעוניות, en: colorful stones}
  - {he: בעלי חיים קטנים שבונים שלד, en: tiny animals that build skeletons}
  answer: 2
  explanation_he: אלמוגים הם בעלי חיים זעירים שחיים במושבות. השלד הגירני שלהם בונה את השונית, שהיא בית לדגים רבים.
  explanation_en: Corals are tiny animals living in colonies. Their limestone skeletons build the reef, home to many fish.
  tags: [habitats]
- id: sci.animals.022
  skill: science.animals.habitats
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איפה כדאי לחפש סרטנים?
  prompt_en: Where should you look for crabs?
  choices:
  - {he: במערה חשוכה במדבר, en: in a dark desert cave}
  - {he: על צמרת העץ, en: at the top of a tree}
  - {he: על חוף הים ובין הסלעים, en: on the beach and among rocks}
  answer: 2
  explanation_he: סרטנים רבים חיים במים או לידם, בחוף ובין סלעים, ושם הם מוצאים מזון ומסתור.
  explanation_en: Many crabs live in or near water, on beaches and among rocks, where they find food and hiding places.
  tags: [habitats]
- id: sci.animals.023
  skill: science.animals.habitats
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: במדבר אין בכלל בעלי חיים, כי חם ויבש מדי.
  prompt_en: No animals live in the desert because it is too hot and dry.
  answer: false
  explanation_he: לא נכון. במדבר חיים יעלים, שפני סלע, נחשים, עקרבים וציפורים רבות. הם מותאמים לחום ולמחסור במים.
  explanation_en: False. Ibex, hyraxes, snakes, scorpions and many birds live in the desert. They are adapted to heat and little water.
  tags: [habitats]
- id: sci.animals.024
  skill: science.animals.habitats
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: למה דגים לא יכולים לחיות במים מזוהמים מאוד?
  prompt_en: Why can't fish live in very polluted water?
  choices:
  - {he: יש בהם מעט חמצן וחומרים רעילים, en: they have little oxygen and toxic substances}
  - {he: כי המים צבעוניים, en: because the water is colored}
  - {he: כי אין בהם מלח, en: because there is no salt}
  answer: 0
  explanation_he: זיהום מוריד את כמות החמצן במים ומוסיף רעלים. כך בית הגידול נפגע, ובעלי החיים נעלמים ממנו.
  explanation_en: Pollution lowers the oxygen in water and adds toxins, so the habitat is damaged and animals disappear.
  tags: [habitats]
- id: sci.animals.025
  skill: science.animals.habitats
  kind: order
  grade: 4
  difficulty: 1.0
  prompt_he: סדרו את בתי הגידול מהיבש ביותר לרטוב ביותר.
  prompt_en: Order the habitats from driest to wettest.
  choices:
  - {he: מדבר, en: desert}
  - {he: יער גשם, en: rainforest}
  - {he: ערבה עם עשב, en: grassland}
  - {he: ים, en: sea}
  answer: [0, 2, 1, 3]
  explanation_he: במדבר יורד מעט מאוד גשם, בערבה יותר, ביער גשם יורד גשם כמעט כל יום, והים הוא כולו מים.
  explanation_en: Deserts get very little rain, grasslands more, rainforests rain almost daily, and the sea is all water.
  tags: [habitats]
- id: sci.animals.026
  skill: science.animals.adaptations
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: למה לברווז יש קרום בין האצבעות?
  prompt_en: Why does a duck have webbed feet?
  choices:
  - {he: כדי לחפור באדמה, en: to dig in the ground}
  - {he: כדי לטפס על עצים, en: to climb trees}
  - {he: כדי לשחות טוב יותר, en: to swim better}
  answer: 2
  explanation_he: הקרום הופך את כף הרגל למשוט רחב שדוחף הרבה מים. כך הברווז שוחה בקלות.
  explanation_en: The webbing turns the foot into a wide paddle that pushes lots of water, so the duck swims easily.
  tags: [adaptations]
- id: sci.animals.027
  skill: science.animals.adaptations
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: למה לשועל המדבר (פנק) יש אוזניים גדולות במיוחד?
  prompt_en: Why does the desert fennec fox have very large ears?
  choices:
  - {he: כדי לפלוט חום ולשמוע טוב, en: to release heat and hear well}
  - {he: כדי לאגור מים, en: to store water}
  - {he: כדי לעוף, en: to fly}
  answer: 0
  explanation_he: דרך האוזניים הגדולות הגוף מאבד חום ומתקרר. הן גם קולטות קולות חלשים מאוד.
  explanation_en: Large ears let body heat escape so the fox cools down. They also pick up very faint sounds.
  tags: [adaptations]
- id: sci.animals.028
  skill: science.animals.adaptations
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה עוזר לדוב הלבן לשרוד בקור?
  prompt_en: What helps the polar bear survive the cold?
  choices:
  - {he: עור דק, en: thin skin}
  - {he: פרווה עבה ושכבת שומן, en: thick fur and a layer of fat}
  - {he: רגליים ארוכות, en: long legs}
  answer: 1
  explanation_he: 'הפרווה והשומן הם כמו מעיל ושמיכה: הם שומרים על חום הגוף גם בקור עז.'
  explanation_en: Fur and fat work like a coat and a blanket, keeping body heat in even in bitter cold.
  tags: [adaptations]
- id: sci.animals.029
  skill: science.animals.adaptations
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: זיקית משנה צבע גם כדי להתחמם או להתקרר, וגם כדי להעביר מסרים לזיקיות אחרות.
  prompt_en: A chameleon changes color to warm up or cool down and to send signals to other chameleons.
  answer: true
  explanation_he: נכון. צבע כהה סופג יותר חום, וצבע בהיר פחות. שינוי הצבע משמש גם לתקשורת, ולפעמים גם להסוואה.
  explanation_en: True. Darker colors absorb more heat, lighter ones less. Color change also works for communication and sometimes camouflage.
  tags: [adaptations]
- id: sci.animals.030
  skill: science.animals.adaptations
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: למה הרבה בעלי חיים במדבר פעילים בעיקר בלילה?
  prompt_en: Why are many desert animals active mainly at night?
  choices:
  - {he: בלילה קריר יותר ומאבדים פחות מים, en: 'nights are cooler, so they lose less water'}
  - {he: כי בלילה יש יותר אוכל בצבע לבן, en: because white food appears at night}
  - {he: כי הם מפחדים מהשמש, en: because they are scared of the sun}
  answer: 0
  explanation_he: ביום חם מאוד במדבר. כשנחים במחילה ביום ויוצאים בלילה, חוסכים מים ונמנעים מהחום.
  explanation_en: Desert days are very hot. Resting in a burrow by day and coming out at night saves water and avoids the heat.
  tags: [adaptations]
- id: sci.animals.031
  skill: science.animals.adaptations
  kind: choice
  grade: 3
  difficulty: -1.0
  prompt_he: מה עוזר לקיפוד להגן על עצמו?
  prompt_en: What helps a hedgehog protect itself?
  choices:
  - {he: כנפיים, en: wings}
  - {he: צבע זוהר, en: glowing color}
  - {he: קוצים, en: spines}
  answer: 2
  explanation_he: כשקיפוד מרגיש סכנה הוא מתכדרר לכדור. הקוצים מרחיקים טורפים.
  explanation_en: When a hedgehog senses danger it rolls into a ball, and its spines keep predators away.
  tags: [adaptations]
- id: sci.animals.032
  skill: science.animals.adaptations
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: למה לג'ירפה יש צוואר ארוך?
  prompt_en: How does a long neck help a giraffe?
  choices:
  - {he: היא מגיעה לעלים בצמרות העצים, en: it reaches leaves high in trees}
  - {he: היא שומרת מים בצוואר, en: it stores water in its neck}
  - {he: היא שוחה מהר יותר, en: it swims faster}
  answer: 0
  explanation_he: הצוואר הארוך מאפשר לג'ירפה לאכול עלים גבוהים, שבעלי חיים אחרים לא מגיעים אליהם.
  explanation_en: The long neck lets a giraffe eat high leaves that other animals can't reach.
  tags: [adaptations]
- id: sci.animals.033
  skill: science.animals.adaptations
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: למה לעופות רבים יש עצמות חלולות?
  prompt_en: Why do many birds have hollow bones?
  choices:
  - {he: כדי לאגור אוכל, en: to store food}
  - {he: כדי לשמוע טוב, en: to hear better}
  - {he: כדי שהגוף יהיה קל לתעופה, en: to keep the body light for flight}
  answer: 2
  explanation_he: עצמות חלולות הן קלות אבל חזקות. גוף קל צריך פחות אנרגיה כדי להתרומם ולעוף.
  explanation_en: Hollow bones are light yet strong. A lighter body needs less energy to take off and fly.
  tags: [adaptations]
- id: sci.animals.034
  skill: science.animals.adaptations
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: צורת המקור לא קשורה למה שהציפור אוכלת.
  prompt_en: A bird's beak shape has nothing to do with what it eats.
  answer: false
  explanation_he: לא נכון. לצופית יש מקור דק וארוך ללגימת צוף, לדרור יש מקור קצר וחזק לפיצוח זרעים.
  explanation_en: False. A sunbird has a long thin beak for sipping nectar; a sparrow has a short strong beak for cracking seeds.
  tags: [adaptations]
- id: sci.animals.035
  skill: science.animals.adaptations
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: השועל הארקטי לבן בחורף וחום בקיץ. במה זה עוזר לו?
  prompt_en: The Arctic fox is white in winter and brown in summer. How does this help?
  choices:
  - {he: הוא מתחמם יותר מהשמש, en: it heats up more in the sun}
  - {he: הוא נראה יפה יותר, en: it looks prettier}
  - {he: 'הסוואה: קשה לראות אותו', en: 'camouflage: it is hard to see'}
  answer: 2
  explanation_he: בחורף הנוף מושלג ובקיץ הוא חום. כשהצבע מתאים לנוף קשה לראות את השועל.
  explanation_en: In winter the land is snowy and in summer it is brown. Matching the background makes the fox hard to spot.
  tags: [adaptations]
- id: sci.animals.036
  skill: science.animals.adaptations
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה עוזר לינשוף למצוא מזון בלילה?
  prompt_en: What helps an owl find food at night?
  choices:
  - {he: עיניים גדולות ושמיעה חדה, en: big eyes and sharp hearing}
  - {he: אף ארוך, en: a long nose}
  - {he: קשקשים, en: scales}
  answer: 0
  explanation_he: עיני הינשוף קולטות הרבה אור, ושמיעתו כל כך טובה שהוא שומע עכבר זז בתוך העשב.
  explanation_en: Owl eyes gather lots of light, and their hearing is so sharp they can hear a mouse moving in the grass.
  tags: [adaptations]
- id: sci.animals.037
  skill: science.animals.adaptations
  kind: true_false
  grade: 5
  difficulty: 1.0
  prompt_he: לגמל יש ריסים ארוכים ונחיריים שאפשר לסגור, וזה עוזר לו בסופות חול.
  prompt_en: A camel has long eyelashes and nostrils it can close, which help in sandstorms.
  answer: true
  explanation_he: נכון. הריסים הארוכים והנחיריים הנסגרים מונעים מהחול להיכנס לעיניים ולאף.
  explanation_en: True. Long eyelashes and closable nostrils keep sand out of its eyes and nose.
  tags: [adaptations]
- id: sci.animals.038
  skill: science.animals.adaptations
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: למה פינגווינים בקור עומדים צפופים בקבוצה גדולה?
  prompt_en: Why do penguins in the cold huddle in a big group?
  choices:
  - {he: כדי לשחק, en: to play}
  - {he: כדי לשמור על חום הגוף, en: to keep warm}
  - {he: כדי לישון בעמידה, en: to sleep standing up}
  answer: 1
  explanation_he: כשהם צמודים, כל פינגווין מאבד פחות חום לאוויר הקר. הם מתחלפים, כך שכל אחד מגיע גם למרכז החם.
  explanation_en: Huddling means each penguin loses less heat to the cold air. They take turns so each reaches the warm middle.
  tags: [adaptations]
- id: sci.animals.039
  skill: science.animals.lifecycles
  kind: order
  grade: 2
  difficulty: 0.0
  prompt_he: סדרו את מחזור החיים של הפרפר.
  prompt_en: Order the life cycle of a butterfly.
  choices:
  - {he: זחל, en: caterpillar}
  - {he: פרפר, en: butterfly}
  - {he: גולם, en: pupa (chrysalis)}
  - {he: ביצה, en: egg}
  answer: [3, 0, 2, 1]
  explanation_he: הנקבה מטילה ביצה, ממנה בוקע זחל שאוכל עלים. הזחל הופך לגולם, ומהגולם יוצא פרפר בוגר.
  explanation_en: The butterfly lays an egg, a caterpillar hatches and eats leaves, it becomes a pupa, and an adult butterfly emerges.
  tags: [lifecycles]
- id: sci.animals.040
  skill: science.animals.lifecycles
  kind: order
  grade: 3
  difficulty: 0.0
  prompt_he: סדרו את מחזור החיים של הצפרדע.
  prompt_en: Order the life cycle of a frog.
  choices:
  - {he: ביצים במים, en: eggs in water}
  - {he: ראשן עם רגליים, en: tadpole with legs}
  - {he: ראשן, en: tadpole}
  - {he: צפרדע בוגרת, en: adult frog}
  answer: [0, 2, 1, 3]
  explanation_he: הראשן חי במים ונושם בזימים. בהדרגה צומחות לו רגליים, הזנב נעלם, והוא הופך לצפרדע שנושמת בריאות.
  explanation_en: A tadpole lives in water and breathes with gills. Legs grow, the tail disappears, and it becomes a frog with lungs.
  tags: [lifecycles]
- id: sci.animals.041
  skill: science.animals.lifecycles
  kind: order
  grade: 2
  difficulty: -1.0
  prompt_he: סדרו את מחזור החיים של התרנגולת.
  prompt_en: Order the life cycle of a chicken.
  choices:
  - {he: אפרוח, en: chick, emoji: 1f425}
  - {he: אפרוח בוקע, en: hatching chick, emoji: 1f423}
  - {he: ביצה, en: egg, emoji: 1f95a}
  - {he: תרנגולת, en: hen, emoji: 1f414}
  answer: [2, 1, 0, 3]
  explanation_he: התרנגולת דוגרת על הביצה כשלושה שבועות. האפרוח בוקע, גדל ומתפתח לתרנגולת.
  explanation_en: The hen sits on the egg for about three weeks. The chick hatches, grows and becomes a hen.
  tags: [lifecycles]
- id: sci.animals.042
  skill: science.animals.lifecycles
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איך נקרא הגור של הצפרדע?
  prompt_en: What is a baby frog called?
  choices:
  - {he: גוזל, en: nestling}
  - {he: ראשן, en: tadpole}
  - {he: אפרוח, en: chick}
  answer: 1
  explanation_he: ראשן נראה כמו דג קטן עם זנב. הוא חי במים עד שהוא הופך לצפרדע.
  explanation_en: A tadpole looks like a small fish with a tail. It lives in water until it becomes a frog.
  tags: [lifecycles]
- id: sci.animals.043
  skill: science.animals.lifecycles
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה עושה הזחל של הפרפר רוב הזמן?
  prompt_en: What does a caterpillar do most of the time?
  choices:
  - {he: מטיל ביצים, en: lays eggs}
  - {he: אוכל עלים וגדל, en: eats leaves and grows}
  - {he: עף מפרח לפרח, en: flies from flower to flower}
  answer: 1
  explanation_he: הזחל אוכל הרבה ומשיל את עורו כמה פעמים כשהוא גדל. האנרגיה הזאת משמשת לשלב הגולם.
  explanation_en: A caterpillar eats a lot and sheds its skin several times as it grows. The energy is used in the pupa stage.
  tags: [lifecycles]
- id: sci.animals.044
  skill: science.animals.lifecycles
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: רוב היונקים יולדים גורים חיים, ולא מטילים ביצים.
  prompt_en: Most mammals give birth to live young rather than laying eggs.
  answer: true
  explanation_he: נכון. רוב היונקים יולדים. יש יוצאי דופן נדירים כמו הברווזן, יונק שמטיל ביצים.
  explanation_en: True. Most mammals give birth. Rare exceptions like the platypus are mammals that lay eggs.
  tags: [lifecycles]
- id: sci.animals.045
  skill: science.animals.lifecycles
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: הגורים של כל בעלי החיים נראים בדיוק כמו ההורים שלהם.
  prompt_en: The young of all animals look exactly like their parents.
  answer: false
  explanation_he: לא נכון. זחל לא דומה לפרפר, וראשן לא דומה לצפרדע. אצלם יש שינוי גדול בצורה שנקרא גלגול.
  explanation_en: False. A caterpillar doesn't look like a butterfly, nor a tadpole like a frog. They go through a big change called metamorphosis.
  tags: [lifecycles]
- id: sci.animals.046
  skill: science.animals.lifecycles
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איך נקרא שינוי צורה גדול במהלך החיים, כמו מזחל לפרפר?
  prompt_en: What is the big change in body form, like caterpillar to butterfly, called?
  choices:
  - {he: נדידה, en: migration}
  - {he: גלגול (מטמורפוזה), en: metamorphosis}
  - {he: תרדמה, en: hibernation}
  answer: 1
  explanation_he: בגלגול הגוף משתנה לגמרי. כך זה אצל פרפרים, דבורים, חיפושיות וצפרדעים.
  explanation_en: In metamorphosis the body changes completely, as in butterflies, bees, beetles and frogs.
  tags: [lifecycles]
- id: sci.animals.047
  skill: science.animals.lifecycles
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איפה צבי ים מטילים את הביצים שלהם, גם בחופי ישראל?
  prompt_en: Where do sea turtles lay their eggs, including on Israel's beaches?
  choices:
  - {he: בקן על עץ, en: in a nest in a tree}
  - {he: בתוך הים, en: in the sea}
  - {he: בחול על חוף הים, en: in the sand on the beach}
  answer: 2
  explanation_he: הנקבה יוצאת מהים בלילה וחופרת גומה בחול. כשהגורים בוקעים הם זוחלים מיד אל הים.
  explanation_en: The female comes ashore at night and digs a hole in the sand. The hatchlings crawl straight to the sea.
  tags: [lifecycles]
- id: sci.animals.048
  skill: science.animals.lifecycles
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איפה מתפתח גור הקנגורו אחרי שהוא נולד?
  prompt_en: Where does a baby kangaroo develop after birth?
  choices:
  - {he: בכיס על בטן האם, en: in a pouch on its mother's belly}
  - {he: בביצה, en: in an egg}
  - {he: במחילה באדמה, en: in a burrow}
  answer: 0
  explanation_he: גור הקנגורו נולד קטנטן וזוחל לכיס, שם הוא יונק ומתפתח במשך חודשים.
  explanation_en: A baby kangaroo is born tiny and crawls into the pouch, where it nurses and grows for months.
  tags: [lifecycles]
- id: sci.animals.049
  skill: science.animals.lifecycles
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: מחזור החיים של יתוש מתחיל במים.
  prompt_en: A mosquito's life cycle starts in water.
  answer: true
  explanation_he: נכון. יתושים מטילים ביצים במים עומדים, והזחלים חיים בהם. לכן חשוב לא להשאיר מים עומדים בחצר.
  explanation_en: True. Mosquitoes lay eggs in still water where the larvae live. That's why we shouldn't leave standing water outside.
  tags: [lifecycles]
- id: sci.animals.050
  skill: science.animals.lifecycles
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איזה חרק טווה פקעת שממנה מפיקים משי?
  prompt_en: Which insect spins a cocoon we get silk from?
  choices:
  - {he: הנמלה, en: the ant}
  - {he: זחל תולעת המשי, en: the silkworm caterpillar}
  - {he: הדבורה, en: the bee}
  answer: 1
  explanation_he: תולעת המשי היא בעצם זחל של עש. הוא טווה פקעת מחוט משי ארוך מאוד, ואותו אורגים לבד.
  explanation_en: A silkworm is really a moth caterpillar. It spins a cocoon from one very long silk thread that is woven into cloth.
  tags: [lifecycles]
- id: sci.animals.051
  skill: science.animals.lifecycles
  kind: order
  grade: 4
  difficulty: 1.0
  prompt_he: סדרו את מחזור החיים של הדבורה.
  prompt_en: Order the life cycle of a bee.
  choices:
  - {he: גולם, en: pupa}
  - {he: זחל, en: larva}
  - {he: דבורה בוגרת, en: adult bee}
  - {he: ביצה, en: egg}
  answer: [3, 1, 0, 2]
  explanation_he: 'כמו הפרפר, גם לדבורה יש גלגול מלא: ביצה, זחל, גולם ובוגר. הזחלים גדלים בתאי הכוורת.'
  explanation_en: 'Like butterflies, bees go through full metamorphosis: egg, larva, pupa, adult. Larvae grow in honeycomb cells.'
  tags: [lifecycles]
- id: sci.animals.052
  skill: science.animals.foodchains
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מי אוכל רק צמחים?
  prompt_en: Which animal eats only plants?
  choices:
  - {he: פרה, en: cow, emoji: 1f404}
  - {he: כריש, en: shark, emoji: 1f988}
  - {he: אריה, en: lion, emoji: 1f981}
  answer: 0
  explanation_he: בעלי חיים שאוכלים רק צמחים נקראים צמחוניים. פרה אוכלת עשב ותבן.
  explanation_en: Animals that eat only plants are herbivores. A cow eats grass and hay.
  tags: [food_chains]
- id: sci.animals.053
  skill: science.animals.foodchains
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: במה מתחילה כמעט כל שרשרת מזון?
  prompt_en: What does almost every food chain start with?
  choices:
  - {he: בבעל חיים גדול, en: a large animal}
  - {he: בחיידק, en: a bacterium}
  - {he: בצמח ירוק שמקבל אנרגיה מהשמש, en: a green plant using the sun's energy}
  answer: 2
  explanation_he: 'צמחים הם יצרנים: הם הופכים אור שמש למזון. כל בעלי החיים מקבלים אנרגיה, ישירות או בעקיפין, מצמחים.'
  explanation_en: 'Plants are producers: they turn sunlight into food. All animals get energy from plants, directly or indirectly.'
  tags: [food_chains]
- id: sci.animals.054
  skill: science.animals.foodchains
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: איך קוראים לבעל חיים שאוכל גם צמחים וגם בעלי חיים?
  prompt_en: What do we call an animal that eats both plants and animals?
  choices:
  - {he: אוכל כל, en: omnivore}
  - {he: טורף, en: carnivore}
  - {he: צמחוני, en: herbivore}
  answer: 0
  explanation_he: אוכלי כל, כמו דוב, תרנגולת ואדם, אוכלים מזון מהצומח ומהחי.
  explanation_en: Omnivores, like bears, chickens and people, eat food from both plants and animals.
  tags: [food_chains]
- id: sci.animals.055
  skill: science.animals.foodchains
  kind: order
  grade: 4
  difficulty: 0.0
  prompt_he: סדרו את שרשרת המזון.
  prompt_en: Put the food chain in order.
  choices:
  - {he: עשב, en: grass}
  - {he: עיט, en: eagle}
  - {he: ציפור, en: bird}
  - {he: חגב, en: grasshopper}
  answer: [0, 3, 2, 1]
  explanation_he: החגב אוכל עשב, הציפור אוכלת את החגב, והעיט אוכל את הציפור. האנרגיה עוברת מהשמש לעשב ומשם הלאה.
  explanation_en: The grasshopper eats grass, the bird eats the grasshopper, the eagle eats the bird. Energy flows from sun to grass onward.
  tags: [food_chains]
- id: sci.animals.056
  skill: science.animals.foodchains
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: מה התפקיד של פטריות וחיידקים בשרשרת המזון?
  prompt_en: What role do fungi and bacteria play in a food chain?
  choices:
  - {he: טורפים גדולים, en: top predators}
  - {he: 'מפרקים: מפרקים שאריות לחומרים באדמה', en: 'decomposers: break down remains into soil'}
  - {he: 'יצרנים: מייצרים מזון מאור', en: 'producers: make food from light'}
  answer: 1
  explanation_he: המפרקים מפרקים עלים נושרים ושאריות של יצורים. החומרים חוזרים לאדמה, וצמחים משתמשים בהם שוב.
  explanation_en: Decomposers break down fallen leaves and remains. The materials return to the soil and plants reuse them.
  tags: [food_chains]
- id: sci.animals.057
  skill: science.animals.foodchains
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: בשרשרת המזון, החץ מצביע מהטורף אל מי שהוא אוכל.
  prompt_en: In a food chain, the arrow points from the predator to what it eats.
  answer: false
  explanation_he: 'לא נכון. החץ מראה את כיוון האנרגיה: מהנאכל אל האוכל. למשל: עשב ← ארנב ← שועל.'
  explanation_en: 'False. The arrow shows the direction energy flows: from the eaten to the eater. For example grass to rabbit to fox.'
  tags: [food_chains]
- id: sci.animals.058
  skill: science.animals.foodchains
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: בשדה נעלמו כל השועלים. מה כנראה יקרה לארנבים?
  prompt_en: All the foxes disappear from a field. What will likely happen to the rabbits?
  choices:
  - {he: 'מספרם יגדל, ואז יחסר להם עשב', en: 'their number will grow, then grass runs short'}
  - {he: שום דבר לא ישתנה, en: nothing will change}
  - {he: כולם ייעלמו מיד, en: they will all vanish at once}
  answer: 0
  explanation_he: בלי טורפים, יותר ארנבים שורדים ומתרבים. כשהם רבים מדי הם אוכלים את כל העשב, ואז חסר להם מזון.
  explanation_en: Without predators more rabbits survive and breed. Too many rabbits eat all the grass, then run out of food.
  tags: [food_chains]
- id: sci.animals.059
  skill: science.animals.foodchains
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: 'אריה הוא טורף: הוא ניזון מבעלי חיים אחרים.'
  prompt_en: 'A lion is a carnivore: it feeds on other animals.'
  answer: true
  explanation_he: נכון. טורפים ניזונים מבשר. לאריה יש שיניים חדות שמתאימות לכך.
  explanation_en: True. Carnivores eat meat, and a lion's sharp teeth suit this.
  tags: [food_chains]
- id: sci.animals.060
  skill: science.animals.foodchains
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: מי הם היצרנים בשרשרת מזון בים?
  prompt_en: Who are the producers in an ocean food chain?
  choices:
  - {he: כרישים, en: sharks}
  - {he: אצות ופלנקטון צמחי, en: algae and plant plankton}
  - {he: דגים קטנים, en: small fish}
  answer: 1
  explanation_he: בים, אצות זעירות שצפות במים עושות פוטוסינתזה. הן המזון הראשון בשרשרת, ממש כמו עשב ביבשה.
  explanation_en: In the sea, tiny floating algae do photosynthesis. They are the first food in the chain, like grass on land.
  tags: [food_chains]
- id: sci.animals.061
  skill: science.animals.foodchains
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מדוע יש בדרך כלל פחות טורפים מאשר צמחוניים באזור?
  prompt_en: Why are there usually fewer predators than herbivores in an area?
  choices:
  - {he: כי צמחוניים מתרבים רק בקיץ, en: because herbivores only breed in summer}
  - {he: בכל שלב בשרשרת אובדת הרבה אנרגיה, en: a lot of energy is lost at each step}
  - {he: כי טורפים לא צריכים לאכול, en: because predators don't need to eat}
  answer: 1
  explanation_he: רוב האנרגיה משמשת את היצור לחיים ולתנועה ואובדת כחום. רק חלק קטן עובר לשלב הבא, ולכן יש בו פחות פרטים.
  explanation_en: Most energy is used for living and moving and lost as heat. Only a small part passes on, so each level supports fewer animals.
  tags: [food_chains]
- id: sci.animals.062
  skill: science.animals.foodchains
  kind: true_false
  grade: 5
  difficulty: 0.0
  prompt_he: אם נעלים את כל הצמחים, לטורפים זה לא יזיק, כי הם לא אוכלים צמחים.
  prompt_en: If all plants disappeared, predators would be fine since they don't eat plants.
  answer: false
  explanation_he: לא נכון. הטורפים אוכלים צמחוניים, והצמחוניים אוכלים צמחים. בלי צמחים, כל השרשרת קורסת.
  explanation_en: False. Predators eat herbivores, which eat plants. Without plants the whole chain collapses.
  tags: [food_chains]
- id: sci.animals.063
  skill: science.animals.foodchains
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מהו מארג מזון?
  prompt_en: What is a food web?
  choices:
  - {he: רשימת מזונות בריאים, en: a list of healthy foods}
  - {he: כמה שרשראות מזון שקשורות זו לזו, en: several connected food chains}
  - {he: רשת שעכביש טווה, en: a web a spider spins}
  answer: 1
  explanation_he: ברוב הסביבות כל בעל חיים אוכל כמה סוגי מזון ונאכל בידי כמה טורפים. כך השרשראות מתחברות למארג.
  explanation_en: In most places each animal eats several foods and is eaten by several predators, so chains link into a web.
  tags: [food_chains]
- id: sci.animals.064
  skill: science.animals.foodchains
  kind: order
  grade: 5
  difficulty: 1.0
  prompt_he: סדרו את שרשרת המזון בים.
  prompt_en: Put the ocean food chain in order.
  choices:
  - {he: אצות זעירות, en: tiny algae}
  - {he: דולפין, en: dolphin}
  - {he: סרטנים זעירים, en: tiny shrimp-like animals}
  - {he: דגים קטנים, en: small fish}
  answer: [0, 2, 3, 1]
  explanation_he: האצות מייצרות מזון מאור, סרטנים זעירים אוכלים אותן, דגים קטנים אוכלים את הסרטנים, והדולפין אוכל את הדגים.
  explanation_en: Algae make food from light, tiny crustaceans eat them, small fish eat the crustaceans, and the dolphin eats the fish.
  tags: [food_chains]
- id: sci.animals.065
  skill: science.animals.israel
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איזו ציפור נבחרה לציפור הלאומית של ישראל?
  prompt_en: Which bird was chosen as Israel's national bird?
  choices:
  - {he: היונה, en: the dove}
  - {he: הדוכיפת, en: the hoopoe}
  - {he: התוכי, en: the parrot}
  answer: 1
  explanation_he: הדוכיפת נבחרה בשנת 2008. יש לה ציצת נוצות על הראש שהיא פותחת כמו מניפה.
  explanation_en: The hoopoe was chosen in 2008. It has a crest of feathers on its head that it opens like a fan.
  tags: [israel_animals]
- id: sci.animals.066
  skill: science.animals.israel
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איזה בעל חיים מטפס בקלות על צוקים במדבר יהודה ובעין גדי?
  prompt_en: Which animal easily climbs cliffs in the Judean Desert and Ein Gedi?
  choices:
  - {he: יעל נובי, en: Nubian ibex, emoji: 1f410}
  - {he: פינגווין, en: penguin, emoji: 1f427}
  - {he: היפופוטם, en: hippopotamus, emoji: 1f99b}
  answer: 0
  explanation_he: ליעל יש פרסות עם כרית גמישה שאוחזת בסלע, ולכן הוא מטפס על צוקים תלולים. לזכרים יש קרניים ארוכות ומעוקלות.
  explanation_en: The ibex has hooves with grippy pads, so it climbs steep cliffs. Males have long curved horns.
  tags: [israel_animals]
- id: sci.animals.067
  skill: science.animals.israel
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: שפן הסלע, שחי בישראל, הוא קרוב משפחה רחוק של הפיל.
  prompt_en: The rock hyrax, which lives in Israel, is a distant relative of the elephant.
  answer: true
  explanation_he: נכון. למרות שהוא קטן, לפי מבנה הגוף והשיניים השפן קרוב לפילים ולא לארנבים.
  explanation_en: True. Though small, by its body and teeth the hyrax is related to elephants, not rabbits.
  tags: [israel_animals]
- id: sci.animals.068
  skill: science.animals.israel
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: מדוע ישראל מפורסמת בקרב חובבי ציפורים?
  prompt_en: Why is Israel famous among bird watchers?
  choices:
  - {he: יש בה רק פינגווינים, en: it has only penguins}
  - {he: אין בה ציפורים בכלל, en: there are no birds there}
  - {he: מיליוני ציפורים נודדות עוברות בה, en: millions of migrating birds pass through it}
  answer: 2
  explanation_he: ישראל נמצאת בין אירופה, אסיה ואפריקה. פעמיים בשנה עוברות כאן מאות מיליוני ציפורים נודדות, כמו חסידות ועגורים.
  explanation_en: Israel lies between Europe, Asia and Africa. Twice a year hundreds of millions of migrating birds, like storks and cranes, pass here.
  tags: [israel_animals]
- id: sci.animals.069
  skill: science.animals.israel
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: באיזה אזור בישראל חונים בחורף עשרות אלפי עגורים?
  prompt_en: Where in Israel do tens of thousands of cranes spend the winter?
  choices:
  - {he: ים המלח, en: the Dead Sea}
  - {he: עמק החולה, en: the Hula Valley}
  - {he: מכתש רמון, en: Ramon Crater}
  answer: 1
  explanation_he: בעמק החולה יש מים ושדות עם מזון, ולכן עגורים רבים נשארים שם כל החורף במקום להמשיך לאפריקה.
  explanation_en: The Hula Valley has water and fields with food, so many cranes stay all winter instead of flying on to Africa.
  tags: [israel_animals]
- id: sci.animals.070
  skill: science.animals.israel
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: אילו בעלי חיים הוחזרו לטבע בישראל אחרי שנעלמו ממנה?
  prompt_en: Which animals were returned to the wild in Israel after disappearing?
  choices:
  - {he: זברה וג'ירפה, en: zebra and giraffe}
  - {he: אריה ונמר, en: lion and tiger}
  - {he: 'פרא, ראם ויחמור', en: 'wild ass, oryx and fallow deer'}
  answer: 2
  explanation_he: רשות הטבע והגנים גידלה פראים, ראמים ויחמורים בחי-בר, ושחררה אותם לנגב, לערבה ולכרמל.
  explanation_en: The Nature and Parks Authority bred wild asses, oryxes and fallow deer at Hai-Bar and released them in the Negev, Arava and Carmel.
  tags: [israel_animals]
- id: sci.animals.071
  skill: science.animals.israel
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איזה בעל חיים לילי עם קוצים ארוכים חי בישראל?
  prompt_en: Which nocturnal animal with long quills lives in Israel?
  choices:
  - {he: זאב ים, en: sea lion}
  - {he: קואלה, en: koala}
  - {he: דורבן, en: porcupine}
  answer: 2
  explanation_he: הדורבן הוא מכרסם גדול עם קולמוסים ארוכים. כשהוא מאוים הוא מרעיש בהם ומזדקף כדי להרחיק טורפים.
  explanation_en: The porcupine is a big rodent with long quills. When threatened it rattles and raises them to scare predators away.
  tags: [israel_animals]
- id: sci.animals.072
  skill: science.animals.israel
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איזו סלמנדרה צבעונית חיה ביערות הכרמל והגליל?
  prompt_en: Which colorful salamander lives in the forests of Carmel and the Galilee?
  choices:
  - {he: סלמנדרה ירוקה מעופפת, en: flying green salamander}
  - {he: סלמנדרה כחולה, en: blue salamander}
  - {he: סלמנדרה כתומה, en: fire salamander}
  answer: 2
  explanation_he: הסלמנדרה הכתומה היא דו-חי שחור עם כתמים כתומים או צהובים. היא יוצאת בלילות גשומים בחורף.
  explanation_en: The fire salamander is a black amphibian with orange or yellow spots. It comes out on rainy winter nights.
  tags: [israel_animals]
- id: sci.animals.073
  skill: science.animals.israel
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: בישראל אין עטלפים.
  prompt_en: There are no bats in Israel.
  answer: false
  explanation_he: לא נכון. בישראל חיים כ-30 מיני עטלפים. העטלף הנפוץ ביותר הוא עטלף הפירות, שאוכל פירות וצוף.
  explanation_en: False. About 30 bat species live in Israel. The most common is the fruit bat, which eats fruit and nectar.
  tags: [israel_animals]
- id: sci.animals.074
  skill: science.animals.israel
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה אוכלת הצופית, ציפור קטנה ומבריקה שנפוצה בגינות בישראל?
  prompt_en: What does the sunbird, a small shiny bird common in Israeli gardens, eat?
  choices:
  - {he: צוף מפרחים וחרקים קטנים, en: flower nectar and small insects}
  - {he: זרעים קשים בלבד, en: only hard seeds}
  - {he: דגים, en: fish}
  answer: 0
  explanation_he: לצופית מקור דק ומעוקל ולשון ארוכה. היא שותה צוף, ותוך כך עוזרת להאביק פרחים.
  explanation_en: The sunbird has a thin curved beak and long tongue. It sips nectar and helps pollinate flowers along the way.
  tags: [israel_animals]
- id: sci.animals.075
  skill: science.animals.israel
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: הנשר המקראי, שנזכר בתנ"ך, הוא בעצם עוף דורס גדול שאוכל פגרים.
  prompt_en: The biblical nesher is really a large bird of prey that eats carrion.
  answer: true
  explanation_he: נכון. הנשר המקראי (Griffon vulture) מנקה את הטבע מפגרים. הוא נדיר היום בישראל ושומרים עליו.
  explanation_en: True. The griffon vulture cleans nature of carcasses. It is rare in Israel today and protected.
  tags: [israel_animals]
- id: sci.animals.076
  skill: science.animals.israel
  kind: choice
  grade: 2
  difficulty: -1.0
  prompt_he: איזה בעל חיים חי בעיקר בים ולא ביבשה?
  prompt_en: Which animal lives mainly in the sea, not on land?
  choices:
  - {he: דולפין, en: dolphin}
  - {he: צבי, en: gazelle}
  - {he: גמל, en: camel}
  answer: 0
  explanation_he: בים התיכון ובים סוף שליד חופי ישראל חיים דולפינים. גמלים וצבאים חיים ביבשה.
  explanation_en: Dolphins live in the Mediterranean and Red Sea off Israel's coasts. Camels and gazelles live on land.
  tags: [israel_animals]
- id: sci.animals.077
  skill: science.animals.israel
  kind: order
  grade: 3
  difficulty: 0.0
  prompt_he: סדרו מהצפון לדרום את המקומות שבהם אפשר לראות את בעלי החיים.
  prompt_en: Order these animal-watching places from north to south.
  choices:
  - {he: ראמים בערבה, en: oryx in the Arava}
  - {he: דגי אלמוגים באילת, en: reef fish in Eilat}
  - {he: יעלים בעין גדי, en: ibex at Ein Gedi}
  - {he: עגורים בעמק החולה, en: cranes in the Hula Valley}
  answer: [3, 2, 0, 1]
  explanation_he: עמק החולה בגליל העליון, עין גדי ליד ים המלח, הערבה מדרום לו, ואילת בקצה הדרומי של ישראל.
  explanation_en: The Hula Valley is in the Upper Galilee, Ein Gedi by the Dead Sea, the Arava south of it, and Eilat at Israel's southern tip.
  tags: [israel_animals]

# Nagmon learning content - science / technology (safety, inventions, coding basics, how things work)
# Format: docs/kids/SDD_CONTENT.md section 3. Generated from curated sources; reviewed by a parent.
# Hebrew without niqqud. Answer indexes are 0-based; for kind=order, answer lists choice indexes in the correct order.
# Curriculum alignment: Israeli MoE "מדע וטכנולוגיה" (science and technology) strands -
#   materials, energy and interactions, systems and processes in living things, earth and universe, technology.
# Sources consulted:
#   - Elementary curriculum (grades 1-6): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/yesodi/technology-science-pedagogy/curriculum
#   - Elementary curriculum PDF (2009 draft): https://meyda.education.gov.il/files/Tochniyot_Limudim/KdamYesodi/MadaTechnologia.pdf
#   - Middle school (grades 7-9): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/chativat-beynayim/mada-technologia-pedagogia/curriculum
#   - Grade 8/9 test specifications (Meitzav/RAMA): https://meyda.education.gov.il/files/Rama/Mifrat_sci_9_H_2027.pdf
# Topics: safety at home and online (1-3), inventions including Israeli ones (2-5), coding and algorithms (2-6), how things work (3-6).
# Israeli emergency numbers: 100 police, 101 Magen David Adom, 102 fire and rescue.

skill: science.tech.safety
items:
- id: sci.tech.001
  skill: science.tech.safety
  kind: choice
  grade: 1
  difficulty: -1.0
  prompt_he: למי מספרים אם ראית ברשת משהו מפחיד או לא נעים?
  prompt_en: Who do you tell if you see something scary or unpleasant online?
  choices:
  - {he: להורה או למבוגר שסומכים עליו, en: a parent or a trusted adult}
  - {he: "לאף אחד, כדי שלא יכעסו עליי", en: "to nobody, so no one gets angry"}
  - {he: "לזר שכתב לי בצ'אט, כי הוא נחמד", en: "to a stranger who wrote to me in a chat, because he is nice"}
  answer: 0
  explanation_he: מבוגר שאנחנו סומכים עליו יכול לעזור ולהגן. אין סיבה להתבייש לספר.
  explanation_en: A trusted adult can help and protect you. There's no reason to be embarrassed to tell.
  tags: [tech_safety]
- id: sci.tech.002
  skill: science.tech.safety
  kind: choice
  grade: 1
  difficulty: 0.0
  prompt_he: איזה מידע אסור לשתף עם זרים ברשת?
  prompt_en: What information should you never share with strangers online?
  choices:
  - {he: השם של המשחק שאתה אוהב, en: the name of a game you like}
  - {he: כתובת הבית והסיסמה, en: your home address and password}
  - {he: הצבע האהוב עליך, en: your favorite color}
  answer: 1
  explanation_he: כתובת, טלפון, בית ספר וסיסמאות הם מידע פרטי. משתפים אותם רק עם המשפחה.
  explanation_en: Address, phone, school and passwords are private. Share them only with family.
  tags: [tech_safety]
- id: sci.tech.003
  skill: science.tech.safety
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: לאיזה מספר מתקשרים כדי להזמין אמבולנס של מגן דוד אדום?
  prompt_en: Which number do you call for a Magen David Adom ambulance?
  choices:
  - {he: '102', en: '102'}
  - {he: '101', en: '101'}
  - {he: '100', en: '100'}
  answer: 1
  explanation_he: 101 הוא מגן דוד אדום, 100 משטרה, ו-102 כבאות והצלה. מתקשרים רק במקרה חירום אמיתי.
  explanation_en: 101 is Magen David Adom, 100 the police, and 102 fire and rescue. Call only in a real emergency.
  tags: [tech_safety]
- id: sci.tech.004
  skill: science.tech.safety
  kind: true_false
  grade: 1
  difficulty: 0.0
  prompt_he: חומרי ניקוי ותרופות משתמשים רק בעזרת מבוגר.
  prompt_en: Cleaning products and medicines are used only with an adult.
  answer: true
  explanation_he: נכון. חומרים כאלה יכולים להיות מסוכנים אם בולעים אותם או נוגעים בהם. מבוגר יודע איך להשתמש בהם בבטחה.
  explanation_en: True. They can be dangerous if swallowed or touched. An adult knows how to use them safely.
  tags: [tech_safety]
- id: sci.tech.005
  skill: science.tech.safety
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איך חוצים כביש בבטחה?
  prompt_en: How do you cross a road safely?
  choices:
  - {he: 'במעבר חציה, אחרי שמסתכלים לשני הצדדים', en: 'at a crosswalk, after looking both ways'}
  - {he: תוך כדי משחק בטלפון, en: while playing on a phone}
  - {he: בריצה בין מכוניות חונות, en: running between parked cars}
  answer: 0
  explanation_he: חוצים במעבר חציה ובאור ירוק, מסתכלים ימינה ושמאלה, ומחכים שהמכוניות יעצרו.
  explanation_en: Cross at a crosswalk on green, look left and right, and wait for cars to stop.
  tags: [tech_safety]
- id: sci.tech.006
  skill: science.tech.safety
  kind: true_false
  grade: 2
  difficulty: 0.0
  prompt_he: מותר לפתוח קישור שזר שלח לי בהודעה, אם הוא מבטיח פרס.
  prompt_en: It's fine to open a link a stranger sent, if it promises a prize.
  answer: false
  explanation_he: לא נכון. קישורים מזרים יכולים להוביל לאתרים מזיקים או לגנוב מידע. כדאי לשאול הורה קודם.
  explanation_en: False. Links from strangers can lead to harmful sites or steal information. Ask a parent first.
  tags: [tech_safety]
- id: sci.tech.007
  skill: science.tech.safety
  kind: choice
  grade: 2
  difficulty: 1.0
  prompt_he: מהי סיסמה חזקה?
  prompt_en: What is a strong password?
  choices:
  - {he: 'ארוכה, עם אותיות, מספרים וסימנים', en: 'long, with letters, numbers and symbols'}
  - {he: "שם קצר ופשוט שקל לזכור", en: "a short, simple name that is easy to remember"}
  - {he: "ספרות קצרות בסדר עולה, כמו 1234", en: "a few digits in order, like 1234"}
  answer: 0
  explanation_he: סיסמה ארוכה ומגוונת קשה לנחש. לא מספרים אותה לחברים, רק להורים.
  explanation_en: A long varied password is hard to guess. Don't tell friends, only parents.
  tags: [tech_safety]
- id: sci.tech.008
  skill: science.tech.safety
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה נכון לעשות כשמוציאים תקע מהשקע?
  prompt_en: What's the right way to unplug a device?
  choices:
  - {he: למשוך את התקע עצמו, en: pull the plug itself}
  - {he: למשוך בחוט, en: yank the cord}
  - {he: לעשות את זה בידיים רטובות, en: do it with wet hands}
  answer: 0
  explanation_he: משיכה בחוט עלולה לקרוע אותו ולחשוף חוטי חשמל. תמיד אוחזים בתקע, עם ידיים יבשות.
  explanation_en: Yanking the cord can tear it and expose wires. Always hold the plug, with dry hands.
  tags: [tech_safety]
- id: sci.tech.009
  skill: science.tech.safety
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: חיבור הרבה מכשירים חזקים למפצל אחד יכול לגרום להתחממות ולשריפה.
  prompt_en: Plugging many powerful devices into one power strip can cause overheating and fire.
  answer: true
  explanation_he: נכון. כשזורם יותר מדי זרם, החוטים מתחממים. לכן לא מחברים מפצל לתוך מפצל.
  explanation_en: True. Too much current heats the wires. That's why you don't plug a power strip into another.
  tags: [tech_safety]
- id: sci.tech.010
  skill: science.tech.safety
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה תפקיד גלאי עשן בבית?
  prompt_en: What does a smoke detector do?
  choices:
  - {he: מכבה את האש לבד, en: puts out the fire by itself}
  - {he: מנקה את האוויר, en: cleans the air}
  - {he: 'מצפצף כשיש עשן, כדי להזהיר משריפה', en: beeps at smoke to warn of fire}
  answer: 2
  explanation_he: גלאי עשן מזהה עשן מוקדם, עוד לפני שרואים אש, ונותן זמן לצאת מהבית בבטחה.
  explanation_en: A smoke detector senses smoke early, before flames are visible, giving time to leave safely.
  tags: [tech_safety]
- id: sci.tech.011
  skill: science.tech.safety
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: למה כדאי לעשות הפסקות כשמשחקים במסך זמן רב?
  prompt_en: Why take breaks during long screen time?
  choices:
  - {he: כדי לנוח עם העיניים ולהזיז את הגוף, en: to rest your eyes and move your body}
  - {he: אין צורך בהפסקות, en: breaks aren't needed}
  - {he: כדי שהמסך לא יתעייף, en: so the screen doesn't get tired}
  answer: 0
  explanation_he: מבט ארוך במסך מעייף את העיניים, וישיבה ממושכת לא טובה לגוף. הפסקה קצרה עם תנועה עוזרת.
  explanation_en: Staring at a screen tires the eyes, and sitting too long isn't good for the body. A short active break helps.
  tags: [tech_safety]
- id: sci.tech.012
  skill: science.tech.safety
  kind: true_false
  grade: 1
  difficulty: 0.0
  prompt_he: מותר לגעת בכיריים או בתנור כדי לבדוק אם הם חמים.
  prompt_en: It's okay to touch the stove or oven to check if it's hot.
  answer: false
  explanation_he: לא נכון. כיריים ותנור יכולים להיות חמים מאוד גם כשלא רואים אש. מתרחקים מהם ושואלים מבוגר.
  explanation_en: False. Stoves and ovens can be very hot even without visible flames. Stay away and ask an adult.
  tags: [tech_safety]
- id: sci.tech.013
  skill: science.tech.safety
  kind: order
  grade: 2
  difficulty: 0.0
  prompt_he: סדרו מה עושים כשיש שריפה בבית.
  prompt_en: Order what to do if there is a fire at home.
  choices:
  - {he: מתקשרים ל-102 מבחוץ, en: call 102 from outside}
  - {he: יוצאים מהבית מהר, en: get out of the house quickly}
  - {he: מחכים בחוץ ולא חוזרים פנימה, en: wait outside and don't go back in}
  - {he: מזהירים את כולם בקול, en: warn everyone loudly}
  answer: [3, 1, 0, 2]
  explanation_he: קודם כול יוצאים בבטחה. מתקשרים לכבאות רק כשכבר נמצאים בחוץ, ולא חוזרים פנימה בשום מקרה, גם לא בשביל צעצוע.
  explanation_en: First get out safely. Call the fire service once you're outside, and never go back in, not even for a toy.
  tags: [tech_safety]
- id: sci.tech.014
  skill: science.tech.inventions
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איזו המצאה עתיקה עוזרת להזיז דברים כבדים בקלות?
  prompt_en: Which ancient invention helps move heavy things easily?
  choices:
  - {he: הגלגל, en: the wheel, emoji: 1f6de}
  - {he: המטריה, en: the umbrella, emoji: '2602'}
  - {he: המזלג, en: the fork, emoji: 1f374}
  answer: 0
  explanation_he: הגלגל הוא אחת ההמצאות החשובות ביותר. הוא מקטין חיכוך ומאפשר עגלות, מכוניות ומכונות.
  explanation_en: The wheel is one of the most important inventions. It reduces friction and makes carts, cars and machines possible.
  tags: [inventions]
- id: sci.tech.015
  skill: science.tech.inventions
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מי זכור כממציא של הנורה החשמלית המעשית?
  prompt_en: Who is remembered for inventing the practical electric light bulb?
  choices:
  - {he: לואי פסטר, en: Louis Pasteur}
  - {he: אלברט איינשטיין, en: Albert Einstein}
  - {he: תומס אדיסון, en: Thomas Edison}
  answer: 2
  explanation_he: אדיסון וצוותו פיתחו בשנת 1879 נורה שדולקת שעות רבות. גם ממציאים אחרים עבדו על נורות.
  explanation_en: In 1879 Edison and his team developed a bulb that glowed for many hours. Other inventors worked on bulbs too.
  tags: [inventions]
- id: sci.tech.016
  skill: science.tech.inventions
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איזו המצאה ישראלית עוזרת לשמור קבצים ולהעביר אותם במחשב?
  prompt_en: Which Israeli invention helps store and move computer files?
  choices:
  - {he: "מכונת כביסה עם מסך מגע", en: "a washing machine with a touch screen"}
  - {he: "מקרר שמדבר עם הבעלים", en: "a fridge that talks to its owner"}
  - {he: החסן הנייד (דיסק און קי), en: the USB flash drive (Disk-on-Key)}
  answer: 2
  explanation_he: דיסק און קי פותח בחברה הישראלית אם-סיסטמס. הוא שומר מידע בשבב קטן בלי חלקים זזים.
  explanation_en: The Disk-on-Key was developed by the Israeli company M-Systems. It stores data on a small chip with no moving parts.
  tags: [inventions]
- id: sci.tech.017
  skill: science.tech.inventions
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה עשו האחים רייט בשנת 1903?
  prompt_en: What did the Wright brothers do in 1903?
  choices:
  - {he: המציאו את הטלפון, en: invented the telephone, emoji: 260e}
  - {he: בנו את הרכבת הראשונה, en: built the first train, emoji: 1f682}
  - {he: הטיסו את המטוס הממונע הראשון, en: flew the first powered airplane, emoji: '2708'}
  answer: 2
  explanation_he: הטיסה הראשונה שלהם נמשכה רק 12 שניות. היום מטוסים חוצים אוקיינוסים בכמה שעות.
  explanation_en: Their first flight lasted just 12 seconds. Today planes cross oceans in a few hours.
  tags: [inventions]
- id: sci.tech.018
  skill: science.tech.inventions
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: דפוס הספרים של גוטנברג עזר להפיץ ספרים להרבה אנשים.
  prompt_en: Gutenberg's printing press helped spread books to many people.
  answer: true
  explanation_he: נכון. לפני הדפוס העתיקו ספרים ביד, וזה לקח חודשים. הדפוס, לפני כ-600 שנה, הפך ספרים לזולים ונפוצים.
  explanation_en: True. Before printing, books were copied by hand over months. The press, about 600 years ago, made books cheap and common.
  tags: [inventions]
- id: sci.tech.019
  skill: science.tech.inventions
  kind: order
  grade: 4
  difficulty: 1.0
  prompt_he: סדרו את ההמצאות לפי הזמן שבו הומצאו, מהמוקדמת למאוחרת.
  prompt_en: Order the inventions from earliest to latest.
  choices:
  - {he: הטלפון, en: the telephone}
  - {he: האינטרנט, en: the internet}
  - {he: הגלגל, en: the wheel}
  - {he: דפוס הספרים, en: the printing press}
  answer: [2, 3, 0, 1]
  explanation_he: הגלגל עתיק מאוד, הדפוס בן כ-600 שנה, הטלפון הומצא לפני כ-150 שנה, והאינטרנט התפתח לפני כ-50 שנה.
  explanation_en: The wheel is very ancient, printing about 600 years old, the telephone about 150 years, and the internet about 50 years.
  tags: [inventions]
- id: sci.tech.020
  skill: science.tech.inventions
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איזו תרופה חשובה גילה אלכסנדר פלמינג במקרה?
  prompt_en: Which important medicine did Alexander Fleming discover by accident?
  choices:
  - {he: "ויטמין C מפירות הדר", en: "vitamin C from citrus fruit"}
  - {he: "אספירין נגד כאבי ראש", en: "aspirin for headaches"}
  - {he: 'פניצילין, אנטיביוטיקה', en: 'penicillin, an antibiotic'}
  answer: 2
  explanation_he: בשנת 1928 פלמינג שם לב שעובש עצר את גדילת החיידקים בצלחת. מזה פותח הפניצילין, שהציל מיליוני אנשים.
  explanation_en: In 1928 Fleming noticed a mold stopped bacteria growing in a dish. Penicillin was developed from it and saved millions.
  tags: [inventions]
- id: sci.tech.021
  skill: science.tech.inventions
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איזו המצאה ישראלית היא מצלמה קטנה בתוך כמוסה שבולעים?
  prompt_en: Which Israeli invention is a tiny camera in a swallowable capsule?
  choices:
  - {he: הגלולה המצלמת, en: the camera pill (PillCam)}
  - {he: הטלסקופ, en: the telescope}
  - {he: השעון המעורר, en: the alarm clock}
  answer: 0
  explanation_he: הגלולה המצלמת מצלמת את מערכת העיכול מבפנים, והרופאים רואים את התמונות בלי ניתוח.
  explanation_en: The camera pill photographs the digestive system from inside, so doctors see images without surgery.
  tags: [inventions]
- id: sci.tech.022
  skill: science.tech.inventions
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: את הטלפון החכם המציא אדם אחד ביום אחד.
  prompt_en: One person invented the smartphone in one day.
  answer: false
  explanation_he: 'לא נכון. הטלפון החכם משלב המצאות רבות: טלפון, מחשב, מסך מגע, מצלמה ו-GPS, שפיתחו אנשים רבים במשך שנים.'
  explanation_en: 'False. A smartphone combines many inventions: phone, computer, touchscreen, camera and GPS, developed by many people over years.'
  tags: [inventions]
- id: sci.tech.023
  skill: science.tech.inventions
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: באיזו מדינה הומצא הנייר?
  prompt_en: In which country was paper invented?
  choices:
  - {he: אנגליה, en: England}
  - {he: ישראל, en: Israel}
  - {he: סין, en: China}
  answer: 2
  explanation_he: הנייר הומצא בסין לפני כ-1,900 שנה, מסיבי צמחים. לפני כן כתבו על קלף, פפירוס ולוחות.
  explanation_en: Paper was invented in China about 1,900 years ago from plant fibers. Before that people wrote on parchment, papyrus and tablets.
  tags: [inventions]
- id: sci.tech.024
  skill: science.tech.inventions
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איזו אפליקציית ניווט פותחה בישראל ומשתמשת בדיווחים של נהגים?
  prompt_en: Which navigation app was developed in Israel and uses drivers' reports?
  choices:
  - {he: מפה מנייר, en: a paper map}
  - {he: וייז, en: Waze}
  - {he: מצפן, en: compass}
  answer: 1
  explanation_he: וייז אוספת מידע מנהגים על פקקים ותאונות, ומחשבת את הדרך המהירה ביותר.
  explanation_en: Waze collects drivers' reports on traffic and accidents and calculates the fastest route.
  tags: [inventions]
- id: sci.tech.025
  skill: science.tech.inventions
  kind: true_false
  grade: 5
  difficulty: 1.0
  prompt_he: הטלגרף והטלפון אפשרו לראשונה לשלוח מסרים למרחקים בתוך שניות.
  prompt_en: The telegraph and telephone first made it possible to send messages long distances in seconds.
  answer: true
  explanation_he: נכון. לפניהם מסר לקח ימים ושבועות, עם שליח או בדואר. האותות החשמליים עוברים בחוטים כמעט מיד.
  explanation_en: True. Before them a message took days or weeks by messenger or mail. Electric signals travel along wires almost instantly.
  tags: [inventions]
- id: sci.tech.026
  skill: science.tech.coding
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מהו אלגוריתם?
  prompt_en: What is an algorithm?
  choices:
  - {he: "סוג של מחשב קטן שאפשר לשאת", en: "a kind of small computer you can carry"}
  - {he: "משחק כדור עם חוקים", en: "a ball game with rules"}
  - {he: רשימת הוראות לפי סדר לביצוע משימה, en: a step-by-step list of instructions for a task}
  answer: 2
  explanation_he: 'מתכון לעוגה הוא אלגוריתם: הוראות מסודרות שמביאות לתוצאה. גם תוכנה היא אוסף של אלגוריתמים.'
  explanation_en: 'A cake recipe is an algorithm: ordered steps leading to a result. Software is a collection of algorithms.'
  tags: [coding]
- id: sci.tech.027
  skill: science.tech.coding
  kind: order
  grade: 2
  difficulty: -1.0
  prompt_he: סדרו את האלגוריתם לצחצוח שיניים.
  prompt_en: Order the algorithm for brushing teeth.
  choices:
  - {he: לשים משחה על המברשת, en: put toothpaste on the brush}
  - {he: לצחצח את כל השיניים, en: brush all your teeth}
  - {he: לשטוף את המברשת, en: rinse the brush}
  - {he: לירוק ולשטוף את הפה, en: spit and rinse}
  answer: [0, 1, 3, 2]
  explanation_he: באלגוריתם הסדר חשוב. אי אפשר לצחצח לפני ששמים משחה, ושוטפים את המברשת בסוף.
  explanation_en: In an algorithm order matters. You can't brush before adding paste, and you rinse the brush at the end.
  tags: [coding]
- id: sci.tech.028
  skill: science.tech.coding
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איך קוראים לטעות בתוכנית מחשב?
  prompt_en: What is a mistake in a computer program called?
  choices:
  - {he: כפתור, en: a button}
  - {he: באג, en: a bug}
  - {he: קובץ, en: a file}
  answer: 1
  explanation_he: באג הוא טעות שגורמת לתוכנה לעבוד לא נכון. מציאת באגים ותיקונם נקראים "דיבאג".
  explanation_en: A bug is an error that makes software work wrong. Finding and fixing bugs is called debugging.
  tags: [coding]
- id: sci.tech.029
  skill: science.tech.coding
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: 'רובוט קיבל את ההוראה "חזור 3 פעמים: צעד קדימה". כמה צעדים הוא יעשה?'
  prompt_en: 'A robot gets "repeat 3 times: step forward". How many steps will it take?'
  choices:
  - {he: '6', en: '6'}
  - {he: '3', en: '3'}
  - {he: '1', en: '1'}
  answer: 1
  explanation_he: 'זו לולאה: הוראה שחוזרת כמה פעמים. במקום לכתוב "צעד" שלוש פעמים, כותבים פעם אחת עם "חזור".'
  explanation_en: 'That''s a loop: an instruction repeated several times. Instead of writing "step" three times, you write it once with "repeat".'
  tags: [coding]
- id: sci.tech.030
  skill: science.tech.coding
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: רובוט פונה צפונה. הוא פונה ימינה פעמיים. לאן הוא פונה עכשיו?
  prompt_en: A robot faces north. It turns right twice. Which way does it face now?
  choices:
  - {he: מזרחה, en: east}
  - {he: צפונה, en: north}
  - {he: דרומה, en: south}
  answer: 2
  explanation_he: פנייה ימינה אחת מצפון מביאה למזרח, ופנייה נוספת מביאה לדרום. שתי פניות ימינה הן חצי סיבוב.
  explanation_en: One right turn from north faces east; another faces south. Two right turns make a half turn.
  tags: [coding]
- id: sci.tech.031
  skill: science.tech.coding
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: מחשב עושה בדיוק את מה שכתוב בתוכנית, גם אם התכוונו למשהו אחר.
  prompt_en: A computer does exactly what the program says, even if we meant something else.
  answer: true
  explanation_he: נכון. המחשב לא מנחש כוונות. לכן חשוב לכתוב הוראות ברורות ומדויקות, ולבדוק אותן.
  explanation_en: True. A computer doesn't guess intentions, so instructions must be clear and exact, and tested.
  tags: [coding]
- id: sci.tech.032
  skill: science.tech.coding
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: '"אם יורד גשם, קח מטריה". איזה סוג הוראה זו?'
  prompt_en: '"If it rains, take an umbrella." What kind of instruction is this?'
  choices:
  - {he: משתנה, en: a variable}
  - {he: לולאה, en: a loop}
  - {he: תנאי, en: a condition}
  answer: 2
  explanation_he: תנאי בודק אם משהו נכון, ורק אז מבצע פעולה. בתכנות כותבים זאת עם המילה if.
  explanation_en: A condition checks if something is true and only then acts. In code it's written with "if".
  tags: [coding]
- id: sci.tech.033
  skill: science.tech.coding
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: מהו משתנה בתכנות?
  prompt_en: What is a variable in programming?
  choices:
  - {he: מחשב שמשנה צבע, en: a computer that changes color}
  - {he: טעות בתוכנית, en: a mistake in a program}
  - {he: שם לתיבה ששומרת ערך שיכול להשתנות, en: a named box storing a value that can change}
  answer: 2
  explanation_he: למשל, במשחק יש משתנה "ניקוד". בכל פעם שעונים נכון, הערך שלו גדל.
  explanation_en: For example, a game has a "score" variable. Each correct answer increases its value.
  tags: [coding]
- id: sci.tech.034
  skill: science.tech.coding
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: מחשבים מבינים שפה רגילה בדיוק כמו בני אדם, ולכן לא צריך שפות תכנות.
  prompt_en: Computers understand everyday language exactly like people, so programming languages aren't needed.
  answer: false
  explanation_he: לא נכון. בעומק, המחשב עובד עם הוראות פשוטות מאוד של 0 ו-1. שפות תכנות הן דרך מדויקת לתת לו הוראות.
  explanation_en: False. Deep down a computer works with very simple instructions in 0s and 1s. Programming languages are a precise way to instruct it.
  tags: [coding]
- id: sci.tech.035
  skill: science.tech.coding
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: בשיטה הבינארית משתמשים רק בשתי ספרות. אילו?
  prompt_en: Binary uses only two digits. Which?
  choices:
  - {he: 5 ו-10, en: 5 and 10}
  - {he: 0 ו-1, en: 0 and 1}
  - {he: 1 ו-2, en: 1 and 2}
  answer: 1
  explanation_he: בתוך המחשב כל מידע נשמר כרצפים של 0 ו-1, כמו מתג כבוי או דולק.
  explanation_en: Inside a computer all data is stored as sequences of 0s and 1s, like switches off or on.
  tags: [coding]
- id: sci.tech.036
  skill: science.tech.coding
  kind: choice
  grade: 6
  difficulty: 2.0
  prompt_he: מה הערך של המספר הבינארי 101 בשיטה העשרונית?
  prompt_en: What is the binary number 101 in decimal?
  choices:
  - {he: '101', en: '101'}
  - {he: '3', en: '3'}
  - {he: '5', en: '5'}
  answer: 2
  explanation_he: 'בבינארי כל מקום שווה פי 2 מהקודם: 4, 2, 1. לכן 101 הוא 4 ועוד 0 ועוד 1, כלומר 5.'
  explanation_en: 'In binary each place is worth twice the one before: 4, 2, 1. So 101 is 4 + 0 + 1 = 5.'
  tags: [coding]
- id: sci.tech.037
  skill: science.tech.coding
  kind: order
  grade: 4
  difficulty: 1.0
  prompt_he: רובוט צריך להגיע לכדור שנמצא שני צעדים לפניו ואז צעד ימינה. סדרו את ההוראות.
  prompt_en: A robot must reach a ball two steps ahead and then one step right. Order the commands.
  choices:
  - {he: פנה ימינה, en: turn right}
  - {he: צעד קדימה, en: step forward}
  - {he: צעד קדימה שוב, en: step forward again}
  - {he: צעד קדימה והרם את הכדור, en: step forward and pick up the ball}
  answer: [1, 2, 0, 3]
  explanation_he: קודם הולכים שני צעדים קדימה, אחר כך מסתובבים ימינה, ורק אז צועדים לכדור ומרימים אותו.
  explanation_en: First two steps forward, then turn right, and only then step to the ball and pick it up.
  tags: [coding]
- id: sci.tech.038
  skill: science.tech.coding
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: מה נקרא "קלט" במחשב?
  prompt_en: What is "input" for a computer?
  choices:
  - {he: צליל מהרמקול, en: sound from the speaker, emoji: 1f50a}
  - {he: 'מידע שנכנס למחשב, כמו הקלדה או לחיצה', en: 'information going in, like typing or clicking', emoji: '2328'}
  - {he: תמונה שמופיעה על המסך, en: a picture shown on screen, emoji: 1f5bc}
  answer: 1
  explanation_he: קלט נכנס למחשב, למשל ממקלדת, עכבר או מיקרופון. פלט יוצא ממנו, למשל למסך או לרמקול.
  explanation_en: Input goes into the computer, from a keyboard, mouse or microphone. Output comes out, to a screen or speaker.
  tags: [coding]
- id: sci.tech.039
  skill: science.tech.how
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: המקרר מכניס קור לתוך האוכל.
  prompt_en: A fridge puts cold into the food.
  answer: false
  explanation_he: לא נכון. המקרר מוציא חום מבפנים ומשחרר אותו מאחור, ולכן החלק האחורי של המקרר חמים.
  explanation_en: False. A fridge removes heat from inside and releases it at the back, which is why the back feels warm.
  tags: [how_things_work]
- id: sci.tech.040
  skill: science.tech.how
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איך מכשיר ה-GPS בטלפון יודע איפה אנחנו?
  prompt_en: How does a phone's GPS know where we are?
  choices:
  - {he: לפי צבע השמיים, en: from the color of the sky, emoji: '2601'}
  - {he: לפי הריח של המקום, en: from the smell of the place, emoji: 1f443}
  - {he: לפי אותות מכמה לוויינים, en: from signals from several satellites, emoji: 1f6f0}
  answer: 2
  explanation_he: לוויינים שמקיפים את כדור הארץ משדרים אותות. הטלפון מחשב את מיקומו לפי הזמן שלקח לאותות להגיע מכמה לוויינים.
  explanation_en: Orbiting satellites send signals. The phone calculates its position from how long signals take to arrive from several satellites.
  tags: [how_things_work]
- id: sci.tech.041
  skill: science.tech.how
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: איך הטלפון הנייד שולח קול למרחקים בלי חוטים?
  prompt_en: How does a mobile phone send voice far without wires?
  choices:
  - {he: בגלי רדיו לאנטנות, en: by radio waves to antennas}
  - {he: בעזרת ציפורים, en: with birds}
  - {he: בצינורות מים, en: through water pipes}
  answer: 0
  explanation_he: הטלפון הופך את הקול לאות חשמלי ושולח אותו בגלי רדיו לאנטנה סלולרית, שמעבירה אותו הלאה.
  explanation_en: The phone turns your voice into an electric signal and sends it by radio waves to a cell antenna, which passes it on.
  tags: [how_things_work]
- id: sci.tech.042
  skill: science.tech.how
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איך צוללת שוקעת ועולה?
  prompt_en: How does a submarine sink and rise?
  choices:
  - {he: מנופפת בסנפירים כמו דג, en: it flaps fins like a fish}
  - {he: משנה את צבעה, en: it changes color}
  - {he: ממלאת מכלים במים או באוויר, en: it fills tanks with water or air}
  answer: 2
  explanation_he: כשהמכלים מתמלאים במים הצוללת כבדה יותר ושוקעת. כשדוחסים פנימה אוויר והמים יוצאים, היא קלה יותר ועולה.
  explanation_en: Filling tanks with water makes it heavier so it sinks. Blowing in air to push water out makes it lighter so it rises.
  tags: [how_things_work]
- id: sci.tech.043
  skill: science.tech.how
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איך מסך מגע בטלפון מרגיש את האצבע?
  prompt_en: How does a phone touchscreen sense your finger?
  choices:
  - {he: המסך שומע את האצבע, en: the screen hears the finger}
  - {he: האצבע משנה מעט את השדה החשמלי במסך, en: the finger slightly changes the screen's electric field}
  - {he: המסך מריח את האצבע, en: the screen smells the finger}
  answer: 1
  explanation_he: הגוף שלנו מוליך חשמל. כשנוגעים, משתנה המטען במקום הנגיעה, והטלפון מחשב איפה נגענו. לכן עם כפפה רגילה זה לא עובד.
  explanation_en: Our body conducts electricity. A touch changes the charge at that spot, and the phone computes where. That's why ordinary gloves don't work.
  tags: [how_things_work]
- id: sci.tech.044
  skill: science.tech.how
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: מה מחמם את האוכל בתנור מיקרוגל?
  prompt_en: What heats food in a microwave oven?
  choices:
  - {he: גלים שמרעידים את מולקולות המים באוכל, en: waves that shake the water molecules in food}
  - {he: "להבה קטנה שבוערת בתוך התנור", en: "a small flame burning inside the oven"}
  - {he: "אור השמש שנכנס מהחלון", en: "sunlight coming in through the window"}
  answer: 0
  explanation_he: גלי המיקרו גורמים למולקולות המים באוכל לנוע מהר, והתנועה הופכת לחום.
  explanation_en: Microwaves make water molecules in food move rapidly, and that motion becomes heat.
  tags: [how_things_work]
- id: sci.tech.045
  skill: science.tech.how
  kind: true_false
  grade: 5
  difficulty: 1.0
  prompt_he: כנפי מטוס בנויות כך שהאוויר שזורם סביבן דוחף אותן כלפי מעלה.
  prompt_en: Airplane wings are shaped so the air flowing around them pushes them up.
  answer: true
  explanation_he: נכון. צורת הכנף והזווית שלה מסיטות אוויר כלפי מטה, והאוויר דוחף את הכנף כלפי מעלה. זה כוח העילוי.
  explanation_en: True. The wing's shape and angle deflect air downward, and the air pushes the wing upward. This is lift.
  tags: [how_things_work]
- id: sci.tech.046
  skill: science.tech.how
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: מה עושים ההילוכים באופניים?
  prompt_en: What do bicycle gears do?
  choices:
  - {he: מצלצלים כדי להזהיר, en: ring to warn others, emoji: 1f514}
  - {he: מאפשרים לדווש בקלות בעלייה או מהר במישור, en: let you pedal easily uphill or fast on flat ground, emoji: 1f6b2}
  - {he: מדליקים פנס, en: turn on a light, emoji: 1f526}
  answer: 1
  explanation_he: הילוך קל דורש פחות כוח אבל יותר סיבובים, והילוך כבד הפוך. זה כמו מנוף בצורה של גלגלי שיניים.
  explanation_en: A low gear needs less force but more turns; a high gear the opposite. It works like a lever made of toothed wheels.
  tags: [how_things_work]
- id: sci.tech.047
  skill: science.tech.how
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: מה עושה העדשה במצלמה?
  prompt_en: What does a camera's lens do?
  choices:
  - {he: "מקליטה את הקול של הצילום", en: "records the sound of the shot", emoji: 1f3a4}
  - {he: ממקדת את האור ליצירת תמונה חדה, en: focuses light to make a sharp image, emoji: 1f4f7}
  - {he: "מייצרת אור לתמונה", en: "makes light for the picture", emoji: 1f4a1}
  answer: 1
  explanation_he: העדשה מכופפת את קרני האור כך שהן נפגשות על החיישן, וכך נוצרת תמונה. גם בעין שלנו יש עדשה.
  explanation_en: The lens bends light rays to meet on the sensor, forming an image. Our eyes have a lens too.
  tags: [how_things_work]
- id: sci.tech.048
  skill: science.tech.how
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: איך שואב אבק אוסף לכלוך?
  prompt_en: How does a vacuum cleaner collect dirt?
  choices:
  - {he: מגנט מושך את הלכלוך, en: a magnet attracts the dirt}
  - {he: מאוורר יוצר לחץ נמוך שיונק אוויר ולכלוך, en: 'a fan lowers pressure, sucking in air and dirt'}
  - {he: הלכלוך קופץ לבד, en: the dirt jumps in by itself}
  answer: 1
  explanation_he: המאוורר מוציא אוויר מהשואב. האוויר בחוץ נדחף פנימה וסוחף איתו אבק, שנלכד במסנן או בשקית.
  explanation_en: The fan pushes air out of the vacuum. Outside air rushes in, carrying dust that is trapped in a filter or bag.
  tags: [how_things_work]
- id: sci.tech.049
  skill: science.tech.how
  kind: order
  grade: 5
  difficulty: 1.0
  prompt_he: סדרו מה קורה כששולחים הודעה בטלפון לחבר.
  prompt_en: Order what happens when you text a friend.
  choices:
  - {he: מקלידים ולוחצים "שלח", en: type and press send}
  - {he: הרשת מעבירה את ההודעה, en: the network passes the message on}
  - {he: הטלפון של החבר מקבל ומציג אותה, en: the friend's phone receives and shows it}
  - {he: הטלפון שולח גלי רדיו לאנטנה, en: the phone sends radio waves to an antenna}
  answer: [0, 3, 1, 2]
  explanation_he: ההודעה הופכת לאות דיגיטלי, עוברת באוויר לאנטנה, ברשת התקשורת, ומשם לטלפון של החבר.
  explanation_en: The message becomes a digital signal, travels through the air to an antenna, across the network and on to your friend's phone.
  tags: [how_things_work]
- id: sci.tech.050
  skill: science.tech.how
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מה עושה דוד השמש על הגג?
  prompt_en: What does a solar water heater on the roof do?
  choices:
  - {he: מייצר חשמל לכל הבית, en: makes electricity for the whole house}
  - {he: מקרר מים, en: cools water}

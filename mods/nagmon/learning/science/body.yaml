# Nagmon learning content - science / the human body (senses, organs, systems, healthy habits, nutrition)
# Format: docs/kids/SDD_CONTENT.md section 3. Generated from curated sources; reviewed by a parent.
# Hebrew without niqqud. Answer indexes are 0-based; for kind=order, answer lists choice indexes in the correct order.
# Curriculum alignment: Israeli MoE "מדע וטכנולוגיה" (science and technology) strands -
#   materials, energy and interactions, systems and processes in living things, earth and universe, technology.
# Sources consulted:
#   - Elementary curriculum (grades 1-6): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/yesodi/technology-science-pedagogy/curriculum
#   - Elementary curriculum PDF (2009 draft): https://meyda.education.gov.il/files/Tochniyot_Limudim/KdamYesodi/MadaTechnologia.pdf
#   - Middle school (grades 7-9): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/chativat-beynayim/mada-technologia-pedagogia/curriculum
#   - Grade 8/9 test specifications (Meitzav/RAMA): https://meyda.education.gov.il/files/Rama/Mifrat_sci_9_H_2027.pdf
# Topics: senses (1-2), body parts and organs (2-4), healthy habits (1-4), nutrition (2-5), body systems (4-6), blood, breathing and immunity (7-9).
# Health figures follow WHO guidance for children (about 60 minutes of activity a day) and common pediatric sleep guidance (9-12 hours, ages 6-12).

skill: science.body.senses
items:
- id: sci.body.001
  skill: science.body.senses
  kind: choice
  grade: 1
  difficulty: -1.0
  prompt_he: באיזה חוש אנחנו משתמשים כדי לשמוע מוזיקה?
  prompt_en: Which sense do we use to hear music?
  choices:
  - {he: שמיעה, en: hearing, emoji: 1f442}
  - {he: ראייה, en: sight, emoji: 1f441}
  - {he: ריח, en: smell, emoji: 1f443}
  answer: 0
  explanation_he: את הקולות אנחנו קולטים באוזניים, בעזרת חוש השמיעה.
  explanation_en: We pick up sounds with our ears, using the sense of hearing.
  tags: [senses]
- id: sci.body.002
  skill: science.body.senses
  kind: choice
  grade: 1
  difficulty: 0.0
  prompt_he: איזה איבר הוא איבר חוש המישוש?
  prompt_en: Which organ is the organ of touch?
  choices:
  - {he: העין, en: the eye, emoji: 1f441}
  - {he: הלשון, en: the tongue, emoji: 1f445}
  - {he: העור, en: the skin, emoji: 270b}
  answer: 2
  explanation_he: בעור יש חיישנים קטנים שמרגישים מגע, חום, קור וכאב.
  explanation_en: The skin has tiny sensors that feel touch, heat, cold and pain.
  tags: [senses]
- id: sci.body.003
  skill: science.body.senses
  kind: choice
  grade: 1
  difficulty: 0.0
  prompt_he: כמה חושים עיקריים יש לנו?
  prompt_en: How many main senses do we have?
  choices:
  - {he: '10', en: '10'}
  - {he: '5', en: '5'}
  - {he: '3', en: '3'}
  answer: 1
  explanation_he: ראייה, שמיעה, ריח, טעם ומישוש. כל חוש עובד בעזרת איבר אחר.
  explanation_en: Sight, hearing, smell, taste and touch. Each sense works through a different organ.
  tags: [senses]
- id: sci.body.004
  skill: science.body.senses
  kind: choice
  grade: 1
  difficulty: 0.0
  prompt_he: באיזה חוש נבחין שהעוגה נשרפת בתנור, עוד לפני שנראה אותה?
  prompt_en: Which sense tells us the cake is burning before we see it?
  choices:
  - {he: טעם, en: taste, emoji: 1f445}
  - {he: מישוש, en: touch, emoji: 270b}
  - {he: ריח, en: smell, emoji: 1f443}
  answer: 2
  explanation_he: ריחות עוברים באוויר ומגיעים לאף, ולכן אפשר להריח משהו מרחוק.
  explanation_en: Smells travel through the air to the nose, so we can smell things from far away.
  tags: [senses]
- id: sci.body.005
  skill: science.body.senses
  kind: true_false
  grade: 2
  difficulty: 1.0
  prompt_he: כל אזור בלשון טועם רק טעם אחד, למשל קצה הלשון טועם רק מתוק.
  prompt_en: Each area of the tongue tastes only one flavor, e.g. the tip tastes only sweet.
  answer: false
  explanation_he: לא נכון. זו טעות נפוצה. בכל חלקי הלשון יש בלוטות טעם שמרגישות את כל הטעמים.
  explanation_en: False. That's a common myth. Taste buds all over the tongue sense every taste.
  tags: [senses]
- id: sci.body.006
  skill: science.body.senses
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: למה האוכל פחות טעים כשהאף סתום בגלל צינון?
  prompt_en: Why does food taste bland when your nose is blocked by a cold?
  choices:
  - {he: הלשון מפסיקה לעבוד, en: the tongue stops working}
  - {he: האוכל משתנה, en: the food changes}
  - {he: גם הריח עוזר להרגיש טעם, en: smell also helps us taste}
  answer: 2
  explanation_he: הטעם שאנחנו מרגישים הוא שילוב של הלשון והאף. כשהאף סתום, חלק גדול מהטעם הולך לאיבוד.
  explanation_en: Flavor is a mix of tongue and nose. When the nose is blocked, much of the flavor is lost.
  tags: [senses]
- id: sci.body.007
  skill: science.body.senses
  kind: true_false
  grade: 1
  difficulty: 0.0
  prompt_he: אסור להסתכל ישר אל השמש, גם לא לרגע ארוך.
  prompt_en: Never stare straight at the sun.
  answer: true
  explanation_he: נכון. אור השמש חזק מאוד ויכול לפגוע בעיניים לתמיד. גם משקפי שמש רגילים לא מספיקים לזה.
  explanation_en: True. Sunlight is very strong and can permanently damage your eyes. Ordinary sunglasses are not enough for that.
  tags: [senses]
- id: sci.body.008
  skill: science.body.senses
  kind: choice
  grade: 2
  difficulty: 1.0
  prompt_he: מה קורה לאישון בעין כשנכנסים לחדר חשוך?
  prompt_en: What happens to the pupil when you enter a dark room?
  choices:
  - {he: הוא מתרחב כדי להכניס יותר אור, en: it widens to let in more light}
  - {he: הוא משנה צבע, en: it changes color}
  - {he: הוא נסגר לגמרי, en: it closes completely}
  answer: 0
  explanation_he: האישון הוא פתח שגודלו משתנה. בחושך הוא גדל כדי לקלוט יותר אור, ובאור חזק הוא קטן.
  explanation_en: The pupil is an opening that changes size. In the dark it grows to let in more light; in bright light it shrinks.
  tags: [senses]
- id: sci.body.009
  skill: science.body.senses
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איך אנשים עיוורים יכולים לקרוא ספרים?
  prompt_en: How can blind people read books?
  choices:
  - {he: 'בכתב ברייל, בעזרת מישוש', en: 'with Braille, by touch'}
  - {he: בעזרת הטעם, en: by taste}
  - {he: בעזרת הריח, en: by smell}
  answer: 0
  explanation_he: בכתב ברייל כל אות היא צירוף של נקודות בולטות, וקוראים אותן בקצות האצבעות.
  explanation_en: In Braille each letter is a pattern of raised dots, read with the fingertips.
  tags: [senses]
- id: sci.body.010
  skill: science.body.senses
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: האוזניים עוזרות לנו גם לשמור על שיווי משקל.
  prompt_en: Our ears also help us keep our balance.
  answer: true
  explanation_he: נכון. באוזן הפנימית יש איבר עם נוזל שמרגיש את תנועות הראש, ועוזר לנו לא ליפול.
  explanation_en: True. The inner ear has a fluid-filled organ that senses head movements and helps us not fall.
  tags: [senses]
- id: sci.body.011
  skill: science.body.senses
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: לאיזה בעל חיים יש חוש ריח חזק במיוחד, ולכן הוא עוזר למשטרה ולמצילים?
  prompt_en: Which animal has an especially strong sense of smell and helps police and rescuers?
  choices:
  - {he: דג זהב, en: goldfish, emoji: 1f41f}
  - {he: כלב, en: dog, emoji: 1f415}
  - {he: פרפר, en: butterfly, emoji: 1f98b}
  answer: 1
  explanation_he: לכלב יש באף הרבה יותר תאי ריח מלאדם. לכן הוא מוצא אנשים ודברים לפי הריח.
  explanation_en: A dog has many more smell cells in its nose than a person, so it can find people and things by scent.
  tags: [senses]
- id: sci.body.012
  skill: science.body.senses
  kind: order
  grade: 2
  difficulty: 0.0
  prompt_he: סדרו מה קורה כשאנחנו שומעים צלצול.
  prompt_en: Order what happens when we hear a bell.
  choices:
  - {he: הקול עובר באוויר, en: the sound travels through the air}
  - {he: האוזן קולטת את הקול, en: the ear picks up the sound}
  - {he: המוח מבין שזה פעמון, en: the brain recognizes a bell}
  - {he: הפעמון רועד ויוצר קול, en: the bell vibrates and makes sound}
  answer: [3, 0, 1, 2]
  explanation_he: הקול נוצר מרעידות, עובר באוויר ומגיע לאוזן. האוזן שולחת אות לעצב, והמוח מפענח מה שמענו.
  explanation_en: Sound comes from vibrations, travels through air to the ear, which signals a nerve, and the brain works out what we heard.
  tags: [senses]
- id: sci.body.013
  skill: science.body.parts
  kind: choice
  grade: 2
  difficulty: -1.0
  prompt_he: איזה איבר שולט על כל הגוף וחושב?
  prompt_en: Which organ controls the whole body and thinks?
  choices:
  - {he: הריאות, en: the lungs, emoji: 1fac1}
  - {he: המוח, en: the brain, emoji: 1f9e0}
  - {he: הלב, en: the heart, emoji: 1fac0}
  answer: 1
  explanation_he: המוח מקבל מידע מהחושים, מחליט ושולח הוראות לשרירים ולאיברים.
  explanation_en: The brain receives information from the senses, decides and sends instructions to muscles and organs.
  tags: [body_parts]
- id: sci.body.014
  skill: science.body.parts
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה תפקיד הלב?
  prompt_en: What does the heart do?
  choices:
  - {he: מעכל את המזון, en: digests food, emoji: 1f354}
  - {he: חושב ונזכר, en: thinks and remembers, emoji: 1f9e0}
  - {he: שואב דם לכל הגוף, en: pumps blood around the body, emoji: 1fac0}
  answer: 2
  explanation_he: הלב הוא שריר שמתכווץ כל הזמן ודוחף דם בכלי הדם. הדם מביא חמצן ומזון לכל הגוף.
  explanation_en: The heart is a muscle that keeps squeezing to push blood through blood vessels, bringing oxygen and food everywhere.
  tags: [body_parts]
- id: sci.body.015
  skill: science.body.parts
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: באיזה איבר נכנס האוויר כשאנחנו נושמים?
  prompt_en: Which organ fills with air when we breathe in?
  choices:
  - {he: הקיבה, en: the stomach}
  - {he: הריאות, en: the lungs}
  - {he: הכבד, en: the liver}
  answer: 1
  explanation_he: בריאות החמצן מהאוויר עובר לדם, והפחמן הדו-חמצני יוצא מהדם ונשוף החוצה.
  explanation_en: In the lungs oxygen from the air passes into the blood, and carbon dioxide leaves the blood and is breathed out.
  tags: [body_parts]
- id: sci.body.016
  skill: science.body.parts
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה עושים השרירים?
  prompt_en: What do muscles do?
  choices:
  - {he: מסננים את הדם, en: they filter blood}
  - {he: שומרים זיכרונות, en: they store memories}
  - {he: מזיזים את הגוף, en: they move the body}
  answer: 2
  explanation_he: שרירים מתכווצים ומושכים את העצמות. כך אנחנו הולכים, רצים ומרימים דברים.
  explanation_en: Muscles contract and pull on bones. That's how we walk, run and lift things.
  tags: [body_parts]
- id: sci.body.017
  skill: science.body.parts
  kind: true_false
  grade: 2
  difficulty: 0.0
  prompt_he: העור הוא האיבר הגדול ביותר בגוף.
  prompt_en: The skin is the largest organ of the body.
  answer: true
  explanation_he: נכון. העור מכסה את כל הגוף, מגן עליו מחיידקים ומשמש לשמירה על חום הגוף.
  explanation_en: True. Skin covers the whole body, protects it from germs and helps control body temperature.
  tags: [body_parts]
- id: sci.body.018
  skill: science.body.parts
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: כמה עצמות יש בגוף של אדם בוגר?
  prompt_en: How many bones does an adult have?
  choices:
  - {he: '206', en: '206'}
  - {he: '1000', en: '1000'}
  - {he: '50', en: '50'}
  answer: 0
  explanation_he: תינוק נולד עם יותר עצמות, אבל חלקן מתאחות בזמן הגדילה, ולמבוגר נשארות 206.
  explanation_en: Babies are born with more bones, but some fuse as they grow, leaving an adult with 206.
  tags: [body_parts]
- id: sci.body.019
  skill: science.body.parts
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה תפקיד הגולגולת?
  prompt_en: What is the job of the skull?
  choices:
  - {he: לשאוב דם, en: to pump blood, emoji: 1fac0}
  - {he: להגן על המוח, en: to protect the brain, emoji: 1f9e0}
  - {he: לעזור לעכל, en: to help digest, emoji: 1f354}
  answer: 1
  explanation_he: הגולגולת היא קופסה קשה של עצמות ששומרת על המוח הרך מפני מכות.
  explanation_en: The skull is a hard box of bone that guards the soft brain from knocks.
  tags: [body_parts]
- id: sci.body.020
  skill: science.body.parts
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: הלב נמצא בצד ימין של החזה, בדיוק מתחת לכתף.
  prompt_en: The heart is on the right side of the chest, right under the shoulder.
  answer: false
  explanation_he: לא נכון. הלב נמצא באמצע החזה, בין הריאות, ונוטה מעט שמאלה.
  explanation_en: False. The heart sits in the middle of the chest between the lungs, tilted slightly to the left.
  tags: [body_parts]
- id: sci.body.021
  skill: science.body.parts
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: בערך מה הגודל של הלב שלך?
  prompt_en: About how big is your heart?
  choices:
  - {he: כמו גרגר אורז, en: like a grain of rice}
  - {he: כמו כדורגל, en: like a soccer ball}
  - {he: כמו האגרוף שלך, en: about the size of your fist}
  answer: 2
  explanation_he: הלב גדל יחד עם הגוף, וגודלו בערך כמו האגרוף של אותו אדם.
  explanation_en: The heart grows with the body and is roughly the size of that person's fist.
  tags: [body_parts]
- id: sci.body.022
  skill: science.body.parts
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: מהי העצם הארוכה ביותר בגוף?
  prompt_en: Which is the longest bone in the body?
  choices:
  - {he: עצם באוזן, en: an ear bone, emoji: 1f442}
  - {he: עצם הירך, en: the thigh bone (femur), emoji: 1f9b5}
  - {he: עצם הזרוע, en: the upper arm bone, emoji: 1f4aa}
  answer: 1
  explanation_he: עצם הירך נמצאת ברגל, בין האגן לברך. העצם הקטנה ביותר נמצאת דווקא באוזן.
  explanation_en: The femur runs from the hip to the knee. The smallest bone is actually in the ear.
  tags: [body_parts]
- id: sci.body.023
  skill: science.body.parts
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: מה תפקיד הכליות?
  prompt_en: What do the kidneys do?
  choices:
  - {he: שואבות אוויר, en: pump air}
  - {he: מייצרות קול, en: produce sound}
  - {he: מסננות את הדם ויוצרות שתן, en: filter blood and make urine}
  answer: 2
  explanation_he: הכליות מוציאות מהדם פסולת ומים עודפים. כך נוצר השתן.
  explanation_en: The kidneys remove waste and extra water from the blood, which becomes urine.
  tags: [body_parts]
- id: sci.body.024
  skill: science.body.parts
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: כמה שיני חלב יש לילד?
  prompt_en: How many baby teeth does a child have?
  choices:
  - {he: '32', en: '32'}
  - {he: '10', en: '10'}
  - {he: '20', en: '20'}
  answer: 2
  explanation_he: לילדים יש 20 שיני חלב. בגיל 6 בערך הן מתחילות לנשור, ובמקומן צומחות שיניים קבועות, עד 32.
  explanation_en: Children have 20 baby teeth. Around age 6 they start falling out, replaced by permanent teeth, up to 32.
  tags: [body_parts]
- id: sci.body.025
  skill: science.body.parts
  kind: order
  grade: 3
  difficulty: 0.0
  prompt_he: סדרו מהעליון לתחתון את חלקי הגוף.
  prompt_en: Order the body parts from top to bottom.
  choices:
  - {he: כפות רגליים, en: feet}
  - {he: כתפיים, en: shoulders}
  - {he: ראש, en: head}
  - {he: ברכיים, en: knees}
  answer: [2, 1, 3, 0]
  explanation_he: הראש למעלה, אחר כך הכתפיים, הברכיים באמצע הרגליים, וכפות הרגליים על הקרקע.
  explanation_en: Head on top, then shoulders, knees in the middle of the legs, and feet on the ground.
  tags: [body_parts]
- id: sci.body.026
  skill: science.body.health
  kind: choice
  grade: 1
  difficulty: -1.0
  prompt_he: מתי חשוב לשטוף ידיים עם סבון?
  prompt_en: When is it important to wash hands with soap?
  choices:
  - {he: לפני האוכל ואחרי השירותים, en: before eating and after the toilet, emoji: 1f9fc}
  - {he: רק כשהידיים נראות מלוכלכות, en: only when they look dirty, emoji: 270b}
  - {he: רק בשבת, en: only on Shabbat, emoji: 1f56f}
  answer: 0
  explanation_he: חיידקים קטנים מכדי לראות אותם. סבון ומים מורידים אותם מהידיים ושומרים עלינו בריאים.
  explanation_en: Germs are too small to see. Soap and water wash them off our hands and keep us healthy.
  tags: [health]
- id: sci.body.027
  skill: science.body.health
  kind: choice
  grade: 1
  difficulty: 0.0
  prompt_he: כמה פעמים ביום מומלץ לצחצח שיניים?
  prompt_en: How many times a day should you brush your teeth?
  choices:
  - {he: 'פעמיים: בבוקר ולפני השינה', en: 'twice: morning and before bed', emoji: 1faa5}
  - {he: פעם בשבוע, en: once a week, emoji: 1f4c5}
  - {he: רק אחרי ממתקים, en: only after sweets, emoji: 1f36c}
  answer: 0
  explanation_he: צחצוח פעמיים ביום מסיר שאריות אוכל וחיידקים שגורמים לחורים בשיניים.
  explanation_en: Brushing twice a day removes food bits and the germs that cause cavities.
  tags: [health]
- id: sci.body.028
  skill: science.body.health
  kind: true_false
  grade: 1
  difficulty: 0.0
  prompt_he: שינה מספיקה עוזרת לגוף לגדול ולמוח ללמוד.
  prompt_en: Enough sleep helps the body grow and the brain learn.
  answer: true
  explanation_he: נכון. בזמן השינה הגוף מתקן את עצמו, והמוח מסדר את מה שלמדנו במשך היום.
  explanation_en: True. During sleep the body repairs itself and the brain sorts out what we learned that day.
  tags: [health]
- id: sci.body.029
  skill: science.body.health
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: כמה שעות שינה בלילה צריך ילד בגיל בית ספר יסודי?
  prompt_en: How many hours of sleep a night does an elementary school child need?
  choices:
  - {he: כ-20 שעות, en: about 20 hours}
  - {he: כ-9 עד 12 שעות, en: about 9 to 12 hours}
  - {he: כ-4 שעות, en: about 4 hours}
  answer: 1
  explanation_he: ילדים בגיל 6 עד 12 צריכים בערך 9 עד 12 שעות שינה, יותר ממבוגרים, כי הגוף שלהם גדל.
  explanation_en: Children aged 6 to 12 need about 9 to 12 hours of sleep, more than adults, because they are growing.
  tags: [health]
- id: sci.body.030
  skill: science.body.health
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה כדאי לעשות כשמשתעלים או מתעטשים?
  prompt_en: What should you do when you cough or sneeze?
  choices:
  - {he: להשתעל על חבר, en: cough toward a friend}
  - {he: לא משנה, en: it doesn't matter}
  - {he: לכסות את הפה במרפק, en: cover your mouth with your elbow}
  answer: 2
  explanation_he: טיפות קטנות עם חיידקים עפות באוויר. כשמכסים במרפק הן לא מגיעות לאחרים או לידיים.
  explanation_en: Tiny droplets with germs fly through the air. Covering with your elbow keeps them off others and your hands.
  tags: [health]
- id: sci.body.031
  skill: science.body.health
  kind: true_false
  grade: 2
  difficulty: 0.0
  prompt_he: מספיק לשטוף ידיים במים בלי סבון.
  prompt_en: Rinsing hands with water alone, without soap, is enough.
  answer: false
  explanation_he: לא נכון. הסבון עוזר לפרק את השומן והלכלוך שהחיידקים נדבקים אליו. כדאי לשפשף עם סבון כ-20 שניות.
  explanation_en: False. Soap breaks up the grease and dirt germs stick to. Scrub with soap for about 20 seconds.
  tags: [health]
- id: sci.body.032
  skill: science.body.health
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה חשוב לחבוש כשרוכבים על אופניים או קורקינט?
  prompt_en: What should you wear when riding a bike or scooter?
  choices:
  - {he: קסדה, en: a helmet}
  - {he: כובע צמר, en: a wool hat}
  - {he: משקפי שמש, en: sunglasses}
  answer: 0
  explanation_he: קסדה מגינה על הראש ועל המוח אם נופלים.
  explanation_en: A helmet protects your head and brain if you fall.
  tags: [health]
- id: sci.body.033
  skill: science.body.health
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: כמה זמן ביום מומלץ לילדים לזוז ולהתאמן?
  prompt_en: How much daily physical activity is recommended for children?
  choices:
  - {he: לא צריך בכלל, en: none at all}
  - {he: 5 דקות, en: 5 minutes}
  - {he: לפחות שעה, en: at least an hour}
  answer: 2
  explanation_he: 'ארגון הבריאות העולמי ממליץ על לפחות 60 דקות פעילות ביום: ריצה, משחק, רכיבה או ריקוד.'
  explanation_en: 'The World Health Organization recommends at least 60 minutes of activity a day: running, playing, cycling or dancing.'
  tags: [health]
- id: sci.body.034
  skill: science.body.health
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה כדאי לעשות ביום חם ושמשי בחוץ?
  prompt_en: What should you do outside on a hot sunny day?
  choices:
  - {he: 'לשתות מים, לחבוש כובע ולמרוח קרם הגנה', en: 'drink water, wear a hat, use sunscreen'}
  - {he: לשתות רק משקאות ממותקים, en: drink only sugary drinks}
  - {he: לשבת בשמש כמה שיותר, en: sit in the sun as long as possible}
  answer: 0
  explanation_he: השמש החזקה בישראל עלולה לגרום לכוויות ולהתייבשות. מים, כובע וקרם הגנה שומרים עלינו.
  explanation_en: Israel's strong sun can cause sunburn and dehydration. Water, a hat and sunscreen protect us.
  tags: [health]
- id: sci.body.035
  skill: science.body.health
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: פעילות גופנית מחזקת גם את הלב.
  prompt_en: Physical exercise also strengthens the heart.
  answer: true
  explanation_he: נכון. הלב הוא שריר. כשמתאמנים הוא עובד חזק יותר ונעשה חזק יותר, כמו שרירים אחרים.
  explanation_en: True. The heart is a muscle. Exercise makes it work harder and get stronger, like other muscles.
  tags: [health]
- id: sci.body.036
  skill: science.body.health
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: למה ממתקים ומשקאות ממותקים מזיקים לשיניים?
  prompt_en: Why are sweets and sugary drinks bad for teeth?
  choices:
  - {he: הם צובעים את השיניים בכחול, en: they color teeth blue}
  - {he: חיידקים בפה הופכים סוכר לחומצה, en: mouth bacteria turn sugar into acid}
  - {he: הסוכר קר מדי, en: sugar is too cold}
  answer: 1
  explanation_he: החיידקים בפה ניזונים מסוכר ומייצרים חומצה, שמחלישה את האמייל ויוצרת חורים בשיניים.
  explanation_en: Mouth bacteria feed on sugar and make acid, which weakens enamel and causes cavities.
  tags: [health]
- id: sci.body.037
  skill: science.body.health
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: אם לוקחים תרופה של מישהו אחר שהיה חולה באותה מחלה, זה בטוח.
  prompt_en: Taking someone else's medicine for the same illness is safe.
  answer: false
  explanation_he: לא נכון. תרופה מתאימה לגוף, לגיל ולמשקל של אדם מסוים. לוקחים תרופה רק באישור הורה או רופא.
  explanation_en: False. Medicine is matched to a specific person's body, age and weight. Take medicine only with a parent's or doctor's approval.
  tags: [health]
- id: sci.body.038
  skill: science.body.health
  kind: order
  grade: 1
  difficulty: 0.0
  prompt_he: סדרו את שלבי שטיפת הידיים.
  prompt_en: Order the steps of handwashing.
  choices:
  - {he: מייבשים במגבת, en: dry with a towel}
  - {he: מרטיבים את הידיים, en: wet your hands}
  - {he: שוטפים במים, en: rinse with water}
  - {he: מסבנים, en: apply soap}
  - {he: משפשפים כ-20 שניות, en: scrub for about 20 seconds}
  answer: [1, 3, 4, 2, 0]
  explanation_he: הסבון והשפשוף מורידים את החיידקים, השטיפה מסלקת אותם, ומגבת נקייה מייבשת.
  explanation_en: Soap and scrubbing loosen germs, rinsing washes them away, and a clean towel dries your hands.
  tags: [health]
- id: sci.body.039
  skill: science.body.nutrition
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה המשקה הכי בריא כשצמאים?
  prompt_en: What is the healthiest drink when you're thirsty?
  choices:
  - {he: משקה מוגז ממותק, en: sugary soda, emoji: 1f964}
  - {he: מים, en: water, emoji: 1f4a7}
  - {he: מיץ ממותק, en: sweetened juice, emoji: 1f9c3}
  answer: 1
  explanation_he: מים מרווים את הצמא בלי סוכר. רוב הגוף שלנו בנוי ממים.
  explanation_en: Water quenches thirst without sugar. Most of our body is made of water.
  tags: [nutrition]
- id: sci.body.040
  skill: science.body.nutrition
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איזה מזון עשיר בסידן, שמחזק את העצמות והשיניים?
  prompt_en: Which food is rich in calcium, which strengthens bones and teeth?
  choices:
  - {he: צ'יפס, en: fries, emoji: 1f35f}
  - {he: סוכריות, en: candy, emoji: 1f36c}
  - {he: חלב ומוצריו, en: milk and dairy, emoji: 1f95b}
  answer: 2
  explanation_he: חלב, גבינה ויוגורט עשירים בסידן. גם שומשום (טחינה), שקדים וירקות ירוקים מכילים סידן.
  explanation_en: Milk, cheese and yogurt are rich in calcium. Sesame (tahini), almonds and green vegetables have calcium too.
  tags: [nutrition]
- id: sci.body.041
  skill: science.body.nutrition
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: מה התפקיד העיקרי של חלבונים בגוף?
  prompt_en: What is the main job of proteins in the body?
  choices:
  - {he: לקרר את הגוף, en: to cool the body}
  - {he: לתת צבע לשיער בלבד, en: only to color hair}
  - {he: לבנות ולתקן שרירים ורקמות, en: to build and repair muscles and tissues}
  answer: 2
  explanation_he: חלבונים הם אבני הבניין של הגוף. יש הרבה חלבון בביצים, קטניות, דגים, בשר ומוצרי חלב.
  explanation_en: Proteins are the body's building blocks. Eggs, legumes, fish, meat and dairy are rich in protein.
  tags: [nutrition]
- id: sci.body.042
  skill: science.body.nutrition
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איזה מזון נותן לגוף אנרגיה מהירה בעזרת פחמימות?
  prompt_en: Which food gives quick energy from carbohydrates?
  choices:
  - {he: מלח, en: salt, emoji: 1f9c2}
  - {he: מים, en: water, emoji: 1f4a7}
  - {he: 'לחם, אורז ופסטה', en: 'bread, rice and pasta', emoji: 1f35e}
  answer: 2
  explanation_he: פחמימות הן הדלק העיקרי של הגוף. דגנים מלאים נותנים אנרגיה לאורך זמן וגם סיבים.
  explanation_en: Carbohydrates are the body's main fuel. Whole grains give lasting energy and fiber too.
  tags: [nutrition]
- id: sci.body.043
  skill: science.body.nutrition
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: פירות וירקות בצבעים שונים נותנים לגוף ויטמינים שונים.
  prompt_en: Fruits and vegetables of different colors give the body different vitamins.
  answer: true
  explanation_he: 'נכון. לכן כדאי לאכול צלחת צבעונית: גזר כתום, עגבנייה אדומה, חסה ירוקה ועוד.'
  explanation_en: 'True. That''s why a colorful plate is good: orange carrots, red tomatoes, green lettuce and more.'
  tags: [nutrition]
- id: sci.body.044
  skill: science.body.nutrition
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איזה ויטמין הגוף מייצר בעור בעזרת אור השמש?
  prompt_en: Which vitamin does the skin make with sunlight?
  choices:
  - {he: ויטמין D, en: vitamin D}
  - {he: ויטמין C, en: vitamin C}
  - {he: ויטמין A, en: vitamin A}
  answer: 0
  explanation_he: ויטמין D עוזר לגוף לקלוט סידן לעצמות. מספיק מעט זמן בשמש כדי לייצר אותו.
  explanation_en: Vitamin D helps the body absorb calcium for bones. A little sunshine is enough to make it.
  tags: [nutrition]
- id: sci.body.045
  skill: science.body.nutrition
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: באילו מזונות יש הרבה ויטמין C?
  prompt_en: Which foods are rich in vitamin C?
  choices:
  - {he: שמן, en: oil, emoji: 1fad7}
  - {he: סוכר לבן, en: white sugar, emoji: 1f36c}
  - {he: 'פלפל אדום, תפוזים וקיווי', en: 'red pepper, oranges and kiwi', emoji: 1fad1}
  answer: 2
  explanation_he: ויטמין C עוזר לרפא פצעים ולחזק את מערכת החיסון. יש ממנו הרבה בפירות וירקות טריים.
  explanation_en: Vitamin C helps heal wounds and supports the immune system. Fresh fruits and vegetables are full of it.
  tags: [nutrition]
- id: sci.body.046
  skill: science.body.nutrition
  kind: true_false
  grade: 4
  difficulty: 0.0
  prompt_he: שומן מזיק תמיד, ועדיף לא לאכול שומן בכלל.
  prompt_en: Fat is always harmful and it's best to eat none.
  answer: false
  explanation_he: לא נכון. הגוף צריך מעט שומן בריא, למשל משמן זית, אגוזים ואבוקדו. הבעיה היא כמות גדולה מדי.
  explanation_en: False. The body needs some healthy fat, like olive oil, nuts and avocado. The problem is too much.
  tags: [nutrition]
- id: sci.body.047
  skill: science.body.nutrition
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: למה כדאי לאכול מזונות עם סיבים תזונתיים, כמו ירקות ולחם מלא?
  prompt_en: Why eat foods with dietary fiber, like vegetables and whole bread?
  choices:
  - {he: הם צובעים את העור, en: they color the skin}
  - {he: הם עוזרים למערכת העיכול לעבוד היטב, en: they help the digestive system work well}
  - {he: הם מחליפים מים, en: they replace water}
  answer: 1
  explanation_he: הסיבים לא מתעכלים, אבל הם עוזרים למזון לעבור במעיים ומזינים חיידקים טובים.
  explanation_en: Fiber isn't digested, but it helps food move through the gut and feeds helpful bacteria.
  tags: [nutrition]
- id: sci.body.048
  skill: science.body.nutrition
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: איזה מינרל חשוב לבניית הדם, ויש ממנו בעדשים ובתרד?
  prompt_en: Which mineral is important for blood, and found in lentils and spinach?
  choices:
  - {he: זהב, en: gold}
  - {he: כסף, en: silver}
  - {he: ברזל, en: iron}
  answer: 2
  explanation_he: ברזל הוא חלק מההמוגלובין, החומר בתאי הדם האדומים שנושא חמצן. חסר בברזל גורם לעייפות.
  explanation_en: Iron is part of hemoglobin, the substance in red blood cells that carries oxygen. Too little iron causes tiredness.
  tags: [nutrition]
- id: sci.body.049
  skill: science.body.nutrition
  kind: true_false
  grade: 5
  difficulty: 1.0
  prompt_he: כמעט שני שלישים מגוף האדם הם מים.
  prompt_en: Nearly two thirds of the human body is water.
  answer: true
  explanation_he: נכון. בערך 60 אחוז מגוף האדם הם מים. לכן חשוב לשתות במשך היום, ובמיוחד בחום.
  explanation_en: True. About 60 percent of the body is water, so it's important to drink during the day, especially in the heat.
  tags: [nutrition]
- id: sci.body.050
  skill: science.body.nutrition
  kind: order
  grade: 3
  difficulty: 0.0
  prompt_he: סדרו את המזונות מהכי מומלץ לאכול כל יום ועד למזון לפעמים.
  prompt_en: Order these from "eat every day" to "only sometimes".
  choices:
  - {he: לחם מלא, en: whole bread, emoji: 1f35e}
  - {he: עוגה, en: cake, emoji: 1f370}
  - {he: גבינה, en: cheese, emoji: 1f9c0}
  - {he: ירקות ופירות, en: vegetables and fruit, emoji: 1f966}
  answer: [3, 0, 2, 1]
  explanation_he: ירקות ופירות כדאי לאכול הרבה, דגנים מלאים כל יום, מוצרי חלב במידה, וממתקים רק לפעמים.
  explanation_en: Eat lots of vegetables and fruit, whole grains daily, dairy in moderation, and sweets only sometimes.
  tags: [nutrition]
- id: sci.body.051
  skill: science.body.systems
  kind: order
  grade: 4
  difficulty: 0.0
  prompt_he: סדרו את הדרך של המזון במערכת העיכול.
  prompt_en: Order the path of food through the digestive system.
  choices:
  - {he: פה, en: mouth}
  - {he: ושט, en: esophagus}
  - {he: מעי גס, en: large intestine}
  - {he: מעי דק, en: small intestine}
  - {he: קיבה, en: stomach}
  answer: [0, 1, 4, 3, 2]
  explanation_he: בפה לועסים, הוושט מוביל לקיבה, בקיבה המזון מתפרק, במעי הדק החומרים נספגים לדם, ובמעי הגס נספגים מים.
  explanation_en: We chew in the mouth, the esophagus leads to the stomach, food breaks down there, nutrients are absorbed in the small intestine, and water in the large one.
  tags: [body_systems]
- id: sci.body.052
  skill: science.body.systems
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: באיזה איבר נספגים רוב חומרי המזון לדם?
  prompt_en: In which organ are most nutrients absorbed into the blood?
  choices:
  - {he: בקיבה, en: the stomach}
  - {he: במעי הדק, en: the small intestine}
  - {he: בוושט, en: the esophagus}
  answer: 1
  explanation_he: דופן המעי הדק מכוסה בבליטות זעירות שמגדילות את השטח שלו, וכך הוא סופג הרבה חומרי מזון.
  explanation_en: The small intestine's lining is covered in tiny folds that enlarge its surface, so it absorbs lots of nutrients.
  tags: [body_systems]
- id: sci.body.053
  skill: science.body.systems
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: מה תפקיד מערכת השלד?
  prompt_en: What is the job of the skeletal system?
  choices:
  - {he: 'תמיכה, הגנה ותנועה', en: 'support, protection and movement', emoji: 1f9b4}
  - {he: עיכול מזון, en: digesting food, emoji: 1f354}
  - {he: סינון דם, en: filtering blood, emoji: 1f4a7}
  answer: 0
  explanation_he: השלד נותן לגוף צורה, מגן על איברים כמו המוח והלב, ויחד עם השרירים מאפשר לזוז.
  explanation_en: The skeleton gives the body shape, protects organs like the brain and heart, and with muscles lets us move.
  tags: [body_systems]
- id: sci.body.054
  skill: science.body.systems
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: מה מוביל מסרים מהמוח לשרירים?
  prompt_en: What carries messages from the brain to the muscles?
  choices:
  - {he: עצבים, en: nerves}
  - {he: גידים, en: tendons}
  - {he: עורקים, en: arteries}
  answer: 0
  explanation_he: מערכת העצבים כוללת את המוח, חוט השדרה והעצבים. העצבים מעבירים אותות חשמליים זעירים במהירות רבה.
  explanation_en: The nervous system includes the brain, spinal cord and nerves. Nerves carry tiny electrical signals very fast.
  tags: [body_systems]
- id: sci.body.055
  skill: science.body.systems
  kind: true_false
  grade: 5
  difficulty: 0.0
  prompt_he: כשאנחנו נושמים פנימה אנחנו מכניסים חמצן, וכשאנחנו נושפים אנחנו מוציאים פחמן דו-חמצני.
  prompt_en: We breathe in oxygen and breathe out carbon dioxide.
  answer: true
  explanation_he: נכון. החמצן נחוץ לתאים כדי להפיק אנרגיה מהמזון, והפחמן הדו-חמצני הוא הפסולת של התהליך.
  explanation_en: True. Cells need oxygen to get energy from food, and carbon dioxide is the waste of that process.
  tags: [body_systems]
- id: sci.body.056
  skill: science.body.systems
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: מה עושה מערכת הדם (מחזור הדם)?
  prompt_en: What does the circulatory system do?
  choices:
  - {he: מייצרת קול, en: makes sound}
  - {he: מעכלת אוכל, en: digests food}
  - {he: מובילה חמצן ומזון לכל תאי הגוף, en: carries oxygen and food to all cells}
  answer: 2
  explanation_he: הלב שואב דם בעורקים לכל הגוף. הדם מוסר חמצן ומזון לתאים, אוסף פסולת וחוזר בוורידים ללב.
  explanation_en: The heart pumps blood through arteries to the body. It delivers oxygen and food, collects waste and returns in veins.
  tags: [body_systems]
- id: sci.body.057
  skill: science.body.systems
  kind: true_false
  grade: 5
  difficulty: 1.0
  prompt_he: העיכול מתחיל רק בקיבה.
  prompt_en: Digestion only starts in the stomach.
  answer: false
  explanation_he: 'לא נכון. העיכול מתחיל כבר בפה: השיניים מרסקות את המזון, והרוק מתחיל לפרק עמילן.'
  explanation_en: 'False. Digestion starts in the mouth: teeth crush food and saliva starts breaking down starch.'
  tags: [body_systems]
- id: sci.body.058
  skill: science.body.systems
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מה מחבר שריר לעצם?
  prompt_en: What connects a muscle to a bone?
  choices:
  - {he: גיד, en: a tendon}
  - {he: עצב, en: a nerve}
  - {he: וריד, en: a vein}
  answer: 0
  explanation_he: הגיד הוא רצועה חזקה. כשהשריר מתכווץ הוא מושך בגיד, והגיד מזיז את העצם.
  explanation_en: A tendon is a tough cord. When a muscle contracts it pulls the tendon, which moves the bone.
  tags: [body_systems]
- id: sci.body.059
  skill: science.body.systems
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מה קורה כשנוגעים בטעות בסיר חם ומיד מושכים את היד?
  prompt_en: What happens when you touch a hot pot and instantly pull your hand away?
  choices:
  - {he: הלב מזיז את היד, en: the heart moves the hand}
  - {he: זה קורה רק אחרי מחשבה ארוכה, en: it happens after long thought}
  - {he: 'רפלקס: תגובה מהירה דרך חוט השדרה', en: 'a reflex: a fast response through the spinal cord'}
  answer: 2
  explanation_he: ברפלקס האות עובר לחוט השדרה וחוזר ישר לשריר, עוד לפני שהמוח מרגיש כאב. זה שומר עלינו.
  explanation_en: In a reflex the signal goes to the spinal cord and straight back to the muscle, even before the brain feels pain. It keeps us safe.
  tags: [body_systems]
- id: sci.body.060
  skill: science.body.systems
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: איזו מערכת כוללת את האף, קנה הנשימה והריאות?
  prompt_en: Which system includes the nose, windpipe and lungs?
  choices:
  - {he: מערכת העיכול, en: the digestive system, emoji: 1f354}
  - {he: מערכת הנשימה, en: the respiratory system, emoji: 1fac1}
  - {he: מערכת השלד, en: the skeletal system, emoji: 1f9b4}
  answer: 1
  explanation_he: מערכת הנשימה מכניסה אוויר לריאות. שם החמצן עובר לדם.
  explanation_en: The respiratory system brings air into the lungs, where oxygen passes into the blood.
  tags: [body_systems]
- id: sci.body.061
  skill: science.body.systems
  kind: true_false
  grade: 6
  difficulty: 1.0
  prompt_he: כשמתאמנים הלב פועם מהר יותר.
  prompt_en: The heart beats faster during exercise.
  answer: true
  explanation_he: נכון. השרירים צריכים יותר חמצן, ולכן הלב שואב דם מהר יותר והנשימה מואצת.
  explanation_en: True. Working muscles need more oxygen, so the heart pumps faster and breathing speeds up.
  tags: [body_systems]
- id: sci.body.062
  skill: science.body.systems
  kind: order
  grade: 5
  difficulty: 1.0
  prompt_he: סדרו את הדרך של האוויר כשנושמים פנימה.
  prompt_en: Order the path of air when we breathe in.
  choices:
  - {he: קנה הנשימה, en: windpipe (trachea)}
  - {he: אף, en: nose}
  - {he: נאדיות הריאה, en: air sacs (alveoli)}
  - {he: סימפונות, en: bronchi}
  answer: [1, 0, 3, 2]
  explanation_he: האוויר נכנס באף, יורד בקנה הנשימה, מתפצל לסימפונות ומגיע לשקיקים זעירים בריאות, שם החמצן עובר לדם.
  explanation_en: Air enters the nose, goes down the windpipe, splits into bronchi and reaches tiny sacs in the lungs where oxygen enters the blood.
  tags: [body_systems]
- id: sci.body.063
  skill: science.body.advanced
  kind: choice
  grade: 7
  difficulty: 0.0
  prompt_he: מה תפקיד תאי הדם האדומים?
  prompt_en: What do red blood cells do?
  choices:
  - {he: נושאים חמצן, en: carry oxygen}
  - {he: עוצרים דימום, en: stop bleeding}
  - {he: נלחמים בחיידקים, en: fight germs}
  answer: 0
  explanation_he: תאי הדם האדומים מלאים בהמוגלובין, שנקשר לחמצן בריאות ומשחרר אותו ברקמות.
  explanation_en: Red blood cells are full of hemoglobin, which picks up oxygen in the lungs and releases it in tissues.
  tags: [body_advanced]
- id: sci.body.064
  skill: science.body.advanced
  kind: choice
  grade: 7
  difficulty: 0.0
  prompt_he: מה תפקיד תאי הדם הלבנים?
  prompt_en: What do white blood cells do?
  choices:
  - {he: מעבירים מסרים במוח, en: carry brain messages}
  - {he: מגינים על הגוף מפני חיידקים ונגיפים, en: defend against bacteria and viruses}
  - {he: נושאים חמצן, en: carry oxygen}
  answer: 1
  explanation_he: תאי הדם הלבנים הם חלק ממערכת החיסון. הם מזהים פולשים ומשמידים אותם.
  explanation_en: White blood cells are part of the immune system. They detect invaders and destroy them.
  tags: [body_advanced]
- id: sci.body.065
  skill: science.body.advanced
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: מה עוזר לדם להיקרש ולעצור דימום מחתך קטן?
  prompt_en: What helps blood clot and stop bleeding from a small cut?
  choices:
  - {he: תאי שומן, en: fat cells}
  - {he: תאי עצב, en: nerve cells}
  - {he: טסיות הדם, en: platelets}
  answer: 2
  explanation_he: טסיות הדם נצמדות במקום הפצע ויוצרות פקק עם חלבונים בדם. כך נוצר הגלד.
  explanation_en: Platelets stick together at a wound and form a plug with blood proteins, making a scab.
  tags: [body_advanced]
- id: sci.body.066
  skill: science.body.advanced
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: כמה חללים יש בלב של האדם?
  prompt_en: How many chambers does the human heart have?
  choices:
  - {he: '2', en: '2'}
  - {he: '4', en: '4'}
  - {he: '6', en: '6'}
  answer: 1
  explanation_he: בלב שתי עליות ושני חדרים. צד ימין שולח דם לריאות, וצד שמאל שולח דם עשיר בחמצן לכל הגוף.
  explanation_en: The heart has two atria and two ventricles. The right side sends blood to the lungs; the left sends oxygen-rich blood to the body.
  tags: [body_advanced]
- id: sci.body.067
  skill: science.body.advanced
  kind: true_false
  grade: 8
  difficulty: 1.0
  prompt_he: עורקים תמיד מובילים דם אל הלב.
  prompt_en: Arteries always carry blood toward the heart.
  answer: false
  explanation_he: לא נכון. עורקים מובילים דם מהלב אל הגוף, וורידים מחזירים אותו אל הלב. נימים דקים מחברים ביניהם.
  explanation_en: False. Arteries carry blood away from the heart; veins bring it back. Thin capillaries connect them.
  tags: [body_advanced]
- id: sci.body.068
  skill: science.body.advanced
  kind: choice
  grade: 8
  difficulty: 1.0
  prompt_he: איך פועל חיסון?
  prompt_en: How does a vaccine work?
  choices:
  - {he: מחליף את הדם, en: replaces the blood}
  - {he: מלמד את מערכת החיסון לזהות מחלה מראש, en: trains the immune system to recognize a disease in advance}
  - {he: הורג את כל החיידקים בגוף, en: kills all bacteria in the body}
  answer: 1
  explanation_he: החיסון מראה לגוף חלק לא מזיק של החיידק או הנגיף. מערכת החיסון לומדת לזהות אותו ומגיבה מהר אם יגיע באמת.
  explanation_en: A vaccine shows the body a harmless part of a germ. The immune system learns it and responds quickly if the real germ arrives.
  tags: [body_advanced]
- id: sci.body.069
  skill: science.body.advanced
  kind: true_false
  grade: 8
  difficulty: 1.0
  prompt_he: אנטיביוטיקה עוזרת נגד חיידקים, אבל לא נגד נגיפים כמו נגיף השפעת.
  prompt_en: Antibiotics help against bacteria but not against viruses like the flu virus.
  answer: true
  explanation_he: נכון. אנטיביוטיקה פוגעת במבנה של חיידקים. לנגיפים אין מבנה כזה, ולכן היא לא עוזרת נגד שפעת או הצטננות.
  explanation_en: True. Antibiotics attack bacterial structures. Viruses lack them, so antibiotics don't help with flu or colds.
  tags: [body_advanced]
- id: sci.body.070
  skill: science.body.advanced
  kind: choice
  grade: 7
  difficulty: 1.0
  prompt_he: מה תפקיד הסרעפת בנשימה?
  prompt_en: What role does the diaphragm play in breathing?
  choices:
  - {he: מסננת את האוויר מאבק, en: filters dust from the air}
  - {he: מייצרת קול, en: makes the voice}
  - {he: מתכווצת ויורדת וכך מכניסה אוויר לריאות, en: 'contracts and moves down, drawing air into the lungs'}
  answer: 2
  explanation_he: הסרעפת היא שריר מתחת לריאות. כשהיא מתכווצת נוצר מקום בחזה והאוויר נשאב פנימה.
  explanation_en: The diaphragm is a muscle below the lungs. When it contracts the chest gets roomier and air rushes in.
  tags: [body_advanced]
- id: sci.body.071
  skill: science.body.advanced
  kind: choice
  grade: 9
  difficulty: 2.0
  prompt_he: למה הנאדיות בריאות מתאימות כל כך לחילוף גזים?
  prompt_en: Why are the lungs' air sacs so good for gas exchange?
  choices:
  - {he: הן עשויות מעצם, en: they are made of bone}
  - {he: דפנות דקות מאוד ושטח פנים עצום, en: very thin walls and a huge surface area}
  - {he: הן מלאות בשומן, en: they are full of fat}
  answer: 1
  explanation_he: יש מאות מיליוני נאדיות עם דופן דקה מאוד, מוקפות בנימים. כך חמצן ופחמן דו-חמצני עוברים מהר בין האוויר לדם.
  explanation_en: Hundreds of millions of air sacs with very thin walls are wrapped in capillaries, so gases pass quickly between air and blood.
  tags: [body_advanced]
- id: sci.body.072
  skill: science.body.advanced
  kind: choice
  grade: 9
  difficulty: 1.0
  prompt_he: איזה איבר מייצר אינסולין, שמווסת את רמת הסוכר בדם?
  prompt_en: Which organ makes insulin, which controls blood sugar?
  choices:
  - {he: הלבלב, en: the pancreas}
  - {he: הטחול, en: the spleen}
  - {he: הריאות, en: the lungs}
  answer: 0
  explanation_he: הלבלב משחרר אינסולין כשרמת הסוכר בדם עולה. האינסולין עוזר לתאים לקלוט את הסוכר.
  explanation_en: The pancreas releases insulin when blood sugar rises. Insulin helps cells take in the sugar.
  tags: [body_advanced]
- id: sci.body.073
  skill: science.body.advanced
  kind: true_false
  grade: 9
  difficulty: 1.0
  prompt_he: הדם בוורידים כחול, והוא נהיה אדום רק כשהוא נוגע באוויר.
  prompt_en: Blood in veins is blue and turns red only when it meets air.
  answer: false
  explanation_he: 'לא נכון. הדם תמיד אדום: אדום בהיר כשיש בו הרבה חמצן ואדום כהה כשיש בו פחות. הוורידים רק נראים כחולים דרך העור.'
  explanation_en: 'False. Blood is always red: bright red with lots of oxygen, dark red with less. Veins only look blue through the skin.'
  tags: [body_advanced]
- id: sci.body.074
  skill: science.body.advanced
  kind: choice
  grade: 7
  difficulty: 0.0
  prompt_he: מה הכבד עושה?
  prompt_en: What does the liver do?
  choices:
  - {he: שואב דם, en: pumps blood}
  - {he: מנקה רעלים ועוזר בעיכול שומנים, en: removes toxins and helps digest fats}
  - {he: שולט בשרירים, en: controls muscles}
  answer: 1
  explanation_he: הכבד הוא האיבר הפנימי הגדול ביותר. הוא מפרק חומרים מזיקים ומייצר מרה, שעוזרת לעכל שומנים.
  explanation_en: The liver is the largest internal organ. It breaks down harmful substances and makes bile, which helps digest fats.
  tags: [body_advanced]
- id: sci.body.075
  skill: science.body.advanced
  kind: order
  grade: 8
  difficulty: 1.0
  prompt_he: סדרו את מסלול הדם, החל מהצד הימני של הלב.
  prompt_en: Order the path of blood starting from the right side of the heart.
  choices:
  - {he: 'הריאות, שם הדם מקבל חמצן', en: 'the lungs, where blood gains oxygen'}
  - {he: כל איברי הגוף, en: all the body's organs}
  - {he: הצד השמאלי של הלב, en: the left side of the heart}
  - {he: הצד הימני של הלב, en: the right side of the heart}
  answer: [3, 0, 2, 1]
  explanation_he: צד ימין של הלב שולח דם לריאות. משם הדם חוזר לצד שמאל, שדוחף אותו לכל הגוף, ומשם הוא חוזר לצד ימין.
  explanation_en: The right side pumps blood to the lungs. It returns to the left side, which pushes it to the body, and then back to the right.
  tags: [body_advanced]

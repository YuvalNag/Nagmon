# Nagmon learning content - science / plants (parts, growth, seeds, photosynthesis, plants of Israel and Tu BiShvat)
# Format: docs/kids/SDD_CONTENT.md section 3. Generated from curated sources; reviewed by a parent.
# Hebrew without niqqud. Answer indexes are 0-based; for kind=order, answer lists choice indexes in the correct order.
# Curriculum alignment: Israeli MoE "מדע וטכנולוגיה" (science and technology) strands -
#   materials, energy and interactions, systems and processes in living things, earth and universe, technology.
# Sources consulted:
#   - Elementary curriculum (grades 1-6): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/yesodi/technology-science-pedagogy/curriculum
#   - Elementary curriculum PDF (2009 draft): https://meyda.education.gov.il/files/Tochniyot_Limudim/KdamYesodi/MadaTechnologia.pdf
#   - Middle school (grades 7-9): https://pop.education.gov.il/tchumey_daat/mada-tehnologia/chativat-beynayim/mada-technologia-pedagogia/curriculum
#   - Grade 8/9 test specifications (Meitzav/RAMA): https://meyda.education.gov.il/files/Rama/Mifrat_sci_9_H_2027.pdf
# Topics: plant parts (1-3), needs and growth (2-4), seeds and germination (2-4), photosynthesis (5-8), plants of Israel (2-5).

skill: science.plants.parts
items:
- id: sci.plants.001
  skill: science.plants.parts
  kind: choice
  grade: 1
  difficulty: -1.0
  prompt_he: איזה חלק של הצמח נמצא בדרך כלל מתחת לאדמה?
  prompt_en: Which part of a plant is usually underground?
  choices:
  - {he: הפרח, en: the flower}
  - {he: העלה, en: the leaf}
  - {he: השורש, en: the root}
  answer: 2
  explanation_he: השורשים מחזיקים את הצמח באדמה וסופגים ממנה מים ומינרלים.
  explanation_en: Roots hold the plant in the ground and soak up water and minerals.
  tags: [plant_parts]
- id: sci.plants.002
  skill: science.plants.parts
  kind: choice
  grade: 1
  difficulty: 0.0
  prompt_he: מה התפקיד של הגבעול?
  prompt_en: What does the stem do?
  choices:
  - {he: מייצר זרעים, en: makes seeds}
  - {he: מושך דבורים, en: attracts bees}
  - {he: מוביל מים ומחזיק את הצמח, en: carries water and holds the plant up}
  answer: 2
  explanation_he: 'הגבעול הוא כמו צינור ועמוד: הוא מעביר מים מהשורשים לעלים ומחזיק את הצמח זקוף.'
  explanation_en: 'The stem is like a pipe and a pole: it carries water from roots to leaves and holds the plant upright.'
  tags: [plant_parts]
- id: sci.plants.003
  skill: science.plants.parts
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: באיזה חלק של הצמח נוצר רוב המזון?
  prompt_en: In which part of the plant is most food made?
  choices:
  - {he: בשורשים, en: in the roots, emoji: 1f955}
  - {he: בפרחים, en: in the flowers, emoji: 1f33a}
  - {he: בעלים, en: in the leaves, emoji: 1f343}
  answer: 2
  explanation_he: העלים הירוקים קולטים אור שמש ומייצרים בעזרתו סוכר, שהוא המזון של הצמח.
  explanation_en: Green leaves capture sunlight and use it to make sugar, the plant's food.
  tags: [plant_parts]
- id: sci.plants.004
  skill: science.plants.parts
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה התפקיד העיקרי של הפרח?
  prompt_en: What is the main job of a flower?
  choices:
  - {he: להחזיק את הצמח באדמה, en: to anchor the plant}
  - {he: לשתות מים, en: to drink water}
  - {he: ליצור זרעים, en: to make seeds}
  answer: 2
  explanation_he: בפרח מתרחשת ההאבקה, ואחריה נוצרים פרי וזרעים. מהזרעים יגדלו צמחים חדשים.
  explanation_en: Pollination happens in the flower, then fruit and seeds form. New plants grow from the seeds.
  tags: [plant_parts]
- id: sci.plants.005
  skill: science.plants.parts
  kind: true_false
  grade: 2
  difficulty: 0.0
  prompt_he: הגזר שאנחנו אוכלים הוא שורש.
  prompt_en: The carrot we eat is a root.
  answer: true
  explanation_he: נכון. הגזר הוא שורש עבה שאוגר מזון לצמח.
  explanation_en: True. A carrot is a thick root that stores food for the plant.
  tags: [plant_parts]
- id: sci.plants.006
  skill: science.plants.parts
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: תפוח האדמה הוא שורש.
  prompt_en: A potato is a root.
  answer: false
  explanation_he: לא נכון. תפוח האדמה הוא גבעול תת-קרקעי שאוגר עמילן. ה"עיניים" שעליו הם ניצנים שמהם יכולים לצמוח צמחים חדשים.
  explanation_en: False. A potato is an underground stem that stores starch. Its "eyes" are buds that can grow new plants.
  tags: [plant_parts]
- id: sci.plants.007
  skill: science.plants.parts
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איזה חלק של הצמח אנחנו אוכלים כשאנחנו אוכלים חסה?
  prompt_en: Which plant part do we eat when we eat lettuce?
  choices:
  - {he: עלים, en: leaves}
  - {he: שורשים, en: roots}
  - {he: זרעים, en: seeds}
  answer: 0
  explanation_he: חסה, כרוב ותרד הם עלים. ברוקולי הוא בעצם פרחים, ואפונה היא זרעים.
  explanation_en: Lettuce, cabbage and spinach are leaves. Broccoli is really flowers, and peas are seeds.
  tags: [plant_parts]
- id: sci.plants.008
  skill: science.plants.parts
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: מכניסים גבעול סלרי לכוס מים צבועים. אחרי יום העלים נצבעים. מה זה מראה?
  prompt_en: A celery stalk stands in colored water. After a day the leaves are colored. What does this show?
  choices:
  - {he: הסלרי מייצר צבע, en: celery makes dye}
  - {he: העלים אוהבים צבע, en: leaves like color}
  - {he: הגבעול מוביל מים אל העלים, en: the stem carries water to the leaves}
  answer: 2
  explanation_he: הצבע עלה יחד עם המים בצינורות של הגבעול והגיע לעלים. כך מים עולים בכל צמח.
  explanation_en: The dye rose with the water through tubes in the stem to the leaves. That's how water rises in every plant.
  tags: [plant_parts]
- id: sci.plants.009
  skill: science.plants.parts
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה תפקיד הפרי?
  prompt_en: What is the job of a fruit?
  choices:
  - {he: לייצר אור, en: to make light}
  - {he: לספוג מים מהאדמה, en: to absorb water from soil}
  - {he: להגן על הזרעים ולעזור להפיץ אותם, en: to protect seeds and help spread them}
  answer: 2
  explanation_he: הפרי עוטף את הזרעים. בעלי חיים אוכלים פירות ומפזרים את הזרעים במקומות חדשים.
  explanation_en: Fruit surrounds the seeds. Animals eat fruit and scatter the seeds in new places.
  tags: [plant_parts]
- id: sci.plants.010
  skill: science.plants.parts
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: מבחינה מדעית, עגבנייה היא פרי.
  prompt_en: Scientifically, a tomato is a fruit.
  answer: true
  explanation_he: נכון. כל חלק שמתפתח מהפרח ומכיל זרעים הוא פרי. לכן גם עגבנייה, מלפפון ופלפל הם פירות.
  explanation_en: True. Any part that develops from a flower and holds seeds is a fruit, so tomatoes, cucumbers and peppers are fruits.
  tags: [plant_parts]
- id: sci.plants.011
  skill: science.plants.parts
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איך אפשר לדעת בערך את הגיל של עץ שנכרת?
  prompt_en: How can you estimate the age of a cut tree?
  choices:
  - {he: לספור את הטבעות בגזע, en: count the rings in the trunk}
  - {he: לספור את הענפים, en: count the branches}
  - {he: למדוד את גובה העלים, en: measure the leaves' height}
  answer: 0
  explanation_he: בכל שנה נוספת לגזע שכבת עץ חדשה שנראית כמו טבעת. מספר הטבעות הוא בערך גיל העץ.
  explanation_en: Each year a new layer of wood forms in the trunk, seen as a ring. The number of rings is about the tree's age.
  tags: [plant_parts]
- id: sci.plants.012
  skill: science.plants.parts
  kind: order
  grade: 1
  difficulty: 0.0
  prompt_he: סדרו את חלקי הצמח מלמטה למעלה.
  prompt_en: Order the plant parts from bottom to top.
  choices:
  - {he: פרח, en: flower}
  - {he: עלים, en: leaves}
  - {he: שורש, en: root}
  - {he: גבעול, en: stem}
  answer: [2, 3, 1, 0]
  explanation_he: השורש באדמה, הגבעול יוצא ממנו כלפי מעלה, ממנו יוצאים העלים, ובדרך כלל הפרח בקצה.
  explanation_en: The root is in the soil, the stem grows up from it, leaves branch off, and the flower is usually at the top.
  tags: [plant_parts]
- id: sci.plants.013
  skill: science.plants.needs
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: שמים עציץ ליד חלון. לאן יתכופף הצמח אחרי כמה ימים?
  prompt_en: A pot is placed by a window. Which way will the plant bend after a few days?
  choices:
  - {he: הרחק מהחלון, en: away from the window}
  - {he: לכיוון החלון והאור, en: toward the window and light}
  - {he: הוא לא יזוז, en: it won't move}
  answer: 1
  explanation_he: צמחים גדלים לכיוון האור, כי הם צריכים אותו כדי לייצר מזון.
  explanation_en: Plants grow toward light because they need it to make food.
  tags: [plant_needs]
- id: sci.plants.014
  skill: science.plants.needs
  kind: true_false
  grade: 2
  difficulty: 0.0
  prompt_he: צמחים מקבלים את המזון שלהם מהאדמה.
  prompt_en: Plants get their food from the soil.
  answer: false
  explanation_he: לא נכון. צמחים מייצרים מזון בעצמם בעלים, מאור, מים ופחמן דו-חמצני. מהאדמה הם מקבלים מים ומינרלים.
  explanation_en: False. Plants make their own food in their leaves from light, water and carbon dioxide. Soil provides water and minerals.
  tags: [plant_needs]
- id: sci.plants.015
  skill: science.plants.needs
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה קורה לעלים של צמח שהיה בחושך הרבה ימים?
  prompt_en: What happens to the leaves of a plant kept in the dark for many days?
  choices:
  - {he: הם מצהיבים, en: they turn yellow}
  - {he: הם גדלים במהירות, en: they grow fast}
  - {he: הם נעשים כחולים, en: they turn blue}
  answer: 0
  explanation_he: בלי אור הצמח מפסיק לייצר את החומר הירוק, הכלורופיל. העלים מחווירים ומצהיבים.
  explanation_en: Without light the plant stops making the green substance, chlorophyll. Leaves become pale and yellow.
  tags: [plant_needs]
- id: sci.plants.016
  skill: science.plants.needs
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: למה כדאי לשים עציץ בחלון ולא בארון?
  prompt_en: Why put a pot by a window rather than in a closet?
  choices:
  - {he: כי בארון יש יותר מדי מים, en: the closet has too much water}
  - {he: כי צמחים לא אוהבים עץ, en: plants dislike wood}
  - {he: כי הצמח צריך אור כדי לייצר מזון, en: the plant needs light to make food}
  answer: 2
  explanation_he: אור הוא מקור האנרגיה של הצמח. בלי אור הוא לא יכול לייצר סוכר ולגדול.
  explanation_en: Light is the plant's energy source. Without it the plant can't make sugar or grow.
  tags: [plant_needs]
- id: sci.plants.017
  skill: science.plants.needs
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: גם השקיה מרובה מדי יכולה לפגוע בצמח.
  prompt_en: Watering too much can also harm a plant.
  answer: true
  explanation_he: נכון. כשהאדמה רטובה כל הזמן, לשורשים אין אוויר והם עלולים להירקב.
  explanation_en: True. When soil is always soaked, roots get no air and may rot.
  tags: [plant_needs]
- id: sci.plants.018
  skill: science.plants.needs
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: מה הצמח מקבל מהאדמה?
  prompt_en: What does a plant get from the soil?
  choices:
  - {he: סוכר מוכן, en: ready-made sugar}
  - {he: אור, en: light}
  - {he: מים ומינרלים, en: water and minerals}
  answer: 2
  explanation_he: המינרלים מהאדמה, כמו חנקן, עוזרים לצמח לבנות את גופו. את הסוכר הוא מייצר בעצמו בעלים.
  explanation_en: Minerals from the soil, like nitrogen, help the plant build its body. It makes sugar itself in the leaves.
  tags: [plant_needs]
- id: sci.plants.019
  skill: science.plants.needs
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: למה חקלאים מוסיפים דשן לאדמה?
  prompt_en: Why do farmers add fertilizer to the soil?
  choices:
  - {he: כדי לגרש ציפורים, en: to scare away birds}
  - {he: כדי לצבוע את הפירות, en: to color the fruit}
  - {he: כדי לספק לצמחים מינרלים, en: to give plants minerals}
  answer: 2
  explanation_he: דשן מחזיר לאדמה מינרלים שהצמחים צורכים. כך הם גדלים חזקים ובריאים יותר.
  explanation_en: Fertilizer returns minerals that plants use up, so they grow stronger and healthier.
  tags: [plant_needs]
- id: sci.plants.020
  skill: science.plants.needs
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: צמחים נושמים רק בלילה.
  prompt_en: Plants breathe only at night.
  answer: false
  explanation_he: לא נכון. צמחים נושמים כל הזמן, ביום ובלילה. ביום הם גם עושים פוטוסינתזה, ולכן משחררים יותר חמצן משהם צורכים.
  explanation_en: False. Plants breathe all the time. By day they also photosynthesize, so they release more oxygen than they use.
  tags: [plant_needs]
- id: sci.plants.021
  skill: science.plants.needs
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איך נקרא הגידול של צמחים במים עם מינרלים, בלי אדמה?
  prompt_en: What is growing plants in mineral-rich water without soil called?
  choices:
  - {he: השקיה בטפטוף, en: drip irrigation}
  - {he: גינון ביער, en: forest gardening}
  - {he: הידרופוניקה, en: hydroponics}
  answer: 2
  explanation_he: בהידרופוניקה המים מביאים לשורשים את כל המינרלים. זה מראה שהצמח צריך מהאדמה בעיקר מים ומינרלים.
  explanation_en: In hydroponics water brings all the minerals to the roots, showing plants mainly need water and minerals from soil.
  tags: [plant_needs]
- id: sci.plants.022
  skill: science.plants.needs
  kind: choice
  grade: 4
  difficulty: 0.0
  prompt_he: איזו המצאה ישראלית עוזרת להשקות צמחים ולחסוך מים?
  prompt_en: Which Israeli invention helps water plants while saving water?
  choices:
  - {he: צינור כיבוי אש, en: a fire hose}
  - {he: ממטרה ענקית, en: a giant sprinkler}
  - {he: השקיה בטפטוף, en: drip irrigation}
  answer: 2
  explanation_he: בהשקיה בטפטוף המים מגיעים ישר לשורשים, טיפה אחרי טיפה, וכמעט לא מתבזבזים.
  explanation_en: Drip irrigation delivers water drop by drop straight to the roots, so almost none is wasted.
  tags: [plant_needs]
- id: sci.plants.023
  skill: science.plants.needs
  kind: true_false
  grade: 2
  difficulty: -1.0
  prompt_he: צמחים גדלים כל חייהם.
  prompt_en: Plants keep growing throughout their lives.
  answer: true
  explanation_he: נכון. רוב הצמחים ממשיכים לצמוח כל עוד הם חיים, למשל עצים שנעשים גבוהים ועבים יותר משנה לשנה.
  explanation_en: True. Most plants keep growing as long as they live, like trees getting taller and thicker every year.
  tags: [plant_needs]
- id: sci.plants.024
  skill: science.plants.needs
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: מה קורה לעלים של עצים נשירים בסתיו?
  prompt_en: What happens to the leaves of deciduous trees in autumn?
  choices:
  - {he: הכלורופיל מתפרק והעלים נושרים, en: chlorophyll breaks down and leaves fall}
  - {he: הם הופכים לפרחים, en: they turn into flowers}
  - {he: הם נעשים ירוקים כהים יותר, en: they get darker green}
  answer: 0
  explanation_he: בסתיו הכלורופיל הירוק מתפרק, ונחשפים צבעים צהובים ואדומים. העץ משיר עלים כדי לחסוך מים בחורף.
  explanation_en: In autumn green chlorophyll breaks down, revealing yellows and reds. The tree drops leaves to save water in winter.
  tags: [plant_needs]
- id: sci.plants.025
  skill: science.plants.seeds
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: מה זרע צריך כדי לנבוט?
  prompt_en: What does a seed need to sprout?
  choices:
  - {he: סוכר ומלח, en: sugar and salt}
  - {he: הרבה אור וחושך, en: lots of light and darkness}
  - {he: 'מים, אוויר וחום מתאים', en: 'water, air and the right warmth'}
  answer: 2
  explanation_he: הזרע סופג מים, מתנפח ומתחיל לנבוט כשהטמפרטורה מתאימה. רוב הזרעים לא צריכים אור כדי לנבוט.
  explanation_en: A seed absorbs water, swells and sprouts when the temperature is right. Most seeds don't need light to sprout.
  tags: [seeds]
- id: sci.plants.026
  skill: science.plants.seeds
  kind: true_false
  grade: 3
  difficulty: 1.0
  prompt_he: כל הזרעים צריכים אור כדי לנבוט.
  prompt_en: All seeds need light to sprout.
  answer: false
  explanation_he: לא נכון. רוב הזרעים נובטים מתחת לאדמה, בחושך. הצמח הצעיר צריך אור רק כשהוא מגיע לפני הקרקע.
  explanation_en: False. Most seeds sprout underground in the dark. The young plant needs light only once it reaches the surface.
  tags: [seeds]
- id: sci.plants.027
  skill: science.plants.seeds
  kind: order
  grade: 2
  difficulty: 0.0
  prompt_he: סדרו את שלבי הנביטה.
  prompt_en: Order the stages of germination.
  choices:
  - {he: יוצא שורש קטן, en: a little root appears}
  - {he: זרע יבש באדמה, en: dry seed in soil}
  - {he: הזרע סופג מים ומתנפח, en: the seed soaks up water and swells}
  - {he: יוצא נבט עם עלים, en: a shoot with leaves appears}
  answer: [1, 2, 0, 3]
  explanation_he: קודם הזרע סופג מים. אחר כך יוצא השורש, שמחזיק ושותה, ורק אז הנבט עולה למעלה אל האור.
  explanation_en: First the seed soaks up water. Then the root comes out to hold and drink, and only then does the shoot rise to the light.
  tags: [seeds]
- id: sci.plants.028
  skill: science.plants.seeds
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה יש בתוך הזרע?
  prompt_en: What is inside a seed?
  choices:
  - {he: פרח קטן, en: a small flower}
  - {he: צמח זעיר ומזון שמור, en: a tiny plant and stored food}
  - {he: מים בלבד, en: only water}
  answer: 1
  explanation_he: בזרע יש עובר, שהוא צמח זעיר, ומאגר מזון שמזין אותו עד שיוכל לייצר מזון בעצמו.
  explanation_en: A seed holds an embryo, a tiny plant, and stored food that feeds it until it can make its own.
  tags: [seeds]
- id: sci.plants.029
  skill: science.plants.seeds
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איך מתפזרים זרעי שן הארי (סביונים) עם הציצית הלבנה?
  prompt_en: How are dandelion seeds with white fluff spread?
  choices:
  - {he: במים, en: by water, emoji: 1f30a}
  - {he: בעזרת ציפורים שאוכלות אותם, en: by birds eating them, emoji: 1f426}
  - {he: ברוח, en: by the wind, emoji: 1f32c}
  answer: 2
  explanation_he: לכל זרע יש מצנח קטן משערות דקות, והרוח נושאת אותו רחוק.
  explanation_en: Each seed has a tiny parachute of fine hairs, and the wind carries it far.
  tags: [seeds]
- id: sci.plants.030
  skill: science.plants.seeds
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: איך מתפזרים זרעים של פירות מתוקים כמו תות?
  prompt_en: How are the seeds of sweet fruits like strawberries spread?
  choices:
  - {he: הם מתגלגלים לים, en: they roll into the sea}
  - {he: בעלי חיים אוכלים את הפרי ומפזרים, en: animals eat the fruit and scatter them}
  - {he: הם עפים ברוח, en: they fly in the wind}
  answer: 1
  explanation_he: ציפורים ובעלי חיים אחרים אוכלים את הפרי. הזרעים עוברים במעי ויוצאים במקום אחר, לפעמים רחוק מאוד.
  explanation_en: Birds and other animals eat the fruit. The seeds pass through and come out elsewhere, sometimes far away.
  tags: [seeds]
- id: sci.plants.031
  skill: science.plants.seeds
  kind: true_false
  grade: 4
  difficulty: 1.0
  prompt_he: ירוקת החמור, צמח בר בישראל, יורה את הזרעים שלה כשהפרי שלה בשל.
  prompt_en: The squirting cucumber, a wild plant in Israel, shoots out its seeds when the fruit is ripe.
  answer: true
  explanation_he: נכון. כשנוגעים בפרי הבשל הוא ניתק ומתיז זרעים ונוזל למרחק של כמה מטרים.
  explanation_en: True. When the ripe fruit is touched it pops off and squirts seeds and juice several meters away.
  tags: [seeds]
- id: sci.plants.032
  skill: science.plants.seeds
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: אגוז קוקוס יכול לצוף בים שבועות ארוכים. מה זה עוזר לצמח?
  prompt_en: A coconut can float at sea for weeks. How does that help the plant?
  choices:
  - {he: הדגים אוכלים אותו, en: fish eat it}
  - {he: הוא מתנקה במים, en: it gets washed}
  - {he: הזרע מגיע לחופים רחוקים ונובט שם, en: the seed reaches far shores and sprouts there}
  answer: 2
  explanation_he: הקוקוס הוא זרע גדול עם קליפה עבה וקלה שצפה. הים נושא אותו לאיים וחופים חדשים.
  explanation_en: The coconut is a large seed with a thick light husk that floats. The sea carries it to new islands and shores.
  tags: [seeds]
- id: sci.plants.033
  skill: science.plants.seeds
  kind: choice
  grade: 2
  difficulty: -1.0
  prompt_he: מאיזה זרע יגדל עץ אלון?
  prompt_en: Which seed grows into an oak tree?
  choices:
  - {he: גרעין של אבטיח, en: watermelon seed}
  - {he: בלוט, en: acorn}
  - {he: גרגר חיטה, en: wheat grain}
  answer: 1
  explanation_he: עץ האלון גדל מבלוט. מכל זרע גדל רק צמח מהסוג שלו.
  explanation_en: An oak grows from an acorn. Each seed grows only into its own kind of plant.
  tags: [seeds]
- id: sci.plants.034
  skill: science.plants.seeds
  kind: true_false
  grade: 2
  difficulty: 0.0
  prompt_he: זרע שנזרע הפוך, עם הצד הלא נכון למעלה, יגדל עם השורשים למעלה.
  prompt_en: A seed planted upside down will grow with its roots pointing up.
  answer: false
  explanation_he: לא נכון. השורש תמיד יפנה למטה והנבט למעלה, כי הצמח מרגיש את כוח המשיכה.
  explanation_en: False. The root always turns down and the shoot up, because the plant senses gravity.
  tags: [seeds]
- id: sci.plants.035
  skill: science.plants.seeds
  kind: choice
  grade: 5
  difficulty: 1.0
  prompt_he: למה דבורים חשובות ליצירת זרעים ופירות?
  prompt_en: Why are bees important for making seeds and fruit?
  choices:
  - {he: הן מעבירות אבקה מפרח לפרח, en: they carry pollen from flower to flower, emoji: 1f41d}
  - {he: הן משקות את הפרחים, en: they water the flowers, emoji: 1f4a7}
  - {he: הן מגינות על הפרחים מהשמש, en: they shade flowers from the sun, emoji: '2600'}
  answer: 0
  explanation_he: 'זו האבקה: האבקה מגיעה לפרח אחר ומפרה אותו, ואז מתפתחים בו פרי וזרעים.'
  explanation_en: 'That''s pollination: pollen reaches another flower and fertilizes it, and then fruit and seeds develop.'
  tags: [seeds]
- id: sci.plants.036
  skill: science.plants.seeds
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: איזה מהבאים הוא זרע?
  prompt_en: Which of these is a seed?
  choices:
  - {he: עלה, en: leaf, emoji: 1f343}
  - {he: שורש גזר, en: carrot root, emoji: 1f955}
  - {he: שעועית, en: bean, emoji: 1fad8}
  answer: 2
  explanation_he: 'שעועית היא זרע: אם נשים אותה על צמר גפן רטוב, היא תנבוט תוך כמה ימים.'
  explanation_en: 'A bean is a seed: put it on wet cotton wool and it will sprout within a few days.'
  tags: [seeds]
- id: sci.plants.037
  skill: science.plants.photosynthesis
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: מה הצמח מייצר בפוטוסינתזה?
  prompt_en: What does a plant make in photosynthesis?
  choices:
  - {he: פחמן דו-חמצני ואדמה, en: carbon dioxide and soil}
  - {he: מים ומלח, en: water and salt}
  - {he: סוכר וחמצן, en: sugar and oxygen}
  answer: 2
  explanation_he: בפוטוסינתזה הצמח משתמש באור, במים ובפחמן דו-חמצני כדי לייצר סוכר. החמצן משתחרר לאוויר.
  explanation_en: In photosynthesis a plant uses light, water and carbon dioxide to make sugar. Oxygen is released into the air.
  tags: [photosynthesis]
- id: sci.plants.038
  skill: science.plants.photosynthesis
  kind: choice
  grade: 5
  difficulty: 0.0
  prompt_he: איזה גז צמחים קולטים מהאוויר לפוטוסינתזה?
  prompt_en: Which gas do plants take from the air for photosynthesis?
  choices:
  - {he: הליום, en: helium}
  - {he: פחמן דו-חמצני, en: carbon dioxide}
  - {he: חמצן, en: oxygen}
  answer: 1
  explanation_he: הצמח קולט פחמן דו-חמצני דרך פתחים זעירים בעלים, ובונה ממנו סוכר.
  explanation_en: The plant takes in carbon dioxide through tiny openings in its leaves and builds sugar from it.
  tags: [photosynthesis]
- id: sci.plants.039
  skill: science.plants.photosynthesis
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: מה צובע את העלים בירוק ועוזר לקלוט אור?
  prompt_en: What makes leaves green and helps capture light?
  choices:
  - {he: כלורופיל, en: chlorophyll}
  - {he: המוגלובין, en: hemoglobin}
  - {he: מלח, en: salt}
  answer: 0
  explanation_he: הכלורופיל קולט אור אדום וכחול ומחזיר אור ירוק, ולכן העלים נראים ירוקים.
  explanation_en: Chlorophyll absorbs red and blue light and reflects green, so leaves look green.
  tags: [photosynthesis]
- id: sci.plants.040
  skill: science.plants.photosynthesis
  kind: true_false
  grade: 5
  difficulty: 1.0
  prompt_he: החמצן שאנחנו נושמים מגיע בעיקר מפוטוסינתזה של צמחים ואצות.
  prompt_en: The oxygen we breathe comes mostly from photosynthesis by plants and algae.
  answer: true
  explanation_he: נכון. צמחים ביבשה ואצות בים משחררים חמצן. בלעדיהם כמעט לא היה חמצן באוויר.
  explanation_en: True. Land plants and algae in the sea release oxygen. Without them there would be almost no oxygen in the air.
  tags: [photosynthesis]
- id: sci.plants.041
  skill: science.plants.photosynthesis
  kind: choice
  grade: 6
  difficulty: 1.0
  prompt_he: איך נקראים הפתחים הזעירים בעלה שדרכם נכנסים ויוצאים גזים?
  prompt_en: What are the tiny openings in a leaf for gases called?
  choices:
  - {he: נימים, en: capillaries}
  - {he: פיוניות, en: stomata}
  - {he: טבעות, en: rings}
  answer: 1
  explanation_he: הפיוניות נפתחות ונסגרות. דרכן נכנס פחמן דו-חמצני ויוצאים חמצן ואדי מים.
  explanation_en: Stomata open and close. Carbon dioxide enters through them, and oxygen and water vapor leave.
  tags: [photosynthesis]
- id: sci.plants.042
  skill: science.plants.photosynthesis
  kind: true_false
  grade: 6
  difficulty: 1.0
  prompt_he: רוב המסה של עץ גדול הגיעה מהאדמה.
  prompt_en: Most of a big tree's mass came from the soil.
  answer: false
  explanation_he: לא נכון. רוב החומר של העץ נבנה מפחמן דו-חמצני מהאוויר וממים. מהאדמה מגיעה רק כמות קטנה של מינרלים.
  explanation_en: False. Most of a tree is built from carbon dioxide from the air plus water. Only a small amount of minerals comes from soil.
  tags: [photosynthesis]
- id: sci.plants.043
  skill: science.plants.photosynthesis
  kind: choice
  grade: 6
  difficulty: 0.0
  prompt_he: באיזה חלק של התא מתרחשת הפוטוסינתזה?
  prompt_en: In which part of the cell does photosynthesis happen?
  choices:
  - {he: בגרעין, en: in the nucleus}
  - {he: בכלורופלסט, en: in the chloroplast}
  - {he: בדופן התא, en: in the cell wall}
  answer: 1
  explanation_he: הכלורופלסטים הם גופיפים ירוקים מלאים בכלורופיל. שם האור הופך לאנרגיה שאגורה בסוכר.
  explanation_en: Chloroplasts are green bodies full of chlorophyll, where light energy becomes energy stored in sugar.
  tags: [photosynthesis]
- id: sci.plants.044
  skill: science.plants.photosynthesis
  kind: order
  grade: 5
  difficulty: 1.0
  prompt_he: סדרו את הדרך של המים בצמח, עד לשימוש בפוטוסינתזה.
  prompt_en: Order the path of water through a plant to photosynthesis.
  choices:
  - {he: מגיעים לעלים, en: reach the leaves}
  - {he: עולים בגבעול, en: rise up the stem}
  - {he: משמשים לייצור סוכר, en: used to make sugar}
  - {he: נקלטים בשורשים, en: absorbed by the roots}
  answer: [3, 1, 0, 2]
  explanation_he: המים נספגים בשורשים, עולים בצינורות הגבעול ומגיעים לעלים. שם, בעזרת אור, הם הופכים יחד עם פחמן דו-חמצני לסוכר.
  explanation_en: Water is absorbed by roots, rises through the stem and reaches the leaves, where with light it combines with CO2 to make sugar.
  tags: [photosynthesis]
- id: sci.plants.045
  skill: science.plants.photosynthesis
  kind: choice
  grade: 7
  difficulty: 1.0
  prompt_he: איזו צורת אנרגיה הצמח הופך לאנרגיה כימית בפוטוסינתזה?
  prompt_en: What form of energy does a plant turn into chemical energy in photosynthesis?
  choices:
  - {he: אנרגיית קול, en: sound energy}
  - {he: אנרגיית אור, en: light energy}
  - {he: אנרגיה חשמלית, en: electrical energy}
  answer: 1
  explanation_he: הצמח אוגר את אנרגיית האור בתוך הקשרים הכימיים של הסוכר. כשאנחנו אוכלים צמחים, אנחנו משתמשים באנרגיה הזאת.
  explanation_en: The plant stores light energy in the chemical bonds of sugar. When we eat plants we use that energy.
  tags: [photosynthesis]
- id: sci.plants.046
  skill: science.plants.photosynthesis
  kind: choice
  grade: 7
  difficulty: 2.0
  prompt_he: מה ההבדל בין פוטוסינתזה לנשימה בצמח?
  prompt_en: What is the difference between photosynthesis and respiration in a plant?
  choices:
  - {he: נשימה מתרחשת רק בשורשים, en: respiration only happens in roots}
  - {he: אין הבדל, en: there is no difference}
  - {he: 'פוטוסינתזה בונה סוכר, נשימה מפרקת אותו', en: photosynthesis builds sugar; respiration breaks it down}
  answer: 2
  explanation_he: בפוטוסינתזה נאגרת אנרגיה בסוכר וחמצן משתחרר. בנשימה הסוכר מתפרק בעזרת חמצן ומשחרר אנרגיה לתא.
  explanation_en: Photosynthesis stores energy in sugar and releases oxygen. Respiration breaks sugar down with oxygen to release energy.
  tags: [photosynthesis]
- id: sci.plants.047
  skill: science.plants.photosynthesis
  kind: true_false
  grade: 6
  difficulty: 0.0
  prompt_he: צמחים עושים פוטוסינתזה רק כשיש אור.
  prompt_en: Plants carry out photosynthesis only when there is light.
  answer: true
  explanation_he: נכון. האור הוא מקור האנרגיה של התהליך. בלילה הצמח רק נושם, ולא מייצר סוכר.
  explanation_en: True. Light powers the process. At night the plant only respires and does not make sugar.
  tags: [photosynthesis]
- id: sci.plants.048
  skill: science.plants.photosynthesis
  kind: choice
  grade: 8
  difficulty: 2.0
  prompt_he: מה מהבאים מתאר נכון את הפוטוסינתזה?
  prompt_en: Which correctly describes photosynthesis?
  choices:
  - {he: חמצן ומים ← פחמן דו-חמצני, en: oxygen + water -> carbon dioxide}
  - {he: סוכר וחמצן ← פחמן דו-חמצני ומים, en: sugar + oxygen -> carbon dioxide + water}
  - {he: פחמן דו-חמצני ומים ← סוכר וחמצן, en: carbon dioxide + water -> sugar + oxygen}
  answer: 2
  explanation_he: בפוטוסינתזה, בעזרת אור וכלורופיל, פחמן דו-חמצני ומים הופכים לסוכר וחמצן. התהליך ההפוך הוא הנשימה.
  explanation_en: In photosynthesis, with light and chlorophyll, carbon dioxide and water become sugar and oxygen. Respiration is the reverse.
  tags: [photosynthesis]
- id: sci.plants.049
  skill: science.plants.israel
  kind: choice
  grade: 2
  difficulty: 0.0
  prompt_he: איזה עץ פורח בדרך כלל בסביבות ט"ו בשבט ומכסה את ההרים בלבן וורוד?
  prompt_en: Which tree usually blooms around Tu BiShvat, covering hills in white and pink?
  choices:
  - {he: הדקל, en: the date palm}
  - {he: השקדייה, en: the almond tree}
  - {he: האלון, en: the oak}
  answer: 1
  explanation_he: השקדייה היא מהעצים הראשונים שפורחים בסוף החורף, ולכן היא סמל של ט"ו בשבט.
  explanation_en: The almond tree is one of the first to bloom at winter's end, so it's a symbol of Tu BiShvat.
  tags: [israel_plants]
- id: sci.plants.050
  skill: science.plants.israel
  kind: choice
  grade: 3
  difficulty: 0.0
  prompt_he: מה מהבאים שייך לשבעת המינים?
  prompt_en: Which of these is one of the Seven Species?
  choices:
  - {he: זית, en: olive, emoji: 1fad2}
  - {he: תפוח, en: apple, emoji: 1f34e}
  - {he: בננה, en: banana, emoji: 1f34c}
  answer: 0
  explanation_he: שבעת המינים הם חיטה, שעורה, גפן, תאנה, רימון, זית ותמר.
  explanation_en: The Seven Species are wheat, barley, grape, fig, pomegranate, olive and date.
  tags: [israel_plants]
- id: sci.plants.051
  skill: science.plants.israel
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: ט"ו בשבט נקרא ראש השנה לאילנות.
  prompt_en: Tu BiShvat is called the New Year of the Trees.
  answer: true
  explanation_he: נכון. בט"ו בשבט נוהגים לאכול פירות של ארץ ישראל ולשתול עצים.
  explanation_en: True. On Tu BiShvat it's customary to eat fruits of the Land of Israel and plant trees.
  tags: [israel_plants]
- id: sci.plants.052
  skill: science.plants.israel
  kind: choice
  grade: 3
  difficulty: 1.0
  prompt_he: איזה פרח אדום נבחר לפרח הלאומי של ישראל?
  prompt_en: Which red flower was chosen as Israel's national flower?
  choices:
  - {he: ורד, en: rose}
  - {he: חמנייה, en: sunflower}
  - {he: כלנית, en: anemone}
  answer: 2
  explanation_he: הכלנית נבחרה בשנת 2013. היא פורחת בחורף, ובדרום הארץ יש פסטיבל בשם "דרום אדום".
  explanation_en: The anemone was chosen in 2013. It blooms in winter, celebrated in the south by the "Red South" festival.
  tags: [israel_plants]
- id: sci.plants.053
  skill: science.plants.israel
  kind: true_false
  grade: 3
  difficulty: 0.0
  prompt_he: מותר לקטוף פרחי בר מוגנים כמו כלנית ורקפת כמה שרוצים.
  prompt_en: It's fine to pick as many protected wildflowers like anemones and cyclamens as you like.
  answer: false
  explanation_he: לא נכון. פרחי בר מוגנים בחוק. אם כולם יקטפו, הפרחים לא יספיקו לייצר זרעים, ולא יהיו פרחים בשנה הבאה.
  explanation_en: False. Protected wildflowers are protected by law. If everyone picks them, they can't make seeds and won't bloom next year.
  tags: [israel_plants]
- id: sci.plants.054
  skill: science.plants.israel
  kind: choice
  grade: 4
  difficulty: 1.0
  prompt_he: הצבר נפוץ בארץ. מאיפה הוא הגיע במקור?
  prompt_en: The prickly pear (sabra) is common in Israel. Where did it originally come from?
  choices:
  - {he: מאמריקה, en: from the Americas}
  - {he: הוא תמיד גדל רק בישראל, en: it always grew only in Israel}
  - {he: מהקוטב, en: from the poles}
  answer: 0
  explanation_he: 'הצבר הובא מאמריקה לפני מאות שנים והתאקלם היטב. מכאן הכינוי "צבר" לילידי הארץ: קוצני מבחוץ ומתוק מבפנים.'
  explanation_en: 'The prickly pear was brought from the Americas centuries ago and thrived. Israelis born here are nicknamed "sabra": prickly outside, sweet inside.'
  tags: [israel_plants]
- id: sci.plants.055
  skill: science.plants.israel
  kind: choice
  grade: 3
  difficulty: 0.0

# Nagmon English vocabulary bank (SDD_CONTENT section 4).
#
# Levels follow the CEFR young-learner bands:
#   preA1 ~ Cambridge Pre A1 Starters  (grades 0-2)
#   A1    ~ Cambridge A1 Movers        (grades 3-4)
#   A2    ~ Cambridge A2 Flyers        (grades 5-6)
#   B1    ~ useful B1 / Israeli MoE Band II words (grades 7-9)
#
# Sources used to choose and level the words:
#   - Cambridge English, "Pre A1 Starters, A1 Movers and A2 Flyers Wordlists" (2018 exam format),
#     https://www.cambridgeenglish.org/Images/149681-yle-flyers-word-list.pdf
#   - Israel Ministry of Education, English Curriculum 2020 (CEFR-aligned, Pre-A1..B2),
#     https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/Curriculum2020.pdf
#   - Israel Ministry of Education, Band I / Band II core vocabulary lists ("bandsLists"),
#     https://meyda.education.gov.il/files/Pop/0files/english/Chativa-Elyona/Bagrut/bandsLists.pdf
#   - Israel Ministry of Education, Pre-foundation can-do statements and lexical list,
#     https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/prefoundationcando.pdf
#   Local adaptations: American spelling, Israeli context (falafel, synagogue, Shabbat, Negev),
#   family-friendly and modest vocabulary only.
#
# Field notes:
#   - (word, pos) is unique; a few words appear twice with different parts of speech
#     (orange: color/fruit, answer: noun/verb, fly: insect/verb ...).
#   - he: the most common sense; when a word has two very common senses both are given,
#     separated by "; " (for example old: "ישן; זקן"). No niqqud.
#   - emoji: Twemoji file code (lowercase hex code points joined by "-"; U+FE0F is dropped
#     unless the sequence contains a ZWJ, as in Twemoji file names). null when no clear,
#     unambiguous picture exists.


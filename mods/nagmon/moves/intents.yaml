# The enemy's actions (intents) and temperaments (BATTLE_V3.md 4.3).
# Built into app/public/game/intents.json by tools/app/moves.py.
# `power` is the MP of the hit in the damage formula (5.2); the weights of a
# temperament are percents and add up to 100.
version: 1
intents:
  - {id: fog_puff, n: 1, he: נשיפת ערפל, en: Fog Puff, icon: intent_fog_puff, kind: hit, power: 50, boss_power: 40, desc_he: "נשיפה קטנה של ערפל."}
  - {id: big_puff, n: 2, he: נשיפה גדולה, en: Big Puff, icon: intent_big_puff, kind: windup_hit, power: 60, windup: true, wild_min_level: 8, desc_he: "נשיפה גדולה בסבב הבא."}
  - {id: thicken, n: 3, he: ערפל סמיך, en: Thicken, icon: intent_thicken, kind: shield, shield_share_of_max_fog: 0.20, rounds: 2, desc_he: "הערפל נהיה סמיך."}
  - {id: giggle, n: 4, he: צחקוק, en: Giggle, icon: intent_giggle, kind: fog_up, fog_share: 0.05, every_rounds: 3, desc_he: "צוחק וחוזר לעצמו."}
  - {id: drowsy_mist, n: 5, he: אד מנומנם, en: Drowsy Mist, icon: intent_drowsy_mist, kind: status_on_us, status: drowsy, band_a_replace: silly_dance, desc_he: "אד שקט שמנמנם."}
  - {id: dizzy_swirl, n: 6, he: מערבולת, en: Dizzy Swirl, icon: intent_dizzy_swirl, kind: status_on_us, status: dizzy, desc_he: "מערבולת קטנה."}
  - {id: sticky_mud, n: 7, he: בוץ דביק, en: Sticky Mud, icon: intent_sticky_mud, kind: status_on_us, status: slow, desc_he: "בוץ דביק מאט את הצעדים."}
  - {id: cheer_up, n: 8, he: עידוד עצמי, en: Cheer Up, icon: intent_cheer_up, kind: self_boost, stat: power, stages: 1, rounds: 3, desc_he: "מעודד את עצמו."}
  - {id: silly_dance, n: 9, he: ריקוד מצחיק, en: Silly Dance, icon: intent_silly_dance, kind: breather, spark_for_child: 1, desc_he: "ריקוד מצחיק ונשימה קלה."}
rules:
  - never_two_statuses_in_a_row_on_the_child
  - no_double_puff_above_15_percent_pep_without_a_silly_turn
  - intent_never_changes_once_shown
  - wild_creatures_never_choose_by_weakness
  - keepers_and_bosses_use_scripts
temperaments:
  - {id: shy, he: ביישן, en: Shy, weights: {thicken: 30, giggle: 20, fog_puff: 30, silly_dance: 20}}
  - {id: playful, he: שובב, en: Playful, weights: {silly_dance: 30, fog_puff: 30, dizzy_swirl: 15, sticky_mud: 10, cheer_up: 15}}
  - {id: grumpy, he: רגזן, en: Grumpy, weights: {fog_puff: 50, big_puff: 20, cheer_up: 15, sticky_mud: 15}, big_puff_min_level: 8}
  - {id: sleepy, he: ישנוני, en: Sleepy, weights: {drowsy_mist: 30, silly_dance: 25, fog_puff: 30, giggle: 15}}
  - {id: proud, he: גאה, en: Proud, weights: {cheer_up: 20, big_puff: 25, fog_puff: 35, thicken: 20}, big_puff_min_level: 8}

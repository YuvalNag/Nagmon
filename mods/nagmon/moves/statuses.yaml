# The 14 status icons (docs/app/BATTLE_V3.md section 4.1, 4.2 and 4.4).
# Built into app/public/game/statuses.json by tools/app/moves.py.
#
# Each status has a colour AND a shape (accessibility). `enemy` is what it
# does on the enemy, `ours` what it does on our creature (softened: the
# child's answer is never wasted). Durations are in rounds; a round ends
# after both sides acted. Statuses are never carried out of a battle.
#   kind       major (one at a time), minor, stat, meta
#   group      statuses of one group replace each other
#   boss_immune_rounds  after it lands on a boss or guardian
version: 1
stage_rules:
  max_stage: 3
  up_step: 0.25           # +1 is x1.25, +2 x1.5, +3 x1.75
  down_formula: "1 / (1 + 0.25 * |stage|)"
  boost_rounds: 4
  weaken_rounds: 3
  stats: [power, guard, speed]
statuses:
  - id: drowsy
    n: 1
    he: מנומנם
    en: Drowsy
    kind: major
    group: sleepy_or_dizzy
    boss_immune_rounds: 3
    icon: status_drowsy
    shape: crescent moon with Zz
    color: lilac
    hex: "#b9a3e3"
    enemy: {skip_actions: 2, boss_skip_actions: 1}
    ours: {name: Yawn, rounds: 1, only_tiers: [E], power_mult: 0.75, wake_taps: 3}
    cure: [time, taps, fresh_air, wake_berry]
    desc_he: מנמנם קצת ומחכה לשיר.
  - id: dizzy
    n: 2
    he: סחרחר
    en: Dizzy
    kind: major
    group: sleepy_or_dizzy
    boss_immune_rounds: 3
    icon: status_dizzy
    shape: spiral eyes
    color: violet
    hex: "#9b7fe0"
    enemy: {stumble_chance: 0.33, rounds: 3}
    ours: {rounds: 2, no_tiers: [S], wobble_tiles_once: true}
    cure: [time, fresh_air]
    desc_he: העיניים מסתובבות קצת.
  - id: slow
    n: 3
    he: איטי
    en: Slow
    kind: minor
    group: slow
    boss_immune_rounds: 3
    icon: status_slow
    shape: snail
    color: brown
    hex: "#a9794e"
    enemy: {speed_mult: 0.5, rounds: 3}
    ours: {speed_mult: 0.5, rounds: 3, quick_moves_still_first: true}
    cure: [time]
    desc_he: זז לאט כמו חילזון.
  - id: shield
    n: 4
    he: מגן
    en: Shield
    kind: minor
    group: shield
    icon: status_shield
    shape: soft bubble
    color: cyan
    hex: "#6fd3e8"
    enemy: {absorb_share_of_max_fog: 0.20, rounds: 2}
    ours: {absorb_share_of_max_pep: given_by_move, rounds: 2}
    cure: [time, used_up]
    desc_he: בועה רכה שומרת מכל הכיוונים.
  - id: regen
    n: 5
    he: התחדשות
    en: Regen
    kind: minor
    group: regen
    icon: status_regen
    shape: leaf with heart
    color: green
    hex: "#6cd4a1"
    enemy: {fog_share_per_round: 0.04, rounds: 3}
    ours: {pep_share_per_round: 0.08, rounds: 3}
    cure: [time]
    desc_he: כוח חוזר טיפה בכל סבב.
  - id: boost
    n: 6
    he: חיזוק
    en: Boost
    kind: stat
    group: boost
    icon: status_boost
    icon_variants: [status_boost_power, status_boost_guard, status_boost_speed]
    shape: up-arrow, 1 to 3 arrows
    color: the stat's colour
    hex: "#ffb347"
    enemy: {stages: [1, 3], rounds: 4}
    ours: {stages: [1, 3], rounds: 4}
    cure: [time]
    desc_he: חץ למעלה, משהו נהיה חזק.
  - id: weaken
    n: 7
    he: החלשה
    en: Weaken
    kind: stat
    group: weaken
    icon: status_weaken
    icon_variants: [status_weaken_power, status_weaken_guard, status_weaken_speed]
    shape: down-arrow, 1 to 3 arrows
    color: the stat's colour
    hex: "#8aa4c8"
    enemy: {stages: [-3, -1], rounds: 3}
    ours: {stages: [-3, -1], rounds: 3}
    cure: [time]
    desc_he: חץ למטה, משהו נהיה עדין.
  - id: focus
    n: 8
    he: ריכוז
    en: Focus
    kind: minor
    group: focus
    icon: status_focus
    shape: eye with sparkle
    color: gold
    hex: "#ffd166"
    enemy: {}
    ours: {next_right_answer_brilliant: true}
    cure: [consumed]
    desc_he: העין נוצצת, התשובה הבאה תזהיר.
  - id: giggly
    n: 9
    he: צוחק
    en: Giggly
    kind: minor
    group: giggly
    icon: status_giggly
    shape: laughing face
    color: pink
    hex: "#f4a6c6"
    enemy: {next_attack_mult: 0.5, attacks: 1}
    ours: {next_attack_mult: 0.5, attacks: 1, used_only_by: [playful]}
    cure: [one_attack]
    desc_he: צוחק ומתקשה להתרכז.
  - id: mark
    n: 10
    he: סימן
    en: Mark
    kind: minor
    group: mark
    icon: status_mark
    icon_variants: [status_mark_math, status_mark_geometry, status_mark_science, status_mark_english, status_mark_hebrew, status_mark_logic]
    shape: sticker in the subject colour
    color: the subject colour
    hex: "#c8c8d8"
    enemy: {rounds: 2, max: 2, third_replaces_oldest: true}
    ours: {}
    cure: [time, finisher]
    desc_he: מדבקה קטנה לשימוש הבא.
  - id: sniffly
    n: 11
    he: מצונן
    en: Sniffly
    kind: minor
    group: sniffly
    icon: status_sniffly
    shape: water drop
    color: light blue
    hex: "#a9d8f5"
    enemy: {fog_share_per_round: -0.03, rounds: 3, floor: 1}
    ours: {pep_share_per_round: -0.06, rounds: 3, floor: 1, never_dozes: true}
    cure: [time, fresh_air]
    desc_he: נזלת קטנה, עוברת מהר.
  - id: windup
    n: 12
    he: הכנה
    en: Windup
    kind: meta
    group: windup
    icon: status_windup
    shape: orange ring with number
    color: orange
    hex: "#ff8a5b"
    enemy: {big_move_at_end_of_next_round: true, stagger_fog_share: 0.25}
    ours: {}
    cure: [stagger]
    desc_he: מתכוננים לנשיפה גדולה.
  - id: calm
    n: 13
    he: רגוע
    en: Calm
    kind: meta
    group: calm
    icon: status_calm
    shape: smiling face
    color: warm yellow
    hex: "#ffe08a"
    enemy: {fog_is_zero: true, stops_acting: true, befriend_bonus: 2.0}
    ours: {}
    cure: []
    desc_he: רגוע וחביב, אפשר להתיידד.
  - id: dozing
    n: 14
    he: נרדם
    en: Dozing
    kind: meta
    group: dozing
    icon: status_dozing
    shape: blanket with Zz
    color: grey-blue
    hex: "#8fa3b8"
    enemy: {}
    ours: {out_of_battle: true}
    cure: [wake_berry, sunrise_berry, medicine, nurse, bench_nap]
    desc_he: ישן על שמיכה עד שיעירו אותו.

# Which box of which source sheet becomes which game file
# (docs/kids/SDD_ART.md). Re-import everything with:
#   python tools/art/import_art.py --preview /tmp/art-preview
# Boxes are approximate [x0, y0, x1, y1] on the source: the tool takes
# every sprite piece that lies mostly inside, and nothing else. A grid
# source ("grid: [columns, rows]") is cut into equal cells r<row>c<col>,
# and "take" maps an output cell to another source cell.
# "k" makes an HD sheet, k times the game size, that the game scales
# once to the screen (SDD_ART §2.6); "fill" is the figure height as a
# share of its cell. Sources live in art_sources/ (not shipped).
outputs:

  # ------------------------------------------------------------ the owl
  - name: owl_icon
    source: owl_sheet.jpg
    layout: single
    size: [512, 512]
    resample: lanczos
    boxes:
      image: [110, 1790, 665, 2350]
    output: mods/nagmon/gfx/owl/owl_icon.png

  - name: owl_portrait
    source: owl_sheet.jpg
    layout: single
    size: [192, 192]
    align: bottom
    resample: hd
    boxes:
      image: [105, 160, 580, 610]
    output: mods/nagmon/gfx/owl/owl_portrait.png

  # The owl's dialogue avatar (an NPC avatar is its combat front). The
  # owl never fights, so the second portrait stands in for a back view.
  - name: nagmon_owl
    source: owl_sheet.jpg
    layout: combat
    k: 3
    resample: hd
    boxes:
      back: [690, 180, 1100, 610]
      front: [105, 160, 580, 610]
    output: mods/nagmon/gfx/sprites/player/nagmon_owl.png

  # ---------------------------------------------------- math + English
  - name: geometrion
    source: monsters_math_english.jpg
    layout: monster
    k: 3
    resample: hd
    options: {drop_white: true}
    boxes:
      front: [30, 100, 215, 270]
      back: [240, 105, 415, 270]
      menu1: [75, 385, 185, 476]
      menu2: [255, 385, 365, 476]
    output: mods/nagmon/gfx/sprites/battle/geometrion-sheet.png

  - name: polygonos
    source: monsters_math_english.jpg
    layout: monster
    k: 3
    resample: hd
    options: {drop_white: true}
    boxes:
      front: [483, 89, 658, 274]
      back: [688, 89, 862, 275]
      menu1: [525, 370, 650, 495]
      menu2: [705, 370, 830, 495]
    output: mods/nagmon/gfx/sprites/battle/polygonos-sheet.png

  - name: alphabel
    source: monsters_math_english.jpg
    layout: monster
    k: 3
    resample: hd
    options: {drop_white: true}
    boxes:
      front: [29, 700, 199, 879]
      back: [242, 701, 418, 875]
      menu1: [80, 980, 185, 1072]
      menu2: [250, 980, 355, 1072]
    output: mods/nagmon/gfx/sprites/battle/alphabel-sheet.png

  - name: lexicon
    source: monsters_math_english.jpg
    layout: monster
    k: 3
    resample: hd
    options: {drop_white: true}
    boxes:
      front: [468, 667, 678, 876]
      back: [683, 680, 893, 875]
      menu1: [525, 960, 645, 1075]
      menu2: [705, 960, 830, 1075]
    output: mods/nagmon/gfx/sprites/battle/lexicon-sheet.png

  # ------------------------------------------- the three chapter-1 NPCs
  # Battle sheets only: back view left, front view right, inside a drawn
  # frame (lines: true clears it).
  - name: nagmon_shopkeeper
    source: teachers.jpg
    layout: combat
    k: 3
    resample: hd
    options: {lines: true, holes: 120, min_area: 80}
    boxes:
      back: [508, 132, 690, 330]
      front: [692, 132, 885, 330]
    output: mods/nagmon/gfx/sprites/player/nagmon_shopkeeper.png

  - name: nagmon_traveler
    source: teachers.jpg
    layout: combat
    k: 3
    resample: hd
    options: {lines: true, holes: 120, min_area: 80}
    boxes:
      back: [505, 532, 680, 720]
      front: [688, 532, 872, 720]
    output: mods/nagmon/gfx/sprites/player/nagmon_traveler.png

  - name: nagmon_teacher
    source: teachers.jpg
    layout: combat
    k: 3
    resample: hd
    options: {lines: true, holes: 120, min_area: 80}
    boxes:
      back: [505, 903, 680, 1096]
      front: [690, 903, 872, 1096]
    output: mods/nagmon/gfx/sprites/player/nagmon_teacher.png

  # ------------------------------------------------------ map sheets
  # 3 columns (step, stand, step) x 4 rows (front, left, right, back),
  # flat magenta. In the shopkeeper, tourist and caped owl sources the
  # third column of rows 2 and 3 faces the wrong way: swapped by "take".
  - name: nagmon_owl_map
    source: owl_map.png
    layout: map
    k: 8
    fill: 0.625
    resample: hd
    grid: [3, 4]
    output: mods/nagmon/sprites/nagmon_owl.png

  # The owl after the first badge (SDD_ART §2.8). A caped battle portrait
  # will come later: add an entry with layout: combat for
  # mods/nagmon/gfx/sprites/player/nagmon_owl_caped.png then.
  - name: nagmon_owl_caped_map
    source: owl_caped_map.png
    layout: map
    k: 8
    fill: 0.625
    resample: hd
    grid: [3, 4]
    take: {r2c3: r3c3, r3c3: r2c3}
    output: mods/nagmon/sprites/nagmon_owl_caped.png

  - name: nagmon_shopkeeper_map
    source: shopkeeper_map.png
    layout: map
    k: 8
    fill: 0.6875
    resample: hd
    grid: [3, 4]
    take: {r2c3: r3c3, r3c3: r2c3}
    output: mods/nagmon/sprites/nagmon_shopkeeper.png

  - name: nagmon_tourist_map
    source: tourist_map.png
    layout: map
    k: 8
    fill: 0.6875
    resample: hd
    grid: [3, 4]
    take: {r2c3: r3c3, r3c3: r2c3}
    output: mods/nagmon/sprites/nagmon_tourist.png

  # ------------------------------------- second batch (SDD_ART §2.9)
  # Battle sources are two halves: back on the left, front on the right.
  - name: nagmon_teacher_map
    source: teacher_map.png
    layout: map
    k: 8
    fill: 0.6875
    resample: hd
    grid: [3, 4]
    take: {r2c3: r3c3, r3c3: r2c3}
    output: mods/nagmon/sprites/nagmon_teacher.png

  # Row 2 has only two left steps (its third frame faces right, as all
  # of row 3 does): the second left step is that frame, mirrored.
  - name: nagmon_granite_map
    source: granite_map.png
    layout: map
    k: 8
    fill: 0.6875
    resample: hd
    grid: [3, 4]
    take: {r2c3: "flip:r2c3"}
    output: mods/nagmon/sprites/nagmon_granite.png

  - name: nagmon_granite
    source: granite_battle.png
    layout: combat
    k: 3
    resample: hd
    grid: [2, 1]
    take: {back: r1c1, front: r1c2}
    output: mods/nagmon/gfx/sprites/player/nagmon_granite.png

  - name: nagmon_hero_boy_map
    source: hero_boy_map.png
    layout: map
    k: 8
    fill: 0.6875
    resample: hd
    grid: [3, 4]
    take: {r2c3: r3c3, r3c3: r2c3}
    output: mods/nagmon/sprites/nagmon_hero_boy.png

  - name: nagmon_hero_boy
    source: hero_boy_battle.png
    layout: player
    k: 3
    resample: hd
    grid: [2, 1]
    take: {back: r1c1, front: r1c2}
    output: mods/nagmon/gfx/sprites/player/nagmon_hero_boy.png

  - name: nagmon_hero_girl_map
    source: hero_girl_map.png
    layout: map
    k: 8
    fill: 0.6875
    resample: hd
    grid: [3, 4]
    take: {r2c3: r3c3, r3c3: r2c3}
    output: mods/nagmon/sprites/nagmon_hero_girl.png

  - name: nagmon_hero_girl
    source: hero_girl_battle.png
    layout: player
    k: 3
    resample: hd
    grid: [2, 1]
    take: {back: r1c1, front: r1c2}
    output: mods/nagmon/gfx/sprites/player/nagmon_hero_girl.png

  # Not in the game yet (SDD_ART §4): girl_curly_battle.png has no map
  # sheet (girl_curly_poses_a/b.png are free pose pages), girl_braid_map.png
  # has no battle sheet, girls_5_variants.png is a page of ideas.

[tox]
envlist = py3, fmt, lint, type

[testenv]
usedevelop = True
deps =
    -rrequirements.txt
    pytest
    pytest-cov
    pytest-mock
    numpy
    scipy
commands = pytest tests

[testenv:fmt]
description = Auto-format code
deps = ruff
commands = 
    ruff format tuxemon nagmon tests tools
    ruff check --fix --unsafe-fixes tuxemon nagmon tests tools

[testenv:format]
description = Run Format
deps = ruff
commands = ruff format --check tuxemon nagmon tests tools

[testenv:lint]
description = Run linter
deps = ruff
commands = ruff check tuxemon nagmon tests tools

[testenv:type]
description = Run static type checks
deps = 
    mypy
    -rrequirements.txt
commands = mypy tuxemon
